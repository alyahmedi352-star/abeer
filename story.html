<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قصة تفاعلية | منصة أ. عبير اليحمدية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--n1:#173F55;--n2:#225C78;--g1:#D9A64E;--g2:#F2CF8A;--bg:#EEF3F4;--ok:#2F8A57;--bad:#C8443B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Tajawal,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--n1);display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}button:focus-visible{outline:4px solid var(--g1);outline-offset:3px}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--n1);color:#fff}
.top b{flex:1;font-size:1.05rem}.top span{color:var(--g2);font-weight:900}
.ib{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:12px;width:40px;height:40px;font-size:1.1rem}
main{flex:1;display:grid;place-items:center;padding:16px}
.page{width:min(900px,100%);background:#fff;border-radius:30px;box-shadow:0 14px 40px rgba(23,63,85,.15);display:grid;grid-template-columns:minmax(150px,280px) 1fr;overflow:hidden;animation:turn .45s ease}
@keyframes turn{from{opacity:0;transform:perspective(900px) rotateY(-12deg)}to{opacity:1;transform:none}}
.pic{background:linear-gradient(#fff 55%,#FFF5E1);display:flex;align-items:flex-end;justify-content:center;padding-top:12px;border-left:3px dashed var(--g2)}
.pic img{width:100%;max-width:260px;display:block}
.pic.two img{width:50%}
.txt{padding:26px 26px 22px;display:flex;flex-direction:column;gap:14px}
.no{font-weight:900;color:var(--g1)}
.story{font-size:clamp(1.25rem,3vw,1.6rem);font-weight:800;line-height:1.75;margin:0}
.q{font-size:1.15rem;font-weight:900;color:var(--n2);margin:0}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.op{border:3px solid #D6E2E6;background:#fff;border-radius:20px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:1rem;color:var(--n1)}
.op .e{font-size:2.8rem;line-height:1.15}
.op.ok{border-color:var(--ok);background:#E7F5EC}.op.bad{animation:sh .4s;border-color:var(--bad)}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{min-height:1.6em;font-weight:800;font-size:1.1rem}
.btn{align-self:flex-start;border:0;border-radius:18px;padding:13px 30px;font-size:1.2rem;font-weight:900;background:var(--g1);color:var(--n1);box-shadow:0 6px 0 #A97A2C}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #A97A2C}
.btn.g{background:#fff;border:3px solid #D6E2E6;box-shadow:none}
.dots{display:flex;gap:6px}.dots i{width:22px;height:7px;border-radius:5px;background:#D6E2E6}.dots i.d{background:var(--g1)}
.burst{position:fixed;pointer-events:none;font-size:1.6rem;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--x),var(--y)) scale(.4);opacity:0}}
@media (max-width:620px){.page{grid-template-columns:1fr}.pic{border-left:0;border-bottom:3px dashed var(--g2);max-height:230px;overflow:hidden}.pic img{max-width:190px}.txt{padding:18px}.op .e{font-size:2.2rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>

const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let mute=false,ac;try{mute=localStorage.getItem('story.mute')==='1'}catch(e){}
function tone(f,d,t=0){if(mute)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.18,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+d);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+d)}catch(e){}}
const ok=()=>{tone(660,.15);tone(880,.2,.1)},bad=()=>tone(200,.25),win=()=>[523,659,784,1046].forEach((f,i)=>tone(f,.3,i*.13));
$('#snd').textContent=mute?'🔇':'🔊';$('#snd').onclick=()=>{mute=!mute;$('#snd').textContent=mute?'🔇':'🔊';try{localStorage.setItem('story.mute',mute?'1':'0')}catch(e){}};
function burst(el){const r=el.getBoundingClientRect();for(let k=0;k<7;k++){const s=document.createElement('span');s.className='burst';s.textContent=['⭐','✨','🌟'][k%3];s.style.left=r.left+r.width/2+'px';s.style.top=r.top+r.height/2+'px';s.style.setProperty('--x',(Math.random()*160-80)+'px');s.style.setProperty('--y',(-40-Math.random()*90)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}}
let D,p=0,stars=0;
const pic=w=>w==='both'?`<div class="pic two"><img src="${IMG.boy}" alt="أحمد"><img src="${IMG.girl}" alt="مريم"></div>`:`<div class="pic"><img src="${IMG[w]||IMG.boy}" alt=""></div>`;
const dots=()=>`<div class="dots">${D.pages.map((_,k)=>`<i class="${k<p?'d':''}"></i>`).join('')}</div>`;
function cover(){p=0;stars=0;$('#st').textContent='⭐ 0';
 $('#m').innerHTML=`<div class="page">${pic('both')}<div class="txt"><span class="no">${esc(D.badge)}</span><h1 class="story" style="font-size:2rem">${esc(D.title)}</h1><button class="btn" onclick="show()">ابدأ القصة ✨</button></div></div>`}
function show(){const s=D.pages[p];
 $('#m').innerHTML=`<div class="page">${pic(s.who)}<div class="txt">${dots()}<p class="story">${esc(s.text)}</p><p class="q">${esc(s.q)}</p><div class="opts">${s.options.map((o,k)=>`<button class="op" data-k="${k}"><span class="e">${o[0]}</span>${esc(o[1])}</button>`).join('')}</div><div class="fb" id="fb"></div><div id="nx"></div></div></div>`;
 document.querySelectorAll('.op').forEach(b=>b.onclick=()=>{const o=s.options[b.dataset.k];
  if(o[2]){b.classList.add('ok');document.querySelectorAll('.op').forEach(x=>x.disabled=true);ok();burst(b);$('#st').textContent='⭐ '+(++stars);$('#fb').style.color='var(--ok)';$('#fb').textContent=s.f||'أحسنت!';
   $('#nx').innerHTML=`<button class="btn" onclick="p++;p<D.pages.length?show():end()">${p<D.pages.length-1?'أكمل القصة':'النهاية'}</button>`;$('#nx button').focus()}
  else{bad();b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');$('#fb').style.color='var(--bad)';$('#fb').textContent='حاول مرة أخرى'}})}
function end(){win();$('#m').innerHTML=`<div class="page">${pic('both')}<div class="txt"><span class="no">أحسنت! جمعتَ ${stars} نجوم</span><p class="story">${esc(D.end)}</p><div style="font-size:3rem" id="bg">⭐⭐⭐</div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn g" onclick="cover()">أعد القصة</button>${D.back?`<a class="btn" style="text-decoration:none" href="${esc(D.back)}">العودة إلى المنصة</a>`:''}</div></div></div>`;burst($('#bg'))}
window.STORY=d=>{D=d;document.title=d.title;$('#ttl').textContent=d.title;cover()};
/*LOADER*/(function(){const d=(new URLSearchParams(location.search).get('d')||'').replace(/[^\w-]/g,'');if(!d){$('#m').textContent='افتح القصة من رابطها، مثل: story.html?d=1-1';return}
 const s=document.createElement('script');s.src='story-'+d+'.js?v='+Date.now();s.onerror=()=>{$('#m').textContent='لم يُعثر على ملف القصة story-'+d+'.js'};document.head.appendChild(s)})();/*END*/
</script>
