<title>مغامرات مختبر الحاسوب</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f4ec;color:#15284b;font:1.12rem/1.7 Tajawal,Tahoma,Arial,sans-serif}
main{max-width:1160px;margin:auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:0 0 16px;font-weight:800}header span{color:#4a5d78;font-size:.95rem}
.book{display:grid;grid-template-columns:.88fr 1.12fr;background:#fff;border:1px solid #e6ded2;border-radius:28px;overflow:hidden;box-shadow:0 14px 45px #35245017}
.story{padding:clamp(22px,4vw,46px);display:flex;flex-direction:column;justify-content:center;min-width:0}
.art{min-width:0;background:#173253;display:grid;align-items:center;position:relative}
.art img{width:100%;height:100%;object-fit:cover;display:block}.art svg{width:100%;display:block;padding:12px}
h1{font-size:clamp(1.65rem,4vw,2.7rem);line-height:1.3;margin:.2em 0;font-weight:900}p{margin:8px 0}small{color:#805111;font-weight:800}
.buttons,.nav{display:flex;flex-wrap:wrap;gap:9px;margin-top:10px}.grp{margin-top:6px}
button,a.btn{font:inherit;font-weight:800;color:#15284b;border:1px solid #c5d5e4;background:#eef5fc;border-radius:14px;padding:9px 16px;cursor:pointer;text-decoration:none}
button:hover{background:#deedfd}button:focus-visible,a.btn:focus-visible{outline:3px solid #315ac0;outline-offset:3px}
.primary{background:#ffcf65;border-color:#ffcf65}.primary:hover{background:#ffbd3c}
button[aria-pressed=true]{background:#d1eddd;border-color:#438561}
.feedback{font-size:1rem;min-height:1.7em;color:#33536f;font-weight:700}
footer{text-align:center;font-size:.9rem;padding:18px;color:#4a5d78}[hidden]{display:none!important}
.pop{animation:pop .45s cubic-bezier(.2,1.5,.4,1)}@keyframes pop{from{transform:scale(.6);opacity:0}}
@media(max-width:760px){.book{grid-template-columns:1fr}.art{order:-1}.art img{max-height:330px}.story{padding:22px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

const el=id=>document.getElementById(id), AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
let D,step=0,S={};
function tone(f,d,t=0){try{const a=window._ac||(window._ac=new(window.AudioContext||window.webkitAudioContext)());const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.12,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+d)}catch(e){}}
function btn(parent,label,fn,primary,pressed){const n=document.createElement('button');n.type='button';n.textContent=label;if(primary)n.className='primary';if(pressed!==undefined)n.setAttribute('aria-pressed',pressed);n.onclick=fn;parent.append(n);return n}
const P=()=>D.pages[step-1];
function ready(){const p=P();return !p||!p.groups||p.groups.every(g=>S[g.key]===g.need)}
function go(n){step=n;render();el('title').focus()}
function art(){const a=el('art');a.querySelectorAll('svg').forEach(x=>x.remove());el('cover').hidden=step!==0;if(step===0)return;
 a.insertAdjacentHTML('beforeend',`<svg id="pic" viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="${(P()||{}).title||D.end.title}">${D.draw(S,step,IMG)}</svg>`)}
function render(){
 const last=step>D.pages.length, p=P();
 el('lsn').textContent=D.lesson;
 el('step').textContent=step===0?D.topic:last?'النهاية':'المشهد '+AR(step)+' من '+AR(D.pages.length);
 const t=step===0?[D.title,D.intro,'']:last?[D.end.title,D.end.text,'']:[p.title,p.text,p.q];
 [el('title').textContent,el('narration').textContent,el('question').textContent]=t;
 el('choices').replaceChildren();el('nav').replaceChildren();el('feedback').textContent='';
 if(p&&!last)(p.groups||[]).forEach(g=>{const box=document.createElement('div');box.className='buttons grp';el('choices').append(box);
  g.options.forEach(([v,label,msg])=>{btn(box,label,ev=>{S[g.key]=v;[...box.children].forEach(c=>c.setAttribute('aria-pressed',c===ev.currentTarget));
   el('feedback').textContent=msg;art();v===g.need?(tone(660,.15),tone(880,.2,.1)):tone(330,.18);navs()},false,S[g.key]===v)})});
 navs();art();
}
function navs(){const n=el('nav'),last=step>D.pages.length;n.replaceChildren();
 if(step===0){btn(n,'ابدأ المغامرة ←',()=>go(1),true);return}
 if(last){try{const q=(new URLSearchParams(location.search).get('d')||'').replace(/[^\w-]/g,'');if(q)localStorage.setItem('abeer.adv.'+q,String(Date.now()))}catch(e){}btn(n,'حفظ اللوحة',save,true);btn(n,'أعد المغامرة',()=>{S={};go(0)});if(D.back){const a=document.createElement('a');a.className='btn';a.href=D.back;a.textContent='العودة إلى المنصة';n.append(a)}
  [523,659,784,1046].forEach((f,i)=>tone(f,.3,i*.13));return}
 if(ready())btn(n,step===D.pages.length?'شاهد النهاية ←':'تابع القصة ←',()=>go(step+1),true).classList.add('pop');
 btn(n,'السابق',()=>go(step-1));
}
function save(){const svg=el('pic');if(!svg)return;const xml=new XMLSerializer().serializeToString(svg);const im=new Image();
 im.onload=()=>{const c=document.createElement('canvas');c.width=1440;c.height=960;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,1440,960);x.drawImage(im,0,0,1440,960);
  c.toBlob(b=>{if(!b){el('feedback').textContent='تعذّر تجهيز الصورة. جرّب مرة أخرى.';return}const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download=(D.file||'lohati')+'.png';l.click();setTimeout(()=>URL.revokeObjectURL(l.href),3000);el('feedback').textContent='صورة اللوحة جاهزة للتنزيل.'})};
 im.onerror=()=>el('feedback').textContent='تعذّر تجهيز الصورة في هذا المتصفّح.';
 im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml)}
window.STORY2=d=>{D=d;document.title=d.title+' | مغامرات مختبر الحاسوب';S={};render()};

 const s=document.createElement('script');s.src='s2-'+d+'.js?v='+Date.now();s.onerror=()=>{el('title').textContent='لم يُعثر على ملف المغامرة s2-'+d+'.js'};document.head.append(s)})();/*END*/
