<style>

:root[data-theme="dark"]{--bg:#0E1A21;--paper:#16262F;--text:#E3EDF0;--muted:#9DB3BB;--line:#27404B;--chip:#1F3540;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--text);font-family:"Tajawal",Tahoma,sans-serif;line-height:1.7;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.top{background:radial-gradient(120% 140% at 85% 10%,var(--brand2),var(--brand) 45%,var(--brand3));color:#fff;padding:14px 18px 40px;position:relative;overflow:hidden}
.top .row{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:12px}
.top img{width:52px;height:52px;border-radius:50%;background:#fff;padding:3px}
.top b{font-weight:900;font-size:1.15rem;display:block}.top small{color:var(--gold2);font-weight:700}
.top .sp{flex:1}
.back{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:12px;padding:6px 14px;font-weight:800;text-decoration:none;font-size:.9rem}
.wrap{max-width:860px;margin:-24px auto 30px;padding:0 14px;position:relative}
.panel{background:var(--paper);border-radius:22px;box-shadow:0 10px 30px rgba(23,63,85,.12);padding:24px}
h1{margin:0 0 4px;font-weight:900;font-size:clamp(1.5rem,4vw,2.1rem);color:var(--brand2)}
:root[data-theme="dark"] h1{color:var(--gold2)}
.badge{display:inline-block;background:color-mix(in srgb,var(--gold) 22%,transparent);font-weight:800;padding:2px 12px;border-radius:99px;font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat{background:var(--bg);border-radius:14px;padding:10px;text-align:center}.stat b{display:block;font-size:1.4rem;font-weight:900;color:var(--brand2)}
.rules{margin:0;padding:0 18px 0 0}.rules li{margin:4px 0}
.btn{border:0;border-radius:14px;padding:12px 22px;font-weight:900;font-size:1.05rem;background:var(--brand);color:#fff}
.btn.gold{background:var(--gold);color:#2A1C05}.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--text)}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.hud{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.hud .pill{background:var(--bg);border-radius:99px;padding:4px 14px;font-weight:900}
.hud .sp{flex:1}
.bar{height:10px;background:var(--chip);border-radius:99px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .3s}
.timer{position:relative;width:64px;height:64px;flex:0 0 auto}.timer svg{width:64px;height:64px;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:6}.timer .bg{stroke:var(--chip)}.timer .fg{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.timer span{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:1.2rem}
.q{font-size:clamp(1.25rem,3.4vw,1.7rem);font-weight:900;margin:6px 0 16px}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:10px;text-align:right;border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:14px 16px;font-size:1.2rem;font-weight:800;transition:transform .15s}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--gold)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper))}
.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 12%,var(--paper))}
.opt:disabled{cursor:default}
.say{border:0;background:var(--chip);border-radius:12px;padding:6px 12px;font-weight:800}
.exp{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--bg);font-weight:700;display:none}
.exp.on{display:block}
.pts{font-weight:900;color:var(--ok)}
.end{text-align:center}
.stars{font-size:2.6rem;letter-spacing:6px;margin:6px 0}
.cert{margin:18px auto 0;max-width:640px;border-radius:20px;padding:26px;background:linear-gradient(135deg,#fffaf0,#fff);color:#1C2A31;border:6px double var(--gold);text-align:center;position:relative}
.cert img{width:70px;height:70px;border-radius:50%}

.cert .by{margin-top:12px;font-weight:800;color:#173F55}

.confetti{position:fixed;width:8px;height:12px;z-index:60;pointer-events:none;border-radius:2px}

</style><style>

.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.pix{display:grid;gap:4px;justify-content:center;margin:0 0 14px}.pix i{width:34px;height:34px;border-radius:4px;background:#F1F4F5}

<script>
const BANK=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let AC=null;function tone(f,d=.12,type='sine',v=.08,delay=0){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sfx={ok:()=>{tone(523,.12);tone(659,.12,'sine',.09,.1);tone(784,.25,'sine',.09,.2)},no:()=>{tone(200,.35,'sawtooth',.06)},buzz:()=>{tone(880,.08,'square',.05);tone(1175,.12,'square',.05,.08)},tick:()=>tone(900,.04,'square',.02),win:()=>{[523,659,784,1046,1318].forEach((f,k)=>tone(f,.3,'sine',.09,k*.14))}};
function confetti(n=60){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cols=['#D9A64E','#F2CF8A','#2F8A57','#2F6FB3','#C8443B','#fff'];for(let k=0;k<n;k++){const c=document.createElement('i');c.className='confetti';c.style.background=cols[k%6];c.style.left=(20+Math.random()*60)+'vw';c.style.top='30vh';document.body.appendChild(c);const dx=(Math.random()-.5)*900,dy=-250-Math.random()*300;c.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${Math.random()*720}deg)`,opacity:1,offset:.5},{transform:`translate(${dx*1.2}px,${dy+700}px) rotate(1080deg)`,opacity:0}],{duration:2000+Math.random()*700}).onfinish=()=>c.remove()}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const PIXC={K:'#1A1A1A',C:'#29B6D1',R:'#C8443B',G:'#7AC143',O:'#F07A1E',Y:'#F2C94C'};
function fsToggle(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}}
let G=null,tH=null,cfg={unit:location.hash.slice(1)in BANK?location.hash.slice(1):'g1u1',n:10,time:30,names:['فريق النجوم','فريق الأقمار'],icons:['⭐','🌙']};
function setup(){ clearInterval(tH);
  $('#app').innerHTML=`<div class="setup"><h1>🏆 إعداد المسابقة الجماعية</h1><p style="margin:0" class="muted">فريقان يتنافسان على شاشة الصف. الفريق الأسرع يرفع يده، فتضغط الأستاذة اسمه ثم إجابته.</p>
  <label>الوحدة</label><div class="chips">${Object.entries(BANK).map(([k,u])=>`<button class="chip ${cfg.unit===k?'on':''}" onclick="cfg.unit='${k}';setup()">${esc(u.g)} · ${esc(u.u)} (${u.qs.length})</button>`).join('')}</div>
  <div class="row2"><div><label>اسم الفريق الأول</label><input class="in" id="n0" value="${esc(cfg.names[0])}"></div><div><label>اسم الفريق الثاني</label><input class="in" id="n1" value="${esc(cfg.names[1])}"></div></div>
  <div class="row2"><div><label>عدد الأسئلة</label><div class="chips">${[6,10,15].map(n=>`<button class="chip ${cfg.n===n?'on':''}" onclick="keep();cfg.n=${n};setup()">${n}</button>`).join('')}</div></div>
  <div><label>وقت كل سؤال</label><div class="chips">${[20,30,45].map(n=>`<button class="chip ${cfg.time===n?'on':''}" onclick="keep();cfg.time=${n};setup()">${n} ث</button>`).join('')}</div></div></div>
  <div class="acts"><button class="btn gold" style="font-size:1.2rem" onclick="keep();begin()">ابدأ المسابقة 🚀</button></div></div>`; }
function keep(){ const a=$('#n0'),b=$('#n1'); if(a) cfg.names=[a.value.trim()||'الفريق الأول',b.value.trim()||'الفريق الثاني']; }
function begin(){ const u=BANK[cfg.unit]; G={u,qs:shuffle(u.qs).slice(0,Math.min(cfg.n,u.qs.length)),i:0,sc:[0,0]}; sfx.win(); ask(); }
function teamsHtml(turn){ const lead=G.sc[0]===G.sc[1]?-1:(G.sc[0]>G.sc[1]?0:1);
  return `<div class="teams">${[0,1].map(t=>`<div class="team t${t} ${lead===t?'lead':''} ${turn===t?'turn':''}"><span class="ic">${cfg.icons[t]}</span><div><b>${esc(cfg.names[t])}</b>${turn===t?'دورنا للإجابة!':''}</div><span class="sc">${G.sc[t]}</span></div>`).join('<div class="vs">VS</div>')}</div>`; }
function ask(){ const q=G.qs[G.i]; G.turn=null; G.tried=[]; G.over=false; G.order=shuffle(q.o.map((o,j)=>j)); if(q.tf) G.order=[0,1]; render(); startTimer(); }
function render(msg=''){ const q=G.qs[G.i];
  let h=teamsHtml(G.turn)+`<div class="hud"><span class="pill">السؤال ${G.i+1} من ${G.qs.length}</span><span class="sp"></span><span class="tmr" id="tmr"></span></div><div class="bar"><i style="width:${G.i/G.qs.length*100}%"></i></div><div class="bq">${esc(q.q)}</div>`;
  if(q.pix){const w=q.pix[0].length;h+=`<div class="pix" style="grid-template-columns:repeat(${w},34px)">${q.pix.join('').split('').map(c=>`<i style="${PIXC[c]?'background:'+PIXC[c]:''}"></i>`).join('')}</div>`}
  h+=`<div class="bopts">${G.order.map((j,n)=>{const o=q.o[j];return `<button class="bopt" data-j="${j}" onclick="answer(${j})" ${G.turn===null||G.over?'disabled':''}><span class="lt">${'أبجد'[n]||n+1}</span>${o[1]&&!q.pix?esc(o[1])+' ':''}${esc(o[0])}</button>`}).join('')}</div>`;
  if(G.turn===null&&!G.over) h+=`<div class="who"><span style="font-weight:900;align-self:center">من رفع يده أولًا؟</span>${[0,1].filter(t=>!G.tried.includes(t)).map(t=>`<button class="btn tbtn${t}" onclick="pickTeam(${t})">${cfg.icons[t]} ${esc(cfg.names[t])}</button>`).join('')}</div>`;
  h+=`<div class="msg" id="msg">${msg}</div>`;
  if(G.over) h+=`<div class="acts" style="justify-content:center"><button class="btn gold" style="font-size:1.15rem" onclick="nextQ()">${G.i+1<G.qs.length?'السؤال التالي ←':'النتيجة النهائية 🏆'}</button></div>`;
  $('#app').innerHTML=h; }
function startTimer(){ clearInterval(tH); G.left=cfg.time; G.over=false; const t0=Date.now();
  tH=setInterval(()=>{ G.left=Math.max(0,cfg.time-(Date.now()-t0)/1000); const el=$('#tmr'); if(el) el.textContent='⏱ '+Math.ceil(G.left); if(G.left<=5&&G.left>0&&Math.abs(G.left-Math.round(G.left))<.06) sfx.tick(); if(G.left<=0){clearInterval(tH); reveal('⏰ انتهى الوقت!')} },100); }
function pickTeam(t){ G.turn=t; sfx.buzz(); render(`${cfg.icons[t]} ${esc(cfg.names[t])}: اختاروا إجابتكم`); }
function answer(j){ if(G.turn===null||G.over) return; const q=G.qs[G.i], t=G.turn;
  if(q.o[j][2]){ G.sc[t]+=10; sfx.ok(); confetti(30); G.over=true; clearInterval(tH); render(`✅ أحسنتم يا ${esc(cfg.names[t])}! +10 نقاط<br><span style="font-size:1rem;color:var(--muted)">${esc(q.e)}</span>`); mark(j); }
  else { sfx.no(); G.tried.push(t); const b=document.querySelector(`.bopt[data-j="${j}"]`); if(b) b.classList.add('no');
    const other=1-t;
    if(!G.tried.includes(other)){ G.turn=null; render(`❌ ليست صحيحة! الفرصة الآن لـ ${esc(cfg.names[other])}`); document.querySelector(`.bopt[data-j="${j}"]`).classList.add('no'); }
    else reveal('❌ لم يُجب أحد بشكل صحيح'); } }
function mark(j){ const q=G.qs[G.i]; document.querySelectorAll('.bopt').forEach(b=>{const k=+b.dataset.j; if(q.o[k][2]) b.classList.add('ok'); else if(k===j) b.classList.add('no'); b.disabled=true}); }
function reveal(m){ G.over=true; G.turn=null; clearInterval(tH); const q=G.qs[G.i]; render(`${m}<br><span style="font-size:1rem;color:var(--muted)">${esc(q.e)}</span>`); mark(-1); }
function nextQ(){ G.i++; if(G.i<G.qs.length) ask(); else end(); }
function end(){ clearInterval(tH); sfx.win(); confetti(90); const [a,b]=G.sc; const w=a===b?-1:(a>b?0:1);
  $('#app').innerHTML=teamsHtml(null)+`<div class="win">${w<0?'🤝 تعادل رائع!':'🏆 الفائز: '+esc(cfg.names[w])+' '+cfg.icons[w]}</div>
  <p style="text-align:center;font-size:1.3rem;font-weight:800">${w<0?'كل الفريقين أبطال اليوم! 🌟':'مبروك! وشكرًا للفريقين على روح المنافسة الجميلة 👏'}</p>
  <p style="text-align:center;color:var(--muted);font-weight:700">${esc(G.u.g)} · ${esc(G.u.u)}</p>
  <div class="acts" style="justify-content:center"><button class="btn gold" onclick="begin()">جولة جديدة 🔁</button><button class="btn ghost" onclick="setup()">إعداد جديد</button></div>`; }

/* ---------- N teams ---------- */
cfg.count=2; cfg.names=['فريق النجوم','فريق الأقمار','فريق الشموس','فريق قوس قزح']; cfg.icons=['⭐','🌙','☀️','🌈'];
function setup(){ clearInterval(tH);
  $('#app').innerHTML=`<div class="setup"><h1>🏆 إعداد المسابقة الجماعية</h1><p style="margin:0" class="muted">فرق تتنافس على شاشة الصف. الفريق الأسرع يرفع يده، فتضغط الأستاذة اسمه ثم إجابته.</p>
  <label>الوحدة</label><div class="chips">${Object.entries(BANK).map(([k,u])=>`<button class="chip ${cfg.unit===k?'on':''}" onclick="keep();cfg.unit='${k}';setup()">${esc(u.g)} · ${esc(u.u)} (${u.qs.length})</button>`).join('')}</div>
  <label>عدد الفرق</label><div class="chips">${[2,3,4].map(n=>`<button class="chip ${cfg.count===n?'on':''}" onclick="keep();cfg.count=${n};setup()">${n} فرق</button>`).join('')}</div>
  <label>أسماء الفرق</label><div class="rowN">${Array.from({length:cfg.count},(_,t)=>`<input class="in" id="n${t}" value="${esc(cfg.names[t])}" aria-label="اسم الفريق ${t+1}">`).join('')}</div>
  <div class="row2"><div><label>عدد الأسئلة</label><div class="chips">${[6,10,15,20].map(n=>`<button class="chip ${cfg.n===n?'on':''}" onclick="keep();cfg.n=${n};setup()">${n}</button>`).join('')}</div></div>
  <div><label>وقت كل سؤال</label><div class="chips">${[20,30,45].map(n=>`<button class="chip ${cfg.time===n?'on':''}" onclick="keep();cfg.time=${n};setup()">${n} ث</button>`).join('')}</div></div></div>
  <div class="acts"><button class="btn gold" style="font-size:1.2rem" onclick="keep();begin()">ابدأ المسابقة 🚀</button></div></div>`; }
function keep(){ for(let t=0;t<4;t++){const el=$('#n'+t); if(el) cfg.names[t]=el.value.trim()||('الفريق '+(t+1))} }
function begin(){ const u=BANK[cfg.unit]; G={u,qs:shuffle(u.qs).slice(0,Math.min(cfg.n,u.qs.length)),i:0,sc:Array(cfg.count).fill(0)}; sfx.win(); ask(); }
function teamsHtml(turn){ const mx=Math.max(...G.sc), lead=G.sc.filter(x=>x===mx).length===1&&mx>0?G.sc.indexOf(mx):-1;
  const cards=G.sc.map((sc,t)=>`<div class="team t${t} ${lead===t?'lead':''} ${turn===t?'turn':''}"><span class="ic">${cfg.icons[t]}</span><div><b>${esc(cfg.names[t])}</b>${turn===t?'دورنا للإجابة!':''}</div><span class="sc">${sc}</span></div>`);
  return cfg.count===2?`<div class="teams">${cards.join('<div class="vs">VS</div>')}</div>`:`<div class="teams n${cfg.count}">${cards.join('')}</div>`; }
function render(msg=''){ const q=G.qs[G.i];
  let h=teamsHtml(G.turn)+`<div class="hud"><span class="pill">السؤال ${G.i+1} من ${G.qs.length}</span><span class="sp"></span><span class="tmr" id="tmr"></span></div><div class="bar"><i style="width:${G.i/G.qs.length*100}%"></i></div><div class="bq">${esc(q.q)}</div>`;
  if(q.pix){const w=q.pix[0].length;h+=`<div class="pix" style="grid-template-columns:repeat(${w},34px)">${q.pix.join('').split('').map(c=>`<i style="${PIXC[c]?'background:'+PIXC[c]:''}"></i>`).join('')}</div>`}
  h+=`<div class="bopts">${G.order.map((j,n)=>{const o=q.o[j];return `<button class="bopt ${G.wrong&&G.wrong.includes(j)?'no':''}" data-j="${j}" onclick="answer(${j})" ${G.turn===null||G.over||(G.wrong&&G.wrong.includes(j))?'disabled':''}><span class="lt">${'أبجد'[n]||n+1}</span>${o[1]&&!q.pix?esc(o[1])+' ':''}${esc(o[0])}</button>`}).join('')}</div>`;
  if(G.turn===null&&!G.over) h+=`<div class="who"><span style="font-weight:900;align-self:center">من رفع يده أولًا؟</span>${G.sc.map((_,t)=>t).filter(t=>!G.tried.includes(t)).map(t=>`<button class="btn tbtn${t}" onclick="pickTeam(${t})">${cfg.icons[t]} ${esc(cfg.names[t])}</button>`).join('')}</div>`;
  h+=`<div class="msg" id="msg">${msg}</div>`;
  if(G.over) h+=`<div class="acts" style="justify-content:center"><button class="btn gold" style="font-size:1.15rem" onclick="nextQ()">${G.i+1<G.qs.length?'السؤال التالي ←':'النتيجة النهائية 🏆'}</button></div>`;
  $('#app').innerHTML=h; }
function ask(){ const q=G.qs[G.i]; G.turn=null; G.tried=[]; G.wrong=[]; G.over=false; G.order=q.tf?[0,1]:shuffle(q.o.map((o,j)=>j)); render(); startTimer(); }
function answer(j){ if(G.turn===null||G.over) return; const q=G.qs[G.i], t=G.turn;
  if(q.o[j][2]){ G.sc[t]+=10; sfx.ok(); confetti(30); G.over=true; clearInterval(tH); render(`✅ أحسنتم يا ${esc(cfg.names[t])}! +10 نقاط<br><span style="font-size:1rem;color:var(--muted)">${esc(q.e)}</span>`); mark(j); }
  else { sfx.no(); G.tried.push(t); G.wrong.push(j);
    const left=G.sc.map((_,k)=>k).filter(k=>!G.tried.includes(k)); const opts=q.o.filter((o,k)=>!G.wrong.includes(k)).length;
    if(left.length&&opts>1){ G.turn=null; render(`❌ ليست صحيحة! الفرصة الآن ${left.length===1?'لـ '+esc(cfg.names[left[0]]):'لبقية الفرق'}`); }
    else reveal('❌ لم يُجب أحد بشكل صحيح'); } }
function end(){ clearInterval(tH); sfx.win(); confetti(90); const mx=Math.max(...G.sc); const ws=G.sc.map((s,t)=>t).filter(t=>G.sc[t]===mx);
  const rank=G.sc.map((s,t)=>t).sort((a,b)=>G.sc[b]-G.sc[a]);
  $('#app').innerHTML=teamsHtml(null)+`<div class="win">${ws.length>1?'🤝 تعادل بين '+ws.map(t=>esc(cfg.names[t])).join(' و '):'🏆 الفائز: '+esc(cfg.names[ws[0]])+' '+cfg.icons[ws[0]]}</div>
  <p style="text-align:center;font-size:1.2rem;font-weight:800">${rank.map((t,k)=>`${['🥇','🥈','🥉','🏅'][k]} ${esc(cfg.names[t])}: ${G.sc[t]}`).join(' &nbsp; ')}</p>
  <p style="text-align:center;font-size:1.2rem;font-weight:800">شكرًا لكل الفرق على روح المنافسة الجميلة 👏</p>
  <p style="text-align:center;color:var(--muted);font-weight:700">${esc(G.u.g)} · ${esc(G.u.u)}</p>
  <div class="acts" style="justify-content:center"><button class="btn gold" onclick="begin()">جولة جديدة 🔁</button><button class="btn ghost" onclick="setup()">إعداد جديد</button></div>`; }
addEventListener('hashchange',()=>{ if(location.hash.slice(1) in BANK) cfg.unit=location.hash.slice(1); setup(); });
setup();
</script></body></html>
