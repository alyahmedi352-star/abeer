function confetti(n=50){ if(matchMedia('(prefers-reduced-motion: reduce)').matches) return; const cols=['#D9A64E','#F2CF8A','#2F8A57','#2F6FB3','#C8443B','#fff']; for(let k=0;k<n;k++){const c=document.createElement('i');c.className='confetti';c.style.background=cols[k%6];c.style.left=(25+Math.random()*50)+'vw';c.style.top='35vh';document.body.appendChild(c);const dx=(Math.random()-.5)*800,dy=-220-Math.random()*300;c.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${Math.random()*720}deg)`,opacity:1,offset:.5},{transform:`translate(${dx*1.2}px,${dy+700}px) rotate(1080deg)`,opacity:0}],{duration:1900+Math.random()*600}).onfinish=()=>c.remove()} }

let AC=null;function tone(f,d=.12,t='sine',v=.07,dl=0){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const s=AC.currentTime+dl,o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.setValueAtTime(f,s);g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+d);o.connect(g).connect(AC.destination);o.start(s);o.stop(s+d+.02)}catch(e){}}

async function restore(f){ if(!f) return; let d; try{ d=JSON.parse(await f.text()) }catch(e){ return toast('الملف غير صالح') } if(d.app!=='abeer-sufufi') return toast('هذا ليس ملف نسخة احتياطية لصفوفي');
  if(!confirm('سيُستعاد ما في النسخة: '+(d.t_students||[]).length+' طالبًا، وتُحدَّث السجلات الموجودة بنفس المعرّف. هل تريدين المتابعة؟')) return;
  let ops=[]; for(const col of ['t_classes','t_students','t_att','t_points']) (d[col]||[]).forEach(({id,...x})=>ops.push([col,id,x]));
  for(let i=0;i<ops.length;i+=400){ const b=db.batch(); ops.slice(i,i+400).forEach(([c,id,x])=>b.set(db.collection(c).doc(id),x)); await b.commit(); }
  toast('اكتمل الاسترجاع ✅'); }
/* ---------- points ---------- */
T.reason=REASONS[0][0];
function ptsView(c){ const L=sorted(); const tot=L.reduce((a,s)=>a+(s.pts||0),0); const top=L.slice().sort((a,b)=>(b.pts||0)-(a.pts||0)); const medal={}; top.slice(0,3).forEach((s,k)=>{ if(s.pts>0) medal[s.id]=['🥇','🥈','🥉'][k] });
  return `<div class="panel"><h2>نقاط ${esc(c.name)}</h2>
  <div class="kpis"><div class="kpi"><b>${tot}</b>مجموع نقاط الصف</div><div class="kpi"><b>${top[0]&&top[0].pts>0?esc(top[0].name.split(' ')[0]):'—'}</b>المتصدّر</div></div>
  <div class="edit"><div class="bar"><span style="font-weight:900">السبب:</span><span class="reasons">${REASONS.map(([r,e])=>`<button class="chip" aria-pressed="${T.reason===r}" onclick="T.reason='${r}';render()">${e} ${r}</button>`).join('')}</span></div>
  <div class="bar"><button class="btn sm ghost" onclick="T.sort=T.sort==='name'?'pts':'name';render()">ترتيب: ${T.sort==='name'?'أبجدي':'الأعلى نقاطًا'}</button><button class="btn sm ghost" onclick="selAll()">${T.sel.size?'إلغاء التحديد':'تحديد الكل'}</button>
   ${T.sel.size?`<button class="btn sm" onclick="give([...T.sel],1)">+1 للمحددين (${T.sel.size})</button><button class="btn sm ghost" onclick="give([...T.sel],-1)">−1 للمحددين</button>`:''}
   <button class="btn sm gold" onclick="givePresent()">+1 لكل الحاضرين اليوم</button><span class="sp"></span><button class="btn sm ghost" ${T.undo.length?'':'disabled'} onclick="undo()">↶ تراجع</button></div></div>
  <div class="pgrid">${L.map(s=>`<div class="pcard ${T.sel.has(s.id)?'sel':''}">${medal[s.id]?`<span class="rk">${medal[s.id]}</span>`:''}${av(s)}<div class="nm" onclick="toggleSel('${s.id}')">${esc(s.name)}</div><div class="pt">${s.pts||0}</div>
   <div class="pbtns edit"><button class="minus" onclick="give(['${s.id}'],-1)" aria-label="خصم نقطة">−</button><button class="plus" onclick="give(['${s.id}'],1)" aria-label="إضافة نقطة">+</button></div></div>`).join('')||'<p class="muted">أضيفي الطلاب أولًا.</p>'}</div>
  <p class="muted edit" style="font-size:.85rem">اضغطي على اسم الطالب لتحديده، لتعطي عدة طلاب نقطة واحدة معًا.</p></div>`; }
function toggleSel(id){ if(T.role!=='owner') return; T.sel.has(id)?T.sel.delete(id):T.sel.add(id); render(); }
function selAll(){ if(T.sel.size) T.sel.clear(); else T.students.forEach(s=>T.sel.add(s.id)); render(); }
async function give(ids,d){ if(T.role!=='owner'||!ids.length) return; const b=db.batch(), refs=[];
  ids.forEach(id=>{ const r=db.collection('t_points').doc(); refs.push(r.id); b.set(r,{studentId:id,classId:T.cls,delta:d,reason:T.reason,at:Date.now(),date:today()}); b.update(db.doc('t_students/'+id),{pts:firebase.firestore.FieldValue.increment(d)}); });
  try{ await b.commit(); T.undo.push({refs,ids,d}); if(T.undo.length>20) T.undo.shift(); d>0?sfx.plus():sfx.minus(); T.sel.clear(); toast((d>0?'+':'')+d+' '+T.reason+(ids.length>1?' لـ '+ids.length+' طلاب':'')); }catch(e){ toast('تعذّر الحفظ') } }
async function givePresent(){ const m=T.att||{}; let ids=T.students.filter(s=>['p','l'].includes(m[s.id])).map(s=>s.id);
  if(T.date!==today()){ T.date=today(); subAtt(); }
  if(!ids.length) return toast('سجّلي حضور اليوم أولًا'); give(ids,1); }
async function undo(){ const u=T.undo.pop(); if(!u) return; const b=db.batch(); u.refs.forEach(r=>b.delete(db.doc('t_points/'+r))); u.ids.forEach(id=>b.update(db.doc('t_students/'+id),{pts:firebase.firestore.FieldValue.increment(-u.d)}));
  try{ await b.commit(); toast('تم التراجع ↶') }catch(e){ toast('تعذّر التراجع') } }
</script></body></html>
