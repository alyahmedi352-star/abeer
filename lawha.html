@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A21;--paper:#16262F;--text:#E3EDF0;--muted:#9DB3BB;--line:#27404B;--chip:#1F3540;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1A21;--paper:#16262F;--text:#E3EDF0;--muted:#9DB3BB;--line:#27404B;--chip:#1F3540;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--text);font-family:"Tajawal",Tahoma,sans-serif;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.top{background:radial-gradient(120% 140% at 85% 10%,var(--brand2),var(--brand) 45%,var(--brand3));color:#fff;padding:12px 16px 34px}
.top .row{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top img{width:46px;height:46px;border-radius:50%;background:#fff;padding:3px}
.top b{font-weight:900;font-size:1.2rem;display:block}.top small{color:var(--gold2);font-weight:700}
.top .sp{flex:1}
.lnk{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:12px;padding:6px 12px;font-weight:800;text-decoration:none;font-size:.9rem}
.wrap{max-width:1100px;margin:-22px auto 30px;padding:0 12px}
.panel{background:var(--paper);border-radius:20px;box-shadow:0 10px 30px rgba(23,63,85,.1);padding:16px;margin-bottom:14px}
h2{margin:0 0 8px;font-weight:900;font-size:1.25rem;color:var(--brand2)}
:root[data-theme="dark"] h2{color:var(--gold2)}
.muted{color:var(--muted)}
.classes{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.classes .lbl{font-weight:900;margin-inline-start:6px}
.chip{border:2px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 14px;font-weight:800}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tab{border:0;background:var(--chip);border-radius:12px;padding:8px 16px;font-weight:900}
.tab[aria-pressed="true"]{background:var(--gold);color:#2A1C05}
.btn{border:0;border-radius:12px;padding:9px 16px;font-weight:900;background:var(--brand);color:#fff}
.btn.gold{background:var(--gold);color:#2A1C05}.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--text)}
.btn.sm{padding:5px 10px;font-size:.88rem}.btn.danger{background:var(--no)}
.in{border:2px solid var(--line);border-radius:12px;padding:8px 12px;background:var(--bg);width:100%}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.bar .sp{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:8px 0}
.kpi{background:var(--chip);border-radius:14px;padding:8px;text-align:center;font-weight:700}.kpi b{display:block;font-size:1.5rem;font-weight:900}
.list{display:grid;gap:6px}
.srow{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:14px;padding:8px 10px;flex-wrap:wrap}
.srow .n{width:28px;height:28px;border-radius:50%;background:var(--chip);display:grid;place-items:center;font-weight:900;font-size:.85rem;flex:0 0 auto}
.srow .nm{flex:1;font-weight:800;min-width:120px}
.att{display:flex;gap:4px}
.att button{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:5px 10px;font-weight:900;min-width:58px}
.att button.on[data-v="p"]{background:var(--ok);border-color:var(--ok);color:#fff}
.att button.on[data-v="a"]{background:var(--no);border-color:var(--no);color:#fff}
.att button.on[data-v="l"]{background:var(--late);border-color:var(--late);color:#fff}
.att button.on[data-v="e"]{background:var(--exc);border-color:var(--exc);color:#fff}
.pct{font-weight:900;font-size:.85rem;min-width:52px;text-align:center}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.pcard{background:var(--bg);border-radius:16px;padding:10px;text-align:center;border:2px solid transparent;position:relative}
.pcard.sel{border-color:var(--gold)}
.pcard .nm{font-weight:900;font-size:.98rem;min-height:2.6em;display:flex;align-items:center;justify-content:center;cursor:pointer}
.pcard .pt{font-size:1.6rem;font-weight:900;color:var(--brand2)}
.pcard .rk{position:absolute;top:6px;inset-inline-start:8px;font-size:1.1rem}
.pbtns{display:flex;gap:6px;justify-content:center;margin-top:4px}
.pbtns button{border:0;border-radius:10px;width:42px;height:36px;font-weight:900;font-size:1.1rem}
.plus{background:var(--ok);color:#fff}.minus{background:var(--chip)}
.reasons{display:flex;gap:6px;flex-wrap:wrap}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--brand3);color:#fff;padding:9px 18px;border-radius:12px;font-weight:800;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
.ro .edit{display:none!important}
textarea.in{min-height:140px}
.hist{overflow-x:auto}.hist table{border-collapse:collapse;font-size:.85rem;width:100%}.hist th,.hist td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:center;white-space:nowrap}.hist td:first-child,.hist th:first-child{text-align:right;position:sticky;right:0;background:var(--paper)}
.dot{display:inline-block;width:18px;height:18px;border-radius:5px;line-height:18px;color:#fff;font-size:.7rem;font-weight:900}
.dp{background:var(--ok)}.da{background:var(--no)}.dl{background:var(--late)}.de{background:var(--exc)}
.login{max-width:440px;margin:30px auto}

.av{width:34px;height:34px;flex:0 0 auto;display:inline-block;vertical-align:middle;border-radius:50%;object-fit:cover;background:#fff}
.pcard .av{width:54px;height:54px;display:block;margin:2px auto 0}
.gbtn{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:2px 6px;line-height:0}

.gbtn .av{width:26px;height:26px}

.drawbox .av{width:140px;height:140px;border:5px solid var(--gold);box-shadow:0 8px 24px rgba(0,0,0,.3)}

.drawbox .ds{color:var(--gold2);font-weight:800}
.drawbox.spin .dn{opacity:.85}

.grp h3{margin:0 0 6px;font-size:1.1rem;font-weight:900}
.grp div{display:flex;align-items:center;gap:6px;font-weight:700;margin:3px 0}
.grp .av{width:28px;height:28px}

.rep td:first-child,.rep th:first-child{text-align:right}
.rep .rk{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin:8px 0}.rep .rk div{background:#EEF3F4;border-radius:12px;padding:8px;text-align:center;font-weight:700}.rep .rk b{display:block;font-size:1.4rem;color:#173F55}

.rep .sig{display:flex;justify-content:space-between;margin-top:26px;font-weight:800}

  const nn=normN(s.name); const res=R.res.filter(r=>r.grade===c.grade&&(normN(r.name)===nn||(nn.length>4&&normN(r.name).startsWith(nn.split(' ')[0]+' ')&&nn.startsWith(normN(r.name).split(' ')[0]))&&normN(r.name)===nn)).sort((a,b)=>(a.at||0)-(b.at||0));
  const avg=res.length?Math.round(res.reduce((a,r)=>a+(r.pct||0),0)/res.length):null;
  return {days:days.length,p:cnt('p'),a:cnt('a'),l:cnt('l'),e:cnt('e'),ap,pts:s.pts||0,byR,res,avg}; }
function repView(c){ const L=sorted();
  if(!T._rep||T._repCls!==T.cls){ loadRepData().then(()=>render()); return `<div class="panel"><p class="muted">جارٍ تجهيز التقارير…</p></div>`; }
  const R=T._rep; const d=new Date().toLocaleDateString('ar-OM',{day:'numeric',month:'long',year:'numeric'});
  const head=(t,s)=>`<div class="rh"><img src="903b5f133dc801a5866fccf3307ee053.jpg" alt="">${s?av(s):''}<div style="flex:1"><h1>${t}</h1><div style="color:#5E7079;font-weight:700">مدرسة مزن المعرفة (1-4) · تقنية المعلومات · ${esc(c.name)}</div></div><div style="text-align:left;color:#5E7079;font-weight:700">${d}</div></div>`;
  let body='';
  const one=s=>{ const x=stuStats(s,R,c); return `<div class="rep">${head('تقرير الطالب/ة: '+esc(s.name),s)}
    <div class="rk"><div><b>${x.ap==null?'—':x.ap+'%'}</b>نسبة الحضور</div><div><b>${x.a}</b>أيام الغياب</div><div><b>${x.l}</b>التأخر</div><div><b>${x.pts}</b>النقاط</div><div><b>${x.avg==null?'—':x.avg+'%'}</b>متوسط الواجبات والحصاد</div></div>
    <h3>⭐ النقاط حسب السبب</h3>${Object.keys(x.byR).length?`<table><tr>${Object.keys(x.byR).map(k=>`<th>${esc(k)}</th>`).join('')}</tr><tr>${Object.values(x.byR).map(v=>`<td>${v}</td>`).join('')}</tr></table>`:'<p>لا توجد نقاط مسجلة بعد.</p>'}
    <h3>📝 نتائج الواجبات والحصاد في المنصة</h3>${x.res.length?`<table><tr><th>النشاط</th><th>النتيجة</th><th>النسبة</th><th>التاريخ</th></tr>${x.res.map(r=>`<tr><td>${esc(r.type)}: ${esc(r.title)}</td><td>${r.score} / ${r.total}</td><td>${r.pct}%</td><td>${new Date(r.at).toLocaleDateString('ar-OM')}</td></tr>`).join('')}</table>`:'<p>لا توجد نتائج مسجلة بهذا الاسم بعد.</p>'}
    <h3>✅ الحضور</h3><p>حاضر: <b>${x.p}</b> · غائب: <b>${x.a}</b> · متأخر: <b>${x.l}</b> · مستأذن: <b>${x.e}</b> · من أصل <b>${x.days}</b> يومًا مسجلًا</p>
    <div class="sig"><span>المعلمة: أ. عبير صالح اليحمدية</span><span>التوقيع: ..................</span></div></div>`; };
  if(T.repSel==='class'){ body=`<div class="rep">${head('تقرير صف '+esc(c.name))}<table><tr><th>#</th><th>الطالب/ة</th><th>نسبة الحضور</th><th>الغياب</th><th>التأخر</th><th>النقاط</th><th>متوسط الواجبات</th></tr>
    ${L.map((s,k)=>{const x=stuStats(s,R,c);return `<tr><td>${k+1}</td><td>${esc(s.name)}</td><td>${x.ap==null?'—':x.ap+'%'}</td><td>${x.a}</td><td>${x.l}</td><td>${x.pts}</td><td>${x.avg==null?'—':x.avg+'%'}</td></tr>`}).join('')}</table>
    <div class="sig"><span>المعلمة: أ. عبير صالح اليحمدية</span><span>التوقيع: ..................</span></div></div>`; }
  else if(T.repSel==='all') body=L.map(one).join('');
  else { const s=T.students.find(x=>x.id===T.repSel); body=s?one(s):''; }
  return `<div class="panel"><div class="bar noprint"><h2 style="margin:0">📄 التقارير</h2><select class="in" style="width:auto" onchange="T.repSel=this.value;render()"><option value="class" ${T.repSel==='class'?'selected':''}>تقرير الصف كاملًا</option><option value="all" ${T.repSel==='all'?'selected':''}>تقارير كل الطلاب (للطباعة)</option>${L.map(s=>`<option value="${s.id}" ${T.repSel===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select>
   <span class="sp"></span><button class="btn ghost sm" onclick="T._rep=null;render()">🔄 تحديث</button><button class="btn gold" onclick="print()">🖨️ طباعة / حفظ PDF</button></div>${body}</div>`; }
/* ---------- backup ---------- */
function setView(c){ return `<div class="panel"><h2>⚙️ النسخ الاحتياطي</h2>
  <p>بياناتك محفوظة في <b>قاعدة بيانات Firebase</b>، و<b>تتزامن تلقائيًا</b> بين كل أجهزتك: ما تسجّلينه في الحاسوب يظهر فورًا في الجوال، ولا تحتاجين إلى رمز مزامنة.</p>
  <p>ومع ذلك، احفظي <b>نسخة احتياطية</b> على جهازك مرة كل شهر تقريبًا، للحماية من الحذف بالخطأ.</p>
  <div class="bar"><button class="btn" onclick="backup()">⬇️ تنزيل نسخة احتياطية</button>${T.role==='owner'?`<label class="btn ghost" style="cursor:pointer">⬆️ استرجاع من نسخة<input type="file" accept=".json" hidden onchange="restore(this.files[0])"></label>`:''}</div>
  <p class="muted" id="bkmsg">${localStorage.getItem('lw.bk')?'آخر نسخة احتياطية: '+new Date(+localStorage.getItem('lw.bk')).toLocaleDateString('ar-OM'):'لم تُحفظ نسخة احتياطية من هذا الجهاز بعد.'}</p></div>`; }
async function backup(){ toast('جارٍ تجهيز النسخة…'); const out={app:'abeer-sufufi',v:1,at:Date.now()};
  for(const col of ['t_classes','t_students','t_att','t_points']){ const q=await db.collection(col).get(); out[col]=q.docs.map(d=>({id:d.id,...d.data()})); }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'})); a.download='نسخة-صفوفي-'+today()+'.json'; document.body.appendChild(a); a.click(); a.remove();
  localStorage.setItem('lw.bk',Date.now()); toast('حُفظت النسخة ✅'); render(); }
async function restore(f){ if(!f) return; let d; try{ d=JSON.parse(await f.text()) }catch(e){ return toast('الملف غير صالح') } if(d.app!=='abeer-sufufi') return toast('هذا ليس ملف نسخة احتياطية لصفوفي');
  if(!confirm('سيُستعاد ما في النسخة: '+(d.t_students||[]).length+' طالبًا، وتُحدَّث السجلات الموجودة بنفس المعرّف. هل تريدين المتابعة؟')) return;
  let ops=[]; for(const col of ['t_classes','t_students','t_att','t_points']) (d[col]||[]).forEach(({id,...x})=>ops.push([col,id,x]));
  for(let i=0;i<ops.length;i+=400){ const b=db.batch(); ops.slice(i,i+400).forEach(([c,id,x])=>b.set(db.collection(c).doc(id),x)); await b.commit(); }
  toast('اكتمل الاسترجاع ✅'); }
/* ---------- points ---------- */
T.reason=REASONS[0][0];
function ptsView(c){ const L=sorted(); const tot=L.reduce((a,s)=>a+(s.pts||0),0); const top=L.slice().sort((a,b)=>(b.pts||0)-(a.pts||0)); const medal={}; top.slice(0,3).forEach((s,k)=>{ if(s.pts>0) medal[s.id]=['🥇','🥈','🥉'][k] });
  return `<div class="panel"><h2>نقاط ${esc(c.name)}</h2>
  <div class="kpis"><div class="kpi"><b>${tot}</b>مجموع نقاط الصف</div><div class="kpi"><b>${top[0]&&top[0].pts>0?esc(top[0].name.split(' ')[0]):'—'}</b>المتصدّر</div></div>
  <div class="edit"><div class="bar"><span style="font-weight:900">السبب:</span><span class="reasons">${REASONS.map(([r,e])=>`<button class="chip" aria-pressed="${T.reason===r}" onclick="T.reason='${r}';render()">${e} ${r}</button>`).join('')}</span></div>
  <div class="bar"><button class="btn sm ghost" onclick="T.sort=T.sort==='name'?'pts':'name';render()">ترتيب: ${T.sort==='name'?'أبجدي':'الأعلى نقاطًا'}</button><button class="btn sm ghost" onclick="selAll()">${T.sel.size?'إلغاء التحديد':'تحديد الكل'}</button>
   ${T.sel.size?`<button class="btn sm" onclick="give([...T.sel],1)">+1 للمحددين (${T.sel.size})</button><button class="btn sm ghost" onclick="give([...T.sel],-1)">−1 للمحددين</button>`:''}
   <button class="btn sm gold" onclick="givePresent()">+1 لكل الحاضرين اليوم</button><span class="sp"></span><button class="btn sm ghost" ${T.undo.length?'':'disabled'} onclick="undo()">↶ تراجع</button></div></div>
  <div class="pgrid">${L.map(s=>`<div class="pcard ${T.sel.has(s.id)?'sel':''}">${medal[s.id]?`<span class="rk">${medal[s.id]}</span>`:''}${av(s)}<div class="nm" onclick="toggleSel('${s.id}')">${esc(s.name)}</div><div class="pt">${s.pts||0}</div>
   <div class="pbtns edit"><button class="minus" onclick="give(['${s.id}'],-1)" aria-label="خصم نقطة">−</button><button class="plus" onclick="give(['${s.id}'],1)" aria-label="إضافة نقطة">+</button></div></div>`).join('')||'<p class="muted">أضيفي الطلاب أولًا.</p>'}</div>
  <p class="muted edit" style="font-size:.85rem">اضغطي على اسم الطالب لتحديده، لتعطي عدة طلاب نقطة واحدة معًا.</p></div>`; }
function toggleSel(id){ if(T.role!=='owner') return; T.sel.has(id)?T.sel.delete(id):T.sel.add(id); render(); }
function selAll(){ if(T.sel.size) T.sel.clear(); else T.students.forEach(s=>T.sel.add(s.id)); render(); }
async function give(ids,d){ if(T.role!=='owner'||!ids.length) return; const b=db.batch(), refs=[];
  ids.forEach(id=>{ const r=db.collection('t_points').doc(); refs.push(r.id); b.set(r,{studentId:id,classId:T.cls,delta:d,reason:T.reason,at:Date.now(),date:today()}); b.update(db.doc('t_students/'+id),{pts:firebase.firestore.FieldValue.increment(d)}); });
  try{ await b.commit(); T.undo.push({refs,ids,d}); if(T.undo.length>20) T.undo.shift(); d>0?sfx.plus():sfx.minus(); T.sel.clear(); toast((d>0?'+':'')+d+' '+T.reason+(ids.length>1?' لـ '+ids.length+' طلاب':'')); }catch(e){ toast('تعذّر الحفظ') } }
async function givePresent(){ const m=T.att||{}; let ids=T.students.filter(s=>['p','l'].includes(m[s.id])).map(s=>s.id);
  if(T.date!==today()){ T.date=today(); subAtt(); }
  if(!ids.length) return toast('سجّلي حضور اليوم أولًا'); give(ids,1); }
async function undo(){ const u=T.undo.pop(); if(!u) return; const b=db.batch(); u.refs.forEach(r=>b.delete(db.doc('t_points/'+r))); u.ids.forEach(id=>b.update(db.doc('t_students/'+id),{pts:firebase.firestore.FieldValue.increment(-u.d)}));
  try{ await b.commit(); toast('تم التراجع ↶') }catch(e){ toast('تعذّر التراجع') } }
</script></body></html>
