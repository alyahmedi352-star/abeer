<title>بطاقات مغامرات الوحدة الأولى</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&family=Cairo:wght@600;700;800&display=swap" rel="stylesheet">
<style>:root{color-scheme:light;--bg:#EEF3F4;--ink:#2b2350;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14112a;--ink:#ece9ff;--card:#221d40}}:root[data-theme="dark"]{color-scheme:dark;--bg:#14112a;--ink:#ece9ff;--card:#221d40}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo","Tajawal",Tahoma,sans-serif;padding:18px}
.unit{max-width:1080px;margin:auto;background:linear-gradient(135deg,#4b3a8c,#2b2350);border-radius:22px;padding:14px 22px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.unit small{color:#F2CF8A;font-weight:700}.unit h2{margin:2px 0;font:800 1.5rem "Baloo Bhaijaan 2","Cairo",sans-serif}
.dl{display:flex;gap:8px;flex-wrap:wrap}.dl button{font:800 .9rem "Cairo",sans-serif;border:0;border-radius:12px;padding:8px 14px;background:#D9A64E;color:#2b2350;cursor:pointer}
#msg{max-width:1080px;margin:10px auto 0;font-weight:700}
.grid{max-width:1080px;margin:14px auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.card{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 8px 24px rgba(43,35,80,.12)}.cv{aspect-ratio:4/3;overflow:hidden;background:#173F55}.cv img{width:100%;height:100%;object-fit:cover;display:block}
.bd{padding:12px 16px 16px}.tags{display:flex;gap:6px}.tags span{border-radius:12px;padding:2px 10px;font-size:.8rem;font-weight:700}.t1{background:#FBEFD9;color:#8a5a12}.t2{background:#E6ECF2;color:#3c4f63}
h3{margin:10px 0 4px;font-size:1.05rem;line-height:1.5;font-weight:800}p{margin:0 0 8px;font-size:.92rem;opacity:.85;line-height:1.6}.lk{font-size:.85rem}
.chip{display:inline-block;margin-top:6px;background:#E9E5F7;color:#2b2350;border-radius:12px;padding:6px 12px;font-weight:800;text-decoration:none;font-size:.92rem}
</style></head><body>

const BAL='"Baloo Bhaijaan 2","Cairo",sans-serif', CAI='"Cairo",sans-serif';
function textImg(t,{font,size,weight=800,fill='#fff',gold=false,stroke,sw=0,shadow=false}){
 const S=2,c=document.createElement('canvas'),x=c.getContext('2d');x.font=`${weight} ${size}px ${font}`;
 const pad=Math.ceil(sw+10),w=Math.ceil(x.measureText(t).width)+pad*2,h=Math.ceil(size*1.7)+pad*2;
 c.width=w*S;c.height=h*S;x.scale(S,S);x.font=`${weight} ${size}px ${font}`;x.direction='rtl';x.textAlign='center';x.textBaseline='middle';
 if(shadow){x.shadowColor='rgba(0,0,0,.3)';x.shadowOffsetY=5}
 if(stroke){x.lineJoin='round';x.lineWidth=sw;x.strokeStyle=stroke;x.strokeText(t,w/2,h/2)}
 x.shadowColor='transparent';
 if(gold){const g=x.createLinearGradient(0,0,w,0);g.addColorStop(0,'#F2CF8A');g.addColorStop(.5,'#FFF3D2');g.addColorStop(1,'#D9A64E');x.fillStyle=g}else x.fillStyle=fill;
 x.fillText(t,w/2,h/2);return{url:c.toDataURL('image/png'),w,h};
}
const im=(r,x,y)=>`<image href="${r.url}" xlink:href="${r.url}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${r.w}" height="${r.h}"/>`;
function cover(k){const T=DATA.tpl[k];let size=66;const mc=document.createElement('canvas').getContext('2d');
 const fit=()=>{mc.font=`800 ${size}px ${BAL}`;return Math.max(mc.measureText(T.t1).width,mc.measureText(T.t2).width)};while(fit()>320&&size>34)size-=2;
 const right=596;
 const a=textImg(T.t1,{font:BAL,size,gold:true,stroke:'#173F55',sw:5,shadow:true}),aw=textImg(T.t1,{font:BAL,size,fill:'#fff'});
 const b=textImg(T.t2,{font:BAL,size,fill:'#fff',stroke:'#173F55',sw:5,shadow:true});
 const ax=right-a.w,ay=182-a.h/2,bx=right-b.w,by=268-b.h/2,awx=right-a.w+(a.w-aw.w)/2,awy=182-aw.h/2;
 const t1=`<g class="ti" style="animation-delay:.15s">${im(a,ax,ay)}<mask id="mt">${im(aw,awx,awy)}</mask><rect x="${ax}" y="${ay}" width="${a.w}" height="${a.h}" fill="url(#shine)" mask="url(#mt)"/></g>`;
 const t2=`<g class="ti" style="animation-delay:.3s">${im(b,bx,by)}</g>`;
 const bd=textImg(T.badge,{font:CAI,size:20,fill:'#173F55'}),bt=textImg('قصة تفاعلية',{font:CAI,size:22,fill:'#173F55'});
 let s=T.svg.replace('{{T1}}',t1).replace('{{T2}}',t2).replace('{{BADGE}}',im(bd,-75-bd.w/2,-2-bd.h/2)).replace('{{BTN}}',im(bt,526-bt.w/2,356-bt.h/2));
 return 'data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(s)));}
