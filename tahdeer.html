ارن التلميذ بين الجهازين ويستنتج أن الهاتف الذكي حاسوب ينفّذ مهامّ كثيرة وأن المصباح له وظيفة واحدة، ثم يحل التدريب 1 (صِل اسم الجهاز بالصورة المناسبة)؛ كتاب الطالب ص16–17: الحاسوب في حياتنا (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. فرز الأجهزة: يوزّع التلاميذ في مجموعات رباعية بأدوار (قائد، وعارض للبطاقات، ومتحدث، ومراقب للوقت)، ويعطي كل مجموعة بطاقات صور (جهاز لوحي، وهاتف ذكي، وساعة ذكية، ومكواة، ومجفف شعر، وخلاط) ولوحة بعمودين، ويتابع عمل المجموعات، وتفرز المجموعة البطاقات إلى «أجهزة تُعد حاسوبًا» و«أجهزة لا تُعد حاسوبًا»، ويعرض المتحدث لوحة مجموعته ويناقشها الزملاء، ثم يلصق كل تلميذ الصور في التدريب 2؛ كتاب الطالب ص19: تدريب 2 (الأجهزة التي تُعد حاسوبًا والتي لا تُعد) (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. طرق التفاعل مع الحاسوب: يمرّر المعلم جهازًا لوحيًا على عدد من التلاميذ ويطلب فتح تطبيق بالإصبع، ثم يعطي الجهاز أمرًا صوتيًا أمامهم، ويذكر التحكم بحركة الجسد في ألعاب الفيديو ونظارات الواقع الافتراضي (VR)، ويسأل: بكم طريقة تحدّثنا مع الجهاز؟ ويجرّب التلميذ فتح التطبيق باللمس ويلاحظ استجابة الجهاز للصوت، ويستنتج طرق التفاعل (اللمس، والصوت، وحركة الجسد)، ثم يحل التدريب 3 (اختر الجهاز الذي يعمل بأمر صوتي أو باللمس)؛ كتاب الطالب ص20–21: التفاعل مع الحاسوب و تدريب 3 (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والتقويم الختامي: يطرح المعلم أسئلة التقويم الختامي ويذكّر بالمصطلحات الإنجليزية (Computer, Laptop, Tablet, Touch)، ثم يجيب التلميذ عن أسئلة التقويم الختامي ويردد المصطلحات (4 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): أشر إلى الجهاز الحاسوبي: الهاتف الذكي أم المكواة؟\nالإجابة: الهاتف الذكي.\n\nس2 (مستوى التطبيق): لماذا نعدّ الهاتف الذكي حاسوبًا ولا نعدّ المصباح حاسوبًا؟\nالإجابة: لأن الهاتف الذكي ينفّذ مهامّ كثيرة (التصوير، والألعاب، والفيديو) بأوامرنا، أما المصباح فله وظيفة واحدة هي الإضاءة.\n\nس3 (مستوى الاستدلال): التلفاز الذكي في غرفة أحمد يعرض الفيديو ويتصل بالإنترنت؛ هل يُعد جهازًا حاسوبيًا؟ ولماذا؟\nالإجابة: نعم، لأنه يحتوي على حاسوب وينفّذ مهامّ متعددة وفق أوامر المستخدم.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورًا لهاتف ذكي ومكواة ومصباح وجهاز لوحي، ويفرزها مع التلميذ في سلتين: «حاسوب» و«ليس حاسوبًا» مع ذكر ما يفعله كل جهاز، ثم يسأله: الساعة الذكية أم الثلاجة العادية، أيهما حاسوب؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة لجهاز من البيت (كالتلفاز الذكي أو الساعة الذكية) يبيّنون فيها هل هو حاسوب ولماذا، وطريقة التفاعل معه: لمس أم صوت أم حركة جسد أم فأرة.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): سمِّ جهازين حاسوبيين تستخدمهما في البيت.\nالإجابة: مثل: الهاتف الذكي والجهاز اللوحي (أو الحاسوب المحمول).\n\nس2 (مستوى التطبيق): اذكر طريقتين للتفاعل مع الجهاز اللوحي غير الفأرة ولوحة المفاتيح.\nالإجابة: اللمس بالإصبع، والأوامر الصوتية.\n\nس3 (مستوى الاستدلال): صنّف هذه الأجهزة: (ساعة ذكية، خلاط، حاسوب محمول، مجفف شعر)، ثم اذكر طريقة نتفاعل بها مع أحد الحواسيب منها.\nالإجابة: حواسيب: الساعة الذكية والحاسوب المحمول. ليست حواسيب: الخلاط ومجفف الشعر. نتفاعل مع الساعة الذكية باللمس أو بالأوامر الصوتية.", "notes": "إرشاد للطالب:\n- راجع صفحات الدرس 1.1 «الحاسوب في حياتنا» في كتاب «عالمي الرقمي»، وتأكد من إكمال التدريبات 1–3.\n- ابحث في بيتك عن جهازين حاسوبيين، وارسم أحدهما لتعرضه على زملائك.\n\nإرشاد لولي الأمر:\n- شارك طفلك في تسمية الأجهزة الحاسوبية في المنزل (الهاتف الذكي، والجهاز اللوحي، والتلفاز الذكي)، وتحدّث معه عن مدة الاستخدام المناسبة.\n- يُرجى التأكد من إحضار كتاب «عالمي الرقمي» في حصة الأسبوع القادم (أجزاء جهاز الحاسوب).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/it/?l=1\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}, {"id": "g1-1-2", "g": "الصف الأول", "u": "الوحدة الأولى: حاسوبي", "t": "الدرس 1.2: أجزاء جهاز الحاسوب", "ours": false, "periods": [{"title": "أجزاء الحاسوب المكتبي وتوصيلها، وتشغيل الحاسوب وإيقافه، وقواعد الأمن والسلامة", "week": "الأسبوع الثاني (13–17/9/2026م)", "ref": "كتاب التلميذ: الدرس 1.2 – التدريبات 1–3  |  دليل المعلم: ص 32–39", "f": {"outcomes": "1. يتعرف أجزاء جهاز الحاسوب المكتبي (الشاشة، ووحدة النظام، ولوحة المفاتيح، والفأرة، ومكبرات الصوت، والطابعة) (13 دقيقة)\n2. يوصّل أجزاء الحاسوب بوحدة النظام على الرسم التوضيحي (5 دقائق)\n3. يشغّل جهاز الحاسوب ويوقفه بالطريقة الصحيحة (4 دقائق)\n4. يتّبع قواعد الأمن والسلامة في أثناء استخدام الحاسوب (9 دقائق)\n\nمخرج تعليمي آخر:\n- ينطق أسماء أجزاء الحاسوب بالإنجليزية (Monitor, System Unit, Keyboard, Mouse, Speakers, Printer) (4 دقائق)", "levels": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج الآخر: تذكر", "strategies": "1. التعلم بالاكتشاف\n2. التعلم بالنمذجة\n3. التعلم المبني على اللعب", "resources": "1. الكتاب\n2. جهاز الحاسب\n3. السبورة الذكية\n4. صورة توضيحية\n5. الأقلام\n6. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات)\n7. أخرى: لوحة من الورق المقوى عليها صور أجزاء الحاسوب وأشرطة ورقية تمثل الأسلاك، وبطاقات خضراء وحمراء", "concepts": "1. الشاشة (Monitor)\n2. وحدة النظام (System Unit): الجزء الذي تتصل به أجزاء الحاسوب الأخرى ويتحكم بها.\n3. لوحة المفاتيح (Keyboard)\n4. الفأرة (Mouse)\n5. مكبرات الصوت (Speakers)\n6. الطابعة (Printer)\n7. قواعد الأمن والسلامة في مختبر الحاسوب", "warmup": "- يقدّم المعلم هدف الحصة: التعرف إلى الأجزاء الأساسية للحاسوب المكتبي.\n- يطلب من التلاميذ استكشاف مكان عملهم في المختبر وعدّ الأجهزة التي يرونها، ثم يسأل: هل تعرف أجزاء الحاسوب المكتبي؟ ما وظيفة كل جزء؟ هل من الضروري توصيل كل جزء بالكهرباء؟\n- يعدّ التلاميذ الأجهزة ويذكرون ما يعرفونه من أسمائها ووظائفها. (5 دقائق)", "procedures": "1. وحدة النظام عقل الحاسوب: يشغّل المعلم أنشودة على الحاسوب ثم يطفئ الشاشة ويسأل: لماذا ما زلنا نسمع الأنشودة؟ ثم يفصل الشاشة كاملة أمامهم، ويترك التلاميذ يستنتجون أن وحدة النظام هي التي تشغّل الحاسوب وتتحكم بالأجزاء الأخرى، ثم يعرض أسماء الأجزاء بالعربية والإنجليزية، ويلاحظ التلميذ استمرار الصوت ويستنتج دور وحدة النظام، ويردد أسماء الأجزاء، ثم يحل التدريب 1 (ضع دائرة حول أجزاء جهاز الحاسوب) والتدريب 2 (الجزء الذي يربط الأجزاء الأخرى ويتحكم بها)؛ كتاب الطالب ص22 و ص27: أجزاء جهاز الحاسوب وتوصيلها بوحدة النظام (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. التوصيل والتشغيل والإيقاف: ينمذج المعلم على الطاولة الرئيسة توصيل كل جزء بوحدة النظام خطوة بخطوة مفكرًا بصوت عالٍ («الفأرة تتصل بوحدة النظام لا بلوحة المفاتيح»)، ثم ينمذج تشغيل الحاسوب وإيقافه الصحيح من زر ابدأ (Start) ثم الطاقة (Power) ثم إيقاف التشغيل (Shut down)، وينبّه إلى أن إيقافه بزر التشغيل خطأ، ثم يوجّه تلميذين لإعادة التوصيل على لوحة الورق المقوى، ويتابع التلميذ النمذجة، ويشارك تلميذان في التوصيل على اللوحة (تطبيق موجّه) دون لمس الأسلاك الحقيقية، ثم يحل كل تلميذ التدريب 3 (ارسم خطوطًا لتوصيل الأجزاء بوحدة النظام)، ويشغّل حاسوبه ويوقفه بالطريقة الصحيحة (تطبيق مستقل)؛ كتاب الطالب ص24–25 و ص28: التوصيلات وتشغيل الحاسوب وإيقافه (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. إشارة المختبر: يدير المعلم لعبة «إشارة المختبر»: يعرض صور سلوكيات (الأكل والشرب قرب الحاسوب، واليد المبللة، والجلوس الصحيح، والمسافة الآمنة من الشاشة، ولمس الأسلاك، والضغط بقوة على المفاتيح)، ويرفع التلميذ البطاقة الخضراء للسلوك الآمن والحمراء لغير الآمن ويعلل، ويجيب عن أسئلة التقويم الختامي؛ كتاب الطالب ص29: إرشادات الأمن والسلامة (7 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): أشر إلى الشاشة، ثم إلى وحدة النظام.\nالإجابة: يشير التلميذ إلى الشاشة (Monitor) ثم إلى وحدة النظام (System Unit) إشارة صحيحة.\n\nس2 (مستوى التطبيق): أطفأنا الشاشة وبقي صوت الأنشودة يعمل؛ ماذا تستنتج؟\nالإجابة: أن وحدة النظام هي التي تشغّل الحاسوب، والشاشة جزء يعرض الصور والكلمات فقط.\n\nس3 (مستوى الاستدلال): الفأرة لا تعمل مع أن الحاسوب يعمل؛ ما السبب المحتمل؟ وماذا تفعل؟\nالإجابة: ربما سلكها غير متصل بوحدة النظام؛ أخبر المعلم أو شخصًا بالغًا ليوصلها، ولا أوصلها بنفسي.\n\n• نشاط علاجي (لمن لم يتقن): يشير المعلم مع التلميذ إلى أجزاء حاسوب حقيقي واحدًا واحدًا (الشاشة، ووحدة النظام، ولوحة المفاتيح، والفأرة، والسماعات) ويلصق عليها بطاقات أسمائها، ثم يطلب منه أن يشير إلى وحدة النظام.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برسم حاسوب مكتبي يوصلون فيه كل جزء بوحدة النظام بخط، ويكتبون تحت كل جزء وظيفته، ويقترحون قاعدة سلامة واحدة للتعامل معه.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): سمِّ جزأين من أجزاء الحاسوب نستخدمهما لإدخال الأوامر.\nالإجابة: لوحة المفاتيح (Keyboard) والفأرة (Mouse).\n\nس2 (مستوى التطبيق): ما الطريقة الصحيحة لإيقاف تشغيل الحاسوب؟\nالإجابة: من زر ابدأ (Start) ثم زر الطاقة (Power) ثم إيقاف التشغيل (Shut down)، وليس بالضغط على زر التشغيل.\n\nس3 (مستوى الاستدلال): رأيت زميلك يشرب العصير بجانب الحاسوب ويداه مبللتان؛ ما الخطأ؟ وبماذا تنصحه؟\nالإجابة: الشرب قرب الحاسوب واستخدامه بيدين مبللتين خطأ؛ أنصحه بإبعاد العصير وتجفيف يديه حتى لا يتلف الجهاز ولا يتعرض للخطر.", "notes": "إرشاد للطالب:\n- راجع أسماء أجزاء الحاسوب في الدرس 1.2 من كتاب «عالمي الرقمي»، وردّدها بالعربية والإنجليزية.\n- أخبر أسرتك بثلاث من قواعد السلامة التي تعلمتها في مختبر الحاسوب.\n\nإرشاد لولي الأمر:\n- لا تسمح لطفلك بتوصيل الأسلاك أو فصلها بمفرده، وتابع جلوسه الصحيح ومسافة عينيه من الشاشة.\n- شجّعه على إيقاف الأجهزة بالطريقة الصحيحة بعد الانتهاء من استخدامها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/it/?l=2\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}, {"id": "g1-1-3", "g": "الصف الأول", "u": "الوحدة الأولى: حاسوبي", "t": "الدرس 1.3: سطح المكتب", "ours": false, "periods": [{"title": "أيقونات سطح المكتب الأساسية وأنواع الملفات الرقمية", "week": "الأسبوع الثالث (20–24/9/2026م)", "ref": "كتاب التلميذ: الدرس 1.3 – التدريبات 1–7  |  دليل المعلم: ص 40–48", "f": {"outcomes": "1. يتعرف الرموز الأساسية لسطح مكتب الحاسوب (هذا الحاسوب الشخصي، والمستندات، وسلة المحذوفات، ومتصفح الإنترنت، وزر ابدأ، والساعة) (9 دقائق)\n2. يميّز رموز سطح المكتب الأكثر شيوعًا واستخداماتها (9 دقائق)\n3. يميّز بين أنواع ملفات الحاسوب (نص، وصورة، وصوت، وفيديو) (13 دقيقة)\n\nمخرج تعليمي آخر:\n- ينطق أسماء الأيقونات بالإنجليزية (Desktop, This PC, Documents, Recycle Bin, Start, Internet Browser) (4 دقائق)", "levels": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: فهم\nالمخرج الآخر: تذكر", "strategies": "1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. التعلم المبني على اللعب", "resources": "1. الكتاب\n2. جهاز الحاسب\n3. السبورة الذكية\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (متصفح Google Chrome، والمفكرة Notepad)\n6. أخرى: كاميرا رقمية أو هاتف ذكي للتصوير والتسجيل، ولوحات «شاشة» فارغة وبطاقات الأيقونات", "concepts": "1. سطح المكتب (Desktop)\n2. هذا الحاسوب الشخصي (This PC)\n3. المستندات (Documents)\n4. سلة المحذوفات (Recycle Bin)\n5. متصفح الإنترنت (Internet Browser)\n6. زر ابدأ (Start)\n7. الملف الرقمي (Digital file): نص أو صورة أو صوت أو فيديو", "warmup": "- يقدّم المعلم هدف الحصة، ويشغّل الحواسيب، ويطلب من التلاميذ استكشاف سطح المكتب.\n- يسأل: ما الذي تراه على الشاشة بعد تشغيل الحاسوب؟ هل تعرف وظائف هذه الأيقونات؟ أين يظهر التاريخ والوقت؟\n- يتأمل التلاميذ الشاشة ويشيرون إلى الأيقونات والساعة ويخمّنون وظائفها. (5 دقائق)", "procedures": "1. وظائف الأيقونات: يطرح المعلم تشبيهات تقود إلى الوظيفة قبل تسميتها: أين تحفظ دفاترك؟ (المستندات Documents)، أين تلقي الورق التالف؟ (سلة المحذوفات Recycle Bin التي تسمح أيضًا باستعادة ما حُذف)، لكل منا اسم وعمر (هذا الحاسوب الشخصي This PC يحمل معلومات الحاسوب)، أين الرسام وهو ليس على سطح المكتب؟ (زر ابدأ Start)، ثم ينقر الساعة، ويفتح Google Chrome ويعرض مقطعًا قصيرًا، ويستنتج التلميذ وظيفة كل أيقونة من التشبيه ويرددها بالعربية والإنجليزية، ثم يحل التدريب 2 (الاستخدام الصحيح لسلة المحذوفات) والتدريب 3 (الاستخدام الصحيح لمتصفح الإنترنت)؛ كتاب الطالب ص30: سطح المكتب (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. نبني سطح المكتب: يوزّع المعلم على كل مجموعة لوحة «شاشة» فارغة وبطاقات الأيقونات، ويحدد الأدوار (قائد، ولاصق، ومتحدث، ومراقب)، ويتابع ويصحح، وتبني المجموعة سطح مكتب كاملًا، ويشرح المتحدث وظيفة أيقونتين منه، ثم يحل كل تلميذ التدريب 1 (ألصق الأيقونات لإنشاء سطح المكتب الخاص بك)؛ كتاب الطالب ص31: تدريب 1 (الصق الأيقونات) (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. أنواع الملفات الرقمية: يلتقط المعلم صورة للمختبر، ويسجّل مقطع فيديو قصيرًا ومقطعًا صوتيًا، ويكتب كلمة في المفكرة (Notepad)، ثم يضعها في مجلد واحد ويعرض أيقوناتها ويسأل: بماذا تختلف هذه الأيقونات؟ أي ملف أنشأناه بالكتابة؟ ويقارن التلميذ الأيقونات ويستنتج أنواع الملفات (نص، وصورة، وصوت، وفيديو)، ثم يحل التدريبات 4–7 (اختيار الملف الرقمي الناتج عن كل موقف)؛ كتاب الطالب ص33: ملفاتي الرقمية (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. لعبة «أين أذهب؟»: يذكر المعلم مواقف سريعة (أريد حذف صورة، أريد مشاهدة فيديو، أريد معرفة الوقت، أريد حفظ ملف)، وتتسابق المجموعات للإشارة إلى الأيقونة المناسبة على السبورة الذكية، ثم يطرح أسئلة التقويم الختامي، ويتسابق التلميذ مع مجموعته للإشارة إلى الأيقونة المناسبة لكل موقف، ثم يجيب عن أسئلة التقويم الختامي؛ كتاب الطالب ص32: تدريبا 2 و 3 (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): أشر إلى أيقونة سلة المحذوفات على السبورة.\nالإجابة: يشير إلى أيقونة سلة المحذوفات (Recycle Bin).\n\nس2 (مستوى التطبيق): أي أيقونة تستخدم لتشاهد فيديو على الإنترنت؟ ولماذا؟\nالإجابة: متصفح الإنترنت (Google Chrome)، لأنه يفتح مواقع الإنترنت.\n\nس3 (مستوى الاستدلال): حذفت صورة رسمتها بالخطأ؛ من أين يمكنك استعادتها؟ ولماذا؟\nالإجابة: من سلة المحذوفات (Recycle Bin)، لأنها تحتفظ بالملفات المحذوفة ويمكن استعادتها منها.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم بطاقات مكبّرة لأيقونات سطح المكتب (سلة المحذوفات، والمستندات، والمتصفح، وزر ابدأ، والساعة) ويطابقها التلميذ مع صور استخداماتها بمساعدة زميل، ثم يسأله: أين نجد الصورة التي حذفناها؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصنيف بطاقات ملفات (رسمة، وأنشودة، ومقطع فيديو، وقصة مكتوبة) إلى نص وصورة وصوت وفيديو، واقتراح الأيقونة التي يفتحون منها كل ملف مع التعليل.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما نوع الملف الذي ينشأ عند التقاط صورة بالكاميرا؟\nالإجابة: ملف صورة.\n\nس2 (مستوى التطبيق): ما الملف الذي ينشأ عند الكتابة بلوحة المفاتيح؟ وما الملف الذي ينشأ عند تسجيل صوتك؟\nالإجابة: الكتابة ينشأ عنها ملف نصي، وتسجيل الصوت ينشأ عنه ملف صوتي.\n\nس3 (مستوى الاستدلال): اذكر ثلاثة أنواع من الملفات يمكن إنشاؤها بالهاتف الذكي، وعلّل.\nالإجابة: صورة وفيديو وصوت (ونص أيضًا)، لأن الهاتف الذكي حاسوب فيه كاميرا وميكروفون ولوحة مفاتيح على الشاشة.", "notes": "إرشاد للطالب:\n- راجع أيقونات سطح المكتب في الدرس 1.3 من كتاب «عالمي الرقمي»، وتأكد من إكمال التدريبات 1–7.\n- سمِّ لأسرتك أربعة أنواع من الملفات الرقمية: نص، وصورة، وصوت، وفيديو.\n\nإرشاد لولي الأمر:\n- اعرض على طفلك شاشة حاسوب أو جهاز لوحي في المنزل، واسأله عن مكان الساعة ومتصفح الإنترنت.\n- التقطا معًا صورة وسجّلا مقطعًا صوتيًا قصيرًا ليميّز الفرق بين الملفين.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/it/?l=3\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}, {"id": "g1-1-4", "g": "الصف الأول", "u": "الوحدة الأولى: حاسوبي", "t": "الدرس 1.4: انقر واكتب", "ours": false, "periods": [{"title": "استخدام الفأرة ولوحة المفاتيح، وفتح تطبيق والتحكم في نافذته، ووضعية الجلوس الصحيحة", "week": "الأسبوع الرابع (27/9–1/10/2026م)", "ref": "كتاب التلميذ: الدرس 1.4 – التدريبان 1 و2  |  دليل المعلم: ص 49–54", "f": {"outcomes": "1. يتعرف أجزاء الفأرة ولوحة المفاتيح ووظائفهما (5 دقائق)\n2. يفتح تطبيق المفكرة (Notepad) ويكبّر نافذته ويصغّرها ويغلقها (4 دقائق)\n3. يستخدم الفأرة ولوحة المفاتيح بطريقة صحيحة وآمنة (9 دقائق)\n4. يحافظ على وضعية الجسم الصحيحة عند استخدام الحاسوب (4 دقائق)\n\nمخرج تعليمي آخر:\n- يفرّق بين معاني المصطلحات الإنجليزية (Click, Double-click, Right-click, Maximize, Minimize) (13 دقيقة)", "levels": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج الآخر: فهم", "strategies": "1. التعلم بالاكتشاف\n2. التعلم بالنمذجة\n3. التعلم المبني على اللعب", "resources": "1. جهاز الحاسب\n2. جهاز عرض البيانات\n3. الكتاب\n4. صورة توضيحية\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (المفكرة Notepad، ومسابقة المجموعات)", "concepts": "1. الفأرة (Mouse) وأجزاؤها: الزر الأيسر، والزر الأيمن، وعجلة التمرير\n2. انقر (Click)\n3. نقرة مزدوجة (Double-click)\n4. نقرة بزر الفأرة الأيمن (Right-click)\n5. تكبير (Maximize) وتصغير (Minimize) وإغلاق النافذة\n6. لوحة المفاتيح (Keyboard)\n7. وضعية الجلوس الصحيحة", "warmup": "- يقدّم المعلم هدف الحصة، ويشغّل أمام التلاميذ حاسوبًا دون فأرة ولوحة مفاتيح، ويسأل: ما المفقود هنا؟ كيف سنعطي الحاسوب أوامرنا؟\n- يتابع بأسئلة: هل تعرف ما يمكننا فعله بلوحة المفاتيح؟ هل لكل حاسوب لوحة مفاتيح؟ هل استخدمت الفأرة من قبل؟ ولأي غرض؟\n- يكتشف التلاميذ الجزأين المفقودين ويقترحون وظيفة كل منهما. (5 دقائق)", "procedures": "1. الفأرة وفتح التطبيق: يعرض المعلم أجزاء الفأرة (الزر الأيسر، والزر الأيمن، وعجلة التمرير)، وينمذج وضع الأصابع الصحيح بمساعدة تلميذ، ثم ينفّذ على جهاز العرض مفكرًا بصوت عالٍ: تحريك المؤشر فوق أيقونة المفكرة، والنقر (Click) لتحديدها، والنقر بالزر الأيمن (Right-click) لإظهار القائمة، والنقر المزدوج (Double-click) لفتحها، ثم التكبير (Maximize) والتصغير (Minimize) والإغلاق، ويطلب من التلاميذ تنفيذ كل خطوة معه، ويمسك التلميذ الفأرة بالوضعية الصحيحة وينفّذ الخطوات مع المعلم (تطبيق موجّه)، ثم يحل التدريب 1 مستقلًا (افتح الملف، كبّره وصغّره، افتحه مرة أخرى في نافذة كبيرة ثم أغلقه) والتدريب 2 (اختر الرمز المناسب)؛ كتاب الطالب ص36–37: الفأرة وفتح تطبيق (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. لوحة المفاتيح: يعرض المعلم صورة مكبّرة للوحة المفاتيح، ويشير إلى مفاتيح الحروف ومجموعتي الأرقام والأسهم ومفتاح المسافة للخلف (Backspace)، وينمذج وضع اليدين الصحيح، ثم يكتب حرفًا في المفكرة أمامهم، ويقرأ التلميذ الحروف مع المعلم، ويحدد المفاتيح نفسها على لوحة مفاتيحه، ويكتب الحرف الأول من اسمه في المفكرة بوضعية يدين صحيحة؛ كتاب الطالب ص38: لوحة المفاتيح (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. المعلم يقول: يعرض المعلم صورة لجلسة خاطئة وأخرى صحيحة ويسأل: أيهما أفضل؟ ولماذا؟ ثم يدير لعبة «المعلم يقول»: «اجلس جلسة صحيحة، ضع قدميك على الأرض، انقر مرة، انقر نقرًا مزدوجًا، صغّر النافذة...»، ويختار التلميذ الجلسة الصحيحة ويعلل، وينفّذ الأوامر بسرعة ودقة، ويساعد زميله إن أخطأ؛ كتاب الطالب ص41–42: الجلوس الصحيح واستخدام الفأرة ولوحة المفاتيح بأمان (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام والتقويم الختامي: يطرح المعلم أسئلة التقويم الختامي، ثم يجيب عن أسئلة التقويم الختامي (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): أشر إلى زر الفأرة الأيسر.\nالإجابة: يشير إلى الزر الأيسر للفأرة.\n\nس2 (مستوى التطبيق): كيف تفتح تطبيق المفكرة من أيقونته على سطح المكتب؟\nالإجابة: بالنقر المزدوج (Double-click) على أيقونته بزر الفأرة الأيسر.\n\nس3 (مستوى الاستدلال): أردت أن تملأ نافذة المفكرة الشاشة كلها؛ أي زر تختار؟ وما الفرق بينه وبين زر التصغير؟\nالإجابة: زر التكبير (Maximize)؛ التكبير يجعل النافذة تملأ الشاشة، أما التصغير (Minimize) فيخفي النافذة إلى شريط المهام دون إغلاقها.\n\n• نشاط علاجي (لمن لم يتقن): يمسك المعلم يد التلميذ على الفأرة ويتدربان على النقرة الواحدة ثم النقر المزدوج على أيقونة المفكرة، ثم يكبّران النافذة ويصغّرانها، ثم يطلب منه أن يفتح المفكرة وحده ويغلقها.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بفتح المفكرة وكتابة أسمائهم، ثم تجربة أزرار التكبير والتصغير والإغلاق، وشرح الفرق بين التصغير والإغلاق لزميل بلغة بسيطة.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر جزأين من أجزاء الفأرة.\nالإجابة: اثنان مما يأتي: الزر الأيسر، والزر الأيمن، وعجلة التمرير.\n\nس2 (مستوى التطبيق): ماذا يحدث عند النقر بزر الفأرة الأيمن على أيقونة؟\nالإجابة: تظهر قائمة بخيارات.\n\nس3 (مستوى الاستدلال): جلس زميلك قريبًا جدًا من الشاشة وظهره منحنٍ؛ صحّح جلسته في ثلاث نقاط.\nالإجابة: يبتعد مسافة آمنة عن الشاشة، ويسند ظهره مستقيمًا إلى الكرسي، ويضع قدميه على الأرض ويديه بمستوى لوحة المفاتيح والفأرة.", "notes": "إرشاد للطالب:\n- راجع الدرس 1.4 «انقر واكتب» في كتاب «عالمي الرقمي»، ودرّب نفسك على الجلسة الصحيحة أمام أي جهاز في البيت.\n- استعد لحصة الأسبوع القادم «دعنا نتذكر» بمراجعة دروس الوحدة الأولى.\n\nإرشاد لولي الأمر:\n- ساعد طفلك على الإمساك الصحيح بالفأرة إن توفر حاسوب في المنزل، وتابع استقامة ظهره وثبات قدميه على الأرض.\n- ذكّره بالجلوس على مسافة آمنة من الشاشة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/it/?l=4\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}, {"id": "g1-1-5", "g": "الصف الأول", "u": "الوحدة الأول التدريب 1 (ألصق أجزاء الحاسوب) والتدريب 2 (صِل أجزاء الفأرة بمكانها المناسب)؛ كتاب الطالب ص43–44: «دعنا نتذكر» تدريبا 1 و 2 (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n2. لوحة المفاتيح والملفات: يعرض المعلم لوحة المفاتيح مكبّرة ويطلب تحديد مواضع مفاتيح الحروف والأرقام ومفاتيح (Spacebar, Backspace, Enter)، ثم يوضح مهمتي التدريبين 3 و4، ويوزّع بطاقة تصحيح ذاتي ملونة، ويتابع ويدعم من يحتاج، ويحل التلميذ وحده وفق سرعته التدريب 3 (لوّن المفاتيح بالألوان المحددة) والتدريب 4 (لوّن دوائر الأجهزة بألوان ملفاتها)، ثم يقارن ببطاقة التصحيح ويصحح أخطاءه، ويضع ✓ في بطاقة «أستطيع أن»؛ كتاب الطالب ص45 و ص46: تدريبا 3 و 4 (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n3. آمن أم غير آمن؟: يطرح المعلم أسئلة: هل يمكنك استخدام الحاسوب ويداك متسختان؟ هل تتناول الطعام في أثناء استخدامه؟ هل يُسمح بفصل سلك كهربائي؟ ثم يعطي كل مجموعة صورة سلوك لتحكم عليه، وتناقش المجموعة الصورة وتقرر هل السلوك آمن أم غير آمن وتعلل، ثم يحل كل تلميذ التدريب 5 (السلوك الصحيح والخطأ) والتدريب 6 (الطريقة الآمنة وغير الآمنة)؛ كتاب الطالب ص46–47: تدريبا 5 و 6 (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام والتقويم الختامي: يطرح المعلم أسئلة التقويم الختامي، ثم يجيب عن أسئلة التقويم الختامي (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): يعرض المعلم الفأرة: ما اسم هذا الجزء؟ وما اسم الجزء الذي ننزل به في الصفحة ونصعد؟\nالإجابة: الفأرة (Mouse)، وعجلة التمرير.\n\nس2 (مستوى التطبيق): أين يقع مفتاح المسافة (Spacebar) في لوحة المفاتيح؟ وما وظيفته؟\nالإجابة: المفتاح الطويل في أسفل لوحة المفاتيح؛ يضيف مسافة بين الحروف والكلمات.\n\nس3 (مستوى الاستدلال): الكاميرا الرقمية والحاسوب المحمول: أيهما يستطيع إنشاء ملف نصي؟ ولماذا؟\nالإجابة: الحاسوب المحمول، لأن فيه لوحة مفاتيح نكتب بها، أما الكاميرا فتنشئ صورًا ومقاطع فيديو.\n\n• نشاط علاجي (لمن لم يتقن): يراجع المعلم مع التلميذ أجزاء الفأرة (الزر الأيسر والأيمن وعجلة التمرير) ومفتاحي المسافة والمسافة للخلف على لوحة مفاتيح حقيقية بالإشارة واللمس، ثم يسأله: أي مفتاح يضيف مسافة بين الكلمات؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتوصيل بطاقات أجهزة (الكاميرا، والميكروفون، والحاسوب المحمول) بأنواع الملفات التي تنشئها، وكتابة قاعدتين للسلوك الآمن عند استخدام الحاسوب.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): سمِّ أجزاء الفأرة الثلاثة.\nالإجابة: الزر الأيسر، والزر الأيمن، وعجلة التمرير.\n\nس2 (مستوى التطبيق): أي ملف ينشأ عند تسجيل صوتك؟ وأي ملف ينشأ عند الكتابة؟\nالإجابة: تسجيل الصوت ينشأ عنه ملف صوتي، والكتابة ينشأ عنها ملف نصي.\n\nس3 (مستوى الاستدلال): أيهما سلوك غير آمن: ترتيب المكتب ونظافته، أم سحب سلك الحاسوب من المقبس؟ ولماذا؟\nالإجابة: سحب السلك من المقبس سلوك غير آمن، لأنه قد يسبب صعقة كهربائية أو يتلف الجهاز.", "notes": "إرشاد للطالب:\n- أكمل مع أسرتك بطاقة «أستطيع أن» لمراجعة الوحدة الأولى، وراجع تدريبات الدرس 1.5 في كتاب «عالمي الرقمي».\n- أخبر أسرتك بأسماء أجزاء الفأرة الثلاثة.\n\nإرشاد لولي الأمر:\n- اسأل طفلك عن ثلاث قواعد للسلامة عند استخدام الحاسوب، وامدحه عند إجابته الصحيحة.\n- ساعده على تحديد مفتاح المسافة (Spacebar) ومفتاح المسافة للخلف (Backspace) إن توفرت لوحة مفاتيح في المنزل.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/it/?l=5\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}, {"id": "g1-1-6", "g": "الصف الأول", "u": "الوحدة الأولى: حاسوبي", "t": "الدرس 1.6: لنطبّق معًا", "ours": false, "periods": [{"title": "التدرب على النقر والنقر المزدوج والكتابة والحذف والمسافة في المفكرة (Notepad)", "week": "الأسبوع السادس (11–15/10/2026م)", "ref": "كتاب التلميذ: الدرس 1.6 – التدريبات 1–6  |  دليل المعلم: ص 64–69", "f": {"outcomes": "1. يستخدم الفأرة بطريقة صحيحة للنقر والنقر المزدوج وفتح المفكرة (Notepad) (13 دقيقة)\n2. يكتب الحروف والأرقام في المفكرة مستخدمًا مفتاح المسافة (Spacebar) ومفتاح المسافة للخلف (Backspace) (18 دقيقة)\n\nمخرج تعليمي آخر:\n- يفرّق بين النقر مرتين ببطء والنقر المزدوج السريع وأثر كل منهما (4 دقائق)", "levels": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "strategies": "1. التعلم المبني على اللعب\n2. التعلم بالنمذجة\n3. التعلم الذاتي", "resources": "1. جهاز الحاسب\n2. جهاز عرض البيانات\n3. السبورة التقليدية\n4. الكتاب\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (المفكرة Notepad)\n6. أخرى: بطاقة مهام متدرجة للتدريب الذاتي", "concepts": "1. الفأرة (Mouse)\n2. انقر (Click)\n3. نقرة مزدوجة (Double-click)\n4. مفتاح المسافة (Spacebar)\n5. مفتاح المسافة للخلف (Backspace)\n6. صف الارتكاز ووضع اليدين على لوحة المفاتيح", "warmup": "- يقدّم المعلم هدف الحصة: التدرب على استخدام الفأرة ولوحة المفاتيح.\n- يطرح ألغاز «من أنا؟»: «في الجهاز اللوحي تلمس الشاشة بإصبعك، فمن يقوم بعملي في الحاسوب؟»، «تكتب اسمك على الورقة بالقلم، فبماذا تكتبه في الحاسوب؟».\n- يحل التلاميذ الألغاز ويذكرون أجزاء الفأرة والإجراءات التي ننفّذها بها. (5 دقائق)", "procedures": "1. النقر والنقر المزدوج: ينمذج المعلم على جهاز العرض وضع الأصابع على الفأرة، ثم ينقر نقرة واحدة على ملف المفكرة المحفوظ مسبقًا على سطح المكتب (بخط كبير) فيتحدد، وينقر بالزر الأيمن فتظهر القائمة، ثم ينقر نقرًا مزدوجًا سريعًا فيُفتح، مفكرًا بصوت عالٍ: «لو نقرت مرتين ببطء سيظهر مربع تغيير الاسم»، ثم يطلب تنفيذ كل خطوة معه، وينفّذ التلميذ الخطوات مع المعلم ويلاحظ الفرق بين النقرة الواحدة والنقر بالزر الأيمن والنقر المزدوج، ثم يحل التدريب 1 (استخدم الفأرة للنقر مرة واحدة ومرتين)؛ كتاب الطالب ص48: «لنطبق معًا» تدريب 1 (استخدام الفأرة) (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. الكتابة والحذف والمسافة: ينمذج المعلم وضع اليدين على صف الارتكاز واستخدام كلتا اليدين، ويكتب الأرقام من 1 إلى 0، ثم يحذف رقمًا بمفتاح Backspace ويضيف مسافة بمفتاح Spacebar، ويوجّه التلاميذ خطوة بخطوة، ويكتب التلميذ الأرقام كما في التدريب 2 (اكتب الأرقام الآتية)، ثم يجرّب حذف رقم بمفتاح Backspace وإضافة مسافة بمفتاح Spacebar؛ كتاب الطالب ص49–50: «لنطبق معًا» تدريبات 2–4 (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. بطاقة المهام المتدرجة: يوزّع المعلم بطاقة مهام متدرجة تتضمن التدريبات 3 و4 و5 و6، ويتجول بين التلاميذ يدعم ويصحح وضع اليدين ويشجع، وينجز التلميذ المهام وفق سرعته: يكتب أحرف لوحة المفاتيح بالترتيب (التدريب 3)، ويحذفها (التدريب 4)، ويضغط المفاتيح الملونة مع مسافة بعد كل حرف أو رقم (التدريب 5)، ويكتب اسمه وعمره (التدريب 6)، ويضع ✓ أمام كل مهمة ينجزها؛ كتاب الطالب ص51: «لنطبق معًا» تدريبا 5 و 6 (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. سباق صيد الحروف: يعرض المعلم حرفًا أو رقمًا على السبورة، وتتسابق المجموعات لكتابته في المفكرة، ثم يطرح أسئلة التقويم الختامي، ويكتب التلميذ الحرف أو الرقم بسرعة ودقة مع مجموعته، ثم يجيب عن أسئلة التقويم الختامي (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): انقر نقرة واحدة على أيقونة المفكرة؛ ماذا حدث؟\nالإجابة: تحددت الأيقونة (ظهر حولها تمييز) ولم تُفتح.\n\nس2 (مستوى التطبيق): اكتب الرقم 5 ثم احذفه؛ أي مفتاح استخدمت للحذف؟\nالإجابة: مفتاح المسافة للخلف (Backspace).\n\nس3 (مستوى الاستدلال): نقر زميلك على أيقونة المفكرة مرتين ببطء فظهر مربع لتغيير الاسم بدل أن يُفتح الملف؛ لماذا؟ وكيف يصحح ذلك؟\nالإجابة: لأنه نقر ببطء فتفعّلت إعادة التسمية؛ ينقر في مكان فارغ، ثم ينقر على الأيقونة نقرتين سريعتين متتاليتين.\n\n• نشاط علاجي (لمن لم يتقن): يتدرب المعلم مع التلميذ خطوة خطوة: نقرة واحدة على أيقونة المفكرة ثم نقر مزدوج سريع لفتحها، ثم كتابة الرقم 5 وحذفه بمفتاح المسافة للخلف، ثم يطلب منه كتابة حرف واحد وحذفه وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة أسمائهم وأرقام من 1 إلى 10 في المفكرة مع مسافة بين كل رقم وآخر، ثم تصحيح خطأ متعمّد يضعه المعلم بمفتاح المسافة للخلف (Backspace).", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما المفتاح الذي يضيف مسافة بين الكلمات؟\nالإجابة: مفتاح المسافة (Spacebar).\n\nس2 (مستوى التطبيق): اكتب الأحرف (ب ت ث) مع مسافة بين كل حرف وآخر.\nالإجابة: يكتب: ب ت ث، ويضغط Spacebar بعد كل حرف.\n\nس3 (مستوى الاستدلال): اكتب اسمك وعمرك في المفكرة، وصحّح أي حرف خاطئ دون حذف السطر كله.\nالإجابة: يكتب اسمه وعمره، ويستخدم Backspace لحذف الحرف الخاطئ فقط، ثم يكتبه صحيحًا.", "notes": "إرشاد للطالب:\n- إن توفر حاسوب في البيت، تدرّب على كتابة اسمك وعمرك في المفكرة مستخدمًا كلتا يديك.\n- راجع تدريبات الدرس 1.6 في كتاب «عالمي الرقمي».\n\nإرشاد لولي الأمر:\n- شجّع طفلك على استخدام كلتا يديه في الكتابة، وعدم الاعتماد على إصبع واحد.\n- تبدأ في الأسبوع القادم الوحدة الثانية «هيا نرسم» للتعرف إلى الرسم بالحاسوب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/it/?l=6\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}, {"id": "g1-2-1", "g": "الصف الأول", "u": "الوحدة الثانية: هيا نرسم", "t": "الدرس 2.1: مقدمة إلى الرسم الرقمي", "ours": false, "periods": [{"title": "الرسم الرقمي ومزاياه، ومفهوم البكسل", "week": "الأسبوع السابع (18–22/10/2026م)", "ref": "كتاب التلميذ: الدرس 2.1 – التدريبان 1 و2  |  دليل المعلم: ص 73–77", "f": {"outcomes": "1. يتعرف الرسم الرقمي ومزاياه (سهولة التصحيح والتعديل، وحفظ الرسمة والرجوع إليها، وتنوع الألوان والأدوات) (13 دقيقة)\n2. يتعرف مفهوم البكسل (Pixel) بوصفه أصغر مربع ملوّن تتكوّن منه الصورة الرقمية (9 دقائق)\n\nمخرج تعليمي آخر:\n- يكوّن صورة بتلوين وحدات البكسل على شبكة مربعات وفق نموذج (13 دقيقة)", "levels": "المخرج 1: فهم\nالمخرج 2: فهم\nالمخرج الآخر: تطبيق", "strategies": "1. التعلم بالاكتشاف\n2. التعلم بالنمذجة\n3. التعلم المبني على اللعب", "resources": "1. جهاز الحاسب\n2. السبورة الذكية\n3. السبورة التقليدية\n4. الكتاب\n5. الأقلام\n6. صورة توضيحية\n7. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (تطبيق الرسام Paint، ومسابقة المجموعات)\n8. أخرى: رسومات ورقية للتلاميذ من حصص الفنون التشكيلية", "concepts": "1. الرسم الرقمي (Digital Drawing): رسم ننشئه باستخدام الحاسوب وتطبيقاته.\n2. البكسل (Pixel): أصغر مربع ملوّن في الصورة الرقمية.\n3. مزايا الرسم الرقمي\n4. الفأرة أداة الرسم في الحاسوب", "warmup": "- يقدّم المعلم هدف الحصة، ويعرض رسمتين: إحداهما مرسومة باليد من حصة الفنون التشكيلية، والأخرى مرسومة بالحاسوب.\n- يسأل: أيهما رُسمت بالحاسوب؟ كيف عرفت؟ هل رسمت بالحاسوب من قبل؟ ما الذي يحل محل القلم عند الرسم بالحاسوب؟\n- يقارن التلاميذ بين الرسمتين ويخمّنون الفروق بينهما. (5 دقائق)", "procedures": "1. رسم على اللوح ورسم بالحاسوب: يرسم المعلم بيتًا بسيطًا على السبورة التقليدية ويتعمد خطأ يصعب مسحه، ثم يرسم البيت نفسه في تطبيق الرسام مفكرًا بصوت عالٍ: «الفأرة هنا قلمي وفرشاتي... أخطأت؟ أتراجع بخطوة واحدة... أغيّر اللون بنقرة»، ثم يدعو تلميذًا ليرسم دائرة أمام زملائه، ويتابع التلميذ النمذجة ويذكر الفروق بين الرسمين، ويصوغ مع المعلم مزايا الرسم الرقمي، ويرسم أحد التلاميذ دائرة بتوجيه المعلم (تطبيق موجّه)؛ كتاب الطالب ص56–57: الرسم الرقمي ومزاياه (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. ما البكسل؟: يكبّر المعلم صورة رقمية على السبورة الذكية تدريجيًا حتى تظهر المربعات ويسأل: ماذا ترون؟ مِمّ تتكوّن الصورة؟ ثم يسمّي المربع «البكسل» (Pixel)، ويوضح أن الشاشات تتكوّن من بكسلات كثيرة، ويلاحظ التلميذ ظهور المربعات ويستنتج أن الصورة الرقمية مكوّنة من مربعات صغيرة ملونة، ثم يحل التدريب 1 (طابق بكسل الروبوتات بألوانها)؛ كتاب الطالب ص58: البكسل (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. لعبة «اكشف الصورة»: يعرض المعلم صورة التدريب 2 مكبّرة ويطلق تحدي «اكشف الصورة»: تلوّن كل مجموعة وحدات البكسل بالألوان الأقل استخدامًا أولًا (الأسود والرمادي) ثم الأحمر، ويسأل في النهاية: ما الشكل الذي ظهر؟ ويلوّن التلميذ وحدات البكسل في التدريب 2 مطابقًا للنموذج، ويكشف الشكل النهائي، ويقارن عمله بعمل زملائه في المجموعة؛ كتاب الطالب ص59: تدريب 2 (لوّن وحدات البكسل) (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام والتقويم الختامي: يطرح المعلم أسئلة التقويم الختامي، ويجيب التلميذ مع مجموعته، ثم يجيب عن أسئلة التقويم الختامي (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما اسم المربع الصغير الملوّن الذي تتكوّن منه الصورة الرقمية؟\nالإجابة: البكسل (Pixel).\n\nس2 (مستوى التطبيق): ماذا نستخدم بدل القلم عند الرسم بالحاسوب؟\nالإجابة: الفأرة.\n\nس3 (مستوى الاستدلال): لماذا لا نرى البكسلات في الصورة عادةً، ونراها عند تكبير الصورة كثيرًا؟\nالإجابة: لأنها صغيرة جدًا ومتقاربة، وعند التكبير تظهر المربعات واضحة.\n\n• نشاط علاجي (لمن لم يتقن): يلوّن المعلم مع التلميذ مربعات شبكة ورقية صغيرة وفق نموذج قلب بسيط ليرى أن الصورة تتكوّن من مربعات صغيرة اسمها البكسل، ثم يسأله: ما اسم المربع الملوّن الصغير؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم صورة بكسل خاصة بهم على شبكة 8×8 (كعلم عُمان أو نجمة)، ثم مقارنتها بالرسمة نفسها على شبكة أكبر وبيان أيهما أوضح ولماذا.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر ميزة واحدة للرسم الرقمي.\nالإجابة: واحدة مما يأتي: سهولة تصحيح الخطأ والتراجع عنه، أو حفظ الرسمة والرجوع إليها، أو كثرة الألوان والأدوات.\n\nس2 (مستوى التطبيق): لوّن أربعة مربعات متجاورة (اثنين فوق اثنين) باللون الأحمر على شبكة المربعات؛ ماذا تكوّن؟ وماذا تمثل كل خانة؟\nالإجابة: تكوّن مربعًا أحمر أكبر، وكل خانة تمثل بكسلًا واحدًا.\n\nس3 (مستوى الاستدلال): رسمت شجرة على الورق وأخرى بالحاسوب، ثم أردت تغيير لون الأوراق؛ في أي رسمة يكون ذلك أسهل؟ ولماذا؟\nالإجابة: في الرسمة الرقمية، لأن أداة التعبئة تغيّر اللون بنقرة، ويمكن التراجع عن التغيير إن لم يعجبني.", "notes": "إرشاد للطالب:\n- راجع الدرس 2.1 في كتاب «عالمي الرقمي».\n- ارسم على ورقة مربعات شكلًا بسيطًا بتلوين المربعات كأنها بكسلات.\n\nإرشاد لولي الأمر:\n- كبّر مع طفلك صورة على شاشة الهاتف أو الحاسوب حتى تظهر المربعات الصغيرة (البكسل).\n- تحدّث معه عن مزايا الرسم بالحاسوب مقارنة بالرسم على الورق.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/it/?l=7\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}, {"id": "g1-2-2", "g": "الصف الأول", "u": "الوحدة الثانية: هيا نرسم", "t": "الدرس 2.2: رسم الأشكال", "ours": false, "periods": [{"title": "فتح تطبيق الرسام وأدواته الرئيسة، ورسم الأشكال وتحريرها وتصحيح الأخطاء وحفظ الرسمة", "week": "الأسبوع الثامن (25–29/10/2026م)", "ref": "كتاب التلميذ: الدرس 2.2 – التدريبان 1 و2  |  دليل المعلم: ص 78–83", "f": {"outcomes": "1. يفتح تطبيق الرسام (Paint) (5 دقائق)\n2. يتعرف الأدوات الرئيسة في تطبيق الرسام (الأشكال Shapes، والألوان Colors، والتعبئة Fill، والممحاة Eraser، والتراجع Undo، والإعادة Redo) (9 دقائق)\n3. يرسم الأشكال ويحررها بتغيير ألوانها وحجمها وتعبئتها (4 دقائق)\n4. يستخدم الممحاة والتراجع والإعادة لتصحيح أخطاء الرسم (9 دقائق)\n5. يحفظ رسمة رقمية (Save) (4 دقائق)\n\nمخرج تعليمي آخر:\n- يربط الأشكال الهندسية بلوحات الإرشاد في المدرسة والطريق (4 دقائق)", "levels": "المخرج 1: تطبيق\nالمخرج 2: تذكر\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج الآخر: فهم", "strategies": "1. التعلم بالاكتشاف\n2. التعلم بالنمذجة\n3. التعلم المبني على اللعب", "resources": "1. جهاز الحاسب\n2. جهاز عرض البيانات\n3. الكتاب\n4. صورة توضيحية\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (تطبيق الرسام Paint، ومسابقة المجموعات)", "concepts": "1. أداة (Tool)\n2. الأشكال (Shapes)\n3. الألوان (Colors)\n4. أداة التعبئة (Fill)\n5. الممحاة (Eraser)\n6. تراجع (Undo) وإعادة (Redo)\n7. حفظ (Save)", "warmup": "- يقدّم المعلم هدف الحصة، ويعرض صورًا للوحات إرشاد في ممرات المدرسة ولوحات مرور.\n- يسأل: ما الأشكال التي تراها في هذه اللوحات؟ ما أكثر الأشكال استخدامًا في حياتنا؟ هل سمعت عن تطبيق الرسام؟\n- يسمّي التلاميذ الأشكال (دائرة، ومثلث، ومستطيل) ويخمّنون كيف يمكن رسمها بالحاسوب. (5 دقائق)", "procedures": "1. فتح الرسام وأدواته: ينمذج المعلم فتح تطبيق الرسام خطوة بخطوة (زر ابدأ Start، ثم كتابة Paint في مربع البحث، ثم النقر عليه) ويوضح طريقة ثانية، ثم يعرض «أدواتي في تطبيق الرسام» من كتاب التلميذ، ويسمّي كل أداة بالعربية والإنجليزية مع مثال سريع، ويفتح التلميذ تطبيق الرسام مع المعلم خطوة بخطوة، ويشير إلى كل أداة عند ذكرها ويردد اسمها؛ كتاب الطالب ص60–61: فتح تطبيق الرسام وأدواته (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. رسم الشكل وتحريره وحفظه: ينمذج المعلم مفكرًا بصوت عالٍ: اختيار المستطيل من الأشكال (Shapes) والسحب لرسمه والتحكم بحجمه، وتغيير لون الإطار، وتعبئة الشكل باللون، ثم مسح جزء بالممحاة (Eraser) والتراجع عنه (Undo) والإعادة (Redo)، ثم الحفظ (File ثم Save) مع تسمية الملف، ويوجّه التلاميذ لاتباع خطوات أيقونة الفأرة في الكتاب، وينفّذ التلميذ الخطوات مع المعلم (تطبيق موجّه)، ثم يحل التدريب 1 مستقلًا (ارسم الأشكال الآتية ثم املأها بالألوان: نجمة، ومستطيل، ودائرة، ومثلث)، ويحفظ عمله باسمه؛ كتاب الطالب ص62–63 و ص65: رسم شكل وتلوينه وحفظه (8 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تحدي الأشكال: يطلق المعلم تحديات سريعة: «مثلث حدوده خضراء وداخله أصفر!»، «دائرة حمراء صغيرة!»، ويمنح نقطة للمجموعة التي يُنجز جميع أفرادها التحدي صحيحًا أولًا، ويرسم التلميذ الشكل المطلوب بالألوان المحددة بسرعة ودقة، ثم يرسم أشكالًا من اختياره ويلوّن حدودها ويملؤها (التدريب 2) إن سمح الوقت؛ كتاب الطالب ص66: «لنتدرب معًا» تدريبا 1 و 2 (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. الختام والتقويم الختامي: يعرض بعض أعمال التلاميذ، ثم يطرح أسئلة التقويم الختامي، ويعرض التلميذ عمله ويجيب مع مجموعته، ثم يجيب عن أسئلة التقويم الختامي (2 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): أشر إلى أداة الممحاة (Eraser) في نافذة الرسام.\nالإجابة: يشير إلى أيقونة الممحاة ضمن مجموعة الأدوات (Tools).\n\nس2 (مستوى التطبيق): مسحت جزءًا من المستطيل بالخطأ؛ كيف تعيده كما كان؟\nالإجابة: بالنقر على زر التراجع (Undo).\n\nس3 (مستوى الاستدلال): ما الفرق بين لون حدود الشكل ولون تعبئته؟ ارسم دائرة حدودها حمراء وداخلها أصفر.\nالإجابة: الحدود هي الخط الخارجي للشكل، والتعبئة هي اللون داخله؛ يرسم الدائرة بحدود حمراء ثم يملؤها باللون الأصفر.\n\n• نشاط علاجي (لمن لم يتقن): يفتح المعلم الرسام مع التلميذ ويرسمان مستطيلًا معًا، ثم يمسح التلميذ جزءًا منه بالممحاة ويعيده بالتراجع (Undo)، ثم يطلب منه رسم دائرة وتلوين داخلها بالتعبئة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برسم ثلاثة أشكال مختلفة الألوان والأحجام، لكل منها حدود بلون وتعبئة بلون آخر، ثم حفظ الرسمة باسم مناسب.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما اسم التطبيق الذي نرسم به في الحاسوب؟\nالإجابة: تطبيق الرسام (Paint).\n\nس2 (مستوى التطبيق): رتّب خطوات رسم مستطيل أخضر: (اختر أداة التعبئة واللون الأخضر وانقر داخله، اختر شكل المستطيل، اسحب بالفأرة لرسمه).\nالإجابة: اختر شكل المستطيل ← اسحب بالفأرة لرسمه ← اختر أداة التعبئة واللون الأخضر وانقر داخله.\n\nس3 (مستوى الاستدلال): لماذا يجب حفظ الرسمة قبل إغلاق تطبيق الرسام؟ وماذا يحدث إن لم تحفظها؟\nالإجابة: لأن العمل لا يُحفظ تلقائيًا؛ إن لم أحفظه أفقد الرسمة ولا أستطيع فتحها لاحقًا.", "notes": "إرشاد للطالب:\n- راجع الدرس 2.2 «رسم الأشكال» في كتاب «عالمي الرقمي».\n- لاحظ مع أسرتك لوحات الإرشاد في الطريق، وسمِّ أشكالها.\n\nإرشاد لولي الأمر:\n- إن توفر حاسوب في المنزل، ساعد طفلك على فتح تطبيق الرسام ورسم شكل وحفظه باسمه.\n- ذكّره بأن العمل في الرسام لا يُحفظ تلقائيًا.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/it/?l=8\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}, {"id": "g1-2-3", "g": "الصف الأول", "u": "الوحدة الثانية: هيا نرسم", "t": "الدرس 2.3: لنتدرب على الأشكال", "ours": false, "periods": [{"title": "التدرب على رسم الأشكال وتلوين حدودها وتعبئتها، والتراجع والإعادة والمسح", "week": "الأسبوع التاسع (1–5/11/2026م)", "ref": "كتاب التلميذ: الدرس 2.3 – التدريبات 1–4  |  دليل المعلم: ص 84–89", "f": {"outcomes": "1. يطابق أدوات تطبيق الرسام بوظائفها (الأشكال، والتعبئة، والحدود، والفرش) (4 دقائق)\n2. يرسم الأشكال ويغيّر لون حدودها ولون تعبئتها (13 دقيقة)\n3. يستخدم التراجع (Undo) والإعادة (Redo) والممحاة لتعديل الشكل (9 دقائق)\n\nمخرج تعليمي آخر:\n- يحدد الأدوات التي استُخدمت في رسم شكل معطى والأدوات التي لم تُستخدم (9 دقائق)", "levels": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج الآخر: تحليل", "strategies": "1. التعلم بالاكتشاف\n2. التعلم بالنمذجة\n3. التعلم التعاوني", "resources": "1. جهاز الحاسب\n2. جهاز عرض البيانات\n3. الكتاب\n4. الأقلام\n5. صورة توضيحية\n6. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (تطبيق الرسام Paint)", "concepts": "1. أداة (Tool)\n2. تعبئة (Fill)\n3. لون الحدود ولون التعبئة\n4. تراجع (Undo) وإعادة (Redo)\n5. الممحاة (Eraser)", "warmup": "- يقدّم المعلم هدف الحصة، ويعرض سهمًا حدوده خضراء وداخله وردي.\n- يسأل: كيف لُوّنت حدود السهم؟ كيف مُلئ باللون؟ ما الأداة التي نمسح بها جزءًا من الشكل؟ كيف نتراجع عن تعديل؟\n- يخمّن التلاميذ الأدوات المستخدمة ويشيرون إليها في نافذة الرسام. (5 دقائق)", "procedures": "1. الأدوات ووظائفها: يراجع المعلم باختصار وظائف الأدوات على جهاز العرض، ثم ينمذج رسم أشكال التدريب 2 وتغيير لون حدودها وتعبئتها مفكرًا بصوت عالٍ، مشركًا التلاميذ في اختيار الألوان، ويحل التلميذ التدريب 1 (طابق كل أداة بوظيفتها الصحيحة) والتدريب 2 (طابق الأشكال بلون تعبئتها وحدودها) بتوجيه المعلم؛ كتاب الطالب ص67: «لنتدرب على الأشكال» تدريبا 1 و 2 (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. التراجع والإعادة والممحاة: يفتح المعلم ملفًا جديدًا ويرسم شكل التدريب 3، ثم يسأل قبل كل إجراء: هل يمكنني التراجع عن الرسم؟ بماذا؟ هل يمكنني إعادته؟ هل يمكنني مسح جزء منه؟ وينفّذ إجابات التلاميذ أمامهم، ويقترح التلميذ الأداة المناسبة لكل إجراء ويطبقه على حاسوبه بعد المعلم، ثم يحل التدريب 3 (طابق الأداة بنتيجتها)؛ كتاب الطالب ص64: الممحاة والتراجع والإعادة (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. ماذا استُخدم في الرسم؟: يعرض المعلم الرسمتين في التدريب 4 (سحابة، ودوائر ملونة) ويطلب من التلاميذ تحديد الأدوات المستخدمة، ثم يطبّق اقتراحاتهم في الرسام حتى يصلوا إلى الإجابة الصحيحة، ويحلل كل رسمة ويقترح أدواتها ويتحقق من صحة اقتراحه بالتجربة، ثم يحل التدريب 4 (ضع ✓ أمام ما استخدمته و✗ أمام ما لم تستخدمه)؛ كتاب الطالب ص69: تدريب 4 (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. رسم بالتناوب: يوزّع التلاميذ أزواجًا على الحواسيب: أحدهما يرسم شكلًا والآخر يختار لون الحدود والتعبئة، ثم يتبادلان الدورين ويعرضان رسمتهما المشتركة، ثم يطرح أسئلة التقويم الختامي، والتلاميذ يتعاون مع زميله في رسم شكلين وتلوينهما بالتناوب ويعرضان الناتج، ثم يجيب عن أسئلة التقويم الختامي (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما الأداة التي تستخدمها لتلوين داخل الشكل؟\nالإجابة: أداة التعبئة (Fill).\n\nس2 (مستوى التطبيق): رسمت دائرة في مكان خاطئ؛ ما أسرع طريقة لإزالتها؟\nالإجابة: التراجع (Undo).\n\nس3 (مستوى الاستدلال): تراجعت عن رسم الشكل ثم ندمت؛ كيف تعيده دون أن ترسمه من جديد؟\nالإجابة: بالنقر على زر الإعادة (Redo).\n\n• نشاط علاجي (لمن لم يتقن): يطابق المعلم مع التلميذ بطاقات صور أدوات الرسام (الأشكال، والتعبئة، والحدود، والفرش) بوظائفها، ثم يجرّبان التراجع والإعادة على شكل واحد، ثم يسأله: أي أداة تلوّن داخل الشكل؟\n• نشاط إثرائي (للمتقنين): يعرض المعلم على المتقنين رسمة جاهزة من أشكال ملونة، ويكلفهم بتحديد الأدوات التي استُخدمت فيها والأدوات التي لم تُستخدم، ثم إعادة رسمها.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أشر إلى زر الإعادة (Redo) في نافذة الرسام.\nالإجابة: يشير إلى زر الإعادة (السهم المتجه إلى الأمام) أعلى نافذة الرسام.\n\nس2 (مستوى التطبيق): ارسم مثلثًا حدوده زرقاء وتعبئته صفراء.\nالإجابة: يرسم المثلث، ويختار الأزرق لون الحدود، ثم يملؤه باللون الأصفر.\n\nس3 (مستوى الاستدلال): رسم زميلك سحابة ملونة؛ ما الأدوات التي استخدمها؟ وما الأداة التي لم يحتج إليها؟\nالإجابة: استخدم أداة الأشكال لاختيار السحابة، وأداة التعبئة واللون لتلوينها؛ ولم يحتج إلى الممحاة.", "notes": "إرشاد للطالب:\n- راجع الدرس 2.3 في كتاب «عالمي الرقمي»، وأكمل التدريبات 1–4 إن لم تكملها.\n- تذكّر: التراجع (Undo) يلغي آخر خطوة، والإعادة (Redo) ترجعها.\n\nإرشاد لولي الأمر:\n- إن توفر حاسوب، اطلب من طفلك رسم شكل وتلوين حدوده بلون وداخله بلون آخر، ثم التراجع عن الرسم وإعادته.\n- امدح محاولاته وشجعه على تصحيح أخطائه بنفسه.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/it/?l=9\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}, {"id": "g1-2-4", "g": "الصف الأول", "u": "الوحدة الثانية: هيا نرسم", "t": "الدرس 2.4: دمج الأشكال", "ours": true, "periods": [{"title": "دمج الأشكال لإنشاء رسمة (الشمس والسماء)، ورسم الخطوط وتغيير حجمها ولونها، وتلوين الخلفية", "week": "الأسبوع العاشر (8–12/11/2026م)", "ref": "كتاب التلميذ: الدرس 2.4 – التدريب 1  |  دليل المعلم: ص 90–93", "f": {"outcomes": "1. يدمج الأشكال لإنشاء رسمة جديدة (الشمس والسماء) (18 دقيقة)\n2. يرسم خطًا ويغيّر حجمه ولونه (4 دقائق)\n3. يلوّن الخلفية (Background) (4 دقائق)\n\nمخرج تعليمي آخر:\n- يحفظ رسمته باسم مناسب (9 دقائق)", "levels": "المخرج 1: إبداع\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج الآخر: تطبيق", "strategies": "1. التعلم بالاكتشاف\n2. التعلم بالنمذجة\n3. التعلم المبني على اللعب", "resources": "1. جهاز الحاسب\n2. جهاز عرض البيانات\n3. الكتاب\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (تطبيق الرسام Paint، ومسابقة المجموعات)\n5. أخرى: العرض التفاعلي ومقاطع الفيديو التوضيحية للدرس في منصة أ. عبير اليحمدية", "concepts": "1. دمج الأشكال\n2. الخلفية (Background)\n3. الحدود (Stroke)\n4. الحجم (Size)\n5. أداة الخط (Line)", "warmup": "- يقدّم المعلم هدف الحصة، ويخبر التلاميذ أنهم سيرسمون الشمس في نهايتها، ويعرض صورة التدريب النهائية (الشمس والسماء) من كتاب التلميذ.\n- يسأل: ما الأشكال المستخدمة في هذه الرسمة؟ ما الأدوات التي رُسمت بها؟ كيف لُوّنت السماء؟\n- يحلل التلاميذ الصورة ويحددون الأشكال (دائرة، وخطوط) والأدوات (الأشكال، والتعبئة). (5 دقائق)", "procedures": "1. نرسم الشمس معًا: يفتح المعلم تطبيق الرسام وينمذج مفكرًا بصوت عالٍ: رسم الدائرة (مع الضغط على Shift لتكون تامة الاستدارة)، وتعبئتها بالأصفر، ثم اختيار الحجم (Size) المناسب ورسم أشعة الشمس بأداة الخط، ثم تلوين الخلفية بالأزرق الفاتح بأداة التعبئة، مذكّرًا بأهمية اختيار اللون والحجم قبل الرسم، ويتابع التلاميذ خطوات أيقونة الفأرة في الكتاب، وينفّذ كل خطوة بعد المعلم (تطبيق موجّه)، ويختار الحجم واللون المناسبين، ويسأل عما يُشكل عليه؛ كتاب الطالب ص70–72: دمج الأشكال (رسم الشمس) (9 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. حفظ الرسمة: ينمذج المعلم حفظ الرسمة (File ثم Save ثم كتابة الاسم «الشمس» ثم Save)، ويطلب من التلاميذ تنفيذ الخطوات معه، ويحفظ التلميذ رسمته باسم مناسب في المكان الذي يحدده المعلم؛ كتاب الطالب ص73: احفظ عملك (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. أرسم منظري: يراجع المعلم الخطوات الأساسية ويعرض صورة التدريب 1 (بيت وشمس وسحاب)، ثم يتجول ويقدّم الدعم عند الحاجة دون أن يرسم عن التلميذ، ويرسم التلميذ الصورة مستقلًا بدمج الأشكال (مثلث ومربع للبيت، ودائرة وخطوط للشمس، وتلوين الخلفية)، ويحفظها (تطبيق مستقل)؛ كتاب الطالب ص73: تدريب 1 (ارسم الصورة) (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام والتقويم الختامي: يعرض المعلم أعمال عدد من التلاميذ، ثم يطرح أسئلة التقويم الختامي، ويعرض التلميذ عمله ويجيب مع مجموعته، ثم يجيب عن أسئلة التقويم الختامي (2 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما الشكل الذي نستخدمه لرسم قرص الشمس؟\nالإجابة: الدائرة (الشكل البيضاوي Oval).\n\nس2 (مستوى التطبيق): كيف تجعل أشعة الشمس أكثر سُمكًا؟\nالإجابة: أختار حجمًا أكبر للخط من أداة الحجم (Size) قبل الرسم.\n\nس3 (مستوى الاستدلال): أردت تلوين السماء بالأزرق فتلوّنت الشمس بالأزرق؛ ما السبب؟ وما الحل؟\nالإجابة: نقرتُ بأداة التعبئة داخل الشمس بدل الخلفية؛ الحل: أتراجع (Undo)، ثم أنقر في الخلفية خارج الشمس.\n\n• نشاط علاجي (لمن لم يتقن): يرسم المعلم مع التلميذ دائرة الشمس ويعبئها بالأصفر، ثم يختاران حجمًا أكبر للخط ويرسمان الأشعة، ثم يطلب منه تلوين الخلفية بالأزرق بالنقر خارج الشمس.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإضافة عناصر إلى رسمة الشمس والسماء بدمج الأشكال (غيمة من دوائر، وطائر من خطوط)، وحفظها باسم يصف محتواها.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما الأداة التي تلوّن الخلفية كلها بنقرة واحدة؟\nالإجابة: أداة التعبئة (Fill).\n\nس2 (مستوى التطبيق): ارسم خطًا أحمر سميكًا.\nالإجابة: يختار أداة الخط واللون الأحمر وحجمًا كبيرًا، ثم يسحب بالفأرة.\n\nس3 (مستوى الاستدلال): صمّم بيتًا بدمج شكلين على الأقل، واذكر الشكلين.\nالإجابة: مثل: مثلث للسقف ومربع أو مستطيل للجدار (وقد يضيف مستطيلًا صغيرًا للباب).", "notes": "إرشاد للطالب:\n- راجع الدرس 2.4 «دمج الأشكال» في كتاب «عالمي الرقمي».\n- فكّر في رسمة تتكوّن من أشكال (سيارة أو وجه) لتحاول رسمها في الحصة القادمة.\n\nإرشاد لولي الأمر:\n- شارك طفلك في البحث عن الأشكال في الأشياء من حولكم (العجلة دائرة، والباب مستطيل).\n- إن توفر حاسوب، شجّعه على رسم الشمس مرة أخرى وحفظها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/it/?l=10\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}, {"id": "g1-2-5", "g": "الصف الأول", "u": "الوحدة الثانية: هيا نرسم", "t": "الدرس 2.5: لنتدرب على دمج الأشكال", "ours": true, "periods": [{"title": "التدرب على دمج الأشكال وتعديل حجم الحدود، والتمييز بين أشكال الرسم وأدواتها", "week": "الأسبوع الحادي عشر (15–19/11/2026م)", "ref": "كتاب التلميذ: الدرس 2.5 – التدريبات 1–4  |  دليل المعلم: ص 94–99", "f": {"outcomes": "1. يدمج الأشكال لتكوين رسمة (وجه مبتسم، وسيارة) (13 دقيقة)\n2. يميّز بين أشكال الرسم وأدواتها (4 دقائق)\n\nمخرج تعليمي آخر:\n- يغيّر حجم حدود الشكل (Size) ويرتّب خطوات رسم خط (18 دقيقة)", "levels": "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "strategies": "1. التعلم بالاكتشاف\n2. التعلم المبني على حل المشكلات\n3. التعلم المبني على اللعب", "resources": "1. جهاز الحاسب\n2. جهاز عرض البيانات\n3. الكتاب\n4. الأقلام\n5. صورة توضيحية\n6. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (تطبيق الرسام Paint، ومسابقة المجموعات)\n7. أخرى: العرض التفاعلي ومقاطع الفيديو التوضيحية للدرس في منصة أ. عبير اليحمدية", "concepts": "1. دمج الأشكال\n2. الحجم (Size)\n3. اللون (Color)\n4. حدود الشكل\n5. الشكل الواحد واستخداماته المتعددة", "warmup": "- يقدّم المعلم هدف الحصة، ويعرض رسومات بسيطة: سيارة، ووجهًا، ولوحة إرشاد، تتكرر فيها الدائرة.\n- يسأل: أين ترى الدائرة في كل رسمة؟ هل يمكن استخدام الشكل نفسه بأكثر من طريقة؟ ما الخصائص التي تتحكم في الشكل؟\n- يكتشف التلاميذ أن الدائرة قد تكون عجلة أو وجهًا أو لوحة. (5 دقائق)", "procedures": "1. سُمك الحدود: يرسم المعلم في الرسام عدة دوائر بأحجام حدود مختلفة دون أن يذكر الأداة، ويسأل: ما الفرق بين الدوائر؟ كيف صنعتُ هذا الفرق؟ ويقارن التلميذ الدوائر ويستنتج أن أداة الحجم (Size) تتحكم في سُمك الحدود، ثم يحل التدريب 1 (طابق حجم الحدود بالدائرة الصحيحة)؛ كتاب الطالب ص74: «لنتدرب على دمج الأشكال» تدريب 1 (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. خطوات رسم الخط: يرسم المعلم خطًا ببطء وبخطوات واضحة دون شرح، ثم يسأل: ماذا فعلتُ أولًا؟ ثم؟ ويترك التلاميذ يكتشفون الترتيب، ويلاحظ التلميذ ويستنتج ترتيب الخطوات (اختيار أداة الخط، والحجم، واللون، والسحب، وترك الزر)، ثم يحل التدريب 3 (رقّم خطوات إنشاء خط من 1 إلى 5)؛ كتاب الطالب ص75: تدريب 3 (خطوات إنشاء خط) (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. مشكلة أحمد: يطرح المعلم المشكلة: «يريد أحمد رسم وجه مبتسم وسيارة، لكن الرسام ليس فيه شكل جاهز لوجه أو سيارة؛ كيف نساعده؟»، ويوجّه المجموعات إلى: وصف المشكلة، واقتراح أكبر عدد من الحلول بالأشكال، وتجربتها على الحاسوب، واختيار الأنسب وعرضه، وتقترح المجموعة حلولًا (دائرة للوجه ودوائر صغيرة للعينين وفرشاة للفم؛ مستطيل لجسم السيارة ودائرتان للعجلتين) وتجربها وتعرض حلها، ثم يحل كل تلميذ التدريب 2 (طابق أشكال الرسم بأدواتها) والتدريب 4 (ضع ✓ أمام ما استخدمته و✗ أمام ما لم تستخدمه)؛ كتاب الطالب ص76: تدريب 4 (8 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. الختام والتقويم الختامي: يطرح المعلم أسئلة التقويم الختامي، ويجيب التلميذ مع مجموعته، ثم يجيب عن أسئلة التقويم الختامي (2 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): يعرض المعلم دائرتين بحدود مختلفة: أي الدائرتين حدودها أسمك؟\nالإجابة: يشير إلى الدائرة ذات الخط الأعرض.\n\nس2 (مستوى التطبيق): ما الأداة التي نغيّر بها سُمك حدود الشكل؟\nالإجابة: أداة الحجم (Size).\n\nس3 (مستوى الاستدلال): رتّب خطوات رسم خط: (اسحب بالفأرة، اختر أداة الخط، اترك زر الفأرة، اختر اللون، اختر الحجم).\nالإجابة: اختر أداة الخط ← اختر الحجم ← اختر اللون ← اسحب بالفأرة ← اترك زر الفأرة.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم دائرتين بحدود رفيعة وسميكة، ويرسم مع التلميذ وجهًا مبتسمًا من دائرة كبيرة ودائرتين صغيرتين وخط منحنٍ، ويغيّران سُمك الحدود بأداة الحجم (Size)، ثم يطلب منه تسمية الأداة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بتصميم سيارة من الأشكال (مستطيلات ودوائر) بسُمك حدود مختلف لكل جزء، ثم كتابة خطوات رسم خط فيها بالترتيب الصحيح.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): سمِّ شكلين تستخدمهما لرسم وجه.\nالإجابة: الدائرة للوجه، ودوائر صغيرة أو أشكال بيضاوية للعينين.\n\nس2 (مستوى التطبيق): ما الأشكال التي ترسم بها سيارة؟\nالإجابة: مستطيل لجسم السيارة، وشكل آخر للنافذة أو السقف، ودائرتان للعجلتين.\n\nس3 (مستوى الاستدلال): ارسم إشارة مرور مستخدمًا شكلين على الأقل، واذكر لماذا اخترتهما.\nالإجابة: مثل: مستطيل للصندوق ودوائر حمراء وصفراء وخضراء للأضواء؛ لأن الإشارة صندوق فيه أضواء دائرية.", "notes": "إرشاد للطالب:\n- راجع الدرس 2.5 في كتاب «عالمي الرقمي».\n- ابحث في بيتك عن شيء يتكوّن من أكثر من شكل، وأخبر زملاءك عنه في الحصة القادمة.\n\nإرشاد لولي الأمر:\n- العب مع طفلك لعبة «ما الأشكال في هذا الشيء؟» على الأشياء من حولكم.\n- إن توفر حاسوب، شجّعه على رسم وجه مبتسم بالأشكال.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/it/?l=11\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}, {"id": "g1-2-6", "g": "الصف الأول", "u": "الوحدة الثانية: هيا نرسم", "t": "الدرس 2.6: الرسم الحر", "ours": true, "periods": [{"title": "الرسم بالفرش، وفتح رسمة رقمية محفوظة والتعديل عليها", "week": "الأسبوع الثاني عشر (22–26/11/2026م) – اليوم الوطني", "ref": "كتاب التلميذ: الدرس 2.6 – التدريب 1  |  دليل المعلم: ص 100–103", "f": {"outcomes": "1. ينشئ رسمة باستخدام الفرشاة (Brush) (4 دقائق)\n2. يفتح ملف رسم رقمي سابق ويعدّل عليه (9 دقائق)\n\nمخرج تعليمي آخر:\n- يعبّر بالرسم الرقمي عن المناسبة الوطنية مستخدمًا ألوان علم سلطنة عُمان (22 دقيقة)", "levels": "المخرج 1: إبداع\nالمخرج 2: تطبيق\nالمخرج الآخر: إبداع", "strategies": "1. التعلم التشاركي\n2. التعلم بالنمذجة\n3. التعلم الذاتي", "resources": "1. جهاز الحاسب\n2. جهاز عرض البيانات\n3. الكتاب\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (تطبيق الرسام Paint)\n5. أخرى: بطاقة تحقق ذاتي للرسمة\n6. أخرى: العرض التفاعلي ومقاطع الفيديو التوضيحية للدرس في منصة أ. عبير اليحمدية", "concepts": "1. الرسم الرقمي (Digital Drawing)\n2. الفرشاة (Brush) وأنواع الفرش (Brushes)\n3. فتح (Open)\n4. حفظ (Save)", "warmup": "- يقدّم المعلم هدف الحصة: الرسم بالفرش، وفتح رسمة محفوظة والتعديل عليها.\n- يطلب من كل تلميذين تبادل الحديث: ما أدوات الرسم التي تستخدمها في حياتك (أقلام تلوين، أقلام تحديد)؟ هل يمكنك الرجوع إلى عمل حفظته سابقًا؟ ثم يشاركان الصف بإجابتهما.\n- يراجع مع التلاميذ خطوات حفظ العمل ومكانه بعد الحفظ بأمثلة من رسوماتهم السابقة. (5 دقائق)", "procedures": "1. الفرش ورسم الفراشة: يعرض المعلم قائمة الفرش (Brushes) ويوضح استخدامات بعضها (الفرشاة، وفرشاة الرش Airbrush، وقلم التلوين Crayon، وفرشاة الألوان المائية)، ثم ينمذج رسم الفراشة باتباع خطوات أيقونة الفأرة في الكتاب، ويضيف تفاصيل بفرشاة الألوان، ويحفظها باسم «فراشة»، ويرسم التلميذ الفراشة مع المعلم خطوة بخطوة، ويجرّب نوعين من الفرش، ويحفظ رسمته باسم «فراشة» ثم يغلق الرسام؛ كتاب الطالب ص77–79: الرسم الحر بالفرش (الفراشة) (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. فتح رسمة محفوظة: ينمذج المعلم فتح الرسام من جديد، ثم قائمة ملف (File) ثم فتح (Open)، والبحث عن موقع رسمة الفراشة والنقر على فتح، ويضيف تفصيلًا ثم يحفظ، ويطلب من التلاميذ التنفيذ معه، ويفتح التلميذ رسمة الفراشة التي حفظها، ويضيف إليها تفصيلًا جديدًا، ثم يحفظ التعديل؛ كتاب الطالب ص80: فتح رسمة محفوظة (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. رسمة من مخيلتي: يطلب المعلم تنفيذ التدريب 1 (أضف رسمة من مخيلتك) بموضوع مشترك: «عُمان في عيدها الوطني» بألوان العلم أو منظر من الطبيعة العمانية، ويوزّع بطاقة تحقق ذاتي (استخدمت فرشاتين، ولوّنت، وحفظت)، ويتابع ويدعم، ويخطط التلميذ رسمته، ويختار الفرش والألوان بنفسه، وينفّذها ويحفظها، ثم يراجعها ببطاقة التحقق الذاتي؛ كتاب الطالب ص81: تدريب 1 (أضف رسمة من مخيلتك) (6 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. معرض «نجمتان وأمنية»: ينظم المعلم تبادل عرض الأعمال بين الأزواج، ويطلب من كل تلميذ قول نجمتين (ما أعجبه) وأمنية (ما يمكن تحسينه) لعمل زميله، ثم يطرح أسئلة التقويم الختامي، ويعرض التلميذ رسمته على زميله ويقدّم له نجمتين وأمنية، ثم يجيب عن أسئلة التقويم الختامي (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): أشر إلى زر الفرش (Brushes) في نافذة الرسام.\nالإجابة: يشير إلى زر الفرش (Brushes) في شريط الأدوات.\n\nس2 (مستوى التطبيق): كيف ترسم بالفرشاة دون أن ينقطع الخط؟\nالإجابة: أستمر في الضغط على زر الفأرة الأيسر وأسحب.\n\nس3 (مستوى الاستدلال): أي فرشاة تختار لرسم عشب يبدو كالرذاذ؟ ولماذا؟\nالإجابة: فرشاة الرش (Airbrush)، لأنها ترسم نقاطًا متناثرة تشبه العشب.\n\n• نشاط علاجي (لمن لم يتقن): يمسك المعلم يد التلميذ على الفأرة ليرسما بالفرشاة خطًا متصلًا دون رفع الإصبع عن الزر الأيسر، ثم يجربان فرشاة الرش، ثم يطلب منه رسم خط متصل وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين برسم لوحة عن المناسبة الوطنية بألوان علم سلطنة عُمان مستخدمين فرشاتين مختلفتين على الأقل، ثم فتح رسمة سابقة لهم وإضافة تعديل عليها.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما الأمر الذي نفتح به رسمة محفوظة؟\nالإجابة: فتح (Open) من قائمة ملف (File).\n\nس2 (مستوى التطبيق): رتّب خطوات فتح رسمة الفراشة: (انقر زر فتح، انقر ملف File، اختر رسمة الفراشة، انقر فتح Open).\nالإجابة: انقر ملف (File) ← انقر فتح (Open) ← اختر رسمة الفراشة ← انقر زر فتح.\n\nس3 (مستوى الاستدلال): افتح رسمة الفراشة، وأضف إليها زهرة بفرشاة مختلفة، ثم احفظها.\nالإجابة: يفتح الملف، ويختار فرشاة أخرى ويرسم الزهرة، ثم ينقر حفظ (Save).", "notes": "إرشاد للطالب:\n- شارك أسرتك رسمتك عن العيد الوطني، وراجع الدرس 2.6 في كتاب «عالمي الرقمي».\n- قبل حصة الأسبوع القادم: تأمّل مع أسرتك صفحة بداية الدرس 3.1 «الإنترنت» في كتاب «عالمي الرقمي»، وعُدّ الأجهزة المتصلة بالإنترنت في بيتك، وارسمها في ورقة لتعرضها على زملائك.\n\nإرشاد لولي الأمر:\n- ساعد طفلك على التعرف إلى الأجهزة المتصلة بالإنترنت في المنزل، وأخبره كيف تتواصل الأسرة مع الأقارب عبر مكالمات الفيديو.\n- تبدأ في الأسبوع القادم الوحدة الثالثة «لنتصفح» عن الإنترنت واستخدامه بأمان.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/it/?l=12\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}, {"id": "g1-3-1", "g": "الصف الأول", "u": "الوحدة الثالثة: لنتصفح", "t": "الدرس 3.1: الإنترنت", "ours": true, "periods": [{"title": "مفهوم الإنترنت وطرق الاتصال به واستخداماته وقواعد الأمان في أثناء التصفح", "week": "الأسبوع الثالث عشر (29/11–3/12/2026م) – يوم الأنشطة التربوية", "ref": "كتاب التلميذ: الدرس 3.1 – التدريبات 1–3  |  دليل المعلم: ص 107–113", "f": {"outcomes": "1. يتعرف الإنترنت وطرق الاتصال به (الاتصال السلكي واللاسلكي، والأقمار الصناعية والهوائيات) (9 دقائق)\n2. يتعرف استخدامات الإنترنت في الحياة اليومية (مكالمات الفيديو، ومشاهدة المقاطع، والبحث عن المعلومات، ومعرفة الطريق GPS) (9 دقائق)\n3. يتّبع قواعد الأمان والسلامة في أثناء تصفح الإنترنت (4 دقائق)\n\nمخرج تعليمي آخر:\n- يحكم على السلوكيات عبر الإنترنت ويحمي معلوماته الشخصية (الاسم الكامل، والعنوان، ورقم الهاتف، وكلمة المرور) (13 دقيقة)", "levels": "المخرج 1: فهم\nالمخرج 2: تذكر\nالمخرج 3: تطبيق\nالمخرج الآخر: تقييم", "strategies": "1. الفصل المقلوب\n2. التعلم المبني على اللعب\n3. التعلم التعاوني", "resources": "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية\n4. الأقلام\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (مسابقة المجموعات)\n6. أخرى: رسومات التلاميذ المنزلية للأجهزة المتصلة بالإنترنت، وبطاقات سلوكيات الأمان\n7. أخرى: العرض التفاعلي ومقاطع الفيديو التوضيحية للدرس في منصة أ. عبير اليحمدية", "concepts": "1. الإنترنت (Internet): شبكة تربط الحواسيب والأجهزة في العالم ببعضها.\n2. الأقمار الصناعية (Satellites)\n3. الهوائيات (Antennas)\n4. الاتصال السلكي (Wired Connection) والاتصال اللاسلكي (Wireless Connection)\n5. قواعد الأمان (Safety Rules)\n6. المعلومات الشخصية", "warmup": "- يقدّم المعلم هدف الحصة، ويطلب من التلاميذ عرض رسوماتهم المنزلية للأجهزة المتصلة بالإنترنت التي أعدّوها مع أسرهم بعد تأمل صفحة بداية الدرس.\n- يسأل: ما الأجهزة التي تتصل بالإنترنت في بيتك؟ هل يمكنك الاتصال بالإنترنت من بيتك فقط؟ هل رأيت قريبًا لك على شاشة الهاتف في مكالمة فيديو؟\n- يعرض التلاميذ رسوماتهم ويذكرون الأجهزة واستخداماتها. (5 دقائق)", "procedures": "1. كيف تتصل الأجهزة؟: يبني المعلم على ما تأمله التلاميذ في البيت، ويناقش الرسم التوضيحي في الكتاب: الأقمار الصناعية في السماء تربط الهوائيات حول العالم (كالطيور التي تطير بين الأماكن، أو كخيوط شبكة العنكبوت)، ويوضح الاتصال السلكي واللاسلكي (Wi-Fi)، ويسأل عن الطريقة التي يتصلون بها في البيت، ويربط التلميذ ما لاحظه في البيت بالرسم التوضيحي، ويذكر طريقة اتصال أسرته بالإنترنت، ثم يحل التدريب 1 (ألصق صور الأجهزة على الخريطة لتوصيلها بالإنترنت)؛ كتاب الطالب ص86–88: الإنترنت وطرق الاتصال واستخداماته (6 دقائق)\nالاستراتيجيات: الفصل المقلوب.\n\n2. متاهة استخدامات الإنترنت: يطلق المعلم سباق المتاهة في التدريب 2 (ساعد أحمد في الوصول إلى الاستخدامات المختلفة للإنترنت)، ثم يناقش الاستخدامات: البحث عن المعلومات، ومشاهدة المقاطع، ومكالمات الفيديو، ومعرفة الطريق (GPS)، ويحل التلميذ المتاهة بسرعة، ويشرح الاستخدامات الثلاثة التي وصل إليها أحمد، ويذكر استخدامًا رآه عند أسرته؛ كتاب الطالب ص92: تدريب 2 (أعثر على المسار) (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. حماة الإنترنت: يوزّع المعلم على كل مجموعة بطاقة سلوك (إرسال صورتك لشخص مجهول، وإخبار والديك عند رؤية شيء غير مريح، ومشاركة كلمة المرور، وفتح رسائل من أشخاص لا تعرفهم، وتجاهل إعلانات الألعاب)، ويقرأ البطاقات مع المجموعات، ويحدد الأدوار (مناقش، ورسّام للإشارة، ومتحدث، ومراقب للوقت)، وتحكم المجموعة على السلوك وترسم ✓ أو ✗ وتعلل، ويعرض المتحدث حكم مجموعته، ثم يحل كل تلميذ التدريب 3 (ضع ✓ أسفل السلوك الصحيح و✗ أسفل السلوك الخطأ عند استخدام الإنترنت)؛ كتاب الطالب ص89–90 و ص93: الأمان على الإنترنت و تدريب 3 (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام والتقويم الختامي: يطرح المعلم أسئلة التقويم الختامي، ويجيب التلميذ مع مجموعته، ثم يجيب عن أسئلة التقويم الختامي (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اذكر جهازًا يتصل بالإنترنت في بيتك.\nالإجابة: مثل: الهاتف الذكي أو الجهاز اللوحي أو التلفاز الذكي.\n\nس2 (مستوى التطبيق): كيف يتصل حاسوب في عُمان بحاسوب في بلد بعيد؟\nالإجابة: عبر الإنترنت: تنتقل المعلومات بين الأجهزة عن طريق الأسلاك والهوائيات والأقمار الصناعية.\n\nس3 (مستوى الاستدلال): ما الفرق بين الاتصال السلكي والاتصال اللاسلكي بالإنترنت؟\nالإجابة: السلكي يتم بسلك موصول بالجهاز، واللاسلكي يتم دون سلك مثل شبكة Wi-Fi.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صورًا لأجهزة تتصل بالإنترنت (الهاتف، والجهاز اللوحي، والتلفاز الذكي) وصورًا لسلك وهوائي وقمر صناعي، ويربطها مع التلميذ بخيوط ملونة، ثم يسأله: اذكر جهازًا يتصل بالإنترنت.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد ملصق صغير لاستخدامات الإنترنت في الحياة اليومية (مكالمة فيديو، وبحث، ومعرفة الطريق) مع قاعدة أمان لكل استخدام.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر استخدامًا واحدًا للإنترنت.\nالإجابة: واحد مما يأتي: مشاهدة مقاطع الفيديو، أو مكالمة فيديو مع الأقارب، أو البحث عن معلومات، أو معرفة الطريق.\n\nس2 (مستوى التطبيق): طلب منك شخص لا تعرفه على الإنترنت صورتك؛ ماذا تفعل؟\nالإجابة: لا أرسل صورتي، وأخبر والديّ أو معلمي فورًا.\n\nس3 (مستوى الاستدلال): لماذا لا نشارك كلمة المرور حتى مع أصدقائنا؟\nالإجابة: لأنها تحمي حساباتنا ومعلوماتنا الشخصية؛ ومن يعرفها يستطيع الدخول إليها واستخدامها دون إذننا.", "notes": "إرشاد للطالب:\n- راجع الدرس 3.1 في كتاب «عالمي الرقمي».\n- أخبر أسرتك بقاعدتين للأمان على الإنترنت تعلمتهما اليوم.\n\nإرشاد لولي الأمر:\n- ضع مع طفلك قواعد استخدام الإنترنت في البيت، وذكّره بألا يشارك اسمه الكامل أو عنوانه أو رقم الهاتف أو كلمة المرور.\n- شجّعه على إخبارك فورًا إذا رأى ما يزعجه في أثناء التصفح.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/it/?l=13\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}, {"id": "g1-3-2", "g": "الصف الأول", "u": "الوحدة الثالثة: لنتصفح", "t": "الدرس 3.2: استمتع", "ours": true, "periods": [{"title": "متصفحات الإنترنت وزيارة موقع ويب بكتابة عنوانه، وتمييز محتوى صفحة الويب", "week": "الأسبوع الرابع عشر (6–10/12/2026م)", "ref": "كتاب التلميذ: الدرس 3.2 – التدريبات 1–4  |  دليل المعلم: ص 114–119", "f": {"outcomes": "1. يتعرف متصفحات الإنترنت (Google Chrome, Microsoft Edge) ويميزها عن الأيقونات الأخرى (4 دقائق)\n2. يستخدم متصفح الإنترنت لزيارة موقع ويب بكتابة عنوانه في شريط العنوان (18 دقيقة)\n\nمخرج تعليمي آخر:\n- يميّز في صفحة الويب بين النص والصورة ومقطع الفيديو (13 دقيقة)", "levels": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج الآخر: فهم", "strategies": "1. التعلم بالاكتشاف\n2. التعلم بالنمذجة\n3. التعلم التعاوني", "resources": "1. جهاز الحاسب\n2. جهاز عرض البيانات\n3. الكتاب\n4. السبورة التقليدية\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (متصفح Google Chrome، وموقع Sketchpad)\n6. أخرى: العرض التفاعلي ومقاطع الفيديو التوضيحية للدرس في منصة أ. عبير اليحمدية", "concepts": "1. متصفح الإنترنت (Web Browser)\n2. موقع ويب (Website)\n3. عنوان الموقع وشريط العنوان\n4. علامة تبويب (Tab)\n5. صفحة الويب: نصوص وصور ومقاطع فيديو", "warmup": "- يقدّم المعلم هدف الحصة، ويعرض ست أيقونات: متصفح Google Chrome، ومتصفح Microsoft Edge، ومجلد، وسلة المحذوفات، والرسام، والساعة.\n- يسأل: أي هذه الأيقونات يأخذنا إلى الإنترنت؟ هل استخدمت متصفح الإنترنت من قبل؟ ما موقع الويب الذي تعرفه؟\n- يخمّن التلاميذ المتصفحات ويعللون، ويحلون التدريب 2 (اختر الأداة التي تمكّنك من تصفح الإنترنت). (5 دقائق)", "procedures": "1. زيارة موقع ويب: ينمذج المعلم على جهاز العرض مفكرًا بصوت عالٍ: النقر على أيقونة Google Chrome في شريط المهام، ثم النقر في شريط العنوان، ثم كتابة العنوان https://home.moe.gov.om، ثم الضغط على Enter، ثم ينفّذ التلاميذ معه خطوة بخطوة باتباع أيقونات الفأرة في الكتاب، ويفتح التلميذ المتصفح ويكتب العنوان ويزور الموقع مع المعلم (تطبيق موجّه)، ثم يحل التدريب 3 (رقّم الخطوات التي تتبعها لزيارة أحد مواقع الويب من 1 إلى 4)؛ كتاب الطالب ص94: فتح المتصفح وزيارة موقع ويب (6 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. لنرسم على الإنترنت: يقسّم التلاميذ مجموعات صغيرة يقود كلًّا منها تلميذ متمكن من استخدام المتصفح، ويوزّع الأدوار (كاتب العنوان، وقارئ الخطوات، ومراقب الأمان)، ويوجّههم لزيارة sketch.io/sketchpad، وتزور المجموعة موقع Sketchpad وترسم رسمة مشتركة من اختيارها (التدريب 1: لنرسم)، ويتناوب أفرادها على الرسم؛ كتاب الطالب ص95: الرسم على موقع sketch.io (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. جولة في المتحف الوطني: يرسم المعلم على السبورة مستطيلين: أحدهما صورة والآخر فيديو عليه زر التشغيل ▶، ثم يوجّه التلاميذ لزيارة www.nm.gov.om (التدريب 4)، ويسأل: أين وجدت نصًا؟ أين وجدت صورة؟ هل وجدت فيديو؟ كيف عرفته؟ ويتصفح التلميذ موقع المتحف الوطني ويبحث عن نص وصورة ومقطع فيديو، ويستنتج أن زر التشغيل يميّز الفيديو عن الصورة؛ كتاب الطالب ص97: تدريب 4 (موقع المتحف الوطني) (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. الختام والتقويم الختامي: يطلب المعلم من متحدث كل مجموعة عرض أجمل ما وجدته المجموعة في الموقع، ثم يطرح أسئلة التقويم الختامي، ويعرض التلميذ المتحدث ما وجدته مجموعته، ويجيب التلاميذ عن أسئلة التقويم الختامي (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): أشر إلى أيقونة متصفح الإنترنت Google Chrome.\nالإجابة: يشير إلى أيقونة Google Chrome الدائرية الملونة.\n\nس2 (مستوى التطبيق): أين تكتب عنوان الموقع في المتصفح؟\nالإجابة: في شريط العنوان أعلى نافذة المتصفح.\n\nس3 (مستوى الاستدلال): كتبت عنوان الموقع لكن الصفحة لم تظهر؛ ما الخطأ المحتمل؟\nالإجابة: نسيت الضغط على مفتاح الإدخال (Enter) بعد كتابة العنوان، أو كتبت العنوان خطأً.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم بطاقات أيقونات متنوعة بينها Google Chrome وMicrosoft Edge، ويستخرج التلميذ المتصفحين، ثم يكتب معه عنوان موقع في شريط العنوان ويضغط Enter، ثم يطلب منه تكرار ذلك وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بزيارة موقع تعليمي يحدده، وتصنيف ما في صفحته إلى نص وصورة ومقطع فيديو، وشرح سبب عدم ظهور الصفحة إذا نسينا ضغط Enter.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): سمِّ متصفحين للإنترنت.\nالإجابة: متصفح Google Chrome، ومتصفح Microsoft Edge.\n\nس2 (مستوى التطبيق): رتّب خطوات زيارة موقع: (اكتب العنوان، اضغط Enter، افتح المتصفح، انقر شريط العنوان).\nالإجابة: افتح المتصفح ← انقر شريط العنوان ← اكتب العنوان ← اضغط Enter.\n\nس3 (مستوى الاستدلال): في صفحة المتحف الوطني، كيف تعرف أن هذا مقطع فيديو وليس صورة؟\nالإجابة: يظهر على مقطع الفيديو زر التشغيل (▶) ويتحرك عند تشغيله، أما الصورة فثابتة.", "notes": "إرشاد للطالب:\n- راجع الدرس 3.2 «استمتع» في كتاب «عالمي الرقمي».\n- زر مع أسرتك موقع المتحف الوطني www.nm.gov.om، وأخبرهم عن صورة أعجبتك.\n\nإرشاد لولي الأمر:\n- رافق طفلك دائمًا عند تصفح الإنترنت، وساعده على كتابة العنوان في شريط العنوان والضغط على Enter.\n- ناقش معه ما شاهده في موقع المتحف الوطني.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/it/?l=14\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}, {"id": "g1-3-3", "g": "الصف الأول", "u": "الوحدة الثالثة: لنتصفح", "t": "الدرس 3.3: تواصل", "ours": true, "periods": [{"title": "البريد الإلكتروني ومزاياه، والملفات التي يمكن إرسالها عبره", "week": "الأسبوع الخامس عشر (13–17/12/2026م)", "ref": "كتاب التلميذ: الدرس 3.3 – التدريبات 1–3  |  دليل المعلم: ص 120–125", "f": {"outcomes": "1. يتعرف كيفية التواصل مع الآخرين عبر البريد الإلكتروني ومزاياه (سريع، ودون تكلفة، ويصل إلى أي مكان في العالم) (18 دقيقة)\n2. يميّز بين الملفات التي يمكن إرسالها عبر البريد الإلكتروني (نص، وصورة، وصوت، وفيديو) والأشياء المادية التي لا يمكن إرسالها (4 دقائق)\n\nمخرج تعليمي آخر:\n- يكمل أجزاء رسالة بريد إلكتروني (من، وإلى، والموضوع، ونص الرسالة، والصور المرفقة) (13 دقيقة)", "levels": "المخرج 1: فهم\nالمخرج 2: تحليل\nالمخرج الآخر: تطبيق", "strategies": "1. التعلم بالاكتشاف\n2. التعلم المبني على حل المشكلات\n3. التعلم بالنمذجة", "resources": "1. الكتاب\n2. السبورة الذكية\n3. صورة توضيحية\n4. الأقلام\n5. أخرى: ظرف يحوي صورة مطبوعة ولعبة صغيرة، ونموذج مكبّر لرسالة بريد إلكتروني\n6. أخرى: العرض التفاعلي ومقاطع الفيديو التوضيحية للدرس في منصة أ. عبير اليحمدية", "concepts": "1. البريد الإلكتروني (Email): رسالة نرسلها عبر الإنترنت إلى أي مكان في العالم.\n2. مزايا البريد الإلكتروني: سريع، ودون تكلفة، ويصل إلى أي مكان\n3. الملفات التي يمكن إرسالها: نص، وصورة، وصوت، وفيديو\n4. أجزاء الرسالة: من، وإلى، والموضوع، ونص الرسالة، والصور المرفقة", "warmup": "- يقدّم المعلم هدف الحصة، ويُخرج من ظرف صورة مطبوعة ولعبة صغيرة.\n- يسأل: لو أردت إرسال هذه الصورة وهذه اللعبة إلى صديق في بلد بعيد اليوم، ماذا تفعل؟ مع من تحب أن تتواصل؟ هل أرسلت صورة بهاتف والديك من قبل؟\n- يقترح التلاميذ طرقًا للإرسال ويشاركون تجاربهم في إرسال الرسائل والصور. (5 دقائق)", "procedures": "1. ماذا يمكن أن نرسل؟: يعرض المعلم الرسوم التوضيحية في الكتاب وموقع الويب من الدرس السابق، ويسأل: هل يمكن أن نرسل هذه الصورة؟ وهذا الفيديو؟ وهذه اللعبة الحقيقية؟ ويقود التلاميذ إلى استنتاج أن البريد الإلكتروني يرسل ملفات رقمية لا أشياء مادية، ثم يوضح مزاياه (سريع، ودون تكلفة، ويصل إلى أي مكان في العالم)، ويصنّف التلميذ الأشياء إلى ما يُرسل وما لا يُرسل ويعلل، ثم يحل التدريب 1 (ضع ✓ أسفل الملفات الرقمية التي يمكنك إرسالها عبر البريد الإلكتروني)؛ كتاب الطالب ص98–99 و ص100: البريد الإلكتروني وملفاته و تدريب 1 (6 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. هل يمكنهم التواصل؟: يعرض المعلم صور التدريب 2، ويطرح المشكلة في الصورة الثالثة: «لماذا لا تستطيع سارة وأحمد التواصل؟»، ويوجّه المجموعات إلى تحديد السبب، واقتراح أكثر من حل، ثم مناقشة الحلول، ويحدد التلميذ مع مجموعته السبب (الجهاز غير متصل بالإنترنت)، ويقترح حلولًا (التأكد من الاتصال بشبكة Wi-Fi، أو طلب مساعدة شخص بالغ، أو استخدام جهاز آخر متصل)، ثم يحل التدريب 2؛ كتاب الطالب ص101: تدريب 2 (هل يمكنهم التواصل؟) (6 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. نكتب رسالة بريد: يعرض المعلم نموذج رسالة بريد إلكتروني مكبّرًا، ويملأ أجزاءه مفكرًا بصوت عالٍ: «في خانة من أكتب اسمي... في خانة إلى اسم صديقي... الموضوع: حيواناتي المفضلة»، ثم يطلب من التلاميذ تحديد الجزء التالي (تطبيق موجّه)، ويحدد التلميذ الجزء المناسب لكل معلومة، ثم يكمل مستقلًا التدريب 3 (أرسل بريدًا إلكترونيًا إلى صديقك به ثلاث صور لحيواناتك المفضلة) بلصق الأجزاء الناقصة؛ كتاب الطالب ص102: تدريب 3 (أرسل بريدًا إلكترونيًا) (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n4. الختام والتقويم الختامي: يعرض المعلم بسرعة أشياء وملفات متنوعة ويسأل: هل تُرسل بالبريد الإلكتروني؟ ثم يطرح أسئلة التقويم الختامي، ويحكم التلميذ على كل مثال ويعلل، ثم يجيب عن أسئلة التقويم الختامي (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): هل يمكن إرسال قميص عبر البريد الإلكتروني؟\nالإجابة: لا، لأنه شيء مادي وليس ملفًا رقميًا.\n\nس2 (مستوى التطبيق): اذكر ميزتين للبريد الإلكتروني.\nالإجابة: سريع الوصول، ويصل إلى أي مكان في العالم دون تكلفة.\n\nس3 (مستوى الاستدلال): لم تستطع سارة التواصل مع أحمد لأن جهازها غير متصل بالإنترنت؛ اقترح حلين.\nالإجابة: التأكد من الاتصال بشبكة Wi-Fi، أو طلب المساعدة من شخص بالغ لإعادة الاتصال، أو استخدام جهاز آخر متصل بالإنترنت.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم مجموعة أشياء وصور (قميص، وصورة رقمية، وأنشودة مسجلة، وكرة) ويفرزها مع التلميذ إلى ما يمكن إرساله بالبريد الإلكتروني وما لا يمكن، ثم يسأله: هل نرسل الكرة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة رسالة بريد إلكتروني ورقية مكتملة الأجزاء (من، وإلى، والموضوع، والمحتوى) إلى صديق، وذكر ميزتين للبريد الإلكتروني.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما الذي نستخدمه لإرسال رسالة وصورة إلى صديق بعيد عبر الإنترنت؟\nالإجابة: البريد الإلكتروني (Email).\n\nس2 (مستوى التطبيق): أكمل: في رسالة البريد الإلكتروني نكتب اسم الصديق في خانة ......، وعنوان الرسالة في خانة ......\nالإجابة: إلى، والموضوع.\n\nس3 (مستوى الاستدلال): أردت إرسال صور حيواناتك المفضلة إلى صديقك؛ رتّب أجزاء الرسالة التي ستكتبها.\nالإجابة: من (اسمي) ← إلى (اسم صديقي) ← الموضوع (حيواناتي المفضلة) ← الصور ← نص الرسالة.", "notes": "إرشاد للطالب:\n- راجع الدرس 3.3 «تواصل» في كتاب «عالمي الرقمي».\n- أخبر أسرتك بثلاثة أنواع من الملفات يمكن إرسالها بالبريد الإلكتروني.\n\nإرشاد لولي الأمر:\n- إن أمكن، أرِ طفلك رسالة بريد إلكتروني من بريد الأسرة، ووضّح له أجزاءها (من، وإلى، والموضوع).\n- ذكّره بعدم فتح رسائل من أشخاص لا يعرفهم.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/it/?l=15\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}, {"id": "g1-3-4", "g": "الصف الأول", "u": "الوحدة الثالثة: لنتصفح", "t": "الدرس 3.4: ابحث", "ours": true, "periods": [{"title": "البحث عن موقع ويب ومعلومات باستخدام محرك البحث Google، والتنقل في صفحة الويب", "week": "الأسبوع السادس عشر (20–24/12/2026م)", "ref": "كتاب التلميذ: الدرس 3.4 – التدريب 1  |  دليل المعلم: ص 126–129", "f": {"outcomes": "1. يبحث عن مواقع ويب ومعلومات باستخدام محرك البحث Google (13 دقيقة)\n2. يتنقل في صفحة الويب باستخدام شريط التمرير والارتباطات التشعبية (Hyperlink) (4 دقائق)\n\nمخرج تعليمي آخر:\n- يختار كلمات بحث محددة تناسب ما يريد الوصول إليه (مثل: الحيوانات البرية في سلطنة عمان) (18 دقيقة)", "levels": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج الآخر: تحليل", "strategies": "1. التعلم المبني على اللعب\n2. التعلم بالنمذجة\n3. التعلم التعاوني", "resources": "1. جهاز الحاسب\n2. جهاز عرض البيانات\n3. الكتاب\n4. السبورة التقليدية\n5. صورة توضيحية\n6. الأقلام\n7. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (متصفح Google Chrome، ومحرك البحث Google، ومسابقة المجموعات)\n8. أخرى: العرض التفاعلي ومقاطع الفيديو التوضيحية للدرس في منصة أ. عبير اليحمدية", "concepts": "1. محرك البحث (Google)\n2. متصفح الإنترنت (Web Browser)\n3. كلمات البحث\n4. الارتباط التشعبي (Hyperlink)\n5. شريط التمرير", "warmup": "- يقدّم المعلم هدف الحصة، ويكشف تدريجيًا صورة حيوان بري عُماني (المها العربي) ويطلب من التلاميذ تخمينه.\n- يسأل: كيف نعرف معلومات أكثر عن هذا الحيوان؟ هل يمكننا زيارة موقع على الإنترنت للحصول على معلومات عن الحيوانات البرية في سلطنة عمان؟ هل من الضروري معرفة اسم الموقع؟\n- يخمّن التلاميذ الحيوان ويقترحون طرقًا للبحث عن معلومات عنه. (5 دقائق)", "procedures": "1. نبحث مع Google: ينمذج المعلم مفكرًا بصوت عالٍ: فتح Google Chrome وزيارة www.google.com، وكتابة «البوابة التعليمية» في مربع البحث، والضغط على Enter، وقراءة النتائج، والنقر على الارتباط التشعبي (Hyperlink) المناسب، ثم التنقل بشريط التمرير مع استمرار الضغط على زر الفأرة الأيسر، ثم يكرر التلاميذ الخطوات معه، ويزور التلميذ محرك البحث ويبحث عن البوابة التعليمية مع المعلم خطوة بخطوة، وينتقل في الصفحة بشريط التمرير، ويذكر ما رآه في الموقع؛ كتاب الطالب ص103–104: البحث باستخدام Google (7 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. باحثو الحيوانات: يقسّم التلاميذ مجموعات بأدوار (كاتب كلمات البحث، ومراقب النتائج، ومسجّل الأسماء، ومتحدث)، ويوجّههم لتنفيذ التدريب 1 بكتابة «الحيوانات البرية في سلطنة عمان»، ويتابع ويساعد في قراءة النتائج، وتبحث المجموعة وتختار ثلاثة حيوانات برية عُمانية (مثل المها العربي والغزال)، ويكتب كل تلميذ أسماءها في التدريب 1 بمساعدة زملائه؛ كتاب الطالب ص105: تدريب 1 (الحيوانات البرية في سلطنة عمان) (7 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. قائمة الصف: يطلب المعلم من متحدث كل مجموعة ذكر حيوان وجدته وكيف وصلت إليه، ويجمع الأسماء في قائمة واحدة على السبورة، ويعرض التلميذ المتحدث نتيجة مجموعته، ويقارن التلاميذ القائمة بما كتبوه؛ كتاب الطالب ص105: تدريب 1 (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. الختام والتقويم الختامي: يطرح المعلم أسئلة التقويم الختامي، ويجيب التلميذ مع مجموعته، ثم يجيب عن أسئلة التقويم الختامي (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما اسم محرك البحث الذي استخدمناه؟\nالإجابة: Google.\n\nس2 (مستوى التطبيق): ماذا تكتب في مربع البحث لتعرف عن الحيوانات البرية في عُمان؟\nالإجابة: الحيوانات البرية في سلطنة عمان.\n\nس3 (مستوى الاستدلال): ظهرت نتائج كثيرة؛ كيف تنتقل إلى الموقع الذي تريده؟ وكيف ترى بقية الصفحة؟\nالإجابة: أنقر على الارتباط التشعبي (الرابط) للموقع، وأستخدم شريط التمرير أو عجلة الفأرة للنزول في الصفحة.\n\n• نشاط علاجي (لمن لم يتقن): يجلس المعلم مع التلميذ أمام Google ويكتبان معًا كلمات بحث قصيرة (الحيوانات البرية في سلطنة عمان)، ثم ينقران على رابط وينزلان بشريط التمرير، ثم يطلب منه البحث عن «المها العربي».\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بمقارنة نتائج البحث بكلمة عامة (حيوانات) وبكلمات محددة (حيوانات جبال عمان)، واستنتاج أيهما أفضل ولماذا.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اذكر اسم حيوان بري يعيش في سلطنة عمان.\nالإجابة: مثل: المها العربي، أو الغزال.\n\nس2 (مستوى التطبيق): رتّب خطوات البحث: (اكتب كلمات البحث، افتح www.google.com، اضغط Enter، افتح المتصفح).\nالإجابة: افتح المتصفح ← افتح www.google.com ← اكتب كلمات البحث ← اضغط Enter.\n\nس3 (مستوى الاستدلال): لماذا نكتب كلمات بحث محددة مثل «الحيوانات البرية في سلطنة عمان» بدل كلمة «حيوانات» فقط؟\nالإجابة: لأن الكلمات المحددة تعطي نتائج أقرب لما نريد، فنصل إلى المعلومة بسرعة.", "notes": "إرشاد للطالب:\n- راجع الدرس 3.4 «ابحث» في كتاب «عالمي الرقمي».\n- اختر حيوانًا بريًا عُمانيًا تحبه لترسمه في مشروع الأسبوع القادم.\n\nإرشاد لولي الأمر:\n- ابحث مع طفلك في Google عن الحيوان الذي اختاره، واحرص على أن يكون البحث بإشرافك.\n- ساعده على تذكّر شكل الحيوان وألوانه استعدادًا للمشروع.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/it/?l=16\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}, {"id": "g1-proj", "g": "الصف الأول", "u": "مشروع ختامي يوظّف مهارات الوحدات الثلاث", "t": "المشروع", "ours": false, "periods": [{"title": "مشروع ختامي: لوحة رقمية عن حيوان من بيئة سلطنة عُمان", "week": "الأسبوع السابع عشر (27–30/12/2026م)", "ref": "كتاب التلميذ: — (لا يتضمن دليل المعلم درسًا للمشروع؛ أُعدّ وفق أهداف الوحدات)  |  دليل المعلم: الأهداف العامة للوحدات 14–15", "f": {"outcomes": "1. يوظّف أدوات تطبيق الرسام (الأشكال، والفرش، والتعبئة، والخلفية) لإنتاج رسمة رقمية عن حيوان من بيئة سلطنة عُمان (13 دقيقة)\n2. يستعين بصور مرجعية من محرك البحث بإشراف المعلم لتحديد أشكال الحيوان وألوانه (9 دقائق)\n3. يحفظ مشروعه باسم مناسب ويعرضه على زملائه (9 دقائق)\n\nمخرج تعليمي آخر:\n- يقيّم عمله ذاتيًا ببطاقة «أستطيع أن» وفق معايير المشروع (4 دقائق)", "levels": "المخرج 1: إبداع\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج الآخر: تقييم", "strategies": "1. التعلم المبني على المشاريع\n2. التعلم التشاركي\n3. التعلم الذاتي", "resources": "1. جهاز الحاسب\n2. السبورة الذكية\n3. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot (تطبيق الرسام Paint، ومتصفح Google Chrome)\n4. أخرى: بطاقة معايير المشروع، وبطاقة «أستطيع أن» للتقويم الذاتي", "concepts": "1. المشروع الرقمي\n2. الحيوانات البرية في بيئة سلطنة عُمان\n3. دمج الأشكال والفرش في رسمة واحدة\n4. الحفظ باسم مناسب\n5. العرض والتغذية الراجعة (نجمتان وأمنية)", "warmup": "- يطرح المعلم السؤال الموجّه للمشروع: «كيف نعرّف زوار مدرستنا بحيوانات عُمان البرية بلوحة رقمية من رسمنا؟»\n- يعرض نموذجًا للوحة رقمية، ويقرأ مع التلاميذ بطاقة المعايير: حيوان واضح في وسط اللوحة، وخلفية تمثل بيئته، واستخدام الأشكال والفرش، وحفظ الملف باسم مناسب.\n- يذكر التلاميذ الحيوانات التي اختاروها في الأسبوع الماضي، ومهارات الرسام التي سيحتاجونها. (5 دقائق)", "procedures": "1. التخطيط: يبحث المعلم في Google أمام التلاميذ على السبورة الذكية عن صور مرجعية للحيوانات المختارة (المها العربي، والغزال، والوعل...)، ويسأل: ما الأشكال التي تصلح لرسم الجسم والرأس والأرجل؟ ويتأمل التلميذ الصورة المرجعية لحيوانه، ويحدد الأشكال والألوان والفرش التي سيستخدمها؛ كتاب الطالب ص104: البحث باستخدام Google (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. الإنتاج: يتجول المعلم بين التلاميذ ويدعمهم بأسئلة موجهة دون أن يرسم عنهم، ويذكّرهم بالتراجع (Undo) عند الخطأ، وبالحفظ باسم «اسم الحيوان - اسم التلميذ»، ويرسم التلميذ حيوانه بدمج الأشكال، ويضيف التفاصيل بالفرش، ويلوّن الخلفية لتمثل بيئته،
