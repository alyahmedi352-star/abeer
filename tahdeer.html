 ثم يحفظ الملف باسم مناسب؛ كتاب الطالب ص77–79: الرسم الحر بالفرش (11 دقيقة)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. معرض المشروع: ينظم المعلم عرض الأعمال بين الأزواج، ثم يختار مع التلاميذ لوحات لعرضها في ممر المدرسة، ويعرض التلميذ لوحته على زميله ويشرح ما رسمه، ويقدّم لزميله نجمتين وأمنية (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. التقويم الذاتي والختام: يوزّع المعلم بطاقة «أستطيع أن»، ويطرح أسئلة التقويم الختامي، ويقيّم التلميذ عمله ذاتيًا بوضع ✓ أمام كل معيار حققه، ويجيب عن أسئلة التقويم الختامي (2 دقائق)\nالاستراتيجيات: التعلم الذاتي.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): أي الأشكال ستستخدم لرسم جسم حيوانك ورأسه؟\nالإجابة: مثل: الشكل البيضاوي للجسم، والدائرة للرأس.\n\nس2 (مستوى التطبيق): ما الأداة التي ستلوّن بها الخلفية لتمثل الصحراء أو الجبل؟\nالإجابة: أداة التعبئة (Fill) بلون مناسب.\n\nس3 (مستوى الاستدلال): كيف تجعل لوحتك واضحة لمن يشاهدها في ممر المدرسة؟\nالإجابة: أرسم الحيوان كبيرًا في وسط اللوحة، وأختار ألوانًا مناسبة، وأضيف بيئته بالفرشاة والتعبئة.\n\n• نشاط علاجي (لمن لم يتقن): يرسم المعلم مع التلميذ جسم حيوان عماني بالشكل البيضاوي ورأسه بالدائرة، ثم يلوّنان الخلفية بالتعبئة، ثم يطلب منه إضافة عنصر واحد بالفرشاة وحفظ الرسمة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإضافة بيئة الحيوان كاملة (صحراء أو جبل) بالفرش والتعبئة، وعرض لوحتهم على زملائهم مع شرح الأدوات التي استخدموها.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما الاسم الذي حفظت به مشروعك؟\nالإجابة: يذكر الاسم الذي اختاره (مثل: المها - اسم التلميذ).\n\nس2 (مستوى التطبيق): اذكر أداتين استخدمتهما في مشروعك، ووظيفة كل منهما.\nالإجابة: مثل: الأشكال لرسم الجسم، والتعبئة لتلوين الخلفية (أو الفرشاة لإضافة التفاصيل).\n\nس3 (مستوى الاستدلال): لو أعدت المشروع، ماذا ستضيف أو تحسّن؟ ولماذا؟\nالإجابة: إجابة مفتوحة تتضمن تحسينًا مرتبطًا بالأدوات، مثل إضافة تفاصيل بالفرشاة أو تحسين الألوان لتصبح اللوحة أوضح.", "notes": "إرشاد للطالب:\n- اعرض لوحتك على أسرتك، واشرح لهم كيف رسمتها.\n- راجع دروس الفصل في كتاب «عالمي الرقمي»، واحتفظ بكتابك للفصل الدراسي الثاني.\n\nإرشاد لولي الأمر:\n- شجّع طفلك على الحديث عن مشروعه وعن المهارات التي تعلمها هذا الفصل، واحتفِ بإنجازه.\n- استمر في متابعة استخدامه الآمن للأجهزة والإنترنت في أثناء الإجازة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/1/it/?l=17\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}, {"id": "g3-1", "g": "الصف الثالث", "u": "الوحدة الأولى: حاسوبي", "t": "أجهزة التفاعل مع الحاسوب", "ours": false, "periods": [{"title": "أجهزة التفاعل مع الحاسوب + التقنيات المساعدة وأجهزة التخزين", "week": "الأسبوع الأول: 6–10/9/2026م", "ref": "دليل المعلم: ص 22–25، 27  |  كتاب التلميذ: الوحدة 1 – الدرس 1: أجهزة التفاعل مع الحاسوب (التدريبان 1 و2)", "f": {"outcomes": "1. يتعرف أجهزة التفاعل مع الحاسوب: لوحة اللمس، وشاشة اللمس، وجهاز التحكم بالألعاب، ونظارات الواقع الافتراضي وقفازاته (5 دقائق)\n2. يوضح وظيفة كل جهاز من أجهزة التفاعل وطريقة استخدامه (5 دقائق)\n3. يطابق كل جهاز تفاعل باسمه ويوظفه في مواقف حياتية (التدريبان 1 و 2) (5 دقائق)\n4. يتعرف استخدامات التقنيات المساعدة: لوحة مفاتيح برايل، وفأرة الرأس، والتعرف على الصوت (4 دقائق)\n5. يحدد الأجهزة التي يمكن تخزين الملفات عليها (4 دقائق)\n6. يختار جهاز التخزين المناسب لكل استخدام (التدريب 4) (4 دقائق)\n\nمخرج تعليمي آخر:\n- يستخدم أجهزة التفاعل بعناية ويقدّر تنوع طرق التحكم في الحاسوب (4 دقائق)\n- يتعاطف مع الأشخاص ذوي الإعاقة ويقدّر دور التقنيات المساعدة في تيسير حياتهم (4 دقائق)", "levels": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: تذكر\nالمخرج 6: تطبيق\nالمخرج الآخر: تقييم", "strategies": "1. التعلم بالاكتشاف\n2. التعلم التعاوني\n3. التعلم المبني على اللعب\n4. التعلم المبني على حل المشكلات\n5. التعلم التشاركي\n6. التعلم بالنمذجة", "resources": "1. الكتاب\n2. جهاز عرض البيانات\n3. السبورة الذكية\n4. صورة توضيحية\n5. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n6. أخرى: أجهزة حقيقية متاحة: حاسوب محمول بلوحة لمس، وجهاز لوحي، وجهاز تحكم بالألعاب\n7. جهاز الحاسب\n8. أخرى: بطاقات مواقف، وأجهزة تخزين حقيقية: ذاكرة وامضة، وقرص ضوئي، وبطاقة ذاكرة، وقرص صلب خارجي إن توفر", "concepts": "1. لوحة اللمس (Touchpad): سطح في الحاسوب المحمول نحرّك عليه الإصبع لتحريك المؤشر.\n2. شاشة اللمس (Touchscreen): شاشة نتحكم بها بلمسها مباشرة بالإصبع.\n3. جهاز التحكم بالألعاب (Game Controller): جهاز نستخدمه للتحكم في ألعاب الفيديو.\n4. نظارات الواقع الافتراضي (VR Glasses): نظارات تعرض أمام العينين بيئة افتراضية يشعر المستخدم أنه داخلها.\n5. قفازات الواقع الافتراضي (VR Gloves): قفازات تلتقط حركة اليد والأصابع بشكل كامل للتفاعل داخل البيئة الافتراضية.\n6. التقنيات المساعدة (Assistive Technology): أجهزة تساعد ذوي الإعاقة وكبار السن على التفاعل مع الحاسوب بسهولة.\n7. لوحة مفاتيح برايل (Braille Keyboard): لوحة مفاتيح بنقاط بارزة يستخدمها ذوو الإعاقة البصرية.\n8. فأرة الرأس (Head Mouse): جهاز يحرك المؤشر بحركة الرأس.\n9. التعرف على الصوت (Speech Recognition): تقنية تحول الكلام إلى أوامر أو نص مكتوب.\n10. أجهزة التخزين: القرص الصلب الخارجي (External Hard Disk)، والقرص الضوئي (Optical Disk) مثل CD وDVD، والذاكرة الوامضة (Flash Memory)، وبطاقة الذاكرة (Memory Card).", "warmup": "- يعرض المعلم جهاز تحكم بالألعاب وجهازًا لوحيًا ويسأل: هل تلعب ألعاب فيديو؟ ما الجهاز الذي تستخدمه لممارستها؟\n- هل يمكن التحكم في الحاسوب بأجهزة أخرى غير لوحة المفاتيح والفأرة؟\n- يُدوّن المعلم توقعات الطلبة على السبورة للعودة إليها بعد الاكتشاف. (5 دقائق)", "procedures": "1. اكتشاف أجهزة التفاعل: يعرض المعلم صور الأجهزة الخمسة من كتاب التلميذ بلا أسماء، ويطلب من كل ثنائي ملاحظة كل صورة واستنتاج طريقة استخدامها، ثم يؤكد الأسماء والمصطلحات الإنجليزية بعد عرض الاستنتاجات، ويلاحظ التلميذ الصور ويستنتج مع زميله وظيفة كل جهاز ويقارن استنتاجه بما يؤكده المعلم؛ كتاب الطالب ص18–19: أجهزة التفاعل مع الحاسوب (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. مهمة جماعية: التدريبان 1 و 2: يوزع الطلبة في مجموعات رباعية بأدوار (قارئ، كاتب، مقرر، مراقب وقت)، ويكلفهم بحل التدريب 1 (مطابقة الجهاز باسمه) والتدريب 2 (ملء فراغات الحوار)، ثم يطلب عرض إجابة كل مجموعة ومناقشتها، ويؤدي التلميذ دوره في المجموعة، ويشارك في حل التدريبين، ويعرض المقرر الإجابة الجماعية أمام الصف؛ كتاب الطالب ص23: «لنتدرب معًا» تدريب 1 (طابق جهاز التفاعل باسمه) (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. غلق: يعلق المعلم على كل إجابة (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n4. بطاقات المواقف والتقنيات المساعدة: يوزع المعلم على المجموعات بطاقات مواقف (إعاقة بصرية، صعوبة في تحريك اليدين، صعوبة في الكتابة)، ويطلب اقتراح حل لكل موقف، ثم يقدم لوحة مفاتيح برايل وفأرة الرأس والتعرف على الصوت ويربطها بحلول الطلبة، ويؤكد فائدتها لكبار السن أيضًا، ويحلل التلميذ الموقف مع مجموعته ويقترح حلًا، ثم يقارن حله بالجهاز الذي يعرضه المعلم؛ كتاب الطالب ص20–21: التقنيات المساعدة (2 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. مناقشة ثنائية: التدريب 3: يطلب المعلم من كل ثنائي مناقشة سؤالي التدريب 3، ثم يستمع لعدد من الثنائيات أمام الصف، ويناقش زميله: هل يعرف شخصًا يستخدم تقنية مساعدة؟ ويتخيل جهازًا مساعدًا جديدًا ويشارك فكرته؛ كتاب الطالب ص21: «ناقش زملاءك في الصف» (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.\n\n6. نمذجة: أجهزة التخزين: يعرض المعلم أجهزة التخزين ويصل الذاكرة الوامضة بمنفذ USB أمام الطلبة مفكرًا بصوت عالٍ ليظهر اسمها في مستكشف الملفات، ويوضح الفرق بين CD وDVD في كمية البيانات، ثم يوجه الطلبة لتحديد منفذ USB في أجهزتهم، ثم يلصق كل طالب ملصقات التدريب 4 بمفرده، ويتابع التلميذ النمذجة، ويحدد منفذ USB في جهازه بتوجيه المعلم، ثم يلصق جهاز التخزين المناسب لكل استخدام في التدريب 4؛ كتاب الطالب ص22: وسائط التخزين (2 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n7. بطاقة خروج ثنائية: يطلب المعلم من كل ثنائي كتابة جهاز تخزين وتقنية مساعدة مع استخدام كل منهما، ثم يتبادل الثنائيات البطاقات للتصحيح، ويكتب التلميذ البطاقة مع زميله ويصحح بطاقة ثنائي آخر؛ كتاب الطالب ص23 و ص25: «لنتدرب معًا» تدريبا 2 و 4 (2 دقيقة)\nالاستراتيجيات: التعلم التشاركي.\n\n8. غلق الدرس – جولة افتراضية في نزوى: يتخيل الأزواج أنهم يرتدون نظارات الواقع الافتراضي في جولة داخل قلعة نزوى، فيصف أحدهما ما يراه ويحدد الآخر الجهاز الأنسب لكل نشاط كلوحة اللمس أو جهاز التحكم (1 دقيقتان)\nالاستراتيجيات: لعب الأدوار.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما اسم الجهاز الذي نتحكم به في الحاسوب بلمس الشاشة بالإصبع مباشرة؟\nالإجابة: شاشة اللمس (Touchscreen).\n\nس2 (مستوى التطبيق): ما وظيفة قفازات الواقع الافتراضي؟\nالإجابة: تلتقط حركة اليد والأصابع بشكل كامل لنتفاعل بها داخل البيئة الافتراضية.\n\nس3 (مستوى الاستدلال): اشترى صديقك حاسوبًا محمولًا ولم يجد معه فأرة، كيف يحرك المؤشر؟\nالإجابة: يحرك إصبعه على لوحة اللمس (Touchpad) الموجودة في الحاسوب المحمول.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صور أجهزة التفاعل (لوحة اللمس، وشاشة اللمس، وجهاز التحكم بالألعاب، ونظارات الواقع الافتراضي وقفازاته) ويطابقها مع التلميذ ببطاقات أسمائها ويجرب لوحة لمس حقيقية، ثم يسأله: بماذا نحرك المؤشر دون فأرة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باقتراح جهاز التفاعل المناسب لثلاثة مواقف (رسم على جهاز لوحي، ولعبة سباق، وزيارة افتراضية لمتحف) مع تعليل كل اختيار.\n\nتفريد التعليم (5 دقائق):\nس4 (مستوى المعرفة): ما اسم لوحة المفاتيح التي يستخدمها الأشخاص ذوو الإعاقة البصرية؟\nالإجابة: لوحة مفاتيح برايل (Braille Keyboard).\n\nس5 (مستوى التطبيق): كيف يتحكم شخص لا يستطيع تحريك يديه في مؤشر الحاسوب؟\nالإجابة: باستخدام فأرة الرأس التي تحرك المؤشر بحركة الرأس، أو بإعطاء الأوامر بصوته عبر التعرف على الصوت.\n\nس6 (مستوى الاستدلال): لماذا تفيد التقنيات المساعدة كبار السن أيضًا وليس ذوي الإعاقة فقط؟\nالإجابة: لأن أي شخص قد يواجه صعوبة في مرحلة من حياته، مثل ضعف البصر أو صعوبة الحركة، فتسهل عليه هذه الأجهزة التفاعل مع الحاسوب.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صور أجهزة التفاعل (لوحة اللمس، وشاشة اللمس، وجهاز التحكم بالألعاب، ونظارات الواقع الافتراضي وقفازاته) ويطابقها مع التلميذ ببطاقات أسمائها ويجرب لوحة لمس حقيقية، ثم يسأله: بماذا نحرك المؤشر دون فأرة؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باقتراح جهاز التفاعل المناسب لثلاثة مواقف (رسم على جهاز لوحي، ولعبة سباق، وزيارة افتراضية لمتحف) مع تعليل كل اختيار.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): اختر: الجهاز المستخدم في لعب ألعاب الفيديو هو: (أ) جهاز التحكم بالألعاب (ب) الطابعة (ج) القرص الضوئي.\nالإجابة: (أ) جهاز التحكم بالألعاب.\n\nس2 (مستوى التطبيق): أكمل: «لقد اشتريتُ هاتفًا ذكيًا جديدًا به ........ كبيرة».\nالإجابة: شاشة لمس.\n\nس3 (مستوى الاستدلال): قارن بين نظارات الواقع الافتراضي وقفازات الواقع الافتراضي من حيث الوظيفة.\nالإجابة: النظارات تعرض البيئة الافتراضية أمام عيني المستخدم، والقفازات تلتقط حركة يده وأصابعه ليتفاعل داخل تلك البيئة.\n\nأسئلة التقويم الختامي (5 دقائق):\nس4 (مستوى المعرفة): صواب أم خطأ: بطاقة الذاكرة تُستخدم لتخزين الملفات داخل الكاميرا الرقمية.\nالإجابة: صواب.\n\nس5 (مستوى التطبيق): أي جهاز تخزين تختار لحفظ آلاف الصور ومقاطع الفيديو؟ ولماذا؟\nالإجابة: القرص الصلب الخارجي؛ لأن سعته التخزينية كبيرة.\n\nس6 (مستوى الاستدلال): تريد نقل واجبك من حاسوب المدرسة إلى حاسوب المنزل بسهولة، أي جهاز تخزين تختار؟ ولماذا لا تختار القرص الضوئي؟\nالإجابة: الذاكرة الوامضة؛ لأنها صغيرة وتتصل بمنفذ USB وتسهل نقل الملفات. أما القرص الضوئي فيحتاج إلى مشغل أقراص ويُستخدم لتخزين الملفات ذات الحجم الصغير.", "notes": "- للطالب: راجع أجهزة التفاعل في الوحدة 1 – الدرس 1 من كتاب التلميذ، وأكمل التدريبين 1 و 2 إن لم تُنجزهما.\n- لولي الأمر: ناقش مع ابنك الأجهزة التي يستخدمها في المنزل للتحكم في الحاسوب أو الهاتف.\n- تحضير للحصة القادمة: فكّر في طريقة يستخدم بها شخص لا يرى لوحة المفاتيح جهاز الحاسوب.\n- للطالب: راجع التقنيات المساعدة وأجهزة التخزين في الوحدة 1 – الدرس 1، وتأكد من لصق ملصقات التدريب 4 في أماكنها الصحيحة.\n- لولي الأمر: شارك ابنك في التعرف إلى أجهزة التخزين الموجودة في المنزل (ذاكرة وامضة، بطاقة ذاكرة الهاتف).\n- تحضير للحصة القادمة: اذكر أنواع الملفات التي أنشأتها سابقًا على الحاسوب (رسم، نص، تسجيل).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/it/?l=1\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}, {"id": "g3-2", "g": "الصف الثالث", "u": "الوحدة الأولى: حاسوبي", "t": "تنظيم الملفات والمجلدات", "ours": false, "periods": [{"title": "الملفات: أنواعها وتسميتها + خصائص الملف واستعراض محتويات المجلد", "week": "الأسبوع الثاني: 13–17/9/2026م", "ref": "دليل المعلم: ص 30–33  |  كتاب التلميذ: الوحدة 1 – الدرس 2: تنظيم الملفات والمجلدات (الملف وأنواعه)", "f": {"outcomes": "1. يعرّف الملف ويذكر أنواعًا مختلفة من الملفات (مستند، صورة، صوت، فيديو) (5 دقائق)\n2. يربط كل نوع من الملفات بالتطبيق الذي يُنشأ به (5 دقائق)\n3. يقترح لملفاته أسماء تصف محتواها (5 دقائق)\n4. يتعرف خصائص الملف: الاسم والامتداد والحجم (4 دقائق)\n5. يستعرض خصائص الملفات بتمرير مؤشر الفأرة فوقها (4 دقائق)\n6. يفتح مجلدًا ويستعرض ملفاته، ويستعيد ملفًا محذوفًا من سلة المحذوفات (4 دقائق)\n\nمخرج تعليمي آخر:\n- يعتاد تنظيم ممتلكاته الرقمية كما ينظم أدواته المدرسية (4 دقائق)\n- يتحقق قبل حذف أي ملف ويتعامل مع الملفات بحذر (4 دقائق)", "levels": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تطبيق\nالمخرج 4: تذكر\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق\nالمخرج الآخر: تطبيق\nالمخرج الآخر: تقييم", "strategies": "1. التعلم بالاكتشاف\n2. التعلم المبني على اللعب\n3. التعلم التشاركي\n4. التعلم بالنمذجة\n5. التعلم الذاتي\n6. التعلم التعاوني", "resources": "1. الكتاب\n2. جهاز الحاسب\n3. جهاز عرض البيانات\n4. أخرى: مجلد «بلادي» المرفق مع كتاب التلميذ، وبطاقات ورقية تمثل الملفات\n5. السبورة الذكية\n6. أخرى: مجلد «بلادي» المرفق، وبطاقة استكشاف ذاتي", "concepts": "1. الملف (File): وحدة لحفظ المعلومات في الحاسوب مثل مستند أو صورة أو تسجيل صوتي أو مقطع فيديو.\n2. اسم الملف: الكلمات التي نطلقها على الملف، ويُفضّل أن تصف محتواه.\n3. نوع الملف: يحدده التطبيق الذي أُنشئ به، فالمستند يُنشأ بمعالج الكلمات والرسم بتطبيق الرسم.\n4. امتداد الملف (File Extension): الحروف التي تأتي بعد النقطة في اسم الملف وتدل على نوعه، مثل docx للمستند وjpg للصورة وmp3 للصوت وmp4 للفيديو.\n5. حجم الملف (File Size): مقدار المساحة التي يشغلها الملف، ويُقاس بوحدات مثل كيلوبايت (KB) وميجابايت (MB).\n6. سلة المحذوفات: مكان تُنقل إليه الملفات المحذوفة ويمكن استعادتها منه.", "warmup": "- يعرض المعلم سطح مكتب يحوي أيقونات ملفات مختلفة ويسأل: ما الملف؟ هل أنشأتم ملفًا من قبل؟\n- ما أنواع الملفات التي تعرفونها؟ كيف تنظمون الصور والتسجيلات والمستندات في الحاسوب؟ (5 دقائق)", "procedures": "1. اكتشاف أنواع الملفات وتطبيقاتها: يوجه الطلبة لفتح مجلد «بلادي» وملاحظة أيقونات ملفاته، ويسأل: إذا أردت إنشاء رسم رقمي فما التطبيق الذي ستستخدمه؟ وأي تطبيق ستستخدم لإنشاء مستند نصي؟ ثم يؤكد أن كل ملف يُنشأ بتطبيق معين، ويفتح التلميذ المجلد ويصنف الملفات بحسب أيقوناتها ويستنتج التطبيق المناسب لكل نوع؛ كتاب الطالب ص26: الملف وأنواعه (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. لعبة صندوق الملفات: ينفذ المعلم جولتين بأوراق تمثل ملفات: الأولى بأسماء عامة (File1، File2) ويطلب إيجاد «ملف الواجب» بسرعة، والثانية بأسماء ذات معنى («تسجيلي»، «مقطع الفيديو الخاص بي»، «واجبي المنزلي»)، ويسأل: هل تساعدك التسمية في معرفة محتوى الملف؟ ويشارك التلميذ في الجولتين، ويقارن سرعة العثور على الملف، ويستنتج أن اسم الملف يجب أن يصف محتواه؛ كتاب الطالب ص36: «لنتدرب معًا» تدريب 1 (طابق أيقونة الملف بنوعه) (5 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. تسمية ثنائية وغلق: يصف المعلم أربعة ملفات (صورة رحلة، تسجيل نشيد، واجب رياضيات، مقطع حفل)، ويطلب من كل ثنائي اقتراح اسم مناسب لكل ملف، ثم يعرض بعض الاقتراحات ويناقشها، ويقترح التلميذ مع زميله أسماء مناسبة ويشاركها ويبرر اختيارها؛ كتاب الطالب ص27: تسمية الملف وامتداده (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. نمذجة: عرض خصائص الملف: يمرر المعلم مؤشر الفأرة فوق ملفات سطح المكتب أمام الطلبة ليظهر نوعها وحجمها، ويشرح الامتداد ووحدات الحجم، ثم يوجه الطلبة لتنفيذ الخطوة نفسها على ملفين، ويتابع التلميذ النمذجة، ثم يمرر المؤشر فوق ملفين ويقرأ نوعهما وحجمهما بتوجيه المعلم؛ كتاب الطالب ص28 و ص30: حجم الملف وفتح ملف (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. استكشاف ذاتي لمجلد «بلادي»: يوزع المعلم بطاقة استكشاف ويطلب من كل طالب فتح مجلد «بلادي» وتدوين اسم كل ملف ونوعه وحجمه، ثم حذف ملف تجريبي واستعادته من سلة المحذوفات، ويتجول للمتابعة، ويفتح التلميذ المجلد، ويدون خصائص الملفات في البطاقة، ويحذف الملف التجريبي ثم يستعيده بنفسه؛ كتاب الطالب ص30: فتح ملف (مجلد «بلادي») (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. مقارنة جماعية للأحجام: يوزع الطلبة في مجموعات بأدوار (قارئ، مرتب، كاتب، مقرر)، ويطلب ترتيب ملفات المجلد من الأصغر حجمًا إلى الأكبر واستنتاج نوع الملف الأكبر غالبًا، ثم يستمع لاستنتاج كل مجموعة، ويقارن التلميذ مع مجموعته الأحجام المدونة ويرتبها ويشارك في صياغة الاستنتاج وعرضه؛ كتاب الطالب ص28: حجم الملف (2 دقائق)\nالاستراتيجيات: التعلم التعاوني.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما التطبيق الذي تستخدمه لإنشاء مستند نصي؟\nالإجابة: معالج الكلمات (Microsoft Word).\n\nس2 (مستوى التطبيق): لماذا لا يُفضل تسمية الملفات بأسماء مثل File1 وFile2؟\nالإجابة: لأنها لا تصف محتوى الملف، فيصعب العثور على الملف المطلوب بسرعة.\n\nس3 (مستوى الاستدلال): سجّلت صوتك وأنت تقرأ نشيدًا عن عُمان، اقترح اسمًا مناسبًا للملف وبيّن سبب اختيارك.\nالإجابة: مثل «تسجيل نشيد عمان»؛ لأنه يصف نوع الملف ومحتواه فيسهل العثور عليه.\n\n• نشاط علاجي (لمن لم يتقن): يفرز المعلم مع التلميذ بطاقات ملفات (مستند، وصورة، وصوت، وفيديو) ويربط كلًا منها بالتطبيق الذي ينشئه، ثم يسأله: أي تطبيق ننشئ به مستندًا نصيًا؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعادة تسمية خمسة ملفات أسماؤها File1 وFile2… بأسماء تصف محتواها، ثم تنظيمها في مجلدات وتعليل طريقة التنظيم.\n\nتفريد التعليم (5 دقائق):\nس4 (مستوى المعرفة): ما الامتداد الذي يدل على مستند معالج الكلمات؟\nالإجابة: docx.\n\nس5 (مستوى التطبيق): كيف تعرف حجم ملف دون فتحه؟\nالإجابة: بتمرير مؤشر الفأرة فوق الملف فتظهر خصائصه ومنها الحجم.\n\nس6 (مستوى الاستدلال): حذفت ملف «واجبي المنزلي» بالخطأ، ماذا تفعل؟\nالإجابة: أفتح سلة المحذوفات وأحدد الملف ثم أختار استعادة فيعود إلى مكانه.\n\n• نشاط علاجي (لمن لم يتقن): يفرز المعلم مع التلميذ بطاقات ملفات (مستند، وصورة، وصوت، وفيديو) ويربط كلًا منها بالتطبيق الذي ينشئه، ثم يسأله: أي تطبيق ننشئ به مستندًا نصيًا؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعادة تسمية خمسة ملفات أسماؤها File1 وFile2… بأسماء تصف محتواها، ثم تنظيمها في مجلدات وتعليل طريقة التنظيم.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): صواب أم خطأ: الملفات التي تحمل أسماء متشابهة تكون دائمًا من النوع نفسه.\nالإجابة: خطأ؛ فقد يتشابه الاسم ويختلف النوع، كأن يكون أحدهما صورة والآخر مستندًا.\n\nس2 (مستوى التطبيق): اذكر ثلاثة أنواع من الملفات مع مثال لكل منها.\nالإجابة: صورة مثل صورة الرحلة، وصوت مثل تسجيل نشيد، ومستند مثل الواجب المنزلي (وفيديو مثل مقطع الحفل).\n\nس3 (مستوى الاستدلال): اكتب مثالًا لاسم ملف غير مناسب، ثم أعد كتابته باسم مناسب.\nالإجابة: مثل «ملف جديد 3»، ويُعاد تسميته «واجب الرياضيات – الأسبوع الثاني».\n\nأسئلة التقويم الختامي (5 دقائق):\nس4 (مستوى المعرفة): اذكر خاصيتين من خصائص الملف.\nالإجابة: الامتداد والحجم (إضافة إلى الاسم).\n\nس5 (مستوى التطبيق): طابق الامتدادات (jpg، mp3، docx) بأنواع الملفات (صوت، مستند، صورة).\nالإجابة: jpg صورة، وmp3 صوت، وdocx مستند.\n\nس6 (مستوى الاستدلال): لديك ملفان: «رحلتي.mp4» و«رحلتي.jpg»، أيهما أكبر حجمًا غالبًا؟ ولماذا؟\nالإجابة: ملف الفيديو mp4 غالبًا؛ لأنه يحوي صورًا متتابعة وصوتًا.", "notes": "- للطالب: اقرأ في الوحدة 1 – الدرس 2 أنواع الملفات وطريقة تسميتها.\n- لولي الأمر: شجع ابنك على تسمية ملفاته وصوره في الهاتف أو الحاسوب بأسماء تصف محتواها.\n- تحضير للحصة القادمة: لاحظ أن لكل ملف حجمًا يختلف من ملف لآخر.\n- للطالب: راجع خصائص الملف في الوحدة 1 – الدرس 2، وجرّب معرفة حجم ملف في حاسوب المنزل بتمرير المؤشر فوقه.\n- لولي الأمر: ذكّر ابنك بالتأكد قبل حذف أي ملف، وبإمكانية استعادته من سلة المحذوفات.\n- تحضير للحصة القادمة: أحضر ملفًا ورقيًا (مجلدًا) فيه أوراق مرتبة إن توفر.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/it/?l=2\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}, {"title": "إنشاء المجلدات والمجلدات الفرعية + نسخ الملفات والمجلدات ونقلها", "week": "الأسبوع الثالث: 20–24/9/2026م", "ref": "دليل المعلم: ص 33–35  |  كتاب التلميذ: الوحدة 1 – الدرس 2: إنشاء المجلدات (التدريب 1)", "f": {"outcomes": "1. يوضح فائدة تنظيم الملفات في مجلدات بحسب نوعها ومحتواها (5 دقائق)\n2. ينشئ مجلدًا ويعيد تسميته باسم مناسب (5 دقائق)\n3. ينشئ مجلدات فرعية داخل مجلد رئيس (التدريب 1) (5 دقائق)\n4. يميز بين نسخ الملف (Copy) وقصه (Cut) (4 دقائق)\n5. ينسخ ملفًا أو مجلدًا ويلصقه في مكان آخر بطرق مختلفة (4 دقائق)\n6. ينظم الملفات بنقلها إلى المجلدات المناسبة ويتحقق من صحة التنظيم (التدريب 2) (4 دقائق)\n\nمخرج تعليمي آخر:\n- يتعاون مع زميله في تنظيم ملفات الحاسوب المشترك (4 دقائق)\n- يتحقق من نتيجة عمله بفتح المجلدات بعد التنظيم (4 دقائق)", "levels": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: فهم\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق\nالمخرج الآخر: تطبيق\nالمخرج الآخر: تقييم", "strategies": "1. التعلم بالاكتشاف\n2. التعلم بالنمذجة\n3. التعلم التشاركي\n4. التعلم المبني على حل المشكلات\n5. التعلم المبني على اللعب", "resources": "1. جهاز الحاسب\n2. جهاز عرض البيانات\n3. الكتاب\n4. نماذج مجسمة\n5. أخرى: ملف ورقي فيه أوراق عمل مقسمة بحسب المواد، وبطاقات وأظرف للتصنيف\n6. السبورة الذكية\n7. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n8. أخرى: صورة لسطح مكتب مزدحم بالملفات، وذاكرة وامضة للعرض", "concepts": "1. المجلد (Folder): مكان في الحاسوب نجمع فيه الملفات المتشابهة لتنظيمها.\n2. المجلد الفرعي (Subfolder): مجلد يوجد داخل مجلد آخر لتنظيم الملفات بصورة أدق.\n3. إعادة التسمية (Rename): تغيير اسم ملف أو مجلد إلى اسم جديد.\n4. النسخ (Copy): إنشاء نسخة من الملف مع بقاء الأصل في مكانه، واختصاره Ctrl + C.\n5. القص (Cut): نقل الملف من مكانه إلى مكان جديد، واختصاره Ctrl + X.\n6. اللصق (Paste): وضع الملف المنسوخ أو المقصوص في المكان الجديد، واختصاره Ctrl + V.\n7. السحب والإفلات إلى جهاز تخزين آخر: ينشئ نسخة من الملف ولا ينقله.", "warmup": "- يعرض المعلم ملفًا ورقيًا فيه أوراق مقسمة بحسب المواد ويسأل: لماذا يسهل العثور على ورقة العلوم هنا؟\n- هل يمكن وضع مجلد داخل مجلد آخر؟ هل يمتلئ المجلد إذا وضعنا فيه ملفات كثيرة؟ (5 دقائق)", "procedures": "1. اكتشاف فكرة المجلد الفرعي: يعطي كل مجموعة بطاقات مختلطة (صور، تسجيلات، نصوص) وظرفًا كبيرًا داخله ظرفان صغيران، ويطلب تنظيم البطاقات، ثم يسأل عن معنى الظرف داخل الظرف، ويصنف التلميذ البطاقات مع مجموعته ويستنتج مفهوم المجلد الفرعي؛ كتاب الطالب ص28–29: المجلد والمجلد الفرعي (2 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. نمذجة: إنشاء مجلد وإعادة تسميته: ينشئ المعلم مجلدًا على سطح المكتب (جديد New ثم مجلد Folder) مفكرًا بصوت عالٍ، ويعيد تسميته «رحلتي» بالنقر بزر الفأرة الأيمن واختيار إعادة التسمية (Rename)، وينشئ داخله مجلدًا فرعيًا، ثم يكرر الطلبة الخطوات معه خطوة بخطوة، ويتابع التلميذ النمذجة، ثم ينشئ مجلدًا ويعيد تسميته وينشئ داخله مجلدًا فرعيًا بتوجيه المعلم؛ كتاب الطالب ص32–33: إنشاء مجلد جديد وتسميته (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تطبيق ثنائي: التدريب 1: يطلب المعلم من كل ثنائي إنشاء مجلدين فرعيين داخل مجلد «بلادي» باسمي «مقاطع صوتية عن بلادي» و«نص عن بلادي»، ثم يتبادل الثنائيان المجاوران التحقق من موقع المجلدات، ويتجول المعلم للدعم، وينفذ التلميذ التدريب مع زميله، ويتحقق أن المجلدين داخل المجلد الرئيس، ويراجع عمل ثنائي مجاور؛ كتاب الطالب ص33: «أنشئ مجلدين فرعيين» (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. نمذجة: النسخ والقص واللصق: ينفذ المعلم أمام الطلبة نسخ ملف ولصقه ثم قص ملف ولصقه، بالزر الأيمن للفأرة وباختصارات لوحة المفاتيح، مفكرًا بصوت عالٍ: «أين ذهب الملف الأصلي؟»، ويوضح أن سحب ملف وإفلاته في الذاكرة الوامضة ينشئ نسخة منه، ثم يوجه الطلبة لنسخ ملف واحد إلى مجلد فرعي، ويتابع التلميذ النمذجة ويلاحظ الفرق بين النسخ والقص، ثم ينسخ ملفًا إلى مجلد فرعي بتوجيه المعلم؛ كتاب الطالب ص34: نقل ملف (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. حل مشكلة: تنظيم مجلد «بلادي» (التدريب 2): يكلف كل ثنائي بتنظيم ملفات مجلد «بلادي» في مجلداته الفرعية، وتحديد متى ينسخ ومتى ينقل، ثم فتح كل مجلد فرعي للتحقق، ويقدم الدعم ويمكن اعتبار ما يتبقى من التدريب إثرائيًا، ويخطط التلميذ مع زميله لتوزيع الملفات، وينقلها أو ينسخها، ثم يفتح كل مجلد فرعي ويتأكد أن كل ملف في مكانه الصحيح؛ كتاب الطالب ص35 و ص36: «نظّم الملفات في المجلدات» و«لنتدرب معًا» تدريب 2 (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n6. غلق الدرس – مجلدات محافظات عمان: تتسابق المجموعات في تصنيف ملفات تخيلية مثل «صورة قلعة نزوى» و«صوت فن شعبي» و«نص عن صلالة» في مجلدات بأسماء محافظات عمان، وتحدد التطبيق المناسب لكل ملف (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما الأمران اللذان نختارهما لإنشاء مجلد جديد في مستكشف الملفات؟\nالإجابة: جديد (New) ثم مجلد (Folder).\n\nس2 (مستوى التطبيق): ما المجلد الفرعي؟\nالإجابة: مجلد يُنشأ داخل مجلد آخر لتنظيم الملفات بصورة أدق.\n\nس3 (مستوى الاستدلال): اقترح تنظيمًا لمجلد «المدرسة» باستخدام المجلدات الفرعية.\nالإجابة: إنشاء مجلدات فرعية بأسماء المواد مثل «الرياضيات» و«العلوم» و«اللغة العربية»، ووضع ملفات كل مادة في مجلدها.\n\n• نشاط علاجي (لمن لم يتقن): يفرز المعلم مع التلميذ بطاقات ملفات (مستند، وصورة، وصوت، وفيديو) ويربط كلًا منها بالتطبيق الذي ينشئه، ثم يسأله: أي تطبيق ننشئ به مستندًا نصيًا؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعادة تسمية خمسة ملفات أسماؤها File1 وFile2… بأسماء تصف محتواها، ثم تنظيمها في مجلدات وتعليل طريقة التنظيم.\n\nتفريد التعليم (5 دقائق):\nس4 (مستوى المعرفة): ما اختصار لوحة المفاتيح لأمر اللصق؟\nالإجابة: Ctrl + V.\n\nس5 (مستوى التطبيق): ما الفرق بين النسخ والقص؟\nالإجابة: النسخ يبقي الملف في مكانه الأصلي وينشئ نسخة في المكان الجديد، أما القص فينقل الملف فيختفي من مكانه الأصلي.\n\nس6 (مستوى الاستدلال): سحبت ملفًا من الحاسوب إلى الذاكرة الوامضة وأفلتّه، هل نُقل الملف أم نُسخ؟ فسّر.\nالإجابة: نُسخ؛ لأن سحب الملف وإفلاته في جهاز تخزين آخر ينشئ نسخة منه ويبقى الأصل في الحاسوب.\n\n• نشاط علاجي (لمن لم يتقن): يفرز المعلم مع التلميذ بطاقات ملفات (مستند، وصورة، وصوت، وفيديو) ويربط كلًا منها بالتطبيق الذي ينشئه، ثم يسأله: أي تطبيق ننشئ به مستندًا نصيًا؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعادة تسمية خمسة ملفات أسماؤها File1 وFile2… بأسماء تصف محتواها، ثم تنظيمها في مجلدات وتعليل طريقة التنظيم.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): صواب أم خطأ: لا يمكن وضع مجلد داخل مجلد آخر.\nالإجابة: خطأ.\n\nس2 (مستوى التطبيق): كيف تعيد تسمية مجلد؟\nالإجابة: أنقر بزر الفأرة الأيمن على المجلد وأختار إعادة التسمية (Rename)، ثم أكتب الاسم الجديد وأضغط Enter.\n\nس3 (مستوى الاستدلال): وضع زميلك جميع صوره وتسجيلاته ونصوصه في مجلد واحد اسمه «جديد». ما المشكلة؟ وكيف يحلها؟\nالإجابة: سيصعب عليه العثور على ملفاته؛ يعيد تسمية المجلد باسم يصف محتواه، وينشئ داخله مجلدات فرعية (صور، تسجيلات، نصوص) ويضع كل ملف في مجلده.\n\nأسئلة التقويم الختامي (5 دقائق):\nس4 (مستوى المعرفة): رتّب الخطوات: لصق، تحديد الملف، نسخ.\nالإجابة: تحديد الملف ثم نسخ ثم لصق.\n\nس5 (مستوى التطبيق): تريد نقل صورة من سطح المكتب إلى مجلد «صور عن بلادي» دون أن تبقى على سطح المكتب، ما الأمر الذي تستخدمه؟\nالإجابة: القص (Cut) ثم اللصق (Paste) داخل المجلد.\n\nس6 (مستوى الاستدلال): كيف تتأكد أن ملفاتك نُظمت بصورة صحيحة بعد نقلها؟\nالإجابة: أفتح كل مجلد فرعي وأتحقق من وجود كل ملف في مجلده الصحيح، وأمرر المؤشر فوق الملفات للتأكد من نوعها.", "notes": "- للطالب: راجع خطوات إنشاء المجلد وإعادة تسميته في الوحدة 1 – الدرس 2، وتأكد من إكمال التدريب 1.\n- لولي الأمر: ساعد ابنك على إنشاء مجلد لصوره في حاسوب المنزل بمجلدات فرعية بحسب المناسبات.\n- تحضير للحصة القادمة: فكّر: هل يبقى الملف في مكانه إذا نقلناه إلى مجلد آخر؟\n- للطالب: راجع خطوات النسخ والقص واللصق في الوحدة 1 – الدرس 2، وأكمل التدريب 2 إن لم تُنهه.\n- لولي الأمر: اطلب من ابنك تنظيم صور العائلة في مجلدات فرعية بحاسوب المنزل ليطبق ما تعلمه.\n- تحضير للحصة القادمة: لاحظ نوع الطابعة الموجودة في منزلك أو مدرستك إن وجدت.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/it/?l=2\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}, {"id": "g3-3", "g": "الصف الثالث", "u": "الوحدة الأولى: حاسوبي", "t": "أجهزة الطباعة والالتقاط", "ours": false, "periods": [{"title": "الطابعات وأنواعها + أجهزة الالتقاط وتوصيلها بالحاسوب", "week": "الأسبوع الرابع: 27/9–1/10/2026م", "ref": "دليل المعلم: ص 37–41  |  كتاب التلميذ: الوحدة 1 – الدرس 3: أجهزة الطباعة (التدريب 1)", "f": {"outcomes": "1. يميز بين أنواع الطابعات (النفث الحبري، والليزرية، والحرارية) والغرض من استخدام كل منها (5 دقائق)\n2. يحدد متطلبات الطباعة: توصيل الطابعة بالحاسوب سلكيًا أو لاسلكيًا، وتثبيت تطبيق تشغيل الطابعة، وتوفر الورق والحبر (5 دقائق)\n3. يقترح حلولًا لمشكلات طباعة بسيطة (طابعة غير موصولة، نفاد الورق) (5 دقائق)\n4. يتعرف أجهزة الالتقاط لإدخال البيانات: لاقط الصوت، وكاميرا الويب، والكاميرا الرقمية (4 دقائق)\n5. يربط كل جهاز التقاط بوظيفته (التدريب 2) (4 دقائق)\n6. ينقل ملفًا ملتقطًا (صورة) إلى الحاسوب عبر سلك USB أو بطاقة الذاكرة أو الذاكرة الوامضة (4 دقائق)\n\nمخرج تعليمي آخر:\n- يحافظ على الورق والحبر فلا يطبع إلا ما يحتاج إليه (4 دقائق)\n- يحافظ على خصوصيته عند استخدام كاميرا الويب (4 دقائق)", "levels": "المخرج 1: فهم\nالمخرج 2: تذكر\nالمخرج 3: تطبيق\nالمخرج 4: تذكر\nالمخرج 5: فهم\nالمخرج 6: تطبيق\nالمخرج الآخر: تقييم", "strategies": "1. التعلم المبني على حل المشكلات\n2. التعلم بالنمذجة\n3. التعلم التعاوني\n4. التعلم بالاكتشاف\n5. التعلم التشاركي", "resources": "1. جهاز الحاسب\n2. جهاز عرض البيانات\n3. الكتاب\n4. صورة توضيحية\n5. أخرى: طابعة نفث حبري في الصف إن أمكن، وبطاقات مشكلات طباعة\n6. أخرى: أجهزة التقاط إن أمكن: لاقط صوت، وكاميرا ويب، وكاميرا رقمية، وجهاز لوحي، مع سلك USB وبطاقة ذاكرة", "concepts": "1. الطابعة (Printer): جهاز إخراج يطبع المستندات والصور على الورق.\n2. طابعة النفث الحبري (Inkjet): تطبع برش الحبر على الورق، وتُستخدم في الغالب في المنزل والعمل.\n3. الطابعة الليزرية: طابعة سريعة تناسب طباعة كميات كبيرة من المستندات.\n4. الطابعة الحرارية: تطبع على ورق حراري خاص، مثل إيصالات المحلات التجارية.\n5. تطبيق تشغيل الطابعة: برنامج يُثبت على الحاسوب ويزود الطابعة بالإرشادات اللازمة لتعمل.\n6. أجهزة الالتقاط: أجهزة إدخال تلتقط البيانات مثل الصوت والصور والفيديو وتنقلها إلى الحاسوب.\n7. لاقط الصوت (Microphone): يسجل الصوت.\n8. كاميرا الويب (Web Camera): تُستخدم لإجراء اتصال الفيديو والتقاط الصور من الحاسوب.\n9. الكاميرا الرقمية (Digital Camera): تلتقط الصور ومقاطع الفيديو وتحفظها في بطاقة الذاكرة.", "warmup": "- يطرح المعلم موقفًا: «ضغطتُ أمر الطباعة ولم يخرج شيء من الطابعة! لماذا؟».\n- ثم يسأل: ما أنواع الطابعات التي تعرفها؟ هل لديك طابعة في المنزل؟ (5 دقائق)", "procedures": "1. نمذجة: عمل الطابعة وأنواعها: يعرض المعلم طابعة النفث الحبري ويشير إلى مكان الورق والحبر وزر التشغيل، ويوصلها بالوحدة المركزية ثم بمقبس الطاقة، ويوضح أهمية تطبيق تشغيل الطابعة، ويطبع صورة إن سمح الوقت مفكرًا بصوت عالٍ، ثم يعرض صور الطابعتين الليزرية والحرارية واستخداماتهما، ويتابع التلميذ خطوات التوصيل والطباعة، ويحدد أجزاء الطابعة، ويقارن بين أنواعها من الصور؛ كتاب الطالب ص38: من الشاشة إلى الورق (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. بطاقات مشكلات الطباعة: يوزع المعلم على المجموعات بطاقات: «لم يُثبت تطبيق التشغيل»، «نفد الورق»، «سلك الطابعة مفصول»، «أريد ورقًا بحجم أكبر»، ويطلب اقتراح الحل وعرضه، ويحلل التلميذ المشكلة مع مجموعته، ويقترح حلًا، ويعرضه أمام الصف ويستمع لحلول المجموعات الأخرى؛ كتاب الطالب ص38: لطباعة ملفاتك عليك التأكد من… (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. مهمة جماعية: التدريب 1: يوزع المعلم الأدوار في المجموعات (قارئ، كاتب، مدقق، مقرر)، ويكلفهم بحل عبارات الصواب والخطأ الست في التدريب 1، ثم يناقش العبارتين 3 و 4 مع الصف، ويقرأ التلميذ العبارات مع مجموعته، ويتفقون على الإجابة، ويصحح المقرر العبارة الخاطئة أمام الصف؛ كتاب الطالب ص39 و ص43: أنواع الطابعات و«لنتدرب معًا» تدريب 1 (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. محطات الاكتشاف: يجهز المعلم محطات (لاقط صوت، كاميرا ويب، كاميرا رقمية، جهاز لوحي) وينقل المجموعات بينها، ويطلب استنتاج نوع البيانات التي يلتقطها كل جهاز، ويجرب التلميذ الجهاز في كل محطة ويدون نوع البيانات التي يلتقطها، ثم يعرض استنتاجه؛ كتاب الطالب ص40–42: أجهزة الالتقاط (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. نمذجة: نقل الملفات إلى الحاسوب: يوصل المعلم كاميرا أو هاتفًا بالحاسوب بسلك USB، ثم ينقل صورة من بطاقة ذاكرة أو ذاكرة وامضة بالنسخ واللصق مفكرًا بصوت عالٍ، وينبه إلى خصوصية كاميرا الويب، ثم يوجه الطلبة لنسخ صورة من الذاكرة الوامضة إلى مجلد «صور عن بلادي»، ويتابع التلميذ النمذجة، ثم ينسخ صورة إلى المجلد المطلوب بتوجيه المعلم؛ كتاب الطالب ص41: الكاميرا الرقمية ونقل الصور إلى الحاسوب (2 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. تدريب ثنائي ومشاركة: يطلب المعلم من كل ثنائي حل التدريب 2 (تلوين دوائر الأجهزة بألوان وظائفها) ومناقشة سؤال أحمد، ثم يعرض صفحة «برامج أخرى» موضحًا أن واجهات الأجهزة الذكية تختلف عن واجهة ويندوز، ويحل التلميذ التدريب مع زميله، ويشارك: أي أجهزة الالتقاط موجودة في منزله وأيها في المدرسة؟؛ كتاب الطالب ص44: «لنتدرب معًا» تدريب 2 (لوّن دوائر الأجهزة) (2 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n7. غلق الدرس – ماذا نطبع للمعرض؟: تخطط المجموعات لمعرض صغير عن التراث العماني، فتختار الطابعة المناسبة لطباعة صورة ملونة للخنجر أو ملصق كبير أو إيصال، وتبرر اختيارها (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما نوع الطابعة الأكثر استخدامًا في المنزل والعمل؟\nالإجابة: طابعة النفث الحبري (Inkjet).\n\nس2 (مستوى التطبيق): هل يكفي توصيل الطابعة بالحاسوب لكي تعمل؟ وضّح.\nالإجابة: لا، يجب تثبيت تطبيق تشغيل الطابعة على الحاسوب ليزودها بالإرشادات اللازمة للعمل.\n\nس3 (مستوى الاستدلال): ضغطت أمر الطباعة ولم تطبع الطابعة، اذكر سببين محتملين وحل كل منهما.\nالإجابة: الطابعة غير موصولة بالحاسوب أو بمقبس الطاقة، والحل توصيلها؛ أو نفد الورق أو الحبر، والحل إضافة الورق أو استبدال الحبر.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صور الطابعات الثلاث (النفث الحبري، والليزرية، والحرارية) ويربطها مع التلميذ بمكان استخدامها (البيت، والمكتب، وإيصال المتجر)، ثم يسأله: أي طابعة نستخدمها في البيت غالبًا؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة «حل المشكلة» لثلاث مشكلات طباعة (طابعة غير موصولة، ونفاد الورق، وعدم تثبيت تطبيق التشغيل) مع حل كل منها.\n\nتفريد التعليم (5 دقائق):\nس4 (مستوى المعرفة): ما الجهاز الذي تستخدمه لتسجيل صوتك؟\nالإجابة: لاقط الصوت (Microphone).\n\nس5 (مستوى التطبيق): ما فائدة كاميرا الويب؟\nالإجابة: إجراء اتصال فيديو مع الآخرين والتقاط الصور ومقاطع الفيديو من الحاسوب.\n\nس6 (مستوى الاستدلال): أي جهاز يستطيع وحده إجراء اتصال فيديو وتسجيل الصوت والتقاط الصور؟\nالإجابة: الهاتف الذكي أو الجهاز اللوحي؛ لأنه يحتوي على كاميرا ولاقط صوت.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم صور الطابعات الثلاث (النفث الحبري، والليزرية، والحرارية) ويربطها مع التلميذ بمكان استخدامها (البيت، والمكتب، وإيصال المتجر)، ثم يسأله: أي طابعة نستخدمها في البيت غالبًا؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد بطاقة «حل المشكلة» لثلاث مشكلات طباعة (طابعة غير موصولة، ونفاد الورق، وعدم تثبيت تطبيق التشغيل) مع حل كل منها.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): صواب أم خطأ: يمكنك الطباعة على أحجام مختلفة من الورق.\nالإجابة: صواب.\n\nس2 (مستوى التطبيق): صواب أم خطأ مع التصحيح: «توصيل الطابعة بجهاز الحاسوب يكون عبر سلك USB وليس عبر شبكة Wi-Fi».\nالإجابة: خطأ؛ يمكن توصيل الطابعة بسلك USB أو لاسلكيًا عبر شبكة Wi-Fi.\n\nس3 (مستوى الاستدلال): أين تتوقع رؤية الطابعة الحرارية؟ ولماذا لا تُستخدم على نطاق واسع في المدارس؟\nالإجابة: في المحلات التجارية لطباعة الإيصالات؛ لأنها تطبع على ورق حراري خاص ولا تناسب طباعة المستندات والصور المدرسية.\n\nأسئلة التقويم الختامي (5 دقائق):\nس4 (مستوى المعرفة): اختر: لالتقاط الصور في أثناء رحلتك تستخدم: (أ) لاقط الصوت (ب) الكاميرا الرقمية (ج) الطابعة.\nالإجابة: (ب) الكاميرا الرقمية.\n\nس5 (مستوى التطبيق): اذكر طريقتين لنقل الصور من الكاميرا الرقمية إلى الحاسوب.\nالإجابة: توصيل الكاميرا بالحاسوب بسلك USB، أو إخراج بطاقة الذاكرة ووصلها بالحاسوب ثم نسخ الصور ولصقها.\n\nس6 (مستوى الاستدلال): لماذا يجب الحذر عند استخدام كاميرا الويب؟ اقترح تصرفًا آمنًا.\nالإجابة: لأنها قد تنقل صورتي ومكاني إلى أشخاص غرباء؛ لا أشغلها إلا بإذن ولي أمري ومع أشخاص أعرفهم، وأغلقها بعد الاستخدام.", "notes": "- للطالب: راجع أنواع الطابعات في الوحدة 1 – الدرس 3، واقرأ المعلومات التقنية في الدرس وليس المعلومات الرئيسة فقط.\n- لولي الأمر: إن توفرت طابعة في المنزل فاسمح لابنك بالتعرف إلى مكان الورق والحبر بإشرافك.\n- تحضير للحصة القادمة: اذكر الأجهزة التي استخدمتها لالتقاط صورة أو تسجيل صوت.\n- للطالب: راجع أجهزة الالتقاط في الوحدة 1 – الدرس 3، وأكمل التدريب 2، واطلع على صفحة «برامج أخرى».\n- لولي الأمر: ناقش مع ابنك قواعد استخدام كاميرا الويب والاتصال المرئي بأمان.\n- تحضير للحصة القادمة (بداية الوحدة الثانية): تذكّر أدوات تنسيق النص التي تعلمتها سابقًا (نوع الخط ولونه وحجمه).\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/it/?l=3\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}, {"id": "g3-4", "g": "الصف الثالث", "u": "الوحدة الثانية: هيا نكتب", "t": "تنسيق النص", "ours": false, "periods": [{"title": "فتح مستند وتنسيق النص: غامق ومائل وتسطير + تمييز النص ومحاذاة الفقرة", "week": "الأسبوع الخامس: 4–8/10/2026م", "ref": "دليل المعلم: ص 46–49  |  كتاب التلميذ: الوحدة 2 – الدرس 1: تنسيق النص (فتح مستند، غامق، مائل، تسطير)", "f": {"outcomes": "1. يفتح مستندًا محفوظًا في تطبيق معالج الكلمات (Microsoft Word) (5 دقائق)\n2. ينسق النص بجعله غامقًا أو مائلًا أو مسطرًا، ويجمع بين أكثر من تنسيق (5 دقائق)\n3. يحدد متى يستخدم التنسيق للتأكيد على كلمة أو عبارة في المستند (5 دقائق)\n4. يميز جزءًا من النص بلون معين باستخدام أداة تمييز النص (4 دقائق)\n5. يقارن بين أنواع محاذاة الفقرة (يمين، يسار، توسيط، ضبط) وأثرها في مظهر النص (4 دقائق)\n6. ينشئ مستندًا ويكتب فقرة وينسقها وفق مواصفات محددة (التدريبان 1 و 2) (4 دقائق)\n\nمخرج تعليمي آخر:\n- يستخدم أمر التراجع لتصحيح أخطائه ويحفظ عمله باستمرار (4 دقائق)\n- يختار تنسيقًا يجعل النص واضحًا وسهل القراءة دون مبالغة (4 دقائق)", "levels": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تطبيق\nالمخرج الآخر: تطبيق\nالمخرج الآخر: تقييم", "strategies": "1. التعلم بالاكتشاف\n2. التعلم المبني على اللعب\n3. التعلم بالنمذجة\n4. التعلم الذاتي", "resources": "1. جهاز الحاسب\n2. جهاز عرض البيانات\n3. الكتاب\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n5. أخرى: تطبيق معالج الكلمات Microsoft Word، وملف «إعادة التدوير.docx» المرفق\n6. السبورة الذكية\n7. أخرى: تطبيق معالج الكلمات Microsoft Word، وبطاقة مراجعة ذاتية", "concepts": "1. فتح (Open): أمر لعرض مستند محفوظ مسبقًا على الحاسوب.\n2. غامق (Bold): تنسيق يجعل الخط أسمك، واختصاره Ctrl + B.\n3. مائل (Italic): تنسيق يميل الخط، واختصاره Ctrl + I.\n4. تسطير (Underline): وضع خط أسفل النص، واختصاره Ctrl + U.\n5. التراجع (Undo): إلغاء آخر أمر نُفذ، واختصاره Ctrl + Z.\n6. تمييز (Highlighting): تلوين الخلفية خلف جزء من النص لإبرازه.\n7. محاذاة (Alignment): موضع السطور في الفقرة: لليمين أو لليسار أو في الوسط (توسيط) أو بين الطرفين (ضبط Justify).\n8. فقرة (Paragraph): مجموعة من الجمل تنتهي بالضغط على مفتاح Enter.", "warmup": "- يعرض المعلم مستندين بالنص نفسه: الأول بلا تنسيق والثاني منسق، ويسأل: ما الفرق بين المستندين؟ أيهما أوضح وأكثر جاذبية؟\n- ما التغييرات التي ظهرت على العنوان والفقرتين في المستند الثاني؟ (5 دقائق)", "procedures": "1. لعبة البحث عن التغييرات: يطلب المعلم من الطلبة فتح صفحة الدرس في كتاب التلميذ والبحث عن تغييرات التنسيق في النصوص، والفائز أول من يجد ثلاثة تغييرات مختلفة، ويتسابق التلميذ في رصد ثلاثة تغييرات (تمييز، غامق، توسيط...) ويعلنها؛ كتاب الطالب ص50–51: «هل تتذكر؟» (1 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. نمذجة: فتح مستند وتنسيقه: يفتح المعلم ملف «إعادة التدوير.docx» (ملف ← فتح ← استعراض ← اختيار الملف ← فتح) مفكرًا بصوت عالٍ، ويحدد جملة ويطبق الغامق والمائل والتسطير، ويجمع أكثر من تنسيق على كلمة، ويتراجع بأمر Undo، ثم ينفذ الطلبة الخطوات معه، ويتابع التلميذ النمذجة، ثم يفتح الملف بنفسه ويطبق التنسيقات الثلاثة ويجرب التراجع بتوجيه المعلم؛ كتاب الطالب ص52: فتح مستند وأدوات التنسيق (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. اكتشاف: جرّب أدوات التنسيق: يلفت المعلم الانتباه إلى الروبوت الذي يطلب التجربة، ويطلب العثور على أدوات تعلموها سابقًا (نوع الخط ولونه وحجمه) واكتشاف اختصارات لوحة المفاتيح للتنسيق، ويذكر بحفظ المستند، ويجرب التلميذ الأدوات والاختصارات، ويدون ما اكتشفه، ويساعد زميله إن احتاج، ثم يحفظ المستند؛ كتاب الطالب ص53–54: أدوات التنسيق والخط الغامق (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. غلق: يجيب التلميذ مع مجموعته ويتابع النتيجة (2 دقيقة)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. نمذجة: التمييز ومكان أدوات المحاذاة: يحدد كلمة «إعادة التدوير» ويطبق عليها تمييز النص بلون مفكرًا بصوت عالٍ، ثم يشير إلى أزرار المحاذاة في تبويب الصفحة الرئيسة، ويوجه الطلبة لتمييز كلمة في مستندهم، ويتابع التلميذ النمذجة، ثم يميز كلمة في مستند «إعادة التدوير» بتوجيه المعلم؛ كتاب الطالب ص55–56: تمييز النص (2 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. اكتشاف أنواع المحاذاة: يطلب المعلم من الطلبة تجربة أنواع المحاذاة الأربعة على فقرة المستند وتسجيل ملاحظاتهم في جدول (ماذا تغير؟ أي الحواف مستقيمة؟)، ثم يناقش ظهور مسافات كبيرة عند الضبط واقتراح تصغير الخط، ويجرب كل محاذاة، ويدون ملاحظته، ويستنتج متى تناسب كل محاذاة؛ كتاب الطالب ص57: محاذاة النص (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n7. تطبيق مستقل: التدريبان 1 و 2: يكلف كل طالب بتنسيق النص كما في صورة التدريب 1، ثم إنشاء مستند جديد وكتابة فقرة «ترتفع حرارة كوكبنا...» وتطبيق: الخط Arial، والحجم 18، واللون الأزرق، والمحاذاة لليمين، ثم المراجعة ببطاقة ذاتية، ويمكن اعتبار ما يتبقى إثرائيًا، وينفذ التلميذ التدريبين بنفسه، ويراجع عمله بالبطاقة، ويحفظ المستند؛ كتاب الطالب ص56: «نسّق النص على النحو الآتي» (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما الحرف الذي يظهر على أيقونة الخط الغامق؟\nالإجابة: B.\n\nس2 (مستوى التطبيق): ما الخطوة التي يجب تنفيذها قبل تطبيق أي تنسيق على النص؟\nالإجابة: تحديد النص المطلوب تنسيقه.\n\nس3 (مستوى الاستدلال): تريد إبراز عنوان بأكثر من تنسيق، ماذا تفعل؟\nالإجابة: أحدد العنوان ثم أطبق عليه الغامق والمائل والتسطير معًا؛ إذ يمكن تطبيق أكثر من تنسيق على النص نفسه.\n\n• نشاط علاجي (لمن لم يتقن): يفتح المعلم مع التلميذ مستندًا محفوظًا ويحددان كلمة ثم يطبقان عليها الغامق (B) والمائل (I) والمسطر (U) واحدًا بعد الآخر، ثم يطلب منه جعل كلمة أخرى غامقة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة فقرة قصيرة واختيار الكلمات التي تستحق التأكيد بالتنسيق مع التعليل، وإبراز العنوان بأكثر من تنسيق، وحفظ العمل.\n\nتفريد التعليم (5 دقائق):\nس4 (مستوى المعرفة): ما الأداة التي تستخدمها لتلوين خلفية كلمة مهمة باللون الأصفر؟\nالإجابة: أداة تمييز النص (Text Highlight Color).\n\nس5 (مستوى التطبيق): ما الفرق بين التوسيط والمحاذاة لليمين؟\nالإجابة: التوسيط يضع السطور في منتصف الصفحة، والمحاذاة لليمين تجعل بدايات السطور مستقيمة على الجانب الأيمن.\n\nس6 (مستوى الاستدلال): طبقت أمر الضبط (Justify) فظهرت مسافات كبيرة بين الكلمات، لماذا؟ وكيف تعالجها؟\nالإجابة: لأن الضبط يوزع الكلمات ليمتد السطر بين طرفي الصفحة؛ ويمكن تصغير حجم الخط أو اختيار محاذاة أخرى.\n\n• نشاط علاجي (لمن لم يتقن): يفتح المعلم مع التلميذ مستندًا محفوظًا ويحددان كلمة ثم يطبقان عليها الغامق (B) والمائل (I) والمسطر (U) واحدًا بعد الآخر، ثم يطلب منه جعل كلمة أخرى غامقة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة فقرة قصيرة واختيار الكلمات التي تستحق التأكيد بالتنسيق مع التعليل، وإبراز العنوان بأكثر من تنسيق، وحفظ العمل.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): طابق الأيقونات (B، I، U) بالتنسيقات (مائل، تسطير، غامق).\nالإجابة: B غامق، وI مائل، وU تسطير.\n\nس2 (مستوى التطبيق): رتّب خطوات فتح مستند: استعراض، ملف، فتح، اختيار الملف ثم النقر على فتح.\nالإجابة: ملف ثم فتح ثم استعراض ثم اختيار الملف والنقر على فتح.\n\nس3 (مستوى الاستدلال): طبقت تنسيقًا خاطئًا على كلمة، اذكر طريقتين للتراجع عنه.\nالإجابة: النقر على زر التراجع (Undo)، أو الضغط على Ctrl + Z (أو تحديد الكلمة والنقر على أداة التنسيق نفسها مرة أخرى لإلغائه).\n\nأسئلة التقويم الختامي (5 دقائق):\nس4 (مستوى المعرفة): صواب أم خطأ: تمييز النص يغير لون الحروف نفسها.\nالإجابة: خطأ؛ التمييز يلون الخلفية خلف الحروف، أما لون الخط فيغير لون الحروف.\n\nس5 (مستوى التطبيق): أي محاذاة تناسب عنوان المستند غالبًا؟\nالإجابة: التوسيط.\n\nس6 (مستوى الاستدلال): كيف تبرز كلمة «حرارة» في جملة «ترتفع حرارة كوكبنا في كل عام» دون تغيير بقية الجملة؟\nالإجابة: أحدد كلمة «حرارة» فقط، ثم أطبق عليها التمييز بلون أو الغامق، وأترك بقية الجملة دون تحديد.", "notes": "- للطالب: راجع خطوات فتح مستند وأدوات الغامق والمائل والتسطير في الوحدة 2 – الدرس 1، واطلع على صفحة «هل تذكر» في بداية الوحدة.\n- لولي الأمر: شجع ابنك على كتابة جملة قصيرة في معالج الكلمات وتنسيقها إن توفر حاسوب في المنزل.\n- تحضير للحصة القادمة: لاحظ في كتبك المدرسية: هل تبدأ السطور كلها من المكان نفسه؟\n- للطالب: راجع أدوات التمييز والمحاذاة في الوحدة 2 – الدرس 1، وأكمل التدريب 2 إن لم تُنهه.\n- لولي الأمر: اطلب من ابنك أن يريك كيف يميز كلمة مهمة في مستند ويغير محاذاة الفقرة.\n- تحضير للحصة القادمة: تذكّر وظائف المفاتيح Enter وSpacebar وBackspace وDelete وShift.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/it/?l=4\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}, {"title": "لنتدرب على تنسيق النص", "week": "الأسبوع السادس: 11–15/10/2026م", "ref": "دليل المعلم: ص 51–59  |  كتاب التلميذ: الوحدة 2 – الدرس 2: لنتدرب على تنسيق النص (التدريبات 1–5)", "f": {"outcomes": "1. يميز بين استخدامات أدوات تنسيق النص المختلفة (التدريبان 1 و 4) (9 دقائق)\n2. يطابق مفاتيح لوحة المفاتيح بوظائفها في أثناء كتابة نص (التدريب 2) (9 دقائق)\n3. يرتب خطوات فتح مستند ويحدد نوع المحاذاة المناسب (التدريبان 3 و 5) (9 دقائق)\n\nمخرج تعليمي آخر: - يساعد زملاءه ويتقبل ملاحظاتهم في أثناء التدريب (8 دقائق)", "levels": "المخرج 1: فهم\nالمخرج 2: تذكر\nالمخرج 3: تطبيق\nالمخرج الآخر: تطبيق", "strategies": "1. التعلم الذاتي\n2. التعلم المبني على اللعب\n3. التعلم التعاوني", "resources": "1. الكتاب\n2. جهاز عرض البيانات\n3. جهاز الحاسب\n4. أخرى: بطاقات أدوات التنسيق ونتائجها (12 بطاقة)، وألواح صغيرة، وملصقات كتاب التلميذ", "concepts": "1. مسافة للخلف (Backspace): يحذف النص على يمين المؤشر عند الكتابة بالعربية.\n2. حذف (Delete): يحذف النص على يسار المؤشر عند الكتابة بالعربية.\n3. إدخال (Enter): ينشئ سطرًا جديدًا.\n4. تبديل (Shift): يُستخدم لكتابة الهمزة وإضافة علامات الترقيم.\n5. مفاتيح الأسهم: تحرك المؤشر داخل النص.", "warmup": "- يطرح المعلم أسئلة سريعة يجيب عنها الطلبة على ألواحهم: ما الأداة التي تجعل النص غامقًا؟ ما المفاتيح التي تفيدك عند إنشاء مستند غير مفاتيح الحروف؟ كيف تحاذي فقرة؟ (5 دقائق)", "procedures": "1. لعبة: ابحث عن شريكك: يوزع المعلم ست بطاقات أدوات (غامق، مائل، تسطير، تمييز، لون الخط، حجم الخط) وست بطاقات نص «إعادة التدوير» منسق، ويطلب من كل حامل أداة إيجاد حامل نتيجتها، ثم يسأل: ما تأثير كل أداة على النص؟ ويوجه بعدها لحل التدريب 4، ويبحث التلميذ عن شريكه المطابق، ويشرح تأثير الأداة، ثم يحل التدريب 4؛ كتاب الطالب ص53: أدوات التنسيق (6 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n2. مهمة جماعية: المفاتيح وخطوات الفتح: يوزع المعلم الأدوار في المجموعات (قارئ، منفذ، مدقق، مقرر)، ويكلفهم بالتدريب 2 (مطابقة المفاتيح بوظائفها) والتدريب 3 (ترقيم خطوات فتح مستند من 1 إلى 5)، ويطبق الخطوات على جهاز العرض للتحقق، ويشارك مجموعته في الحل، ويجرب المنفذ المفاتيح على الحاسوب، ويعرض المقرر الإجابات؛ كتاب الطالب ص50–51: «هل تتذكر؟» (المفاتيح الخاصة) (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n3. تطبيق مستقل وتصحيح ذاتي: يطلب المعلم من كل طالب حل التدريب 1 (لصق أداة كل تنسيق) والتدريب 5 (لصق نوع المحاذاة) ملاحظًا زوايا الفقرة، ثم يعرض مفتاح الإجابة للتصحيح الذاتي، ويحل التلميذ التدريبين بمفرده، ثم يصحح إجاباته من مفتاح الإجابة ويعدل خطأه؛ كتاب الطالب ص58–59: «لنتدرب معًا» تدريبا 1 و 2 (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. غلق الدرس – عنوان بارز لوطني: يتبارى الأزواج في اقتراح عنوان لفقرة عن الأفلاج العمانية، ويحددون الكلمة التي تُكتب غامقة والتي تُكتب مائلة أو مسطرة ولماذا، ثم يعرضون اختيارهم (4 دقائق)\nالاستراتيجيات: فكر – زاوج – شارك.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما المفتاح الذي يضيف مسافة بين كلمتين؟\nالإجابة: مفتاح المسافة (Spacebar).\n\nس2 (مستوى التطبيق): ما الفرق بين مفتاح Backspace ومفتاح Delete عند الكتابة بالعربية؟\nالإجابة: Backspace يحذف النص على يمين المؤشر، وDelete يحذف النص على يسار المؤشر.\n\nس3 (مستوى الاستدلال): تريد كتابة علامة الاستفهام «؟» في نهاية جملة، ما المفتاح الذي تضغطه مع مفتاحها؟ ولماذا؟\nالإجابة: مفتاح Shift؛ لأنه يُستخدم لكتابة الهمزة وعلامات الترقيم.\n\n• نشاط علاجي (لمن لم يتقن): يفتح المعلم مع التلميذ مستندًا محفوظًا ويحددان كلمة ثم يطبقان عليها الغامق (B) والمائل (I) والمسطر (U) واحدًا بعد الآخر، ثم يطلب منه جعل كلمة أخرى غامقة.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة فقرة قصيرة واختيار الكلمات التي تستحق التأكيد بالتنسيق مع التعليل، وإبراز العنوان بأكثر من تنسيق، وحفظ العمل.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما الأداة التي يظهر عليها الرقم 16 في شريط الأدوات؟\nالإجابة: حجم الخط.\n\nس2 (مستوى التطبيق): رتّب خطوات فتح مستند «إعادة التدوير».\nالإجابة: ملف ثم فتح ثم استعراض ثم اختيار ملف «إعادة التدوير» ثم النقر على فتح.\n\nس3 (مستوى الاستدلال): أمامك فقرة جانباها الأيمن والأيسر مستقيمان تمامًا، ما نوع محاذاتها؟ وكيف عرفت؟\nالإجابة: الضبط (Justify)؛ لأن السطور تمتد بين طرفي الصفحة فتكون الحافتان مستقيمتين.", "notes": "- للطالب: أكمل تدريبات الوحدة 2 – الدرس 2 التي لم تنهها، وتأكد من لصق الملصقات في أماكنها الصحيحة.\n- لولي الأمر: راجع مع ابنك وظائف مفاتيح لوحة المفاتيح على أي جهاز في المنزل.\n- تحضير للحصة القادمة: فكّر: لماذا تجعل الصور المستند أكثر جاذبية؟\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/it/?l=4\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}, {"id": "g3-5", "g": "الصف الثالث", "u": "الوحدة الثانية: هيا نكتب", "t": "إدراج وتنسيق صورة", "ours": true, "periods": [{"title": "إدراج صورة وتغيير حجمها واقتصاصها + تنسيق الصورة: الحدود والأنماط والتفاف النص", "week": "الأسبوع السادس: 11–15/10/2026م", "ref": "دليل المعلم: ص 60–63  |  كتاب التلميذ: الوحدة 2 – الدرس 3: إدراج وتنسيق صورة (الإدراج، تغيير الحجم، القص)", "f": {"outcomes": "1. يدرج صورة من الحاسوب في مستند نصي (5 دقائق)\n2. يغير حجم الصورة بالمقابض ويميز بين أثر مقبض الزاوية ومقبض المنتصف (5 دقائق)\n3. يقص جزءًا غير مرغوب فيه من الصورة (5 دقائق)\n4. يضيف حدودًا إلى الصورة ويطبق عليها نمطًا من أنماط الصور (4 دقائق)\n5. يستخدم خيار التفاف النص (Wrap Text) لترتيب الصورة مع النص (4 دقائق)\n6. ينشئ مستند «الاحتباس الحراري» بعنوان ونص وصورة منسقة (التدريب 1) (4 دقائق)\n\nمخرج تعليمي آخر:\n- يختار صورًا مرتبطة بموضوع المستند (4 دقائق)\n- يتأنى في اختيار خيار الالتفاف حتى لا يخفي النص خلف الصورة (4 دقائق)", "levels": "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: إبداع\nالمخرج الآخر: تقييم", "strategies": "1. التعلم التشاركي\n2. التعلم بالنمذجة\n3. التعلم بالاكتشاف\n4. التعلم الذاتي", "resources": "1. جهاز الحاسب\n2. جهاز عرض البيانات\n3. الكتاب\n4. أخرى: تطبيق معالج الكلمات Microsoft Word، وصورة «صناديق إعادة التدوير.jpg» المرفقة\n5. السبورة الذكية\n6. أخرى: تطبيق معالج الكلمات Microsoft Word، وبطاقة قائمة تحقق\n7. أخرى: العرض التفاعلي ومقاطع الفيديو التوضيحية للدرس في منصة أ. عبير اليحمدية", "concepts": "1. إدراج صورة (Insert Picture): إضافة صورة محفوظة في الحاسوب إلى المستند من تبويب إدراج.\n2. المقابض: الدوائر الصغيرة حول الصورة المحددة، نسحبها لتغيير حجمها.\n3. القص (Crop): إخفاء جزء غير مرغوب فيه من الصورة.\n4. تنسيق الصورة (Picture Format): تبويب يظهر عند تحديد الصورة ويحوي أدوات تنسيقها.\n5. حدود الصورة: إطار يحيط بالصورة بلون وسمك نختارهما.\n6. أنماط الصور (Picture Styles): أشكال جاهزة للصورة كالإطار والظل والحواف المستديرة.\n7. التفاف النص (Wrap Text): خيار يحدد موضع النص بالنسبة إلى الصورة، مثل: مربع، وأعلى وأسفل، وخلف النص، وأمام النص.", "warmup": "- يسأل المعلم: ما نوع المستند الذي تفضلونه: مستند به صور أم بدون صور؟ لماذا من المهم إضافة صور إلى المستند؟\n- ما نوع الصورة التي تضيفونها إلى مستند عن إعادة التدوير؟ (5 دقائق)", "procedures": "1. نمذجة: إدراج صورة: يضع المعلم المؤشر في المكان المطلوب أولًا، ثم يدرج «صناديق إعادة التدوير.jpg» (إدراج ← صور ← هذا الجهاز ← المستندات ← اختيار الصورة ← إدراج) مفكرًا بصوت عالٍ، ثم ينفذ الطلبة الإدراج معه، ويتابع التلميذ الخطوات، ثم يدرج الصورة في مستند «إعادة التدوير» بتوجيه المعلم؛ كتاب الطالب ص60–61: إدراج صورة (4 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. اكتشاف: مقابض الزاوية والمنتصف: يطلب المعلم تصغير الصورة مرة بمقبض الزاوية ومرة بمقبض المنتصف، وتدوين الفرق، ثم يسأل: هل تختفي الصورة إذا صغرناها؟ ويجرب التلميذ المقبضين ويستنتج أن مقبض الزاوية يحافظ على تناسب الصورة وأن مقبض المنتصف يغيرها من اتجاه واحد؛ كتاب الطالب ص62: تغيير حجم الصورة (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. قص الصورة ومراجعة الزميل: يسأل المعلم: هل من الضروري إبقاء عبارة «RECYCLING BINS» في الصورة والمستند يحمل العنوان نفسه؟ ثم يوجه كل ثنائي لقص الجزء غير المرغوب (تنسيق الصورة ← قص) ومراجعة عمل الزميل، ويعرض نتائج بعض الثنائيات، ويقص التلميذ الجزء المطلوب، ويراجع صورة زميله، ويشاركان النتيجة مع الصف؛ كتاب الطالب ص62: قص الصورة (4 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. اكتشاف أنماط الصور: يطلب المعلم تحديد الصورة وملاحظة ظهور تبويب تنسيق الصورة، ثم تجربة عدة أنماط وتسجيل النمط المفضل وأثره، منبهًا إلى الروبوت الذي يطلب التجربة، ويحدد التلميذ الصورة، ويكتشف ظهور التبويب، ويجرب الأنماط ويدون ملاحظته؛ كتاب الطالب ص63–65: تنسيق الصورة وحدودها ونمطها (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. نمذجة: الحدود والتفاف النص: يضيف المعلم حدودًا للصورة باختيار اللون والسمك، ثم يعرض خيارات التفاف النص (مربع، أعلى وأسفل، خلف النص، أمام النص) مفكرًا بصوت عالٍ، ويحذر من أن «أمام النص» قد يخفي النص، ثم يطبق الطلبة خيارًا معه، ويتابع التلميذ النمذجة، ويضيف حدودًا لصورته، ويجرب خيار التفاف بتوجيه المعلم؛ كتاب الطالب ص66–67: التفاف النص (2 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. تطبيق مستقل: التدريب 1: يكلف كل طالب بإنشاء مستند جديد باسم «الاحتباس الحراري»: العنوان أولًا ثم النص ثم الصورة، وترتيبها بالتفاف مناسب، ثم المراجعة بقائمة التحقق والحفظ، ويمكن اعتبار ما يتبقى إثرائيًا، وينشئ التلميذ المستند بالترتيب الصحيح، وينسق الصورة ويرتبها، ويراجع عمله بقائمة التحقق ويحفظه؛ كتاب الطالب ص65–67: الحدود والأنماط والتفاف النص (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما التبويب الذي نستخدمه لإضافة صورة إلى المستند؟\nالإجابة: تبويب إدراج (Insert).\n\nس2 (مستوى التطبيق): ماذا يحدث للصورة عند سحب مقبض الزاوية؟ وعند سحب مقبض المنتصف؟\nالإجابة: مقبض الزاوية يكبر الصورة أو يصغرها مع المحافظة على تناسبها، ومقبض المنتصف يغير حجمها من اتجاه واحد فتتمدد أو تنضغط.\n\nس3 (مستوى الاستدلال): أُدرجت الصورة في مكان خاطئ من المستند، ما السبب المحتمل؟ وكيف تتجنبه؟\nالإجابة: لم يوضع المؤشر في المكان المطلوب قبل الإدراج؛ أضع المؤشر أولًا في مكان الصورة ثم أدرجها.\n\n• نشاط علاجي (لمن لم يتقن): يدرج المعلم مع التلميذ صورة من تبويب إدراج (Insert)، ثم يسحبان مقبض الزاوية ومقبض المنتصف ويلاحظان الفرق، ثم يطلب منه تصغير الصورة دون تشويهها.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد صفحة عن موضوع يختارونه فيها صورة مناسبة مقصوصة، ومضاف إليها حدود ونمط، وتوضيح سبب استخدام مقبض الزاوية.\n\nتفريد التعليم (5 دقائق):\nس4 (مستوى المعرفة): متى يظهر تبويب تنسيق الصورة (Picture Format)؟\nالإجابة: عند تحديد الصورة.\n\nس5 (مستوى التطبيق): ما فائدة خيار التفاف النص؟\nالإجابة: تحديد موضع النص بالنسبة إلى الصورة، كأن يحيط بها أو يكون أعلاها وأسفلها أو أمامها.\n\nس6 (مستوى الاستدلال): لماذا يجب الحذر عند اختيار «أمام النص»؟\nالإجابة: لأن الصورة توضع فوق النص فتخفي جزءًا منه.\n\n• نشاط علاجي (لمن لم يتقن): يدرج المعلم مع التلميذ صورة من تبويب إدراج (Insert)، ثم يسحبان مقبض الزاوية ومقبض المنتصف ويلاحظان الفرق، ثم يطلب منه تصغير الصورة دون تشويهها.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد صفحة عن موضوع يختارونه فيها صورة مناسبة مقصوصة، ومضاف إليها حدود ونمط، وتوضيح سبب استخدام مقبض الزاوية.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): صواب أم خطأ: لا يمكن قص الصورة بعد إدراجها في مستند معالج الكلمات.\nالإجابة: خطأ.\n\nس2 (مستوى التطبيق): رتّب خطوات إدراج صورة من الحاسوب.\nالإجابة: إدراج ثم صور ثم هذا الجهاز ثم اختيار الصورة ثم إدراج.\n\nس3 (مستوى الاستدلال): في صورتك عبارة مكتوبة تكرر عنوان المستند، كيف تتخلص منها دون حذف الصورة؟\nالإجابة: أحدد الصورة ثم أختار أداة القص (Crop) من تبويب تنسيق الصورة، وأسحب مقبض القص لإخفاء الجزء الذي فيه العبارة.\n\nأسئلة التقويم الختامي (5 دقائق):\nس4 (مستوى المعرفة): ماذا تضيف أداة حدود الصورة؟\nالإجابة: إطارًا حول الصورة بلون وسمك نختارهما.\n\nس5 (مستوى التطبيق): أي خيار التفاف تختار ليحيط النص بالصورة من جوانبها؟\nالإجابة: مربع (Square).\n\nس6 (مستوى الاستدلال): اقترح ترتيبًا مناسبًا لمستند «الاحتباس الحراري» يضم العنوان والفقرة والصورة.\nالإجابة: العنوان في الأعلى بخط بارز وتوسيط، ثم الفقرة، ثم الصورة بجانبها بالتفاف «مربع» ليحيط النص بها دون أن يختفي.", "notes": "- للطالب: راجع خطوات إدراج صورة وتغيير حجمها وقصها في الوحدة 2 – الدرس 3.\n- لولي الأمر: شارك ابنك اختيار صورة مناسبة لموضوع يحبه ليدرجها في مستند لاحقًا.\n- تحضير للحصة القادمة: لاحظ في المجلات كيف يحيط النص بالصور.\n- للطالب: راجع أنماط الصور والتفاف النص في الوحدة 2 – الدرس 3، وأكمل التدريب 1 إن لم تُنهه.\n- لولي الأمر: اطلب من ابنك أن يشرح لك الفرق بين خيارات التفاف النص.\n- تحضير للحصة القادمة: راجع كل ما تعلمته عن تنسيق النص والصور استعدادًا للتدريب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/it/?l=5\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}, {"title": "لنتدرب على التعامل مع النص وتنسيق الصور", "week": "الأسبوع السابع: 18–22/10/2026م", "ref": "دليل المعلم: ص 65–74  |  كتاب التلميذ: الوحدة 2 – الدرس 4: لنتدرب على التعامل مع النص وتنسيق الصور (التدريبات 1–6)", "f": {"outcomes": "1. يحكم على صحة عبارات عن تنسيق النص والصور ويصحح الخاطئ منها (التدريبان 1 و 2) (9 دقائق)\n2. يميز بين أنماط الصور المختلفة (التدريب 4) (4 دقائق)\n3. يرتب خطوات إدراج صورة ويطابق خيارات التفاف النص بنتائجها (التدريبات 3 و 5 و 6) (13 دقيقة)\n\nمخرج تعليمي آخر: - يثابر لإكمال المهام ويتحقق من إجاباته (9 دقائق)", "levels": "المخرج 1: تقييم\nالمخرج 2: تحليل\nالمخرج 3: تطبيق\nالمخرج الآخر: تقييم", "strategies": "1. التعلم الذاتي\n2. التعلم المبني على اللعب\n3. التعلم التعاوني", "resources": "1. الكتاب\n2. جهاز عرض البيانات\n3. جهاز الحاسب\n4. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n5. أخرى: تطبيق معالج الكلمات Microsoft Word، وألواح صغيرة\n6. أخرى: العرض التفاعلي ومقاطع الفيديو التوضيحية للدرس في منصة أ. عبير اليحمدية", "concepts": "1. خلف النص (Behind Text): تظهر الصورة خلف النص كأنها خلفية.\n2. أعلى وأسفل (Top and Bottom): يظهر النص فوق الصورة وأسفلها فقط.\n3. مربع (Square): يحيط النص بالصورة من جوانبها على شكل مربع.", "warmup": "- يسأل المعلم ويجيب الطلبة على الألواح: ما خيارات تنسيق النص التي تعرفونها؟ ما المفاتيح التي لها وظائف خاصة؟ كيف نغير التفاف النص؟ (5 دقائق)", "procedures": "1. تدريب مستقل: صواب وخطأ وفراغات: يطلب المعلم حل التدريب 1 (سبع عبارات صواب وخطأ) والتدريب 2 (ملء الفراغات) ملاحظًا الصور بجانب الجمل، ثم يعرض الحل للتصحيح الذاتي، ويطبق على Word المهارات المذكورة في الجمل للتوضيح، ويحل التلميذ التدريبين بمفرده ويصحح إجاباته ويعلل خطأه؛ كتاب الطالب ص68–69: «لنتدرب معًا» تدريبا 1 و 2 (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. سباق المتاهة: ينظم المعلم سباقًا لحل متاهة التدريب 3 للوصول إلى أداة التفاف النص، ثم يعرض خيارات الالتفاف على جهازه ويسأل الفائزين عن تأثير كل خيار، ويحل التلميذ المتاهة بسرعة، ويشرح الفائز تأثير أحد خيارات الالتفاف؛ كتاب الطالب ص71: «لنتدرب معًا» تدريب 4 (المتاهة) (3 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n3. مهام جماعية: الأنماط والخطوات والالتفاف: يوزع المعلم الأدوار (قارئ، منفذ على الحاسوب، مدقق، مقرر)، ويكلف المجموعات بالتدريب 4 (نمط الصورة) والتدريب 5 (ترقيم خطوات الإدراج من 1 إلى 6) والتدريب 6 (مطابقة الالتفاف بنتيجته)، ويستدعي طالبًا لتجربة النمط على جهاز العرض ليتحقق زملاؤه، وينجز التلميذ المهام مع مجموعته، ويجرب المنفذ الحل على الحاسوب، ويعرض المقرر الإجابات؛ كتاب الطالب ص70 و ص72: «لنتدرب معًا» تدريبا 3 و 5 (6 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n4. غلق: يجيب التلميذ مع مجموعته ويتابع الترتيب (2 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n5. غلق الدرس – مستند حيوانات عمان: يصف الأزواج كيف يدرجون صورة للمها العربية في مستند عن حيوانات عمان، ويحددون المقبض الذي يحافظ على شكلها، ويذكرون سببًا لحماية هذا الحيوان (4 دقائق)\nالاستراتيجيات: الحوار والمناقشة.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): أكمل: لتطبيق أي تنسيق على النص، عليك أولًا أن ........\nالإجابة: تحدده.\n\nس2 (مستوى التطبيق): صحح العبارة: «اضغط مفتاح Enter بعد كل كلمة لفصلها عن الكلمة التي تليها».\nالإجابة: أضغط مفتاح المسافة (Spacebar) بين الكلمات، أما Enter فينشئ سطرًا جديدًا.\n\nس3 (مستوى الاستدلال): تريد جعل صورة خلفية للمستند، أي خيار التفاف تختار؟ وما الذي تراعيه؟\nالإجابة: خلف النص (Behind Text)، مع اختيار صورة فاتحة لا تمنع قراءة النص.\n\n• نشاط علاجي (لمن لم يتقن): يدرج المعلم مع التلميذ صورة من تبويب إدراج (Insert)، ثم يسحبان مقبض الزاوية ومقبض المنتصف ويلاحظان الفرق، ثم يطلب منه تصغير الصورة دون تشويهها.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإعداد صفحة عن موضوع يختارونه فيها صورة مناسبة مقصوصة، ومضاف إليها حدود ونمط، وتوضيح سبب استخدام مقبض الزاوية.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما خيار الالتفاف الذي يجعل النص فوق الصورة وأسفلها فقط؟\nالإجابة: أعلى وأسفل (Top and Bottom).\n\nس2 (مستوى التطبيق): رتّب: إدراج، هذا الجهاز، صور، اختيار الصورة، المستندات، النقر على إدراج.\nالإجابة: إدراج ثم صور ثم هذا الجهاز ثم المستندات ثم اختيار الصورة ثم النقر على إدراج.\n\nس3 (مستوى الاستدلال): صواب أم خطأ مع التعليل: «استخدم دائمًا خطًا أكبر للعنوان من النص العادي الموجود أسفله».\nالإجابة: صواب؛ لأن الخط الأكبر يبرز العنوان ويوضح تنظيم المستند للقارئ.", "notes": "- للطالب: أكمل تدريبات الوحدة 2 – الدرس 4 التي لم تنهها.\n- لولي الأمر: اطلب من ابنك أن يرتب لك خطوات إدراج صورة شفهيًا.\n- تحضير للحصة القادمة: اكتب قائمة بخمس أدوات مدرسية تحتاجها، ولاحظ كيف رتبتها.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/it/?l=5\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}, {"id": "g3-6", "g": "الصف الثالث", "u": "الوحدة الثانية: هيا نكتب", "t": "إنشاء القوائم", "ours": true, "periods": [{"title": "إنشاء القوائم والتكبير والتصغير + معاينة الطباعة وطباعة المستند", "week": "الأسبوع الثامن: 25–29/10/2026م", "ref": "دليل المعلم: ص 75–78، 86  |  كتاب التلميذ: الوحدة 2 – الدرس 5: إنشاء القوائم، والدرس 6 (التدريب 3)", "f": {"outcomes": "1. ينشئ قائمة بالتعداد النقطي (Bullets) وقائمة بالتعداد الرقمي (Numbering) لتنظيم النص (5 دقائق)\n2. يحدد نوع القائمة المناسب لكل موقف (التدريب 3 في الدرس 6) (5 دقائق)\n3. يستخدم شريط التكبير والتصغير (Zoom) ويوضح أنه لا يغير حجم الخط (5 دقائق)\n4. يعاين المستند قبل طباعته باستخدام معاينة الطباعة (Print Preview) (4 دقائق)\n5. يميز بين إعدادات الطباعة: اسم الطابعة، وعدد النسخ، واتجاه الصفحة (التدريب 5) (4 دقائق)\n6. يتذكر خطوات طباعة مستند ويطبع مستندًا منسقًا (التدريب 2 في الدرس 6، والتدريب 1 في الدرس 5) (4 دقائق)\n\nمخرج تعليمي آخر:\n- ينظم أفكاره ومهامه اليومية في قوائم (4 دقائق)\n- يقتصد في الورق والحبر بمعاينة المستند قبل طباعته (4 دقائق)", "levels": "المخرج 1: تطبيق\nالمخرج 2: تحليل\nالمخرج 3: فهم\nالمخرج 4: تطبيق\nالمخرج 5: تحليل\nالمخرج 6: تطبيق\nالمخرج الآخر: تطبيق\nالمخرج الآخر: تقييم", "strategies": "1. التعلم التشاركي\n2. التعلم بالنمذجة\n3. التعلم بالاكتشاف\n4. التعلم التعاوني\n5. التعلم المبني على اللعب", "resources": "1. جهاز الحاسب\n2. جهاز عرض البيانات\n3. السبورة الذكية\n4. الكتاب\n5. أخرى: تطبيق معالج الكلمات Microsoft Word، وملف «قائمة إعادة التدوير.docx» المرفق\n6. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n7. أخرى: تطبيق معالج الكلمات Microsoft Word، وطابعة الصف إن توفرت\n8. أخرى: العرض التفاعلي ومقاطع الفيديو التوضيحية للدرس في منصة أ. عبير اليحمدية", "concepts": "1. تعداد نقطي (Bullets): قائمة تبدأ عناصرها بنقاط أو رموز.\n2. تعداد رقمي (Numbering): قائمة تبدأ عناصرها بأرقام أو أحرف متسلسلة.\n3. التكبير والتصغير (Zoom): تغيير حجم عرض المستند على الشاشة دون تغيير حجم الخط.\n4. طباعة (Print): إخراج المستند على الورق، ونصل إليها من قائمة ملف.\n5. معاينة الطباعة (Print Preview): عرض شكل المستند كما سيظهر بعد الطباعة، وتغييراتها خاصة بالطباعة فقط.\n6. إعدادات الطباعة: اسم الطابعة، وعدد النسخ، واتجاه الصفحة (عمودي أو أفقي)، وحجم الورق.", "warmup": "- يعرض المعلم الشكل النهائي لملف «قائمة إعادة التدوير» ويسأل: ما الاختلافات التي تلاحظها في مظهر النص؟ هل النص على شكل فقرة عادية؟\n- هل سبق أن كتبت قائمة، مثل قائمة مشتريات البقالة أو أدوات المدرسة؟ (5 دقائق)", "procedures": "1. نمذجة: التعداد النقطي والرقمي: يفتح المعلم «قائمة إعادة التدوير.docx» ويكتب العناصر أولًا ثم يحددها ويطبق التعداد النقطي مفكرًا بصوت عالٍ، ثم يحولها إلى تعداد رقمي، وينبه إلى ضرورة تحديد الفقرات قبل التطبيق، ثم ينفذ الطلبة الخطوات معه، ويتابع التلميذ النمذجة، ثم ينشئ قائمة نقطية وأخرى رقمية بتوجيه المعلم؛ كتاب الطالب ص73–74: التعداد النقطي والرقمي (5 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n2. اكتشاف: هل يتغير حجم الخط؟: يطلب المعلم قراءة رقم حجم الخط، ثم تكبير المستند وتصغيره بشريط التكبير والتصغير وزري (+) و(-)، ثم قراءة الرقم مرة أخرى، ويسأل: ماذا تغير؟ ويجرب التلميذ التكبير والتصغير، ويقارن حجم الخط قبل وبعد، ويستنتج أن العرض فقط هو الذي تغير؛ كتاب الطالب ص75: التكبير والتصغير (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. تدريب ثنائي: اختر الإجابة الصحيحة: يطلب المعلم من كل ثنائي حل التدريب 3 من الدرس 6 بعد أن يطبق طالب على جهاز العرض الترقيم على نص غير محدد ثم على نص محدد، ثم يستمع للإجابات، ويحل التلميذ التدريب مع زميله، ويقارن إجابتهما بإجابات ثنائي آخر؛ كتاب الطالب ص78: «لنتدرب معًا» تدريب 2 (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. نمذجة: معاينة الطباعة والطباعة: يفتح المعلم مستند «قائمة إعادة التدوير» المنسق، ثم ملف ← طباعة، ويشرح المعاينة وإعداداتها (اسم الطابعة، عدد النسخ، اتجاه الصفحة) مفكرًا بصوت عالٍ، ويؤكد أن التغييرات تخص الطباعة فقط، ويطبع نسخة إن أمكن، ثم يعاين الطلبة مستنداتهم، ويتابع التلميذ النمذجة، ثم يعاين مستنده ويغير اتجاه الصفحة ليرى أثره بتوجيه المعلم؛ كتاب الطالب ص75–76: معاينة الطباعة وطباعة المستند (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. مهام جماعية: الطباعة: يوزع المعلم الأدوار (قارئ، كاتب، مدقق، مقرر)، ويكلف المجموعات بالتدريب 1 (ملء الفراغات بكلمات: طباعة، حبر، النسخ، ملف، ورق، أفقيًا) والتدريب 2 (ترقيم خطوات الطباعة) والتدريب 5 (مطابقة خيارات الطباعة بوظائفها) مع قراءة المصطلحات الإنجليزية لهم، ويحل التلميذ المهام مع مجموعته، ويعرض المقرر الإجابات، ويصحح الطلبة أخطاءهم؛ كتاب الطالب ص77 و ص79: «لنتدرب معًا» تدريبا 1 و 3 (2 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. غلق: ينظم المعلم سباق متاهة التدريب 4 (إيصال مستند Word إلى الطابعة) (2 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. غلق الدرس – قوائم الضيافة العمانية: تعد المجموعات شفهيًا قائمة نقطية بما يقدم للضيف في عمان كالقهوة والتمر والحلوى، وقائمة رقمية بخطوات استقبال الضيف، وتبرر نوع كل قائمة (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما نوع القائمة التي تبدأ عناصرها بنقاط؟\nالإجابة: قائمة التعداد النقطي (Bullets).\n\nس2 (مستوى التطبيق): لماذا يجب تحديد الفقرات قبل النقر على أيقونة الترقيم؟\nالإجابة: لأن الترقيم يُطبق على النص المحدد فقط.\n\nس3 (مستوى الاستدلال): أي نوع قائمة تختار لكتابة خطوات تحضير عصير؟ ولماذا؟\nالإجابة: قائمة التعداد الرقمي؛ لأن الخطوات مرتبة ويجب تنفيذها بالتسلسل.\n\n• نشاط علاجي (لمن لم يتقن): يكتب المعلم مع التلميذ أسماء ثلاث فواكه في أسطر منفصلة، ثم يحددانها ويطبقان التعداد النقطي ثم الرقمي، ويجربان شريط Zoom، ثم يسأله: أي قائمة تبدأ بنقاط؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإنشاء قائمتين: قائمة رقمية لخطوات تحضير عصير، وقائمة نقطية لأدوات المدرسة، مع تعليل اختيار نوع كل قائمة.\n\nتفريد التعليم (5 دقائق):\nس4 (مستوى المعرفة): من أي قائمة نصل إلى خيارات الطباعة؟\nالإجابة: قائمة ملف (File).\n\nس5 (مستوى التطبيق): ما فائدة معاينة الطباعة؟\nالإجابة: رؤية شكل المستند قبل طباعته لاكتشاف الأخطاء وتجنب هدر الورق والحبر.\n\nس6 (مستوى الاستدلال): هل تؤثر تغييرات المعاينة (مثل اتجاه الصفحة) على المستند الأصلي؟ وضّح.\nالإجابة: لا، فهذه الإعدادات مخصصة للطباعة فقط ولا تغير الملف الفعلي.\n\n• نشاط علاجي (لمن لم يتقن): يكتب المعلم مع التلميذ أسماء ثلاث فواكه في أسطر منفصلة، ثم يحددانها ويطبقان التعداد النقطي ثم الرقمي، ويجربان شريط Zoom، ثم يسأله: أي قائمة تبدأ بنقاط؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بإنشاء قائمتين: قائمة رقمية لخطوات تحضير عصير، وقائمة نقطية لأدوات المدرسة، مع تعليل اختيار نوع كل قائمة.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): صواب أم خطأ: استخدام أداة التكبير والتصغير يغير حجم خط النص.\nالإجابة: خطأ؛ تغير حجم العرض على الشاشة فقط.\n\nس2 (مستوى التطبيق): لترقيم قائمة أسماء التلاميذ في الصف ستستخدم: (أ) قائمة تعداد مدورة (ب) قائمة تعداد مستطيلة (ج) قائمة تعداد رقمي أو بأحرف.\nالإجابة: (ج) قائمة تعداد رقمي أو بأحرف.\n\nس3 (مستوى الاستدلال): حوّل الجملة إلى قائمة: «الفئات الأساسية لإعادة التدوير هي المعادن والبلاستيك والزجاج والأوراق والمواد العضوية».\nالإجابة: أكتب عنوانًا مثل «الفئات الأساسية لإعادة التدوير هي»، ثم أضع كل فئة في سطر مستقل (المعادن، البلاستيك، الزجاج، الأوراق، المواد العضوية) وأحددها وأطبق التعداد النقطي.\n\nأسئلة التقويم الختامي (5 دقائق):\nس4 (مستوى المعرفة): أكمل: تحتاج الطابعة إلى ........ و........ لطباعة المستند.\nالإجابة: حبر، وورق.\n\nس5 (مستوى التطبيق): رتّب خطوات طباعة مستند: زر الطباعة، ملف، طباعة.\nالإجابة: ملف ثم طباعة ثم النقر على زر الطباعة.\n\nس6 (مستوى الاستدلال): تريد طباعة 3 نسخ من شهادة عرضها أكبر من طولها، ما الإعدادان اللذان تغيرهما؟\nالإجابة: عدد النسخ إلى 3، واتجاه الصفحة إلى أفقي.", "notes": "- للطالب: راجع خطوات إنشاء القوائم والتكبير والتصغير في الوحدة 2 – الدرس 5.\n- لولي الأمر: شارك ابنك كتابة قائمة مشتريات مرقمة ليربط الدرس بالحياة.\n- تحضير للحصة القادمة: تذكّر ما الذي تحتاجه الطابعة لتطبع.\n- للطالب: أكمل تدريبات الوحدة 2 – الدرس 6، وراجع خطوات الطباعة.\n- لولي الأمر: إن توفرت طابعة فدع ابنك يعاين مستندًا قبل طباعته بإشرافك.\n- تحضير للحصة القادمة (المشروع): فكّر في طرق يُهدر بها الماء في المنزل والمدرسة ودوّن فكرتين.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/it/?l=6\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}, {"id": "g3-7", "g": "الصف الثالث", "u": "الوحدة الثانية: هيا نكتب", "t": "المشروع", "ours": true, "periods": [{"title": "التخطيط لمقالة ترشيد استهلاك المياه + إنشاء المقالة وتنسيقها + حفظ المقالة وعرضها وتقييمها", "week": "الأسبوع التاسع: 1–5/11/2026م", "ref": "دليل المعلم: ص 89–90  |  كتاب التلميذ: الوحدة 2 – الدرس 7: المشروع (الخطوة 1)", "f": {"outcomes": "1. يناقش مع مجموعته مشكلة شح المياه وطرق هدرها (2 دقيقتان)\n2. يقترح حلولًا لترشيد استهلاك المياه ويدونها في قائمة مرقمة على الورق (4 دقائق)\n3. يخطط مع مجموعته لأجزاء المقالة ويوزع الأدوار (3 دقائق)\n4. ينشئ مقالة في معالج الكلمات تتضمن عنوانًا وفقرة وقائمة وصورًا (3 دقائق)\n5. ينسق النص (نوع الخط، والقوائم، والتمييز) والصور (الحدود، والأنماط، والالتفاف) (4 دقائق)\n6. يؤدي دوره في المجموعة بفاعلية لإنجاز المقالة (3 دقائق)\n7. يحفظ المقالة باسم مناسب بعد كتابة أسماء أفراد المجموعة داخلها (3 دقائق)\n8. يعاين المقالة ويطبعها إن أمكن (2 دقيقتان)\n9. يعرض مقالة مجموعته ويقيم المقالات وفق معايير المشروع (4 دقائق)\n\nمخرج تعليمي آخر:\n- يستمع لأفكار زملائه دون مقاطعة ويحترم آراءهم (3 دقائق)\n- يحافظ على الماء ويوعي أسرته بأهمية ترشيده (2 دقيقتان)\n- يعتز بعمل مجموعته ويتقبل النقد البناء (2 دقائق)", "levels": "المخرج 1: فهم\nالمخرج 2: إبداع\nالمخرج 3: تطبيق\nالمخرج 4: إبداع\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق\nالمخرج 7: تطبيق\nالمخرج 8: تطبيق\nالمخرج 9: تقييم\nالمخرج الآخر: تقييم", "strategies": "1. التعلم المبني على حل المشكلات\n2. التعلم المبني على المشاريع\n3. التعلم التعاوني\n4. التعلم التشاركي\n5. التعلم الذاتي", "resources": "1. الكتاب\n2. جهاز عرض البيانات\n3. صورة توضيحية\n4. الأقلام\n5. أخرى: أوراق تخطيط وبطاقات أدوار\n6. جهاز الحاسب\n7. أخرى: تطبيق معالج الكلمات Microsoft Word، ومجلد صور يجهزه المعلم عن الماء، وبطاقة قائمة تحقق\n8. السبورة الذكية\n9. أخرى: تطبيق معالج الكلمات Microsoft Word، وطابعة الصف إن توفرت، وبطاقات معايير التقييم، وبطاقة «أستطيع أن»\n10. أخرى: العرض التفاعلي ومقاطع الفيديو التوضيحية للدرس في منصة أ. عبير اليحمدية", "concepts": "1. ترشيد استهلاك المياه: استخدام الماء بقدر الحاجة دون إسراف.\n2. شح المياه: قلة الماء المتوفر مقارنة بحاجة الناس إليه.\n3. المقالة: نص قصير له عنوان يعرض أفكارًا حول موضوع واحد.\n4. عنوان المقالة: جملة قصيرة في أعلى المقالة تدل على موضوعها.\n5. تنسيق المقالة: تطبيق أدوات تنسيق النص والصور لجعلها واضحة وجذابة.\n6. حفظ باسم: حفظ المستند باسم يصف محتواه في مكان نختاره.\n7. التقييم بالمعايير: الحكم على العمل وفق بنود محددة مسبقًا.\n8. تطبيقات أخرى لمعالجة الكلمات: تطبيقات غير Microsoft Word يمكن بها تطبيق المهارات نفسها مثل WordPad.", "warmup": "- يعرض المعلم صورة صنبور يتسرب منه الماء ويسأل: ما معنى «ترشيد استهلاك المياه» برأيك؟\n- هل جميع الناس في العالم لديهم مياه نظيفة؟ هل يُهدر الماء في حياتنا اليومية؟ بأي الطرق؟ (5 دقائق)", "procedures": "1. تقديم المشروع وتوزيع الأدوار: يعرض المعلم صفحة المشروع وخطواته الأربع والمنتج النهائي (مقالة عن ترشيد استهلاك المياه) ومعايير تقييمه، ويقسم الطلبة إلى مجموعات ثلاثية بأدوار: كاتب على لوحة المفاتيح، ومراجع يبدي الملاحظات ويساعد في التنسيق، وباحث عن الصور ومنسق لها، ويقرأ التلميذ صفحة المشروع مع مجموعته، ويتعرف دوره ومهامه؛ كتاب الطالب ص80: المشروع – الخطوة 1 (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. تحليل المشكلة واقتراح الحلول: يوجه المجموعات لتحليل المشكلة: أين يُهدر الماء؟ ما أسبابه؟ ما الحلول؟ ويطلب تدوين ثلاثة حلول على الأقل في قائمة مرقمة على الورق كما في المستندات، ويحلل التلميذ المشكلة مع مجموعته، ويقترح حلولًا، ويدونها في قائمة مرقمة؛ كتاب الطالب ص80: المشروع – الخطوة 1 (3 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n3. مخطط المقالة: يطلب المعلم من كل مجموعة إعداد مخطط للمقالة (العنوان، الفقرة، القائمة، الصور المقترحة)، ويستمع لفكرة واحدة من كل مجموعة ويقدم التغذية الراجعة، مؤكدًا الاستماع دون مقاطعة، ويشارك التلميذ في إعداد المخطط، ويعرض المقرر فكرة المجموعة، ويستمع لملاحظات المعلم؛ كتاب الطالب ص80: المشروع (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n4. تنفيذ المقالة: يوجه كل مجموعة للعمل على جهازين: الكاتب يكتب العنوان والفقرة والقائمة، والمراجع يبدي الملاحظات وينسق النص، والباحث يختار الصور من مجلد الصور وينسقها (حدود، نمط، التفاف)، ويتجول المعلم لتقديم النصائح، وينفذ التلميذ دوره: يكتب أو يراجع أو يختار الصور وينسقها، ثم تجمع المجموعة العمل في مستند واحد؛ كتاب الطالب ص80: المشروع – الخطوتان 2 و 3 (4 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n5. تدقيق جماعي بقائمة التحقق: يوزع المعلم قائمة تحقق (عنوان بارز، فقرة، قائمة مرقمة، صورة منسقة، تمييز جزء مهم)، ويطلب من المجموعة التدقيق وإصلاح النواقص، ويدقق التلميذ مع مجموعته كل بند ويصلح ما ينقص؛ كتاب الطالب ص80: المشروع – الخطوة 3 (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.\n\n6. جولة تشاركية: ينظم المعلم جولة تزور فيها كل مجموعة شاشة مجموعة مجاورة لتقديم إشادة واقتراح، ويشاهد التلميذ مقالة مجموعة أخرى، ويقدم إشادة واقتراحًا، ويستقبل ملاحظات زملائه (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.\n\n7. إنهاء المقالة وحفظها: يوجه المجموعات لإضافة أسمائها داخل المستند وحفظه باسم مناسب، ثم معاينته وطباعة بعض المقالات إن توفر الوقت، ويكتب التلميذ الأسماء، ويحفظ الملف باسم يصف محتواه، ويعاين المقالة قبل طباعتها؛ كتاب الطالب ص80: المشروع – الخطوة 4 (2 دقيقتان)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n8. العرض والتقييم التشاركي: ينظم المعلم عرضًا لكل مجموعة (دقيقتان)، ويوزع بطاقات معايير لتقييم الزملاء (عنوان واضح، أفكار مفيدة، تنسيق مناسب، صور مرتبطة)، ويدير النقاش وتبادل الآراء، ويعرض التلميذ مقالة مجموعته، ويقيم مقالات الآخرين بالبطاقة، ويناقش الملاحظات باحترام؛ كتاب الطالب ص80: المشروع (1 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.\n\n9. تقييم ذاتي للوحدة: يوزع المعلم بطاقة «أستطيع أن» (أفتح مستندًا، أنسق النص، أدرج صورة وأنسقها، أنشئ قائمة، أطبع مستندًا)، ثم يعرض صفحة «برامج أخرى» عن تطبيقات معالجة الكلمات الأخرى، ويقيم التلميذ نفسه في كل مهارة بصدق، ويحدد مهارة يحتاج إلى التدرب عليها؛ كتاب الطالب ص82: «في الختام» و ص81: برامج أخرى (1 دقيقتان)\nالاستراتيجيات: التعلم الذاتي.\n\n10. غلق الدرس – حراس الأفلاج: تقترح كل مجموعة طريقة للمحافظة على الماء مستوحاة من نظام الأفلاج العماني الذي يوزع الماء بعدل، وتضيفها إلى قائمتها المرقمة، ثم تقرأ المجموعات مقترحاتها (1 دقيقتان)\nالاستراتيجيات: العصف الذهني.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما معنى ترشيد استهلاك المياه؟\nالإجابة: استخدام الماء بقدر الحاجة دون إسراف أو هدر.\n\nس2 (مستوى التطبيق): اذكر طريقتين يُهدر بهما الماء في الحياة اليومية.\nالإجابة: ترك الصنبور مفتوحًا في أثناء تنظيف الأسنان، وتسرب الماء من الصنابير التالفة.\n\nس3 (مستوى الاستدلال): اقترح حلًا لمشكلة هدر الماء في المدرسة، وبيّن كيف يساعد.\nالإجابة: إغلاق الصنابير جيدًا بعد الاستخدام والإبلاغ عن الصنابير المسربة؛ فيقل الماء المهدر.\n\n• نشاط علاجي (لمن لم يتقن): يناقش المعلم مع التلميذ صورًا لصنبور مفتوح وآخر يتسرب منه الماء، ويكتبان معًا حلين لترشيد استهلاك المياه في قائمة مرقمة، ثم يسأله: ما معنى ترشيد استهلاك المياه؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة عنوان المقالة وفقرة قصيرة عن شح المياه، وإعداد قائمة مرقمة بثلاثة حلول، واقتراح صورة مناسبة لها في معالج الكلمات.\n\nتفريد التعليم (5 دقائق):\nس4 (مستوى المعرفة): ما الأمر الذي تستخدمه لإضافة قائمة مرقمة بطرق الترشيد؟\nالإجابة: التعداد الرقمي (Numbering).\n\nس5 (مستوى التطبيق): كيف تجعل عنوان المقالة بارزًا؟\nالإجابة: بتكبير حجم الخط وجعله غامقًا وتوسيطه وتغيير لونه.\n\nس6 (مستوى الاستدلال): الصورة تغطي جزءًا من نص المقالة، ما الخطأ؟ وكيف تصلحه؟\nالإجابة: اختير التفاف «أمام النص»؛ أحدد الصورة وأختار من التفاف النص «مربع» أو «أعلى وأسفل».\n\n• نشاط علاجي (لمن لم يتقن): يناقش المعلم مع التلميذ صورًا لصنبور مفتوح وآخر يتسرب منه الماء، ويكتبان معًا حلين لترشيد استهلاك المياه في قائمة مرقمة، ثم يسأله: ما معنى ترشيد استهلاك المياه؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة عنوان المقالة وفقرة قصيرة عن شح المياه، وإعداد قائمة مرقمة بثلاثة حلول، واقتراح صورة مناسبة لها في معالج الكلمات.\n\nتفريد التعليم (5 دقائق):\nس7 (مستوى المعرفة): لماذا نكتب أسماء أفراد المجموعة داخل المستند قبل حفظه؟\nالإجابة: لمعرفة أصحاب العمل وحفظ حقهم فيه.\n\nس8 (مستوى التطبيق): اقترح اسمًا مناسبًا لملف مقالتكم.\nالإجابة: مثل «مقالة ترشيد استهلاك المياه – المجموعة 2».\n\nس9 (مستوى الاستدلال): ما الذي تتحقق منه في معاينة الطباعة قبل طباعة المقالة؟\nالإجابة: ظهور العنوان والفقرة والقائمة والصور كاملة ومرتبة في الصفحة، واتجاه الصفحة المناسب، وعدد النسخ.\n\n• نشاط علاجي (لمن لم يتقن): يناقش المعلم مع التلميذ صورًا لصنبور مفتوح وآخر يتسرب منه الماء، ويكتبان معًا حلين لترشيد استهلاك المياه في قائمة مرقمة، ثم يسأله: ما معنى ترشيد استهلاك المياه؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة عنوان المقالة وفقرة قصيرة عن شح المياه، وإعداد قائمة مرقمة بثلاثة حلول، واقتراح صورة مناسبة لها في معالج الكلمات.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما التطبيق الذي ستستخدمه مجموعتك لكتابة المقالة؟\nالإجابة: معالج الكلمات (Microsoft Word).\n\nس2 (مستوى التطبيق): ما الأدوار الثلاثة في مجموعتك؟\nالإجابة: كاتب نص المقالة على لوحة المفاتيح، ومراجع يبدي الملاحظات ويساعد في التنسيق، وباحث عن الصور ومنسق لها.\n\nس3 (مستوى الاستدلال): نظّم أفكار مجموعتك في مخطط من أربعة أجزاء للمقالة.\nالإجابة: عنوان المقالة، ثم فقرة قصيرة عن شح المياه، ثم قائمة مرقمة بطرق الترشيد، ثم صور مناسبة منسقة.\n\nأسئلة التقويم الختامي (5 دقائق):\nس4 (مستوى المعرفة): صواب أم خطأ: يجب أن تكون الصورة المدرجة مرتبطة بموضوع المقالة.\nالإجابة: صواب.\n\nس5 (مستوى التطبيق): اذكر ثلاثة تنسيقات طبقتها مجموعتك على المقالة.\nالإجابة: مثل: تغيير نوع الخط وحجمه، وإنشاء قائمة مرقمة، وتمييز جزء مهم، وإضافة حدود للصورة.\n\nس6 (مستوى الاستدلال): قيّم مقالة مجموعة زميلة وفق معيارين، واقترح تحسينًا.\nالإجابة: مثال: العنوان واضح ومنسق، والصور مرتبطة بالموضوع؛ والتحسين: تحويل الفقرة الطويلة إلى قائمة نقطية.\n\nأسئلة التقويم الختامي (5 دقائق):\nس7 (مستوى المعرفة): اذكر تطبيقًا آخر لمعالجة الكلمات غير Microsoft Word.\nالإجابة: WordPad.\n\nس8 (مستوى التطبيق): ما المهارة التي استخدمتها مجموعتك لتنظيم طرق الترشيد؟ ولماذا؟\nالإجابة: القوائم المرقمة أو النقطية؛ لأنها تنظم الأفكار وتسهل قراءتها.\n\nس9 (مستوى الاستدلال): لو أعدت تنفيذ المشروع، ما الذي ستغيره لتصبح المقالة أكثر جاذبية؟ برر.\nالإجابة: مثل إضافة صورة معبرة بنمط مناسب وتمييز النصيحة الأهم بلون؛ لجذب القارئ وإبراز الفكرة الرئيسة.", "notes": "- للطالب: اقرأ صفحة المشروع في الوحدة 2 – الدرس 7، واحتفظ بورقة أفكار مجموعتك.\n- لولي الأمر: ناقش مع ابنك طرق ترشيد استهلاك الماء في المنزل ليضيف أفكارًا للمقالة.\n- تحضير للحصة القادمة: راجع مهارات تنسيق النص والصور والقوائم.\n- للطالب: راجع خطوات المشروع 2 و 3 في الوحدة 2 – الدرس 7، وفكّر في اسم مناسب لملف مقالتكم.\n- لولي الأمر: اسأل ابنك عن دوره في المجموعة وما أنجزه.\n- تحضير للحصة القادمة: استعد لعرض مقالة مجموعتك في دقيقتين.\n- للطالب: احتفظ بمقالة مجموعتك، وراجع بطاقة «أستطيع أن» وتدرب على المهارة التي تحتاج إليها.\n- لولي الأمر: اطلب من ابنك أن يعرض عليك مقالة مجموعته ويشرح ما تعلمه في الوحدة.\n- تحضير للحصة القادمة (الوحدة الثالثة): فكّر: فيم تستخدم الإنترنت؟ وما المخاطر التي قد تواجهك؟\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/it/?l=7\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}, {"id": "g3-8", "g": "الصف الثالث", "u": "الوحدة الثالثة: عالمي المتصل", "t": "الأمان عبر الإنترنت", "ours": true, "periods": [{"title": "المعلومات الشخصية وقواعد الأمان والاسم المستعار + الفيروسات والإعلانات الاحتيالية وطلب المساعدة", "week": "الأسبوع العاشر: 8–12/11/2026م", "ref": "دليل المعلم: ص 95–98، 100  |  كتاب التلميذ: الوحدة 3 – الدرس 1: الأمان عبر الإنترنت (التدريبان 1 و2)", "f": {"outcomes": "1. يحدد المعلومات الشخصية التي لا يجوز مشاركتها عبر الإنترنت (5 دقائق)\n2. يتبع قواعد الأمان لحماية معلوماته الشخصية في أثناء التصفح والتواصل (5 دقائق)\n3. يميز بين الأسماء المستعارة المناسبة وغير المناسبة ويختار اسمًا مستعارًا آمنًا (التدريبان 1 و 2) (5 دقائق)\n4. يتعرف فيروسات الحاسوب وخطرها، ودور برامج مكافحة الفيروسات (4 دقائق)\n5. يتصرف بأمان عند ظهور إعلانات أو رسائل احتيالية (4 دقائق)\n6. يطابق مشكلات استخدام الإنترنت بحلولها، ويطلب المساعدة من والديه أو معلمه عند الحاجة (التدريبات 3–5) (4 دقائق)\n\nمخرج تعليمي آخر:\n- يستشي
