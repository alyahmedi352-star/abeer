<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173F55">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<title>دفتر التحضير — منصة أ. عبير اليحمدية</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--brand:#173F55;--brand-2:#1F5A78;--brand-3:#0F2C3C;--gold:#D9A64E;--paper:#fff;--bg:#EEF3F7;--chip:#E9F0F6;--line:#D8E2EA;--text:#13324f;--muted:#5f7387;--ok:#2E8B57}
*{box-sizing:border-box}
body{margin:0;font-family:"Cairo",Tahoma,sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
header{background:linear-gradient(135deg,var(--brand-3),var(--brand));color:#fff;padding:calc(18px + env(safe-area-inset-top,0px)) 20px 20px}
header .in{max-width:1100px;margin:auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{margin:0;font-size:1.6rem;font-weight:900}
header p{margin:0;color:#cfe0ec;font-size:.95rem}
header .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:12px;padding:9px 16px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;font-size:.92rem}
.btn.gold{background:var(--gold);color:#2A1C05}.btn.ghost{background:rgba(255,255,255,.14);color:#fff}
.btn.pri{background:var(--brand);color:#fff}.btn.soft{background:var(--chip);color:var(--brand)}
.btn.ok{background:var(--ok);color:#fff}
main{max-width:1100px;margin:auto;padding:18px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:2px solid var(--line);background:var(--paper);border-radius:30px;padding:6px 16px;font:inherit;font-weight:800;color:var(--brand);cursor:pointer}
.tabs button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.unit{margin:18px 0 8px;font-weight:900;color:var(--brand-2)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.lc{background:var(--paper);border-radius:16px;padding:14px;box-shadow:0 4px 14px rgba(15,44,60,.07);cursor:pointer;border:2px solid transparent;display:flex;flex-direction:column;gap:6px}
.lc:hover{border-color:var(--gold)}
.lc b{font-size:1.02rem}
.lc small{color:var(--muted)}
.prog{display:flex;gap:4px;flex-wrap:wrap}
.prog span{font-size:.72rem;background:var(--chip);border-radius:8px;padding:1px 7px;color:var(--muted)}
.prog span.on{background:#DDF2E6;color:#1E7044;font-weight:800}
.plan{display:none}
.plan.open{display:block}
.ph{background:var(--paper);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(15,44,60,.07)}
.ph h2{margin:0 0 4px;font-size:1.35rem;color:var(--brand)}
.ph .meta{color:var(--muted);font-size:.9rem}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.howto{background:#FFF8E8;border:1px dashed var(--gold);border-radius:14px;padding:10px 14px;font-size:.9rem;margin-top:12px}
.sec{background:var(--paper);border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:0 4px 14px rgba(15,44,60,.06)}
.sec .hd{display:flex;align-items:center;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:8px;margin-bottom:10px}
.sec .hd h3{margin:0;font-size:1.12rem;flex:1}
.sec .hd .n{background:var(--brand);color:#fff;border-radius:50%;width:28px;height:28px;display:grid;place-items:center;font-weight:900;font-size:.85rem;flex:none}
.cp{border:0;background:var(--gold);color:#2A1C05;border-radius:10px;padding:6px 12px;font:inherit;font-weight:800;cursor:pointer;font-size:.85rem;white-space:nowrap}
.cp.done{background:var(--ok);color:#fff}
.ed{min-height:60px;border:1px solid var(--line);border-radius:12px;padding:8px 14px;outline:none;background:#FBFDFF}
.ed:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(31,90,120,.12)}
.ed ol,.ed ul{margin:4px 0;padding-right:22px}
.outs .o{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.outs .o .ed{flex:1;min-height:auto;padding:6px 12px}
.outs .o .cp{background:var(--chip);color:var(--brand)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:2px solid var(--line);background:#fff;border-radius:20px;padding:4px 12px;font:inherit;font-size:.86rem;cursor:pointer;color:var(--muted)}
.chips button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:800}
.note{font-size:.82rem;color:var(--muted);margin-top:6px}
.track{display:flex;gap:8px;flex-wrap:wrap}
.track label{display:flex;align-items:center;gap:6px;background:var(--chip);border-radius:12px;padding:6px 10px;cursor:pointer;font-weight:700;font-size:.9rem}
.track label.on{background:#DDF2E6;color:#1E7044}
.track input{width:18px;height:18px;accent-color:var(--ok)}
.track small{font-weight:400;color:var(--muted);font-size:.75rem}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--brand-3);color:#fff;padding:10px 18px;border-radius:14px;font-weight:800;display:none;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.printonly{display:none}
@media (max-width:640px){header h1{font-size:1.3rem}.sec .hd{flex-wrap:wrap}}
@media print{
 header,.tabs,.acts,.howto,.cp,#list,.track-sec,#toast,#abr-fab{display:none!important}
 body{background:#fff}main{padding:0}.sec,.ph{box-shadow:none;border:1px solid #bbb;break-inside:avoid;border-radius:8px}
 .ed{border:0;padding:0;background:#fff}.chips button:not(.on){display:none}.chips button.on{background:#fff;color:#000;border-color:#999}
 .printonly{display:block}.note{display:none!important}
}
</style>
</head>

<script>
(function(){
const PL=JSON.parse(document.getElementById('plans').textContent);
const LV=["التذكُّر", "التقييم", "الإبداع"], ST=["الفصل المقلوب", "التعلم التعاوني", "التعلم التشاركي", "التعلم الذاتي", "التعلم بالاكتشاف", "التعلم المبني على حل المشكلات", "التعلم المبني على المشاريع", "التعلم المبني على اللعب", "التعلم بالنمذجة", "التعلم المتمايز", "الخرائط الذهنية", "العصف الذهني", "رحلات تعليمية", "رحلات تعليمية افتراضية", "تجارب معملية", "تجارب معملية افتراضية", "تقارير كتب", "دراسة حالة", "أخرى"], RS=["الكتاب", "كتب الكترونية", "السبورة التقليدية", "السبورة الذكية", "الأقلام", "جهاز عرض البيانات", "جهاز الحاسب", "صورة توضيحية", "عروض تقديمية", "نماذج مجسمة", "الوسائط المتعددة (سمعية - بصرية)", "الوسائط الاجتماعية", "برمجيات /تطبيقات مثل Edpuzzle, Padlet, Kahoot", "أخرى"];
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem('tahdeer.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('tahdeer.'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('tahdeer.'+k)}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2600)}
const SECS={'الصف الأول':['أول/1','أول/2','أول/3','أول/4','أول/5'],'الصف الثالث':['ثالث/1','ثالث/2','ثالث/3','ثالث/4','ثالث/5']};
function data(id){const base=PL.find(p=>p.id===id);const ed=LS.get('p.'+id,null);return Object.assign(JSON.parse(JSON.stringify(base)),ed||{})}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
let grade=LS.get('grade','all');
function renderList(){
 $('#tabs').innerHTML=[['all','الكل'],['الصف الأول','الصف الأول'],['الصف الثالث','الصف الثالث']].map(([k,t])=>`<button class="${grade===k?'on':''}" data-g="${k}">${t}</button>`).join('');
 $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{grade=b.dataset.g;LS.set('grade',grade);renderList()});
 let h='',lastU='';
 PL.filter(p=>grade==='all'||p.g===grade).forEach(p=>{
  const u=p.g+' — '+p.u; if(u!==lastU){if(lastU)h+='</div>';h+=`<div class="unit">${u}</div><div class="list">`;lastU=u}
  const tr=LS.get('t.'+p.id,{}); const secs=SECS[p.g];
  h+=`<div class="lc" data-id="${p.id}"><b>${p.t}</b><small>${LS.get('p.'+p.id,null)?'✏️ معدَّل • ':''}نُشر في نور: ${secs.filter(s=>tr[s]).length} من ${secs.length} شعب</small><div class="prog">${secs.map(s=>`<span class="${tr[s]?'on':''}">${s}</span>`).join('')}</div></div>`;
 });
 if(lastU)h+='</div>';
 $('#cards').innerHTML=h;
 $('#cards').querySelectorAll('.lc').forEach(c=>c.onclick=()=>{location.hash=c.dataset.id});
}
function chips(name,all,sel){return `<div class="chips" data-f="${name}">${all.map(o=>`<button type="button" class="${sel.includes(o)?'on':''}">${esc(o)}</button>`).join('')}</div>`}
function sec(n,title,body,copyKey,extra){return `<div class="sec"><div class="hd"><span class="n">${n}</span><h3>${title}</h3>${copyKey?`<button class="cp" data-c="${copyKey}">📋 نسخ للصق في نور</button>`:''}</div>${body}${extra||''}</div>`}
function renderPlan(id){
 const p=data(id); const tr=LS.get('t.'+id,{});
 let h=`<div class="ph"><div class="printonly" style="font-weight:800;color:#173F55">تحضير درس — إعداد: أ. عبير صالح اليحمدية • مدرسة مزن المعرفة للصفوف (1-4)</div><h2>${p.t}</h2><div class="meta">كتاب: تقنية المعلومات — ${p.g} • ${p.u}</div>
  <div class="acts"><button class="btn soft" id="back">→ كل الدروس</button><button class="btn pri" id="save">💾 حفظ تعديلاتي</button><button class="btn soft" id="reset">↺ النسخة الأصلية</button><button class="btn soft" id="print">🖨️ طباعة / PDF</button><a class="btn gold" href="https://lms.moe.gov.om/teacher/courses" target="_blank" rel="noopener">فتح نور ↗</a></div>
  <div class="howto">💡 <b>طريقة النقل إلى نور:</b> افتحي «إضافة تحضير» في نور بجانب هذه الصفحة. انقري «نسخ» على كل حقل هنا، ثم انقري داخل الحقل المقابل في نور واضغطي <b>Ctrl+V</b>. القوائم (المستوى، الاستراتيجيات، المصادر) اختاريها في نور كما هي محدّدة هنا. يمكنك تعديل أي نص بالنقر عليه.</div></div>`;
 h+=sec(1,'العنوان',`<div class="ed" contenteditable data-f="t">${esc(p.t)}</div>`,'t');
 h+=sec(2,'المخرجات التعليمية',`<div class="outs">${p.outs.map((o,i)=>`<div class="o"><div class="ed" contenteditable data-o="${i}">${esc(o)}</div><button class="cp" data-c="o${i}">نسخ</button></div>`).join('')}</div><div class="note">في نور: الصقي المخرج الأول، ثم «إضافة مخرج تعليمي آخر» للباقي. أو انسخيها كلها مرة واحدة.</div>`,'outs');
 h+=sec(3,'المستوى',chips('lvl',LV,p.lvl)+'<div class="note">انقري لتحديد أو إلغاء — واختاري نفس المحدّد في نور.</div>');
 h+=sec(4,'الاستراتيجيات',chips('strat',ST,p.strat));
 h+=sec(5,'المصادر التعليمية',chips('res',RS,p.res));
 h+=sec(6,'المفاهيم',`<div class="ed" contenteditable data-f="concepts">${Array.isArray(p.concepts)?'<ul>'+p.concepts.map(c=>'<li>'+esc(c)+'</li>').join('')+'</ul>':p.concepts}</div>`,'concepts');
 h+=sec(7,'التهيئة / التمهيد / التعلم القبلي',`<div class="ed" contenteditable data-f="tam">${p.tam}</div>`,'tam');
 h+=sec(8,'إجراءات سير الدرس / الأنشطة التدريسية',`<div class="ed" contenteditable data-f="steps">${p.steps}</div>`,'steps');
 h+=sec(9,'التقويم التكويني',`<div class="ed" contenteditable data-f="form">${p.form}</div>`,'form');
 h+=sec(10,'التقويم الختامي',`<div class="ed" contenteditable data-f="summ">${p.summ}</div>`,'summ');
 h+=sec(11,'ملاحظات ضمن خطة الدراسة الأسبوعية (يشاهدها الطالب وولي الأمر)',`<div class="ed" contenteditable data-f="week">${p.week}</div>`,'week');
 h+=`<div class="sec track-sec"><div class="hd"><span class="n">✓</span><h3>متابعة النشر في نور</h3></div><div class="track">${SECS[p.g].map(s=>`<label class="${tr[s]?'on':''}"><input type="checkbox" data-s="${s}" ${tr[s]?'checked':''}>${s}${tr[s]?`<small>${tr[s]}</small>`:''}</label>`).join('')}</div><div class="note">ضعي علامة بعد حفظ التحضير في نور لكل شعبة، ليظهر التقدّم في قائمة الدروس.</div></div>`;
 $('#plan').innerHTML=h; $('#plan').classList.add('open'); $('#list').style.display='none'; window.scrollTo(0,0);
 $('#plan').querySelectorAll('.chips button').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
 $('#plan').querySelectorAll('.cp').forEach(b=>b.onclick=()=>copy(b));
 $('#plan').querySelectorAll('.track input').forEach(c=>c.onchange=()=>{const t=LS.get('t.'+id,{});if(c.checked)t[c.dataset.s]=new Date().toLocaleDateString('ar-OM');else delete t[c.dataset.s];LS.set('t.'+id,t);renderPlan(id)});
 $('#back').onclick=()=>{history.pushState('',document.title,location.pathname);show()};
 $('#save').onclick=()=>{LS.set('p.'+id,collect());toast('حُفظت تعديلاتك على هذا الجهاز ✓')};
 $('#reset').onclick=()=>{if(confirm('إرجاع التحضير إلى النسخة الأصلية؟ ستُحذف تعديلاتك.')){LS.del('p.'+id);renderPlan(id);toast('أُرجعت النسخة الأصلية')}};
 $('#print').onclick=()=>window.print();
}
function collect(){
 const o={};$('#plan').querySelectorAll('.ed[data-f]').forEach(e=>{o[e.dataset.f]=e.dataset.f==='t'?e.textContent.trim():e.innerHTML});
 o.outs=[...$('#plan').querySelectorAll('.ed[data-o]')].map(e=>e.textContent.trim()).filter(Boolean);
 $('#plan').querySelectorAll('.chips').forEach(c=>{o[c.dataset.f]=[...c.querySelectorAll('button.on')].map(b=>b.textContent)});
 return o;
}
async function copy(btn){
 const k=btn.dataset.c; let html='',text='';
 if(k==='outs'){const a=[...document.querySelectorAll('.ed[data-o]')].map(e=>e.textContent.trim());text=a.map((x,i)=>(i+1)+'. '+x).join('\n');html=text.replace(/\n/g,'<br>')}
 else if(k[0]==='o'&&k!=='outs'){const e=document.querySelector(`.ed[data-o="${k.slice(1)}"]`);text=e.textContent.trim();html=esc(text)}
 else{const e=document.querySelector(`.ed[data-f="${k}"]`);html=e.innerHTML;text=e.innerText.trim()}
 let ok=false;
 try{ if(navigator.clipboard&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})]);ok=true} }catch(e){}
 if(!ok){ const d=document.createElement('div');d.contentEditable='true';d.style.cssText='position:fixed;left:-9999px;top:0';d.innerHTML=html;document.body.appendChild(d);const r=document.createRange();r.selectNodeContents(d);const s=getSelection();s.removeAllRanges();s.addRange(r);try{ok=document.execCommand('copy')}catch(e){}s.removeAllRanges();d.remove(); }
 if(ok){const t=btn.textContent;btn.classList.add('done');btn.textContent='✓ نُسخ';setTimeout(()=>{btn.classList.remove('done');btn.textContent=t},1600);toast('نُسخ — الصقيه في نور بـ Ctrl+V')}else toast('تعذّر النسخ، حدّدي النص وانسخيه يدويًّا');
}
function show(){const id=location.hash.slice(1);if(id&&PL.find(p=>p.id===id))renderPlan(id);else{$('#plan').classList.remove('open');$('#list').style.display='';renderList()}}
window.addEventListener('hashchange',show);show();
})();
</script>
