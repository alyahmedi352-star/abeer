ر والديه قبل التسجيل في أي موقع أو تطبيق (4 دقائق)\n- يتحلى بالحذر والمسؤولية عند استخدام الإنترنت (4 دقائق)", "levels": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تحليل\nالمخرج 4: فهم\nالمخرج 5: تطبيق\nالمخرج 6: تطبيق\nالمخرج الآخر: تطبيق\nالمخرج الآخر: تقييم", "strategies": "1. الحوار والمناقشة\n2. التعلم بالاكتشاف\n3. التعلم الذاتي\n4. التعلم المبني على حل المشكلات\n5. التعلم التعاوني\n6. التعلم المبني على اللعب", "resources": "1. الكتاب\n2. جهاز عرض البيانات\n3. السبورة الذكية\n4. أخرى: بطاقات أسماء مستعارة للتصنيف، وبطاقة «اسمي المستعار»\n5. صورة توضيحية\n6. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n7. أخرى: صورة لإعلان جائزة وهمي ورسالة بريد احتيالية، وبطاقات مواقف\n8. أخرى: العرض التفاعلي ومقاطع الفيديو التوضيحية للدرس في منصة أ. عبير اليحمدية", "concepts": "1. المعلومات الشخصية: معلومات تدل علينا مثل الاسم الكامل، والعنوان، ورقم الهاتف، وتاريخ الميلاد، وكلمة المرور.\n2. قواعد الأمان (Safety Rules): قواعد نتبعها لحماية أنفسنا وأجهزتنا عند استخدام الإنترنت.\n3. الاسم المستعار: اسم غير حقيقي نستخدمه عبر الإنترنت لا يكشف معلوماتنا.\n4. فيروسات الحاسوب (Computer Viruses): برامج خاصة ضارة يمكنها إتلاف أجهزة الحاسوب وسرقة الملفات والمعلومات.\n5. برنامج مكافحة الفيروسات (Antivirus): برنامج يكتشف الفيروسات ويزيلها من جهاز الحاسوب.\n6. الإعلان الاحتيالي: إعلان يدّعي فوزك بجائزة ليدفعك إلى الضغط عليه.", "warmup": "- يطرح المعلم أسئلة أحمد في كتاب التلميذ: فيمَ تستخدم الإنترنت؟ ما المخاطر التي يمكن أن تتعرض لها عند استخدامه؟ هل تعرف كيف تتجنبها؟ (5 دقائق)", "procedures": "1. حوار: المعلومات الشخصية وقواعد الأمان: يحاور الطلبة حول المشكلات التي نواجهها عند التصفح، ويوضح من كتاب التلميذ المعلومات الشخصية التي لا نشاركها (الاسم، اسم العائلة، العنوان، رقم الهاتف)، ويؤكد الحذر من الغرباء، ويحاور التلميذ ويذكر أمثلة لمعلومات شخصية ويقترح قواعد لحمايتها؛ كتاب الطالب ص88–89: المعلومات الشخصية (3 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. اكتشاف: الاسم المستعار الآمن: يعرض المعلم أسماء مستعارة مثل «سالم_الحارثي_2016» و«نجمة_الفضاء» و«حي_الخوير_9» و«برتقالة_سعيدة»، ويطلب تصنيفها إلى آمن وغير آمن واستنتاج صفات الاسم المستعار الجيد، ويصنف التلميذ الأسماء مع زميله ويستنتج أن الاسم الآمن لا يكشف الاسم الحقيقي أو المكان أو الأرقام الشخصية؛ كتاب الطالب ص90: حماية معلوماتك الشخصية والاسم المستعار (4 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n3. تطبيق مستقل: التدريبان 1 و 2: يطلب المعلم حل التدريب 1 (ملء الفراغات) والتدريب 2 (مطابقة العبارات بالفئة)، ثم يكتب كل طالب اسمًا مستعارًا آمنًا لنفسه ويتحقق منه بالصفات المستنتجة، ويحل التلميذ التدريبين بمفرده، ويكتب اسمه المستعار ويتأكد أنه آمن؛ كتاب الطالب ص93: «لنتدرب معًا» تدريبا 1 و 2 (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. بطاقات المواقف الخطرة: يوزع المعلم على المجموعات مواقف (إعلان جائزة، رسالة بريد من مجهول فيها مرفق، شخص غريب يطلب المقابلة أو يوجه كلامًا غير لائق)، ويطلب اقتراح التصرف الآمن، ثم يشرح الفيروسات وبرامج مكافحتها وأهمية إخبار الوالدين أو المعلم، ويحلل التلميذ الموقف مع مجموعته، ويقترح التصرف الآمن، ويعرضه؛ كتاب الطالب ص91–92: فيروسات الحاسوب وقواعد الأمان (4 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n5. مهام جماعية: التدريبات 3 و 4 و 5: يوزع المعلم الأدوار (قارئ، كاتب، مدقق، مقرر)، ويكلف المجموعات بالتدريب 3 (صواب وخطأ) والتدريب 4 (مطابقة المشكلة بالحل) والتدريب 5 (اختيار الإجابة الصحيحة)، ويناقش أن المعلم مصدر ثقة مع عدم مشاركة المعلومات الشخصية وكلمات المرور إلا مع الوالدين، وينجز التلميذ التدريبات مع مجموعته، ويعرض المقرر الإجابات ويشارك في النقاش؛ كتاب الطالب ص94–95: «لنتدرب معًا» تدريبات 3 و 4 و 5 (4 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. غلق الدرس – أمين على معلوماتي: يمثل الأزواج موقفًا يطلب فيه غريب عبر لعبة إلكترونية الاسم والمدرسة والعنوان، فيرفض الطالب بأدب، ويربط الصف ذلك بقيمة الحذر والأمانة التي يربي عليها البيت العماني (2 دقيقتان)\nالاستراتيجيات: لعب الأدوار.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اذكر معلومتين شخصيتين لا تشاركهما عبر الإنترنت.\nالإجابة: عنوان المنزل ورقم الهاتف (أو الاسم الكامل وتاريخ الميلاد).\n\nس2 (مستوى التطبيق): لماذا نستخدم اسمًا مستعارًا عند تصفح الإنترنت؟\nالإجابة: لحماية هويتنا؛ فاستخدام الاسم الحقيقي يسهل على المتسلل جمع المعلومات عنا.\n\nس3 (مستوى الاستدلال): أي الاسمين أنسب: «خالد_البلوشي_2017» أم «صقر_الجبل»؟ ولماذا؟\nالإجابة: «صقر_الجبل»؛ لأن الأول يكشف الاسم الحقيقي وسنة الميلاد.\n\n• نشاط علاجي (لمن لم يتقن): يفرز المعلم مع التلميذ بطاقات معلومات (اللون المفضل، وعنوان المنزل، ورقم الهاتف، والهواية) إلى «أشاركها» و«لا أشاركها» عبر الإنترنت، ثم يسأله: هل أشارك رقم هاتفي؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باقتراح ثلاثة أسماء مستعارة آمنة لا تكشف الاسم الحقيقي أو العمر، وكتابة ثلاث قواعد أمان لحماية المعلومات الشخصية.\n\nتفريد التعليم (5 دقائق):\nس4 (مستوى المعرفة): ما البرنامج الذي يحمي الحاسوب من الفيروسات؟\nالإجابة: برنامج مكافحة الفيروسات (Antivirus).\n\nس5 (مستوى التطبيق): ظهر لك إعلان يقول إنك ربحت مبلغًا ماليًا، ماذا تفعل؟\nالإجابة: أتجاهل الإعلان وأغلق نافذته ولا أضغط عليه.\n\nس6 (مستوى الاستدلال): لماذا ينشر بعض الأشخاص إعلانات الجوائز الوهمية على الإنترنت؟\nالإجابة: لخداع المستخدم ليضغط عليها فيُثبَّت فيروس على حاسوبه لسرقة الملفات والمعلومات أو إحداث خلل في الجهاز.\n\n• نشاط علاجي (لمن لم يتقن): يفرز المعلم مع التلميذ بطاقات معلومات (اللون المفضل، وعنوان المنزل، ورقم الهاتف، والهواية) إلى «أشاركها» و«لا أشاركها» عبر الإنترنت، ثم يسأله: هل أشارك رقم هاتفي؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين باقتراح ثلاثة أسماء مستعارة آمنة لا تكشف الاسم الحقيقي أو العمر، وكتابة ثلاث قواعد أمان لحماية المعلومات الشخصية.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أكمل: استخدم دائمًا ........ بدلًا من اسمك الحقيقي.\nالإجابة: اسمًا مستعارًا.\n\nس2 (مستوى التطبيق): صنّف إلى مناسب وغير مناسب: اسم شخصيتي الكرتونية المفضلة، عنواني، اسم فاكهتي المفضلة، اسمي الحقيقي.\nالإجابة: مناسب: اسم الشخصية الكرتونية واسم الفاكهة. غير مناسب: العنوان والاسم الحقيقي.\n\nس3 (مستوى الاستدلال): طلب منك موقع ألعاب كتابة اسمك الكامل ورقم هاتفك للتسجيل، ماذا تفعل؟\nالإجابة: لا أكتب معلوماتي الشخصية، وأستشير والديّ قبل التسجيل، وأستخدم اسمًا مستعارًا إن سمحا بذلك.\n\nأسئلة التقويم الختامي (5 دقائق):\nس4 (مستوى المعرفة): اختر السؤال الذي لا يجب أن تجيب عنه في محادثة عبر الإنترنت: (أ) ما فرقتك الموسيقية المفضلة؟ (ب) أين تقيم؟ (ج) ما الوقت الآن؟\nالإجابة: (ب) أين تقيم؟\n\nس5 (مستوى التطبيق): ماذا تفعل إذا ظهرت لك صفحة غريبة في أثناء التصفح؟\nالإجابة: أبلغ والديّ (أو معلمي).\n\nس6 (مستوى الاستدلال): طلب منك صديق تعرفت إليه عبر الإنترنت مقابلتك، ما التصرف الصحيح؟\nالإجابة: لا أقابله إلا بعلم والديّ التام ومرافقتهما لي، وإن شعرت بعدم الارتياح أقطع الاتصال به وأخبر والديّ.", "notes": "- للطالب: راجع قواعد الأمان والاسم المستعار في الوحدة 3 – الدرس 1، واطلع على صفحة «هل تذكر» في بداية الوحدة.\n- لولي الأمر: اتفق مع ابنك على اسم مستعار آمن، وتابع المواقع التي يسجل فيها.\n- تحضير للحصة القادمة: هل سمعت عن فيروسات الحاسوب؟ اسأل والديك عنها.\n- للطالب: راجع موضوع الفيروسات وقواعد التواصل الآمن في الوحدة 3 – الدرس 1، وأكمل التدريبات 3–5.\n- لولي الأمر: تأكد من تثبيت برنامج مكافحة الفيروسات في حاسوب المنزل، وشجع ابنك على إخبارك بأي رسالة أو صفحة غريبة.\n- تحضير للحصة القادمة: ما المتصفح الذي تستخدمه أسرتك لتصفح الإنترنت؟\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/it/?l=8\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}, {"id": "g3-9", "g": "الصف الثالث", "u": "الوحدة الثالثة: عالمي المتصل", "t": "البحث عن المعلومات", "ours": true, "periods": [{"title": "متصفح الإنترنت ومكونات واجهته + البحث باستخدام محرك البحث جوجل + التبويب الجديد وتصفح موقع ويب", "week": "الأسبوع الحادي عشر: 15–19/11/2026م", "ref": "دليل المعلم: ص 103–107  |  كتاب التلميذ: الوحدة 3 – الدرس 2: البحث عن المعلومات (متصفح الإنترنت وواجهته)", "f": {"outcomes": "1. يعرّف متصفح الإنترنت ويذكر أمثلة عليه (2 دقيقتان)\n2. يفتح متصفح جوجل كروم ويتعرف مكونات واجهته: شريط العنوان، والتبويبات، وزر الرجوع، وزر التحديث، وشريط التمرير (4 دقائق)\n3. يميز بين متصفح الإنترنت ومحرك البحث (4 دقائق)\n4. يستخدم محرك البحث جوجل للبحث عن معلومات بكلمة رئيسة (3 دقائق)\n5. يختار كلمات بحث دقيقة تحقق هدفه من البحث (3 دقائق)\n6. يتصفح نتائج البحث ويختار منها ما يناسب موضوعه (التدريب 1: المتاحف في سلطنة عُمان) (4 دقائق)\n7. يفتح تبويبًا جديدًا (New Tab) ويغلقه (3 دقائق)\n8. يكتب عنوان موقع كاملًا في شريط العنوان ويقارن ذلك بكتابة كلمة بحث (2 دقيقتان)\n9. يتنقل داخل موقع ويب باستخدام الفأرة وشريط التمرير والأسهم (التدريب 2) (4 دقائق)\n\nمخرج تعليمي آخر:\n- يستخدم الإنترنت لأغراض نافعة بإشراف الكبار (2 دقيقتان)\n- يعتز بتراث سلطنة عُمان ومتاحفها (2 دقيقتان)\n- يعتز بالمعالم الدينية والحضارية في سلطنة عُمان (2 دقائق)", "levels": "المخرج 1: تذكر\nالمخرج 2: فهم\nالمخرج 3: تحليل\nالمخرج 4: تطبيق\nالمخرج 5: تقييم\nالمخرج 6: تحليل\nالمخرج 7: تطبيق\nالمخرج 8: تحليل\nالمخرج 9: تطبيق\nالمخرج الآخر: تطبيق\nالمخرج الآخر: تقييم", "strategies": "1. التعلم التشاركي\n2. التعلم بالاكتشاف\n3. التعلم بالنمذجة\n4. الفصل المقلوب\n5. التعلم التعاوني\n6. التعلم المبني على اللعب", "resources": "1. جهاز الحاسب\n2. جهاز عرض البيانات\n3. الكتاب\n4. أخرى: متصفح جوجل كروم Google Chrome، وورقة عمل بصورة واجهة المتصفح\n5. أخرى: متصفح جوجل كروم Google Chrome، وكلمات البحث التي أعدها الطلبة في المنزل\n6. السبورة الذكية\n7. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n8. أخرى: متصفح جوجل كروم Google Chrome، وموقع جامع السلطان قابوس الأكبر\n9. أخرى: العرض التفاعلي ومقاطع الفيديو التوضيحية للدرس في منصة أ. عبير اليحمدية", "concepts": "1. متصفح الإنترنت (Internet Browser): برنامج نستخدمه لعرض مواقع الإنترنت، مثل جوجل كروم ومايكروسوفت إيدج.\n2. محرك البحث (Search Engine): موقع يبحث عن المعلومات ويعرض قائمة بالنتائج، مثل جوجل.\n3. شريط العنوان (Address Bar): المكان الذي نكتب فيه عنوان الموقع.\n4. الكلمة الرئيسة: كلمة أو عبارة نكتبها في محرك البحث لنحصل على نتائج مرتبطة بها.\n5. نتائج البحث: قائمة المواقع التي يعرضها محرك البحث بعد البحث.\n6. جوجل (Google): أكثر محركات البحث استخدامًا.\n7. تبويب جديد (New Tab): صفحة إضافية في المتصفح نفتحها بالنقر على علامة (+) لزيارة موقع آخر في الوقت نفسه.\n8. عنوان الموقع: العنوان الكامل الذي نكتبه في شريط العنوان لزيارة الموقع مباشرة، مثل https://sultanqaboosgrandmosque.com\n9. شريط التمرير: شريط ننتقل به إلى أعلى الصفحة وأسفلها.", "warmup": "- يسأل المعلم: كيف تحصل على معلومات عن الحضارة العمانية؟ ما متصفح الإنترنت؟ هل سبق أن استخدمت محركات البحث؟ ما محركات البحث التي تعرفها؟ (5 دقائق)", "procedures": "1. اكتشاف أيقونات المتصفحات ومحركات البحث: يطلب المعلم تشغيل الأجهزة واستكشاف الأيقونات وملاحظة أيقونات المتصفحات ومحركات البحث في كتاب التلميذ وتصنيفها: متصفح أم محرك بحث؟ ويستكشف التلميذ الأيقونات ويصنفها ويستنتج الفرق بين المتصفح ومحرك البحث؛ كتاب الطالب ص96: متصفح الإنترنت (2 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. نمذجة: فتح جوجل كروم وواجهته: يفتح المعلم جوجل كروم باتباع خطوات كتاب التلميذ مفكرًا بصوت عالٍ، ويشرح شريط العنوان والتبويب وأزرار الرجوع والتقدم والتحديث وشريط التمرير، ثم يوجه الطلبة لاستخدام زر الرجوع وشريط التمرير، ويتابع التلميذ النمذجة، ثم يفتح المتصفح ويجرب أزراره بتوجيه المعلم؛ كتاب الطالب ص97: فتح متصفح الإنترنت وواجهته (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تسمية ثنائية لأجزاء الواجهة: يوزع المعلم ورقة عمل بصورة واجهة المتصفح، ويطلب من كل ثنائي كتابة أسماء الأجزاء، ثم يتبادل الثنائيات الأوراق للتصحيح، ويسمي التلميذ الأجزاء مع زميله، ويصحح ورقة ثنائي آخر ويناقش الاختلاف؛ كتاب الطالب ص97: أجزاء واجهة المتصفح (2 دقيقتان)\nالاستراتيجيات: التعلم التشاركي.\n\n4. مناقشة كلمات البحث المعدة مسبقًا: يناقش المعلم الكلمات المدونة ويسأل: أي الكلمات أدق؟ لماذا؟ ويوجه لتحسين الكلمات العامة، ويقارن كلماته بكلمات زملائه ويحسنها لتصبح أدق؛ كتاب الطالب ص98: محرك البحث (2 دقيقتان)\nالاستراتيجيات: الفصل المقلوب.\n\n5. نمذجة: البحث عن الحضارة العمانية: يبحث المعلم في جوجل عن «الحضارة العمانية» مفكرًا بصوت عالٍ، ويسأل: هل ترى النتائج المقترحة أثناء الكتابة؟ كم نتيجة تظهر في الصفحة الأولى؟ ثم يزور موقع omanportal.gov.om، ثم ينفذ الطلبة البحث نفسه، ويتابع التلميذ النمذجة، ثم يبحث بنفسه ويعد النتائج في الصفحة الأولى؛ كتاب الطالب ص98–99: محرك البحث جوجل (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n6. مهمة جماعية: التدريب 1: يوزع المعلم الأدوار (باحث على الحاسوب، قارئ للنتائج، كاتب، مقرر)، ويكلف المجموعات بالبحث عن «المتاحف في سلطنة عُمان» وكتابة ثلاثة منها، والتمرير لأسفل وعد صفحات النتائج، ثم عرض النتائج، ويبحث التلميذ مع مجموعته، ويكتب أسماء ثلاثة متاحف، ويعرض المقرر ما توصلت إليه المجموعة؛ كتاب الطالب ص99: «استخدم محرك البحث جوجل» (3 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n7. نمذجة: تبويب جديد وكتابة العنوان: يفتح المعلم تبويبًا جديدًا بالنقر على (+) مفكرًا بصوت عالٍ، ويكتب العنوان الكامل https://sultanqaboosgrandmosque.com في شريط العنوان، ثم يغلق تبويبًا بالنقر على (X)، ثم ينفذ الطلبة الخطوات معه، ويتابع التلميذ النمذجة، ثم يفتح تبويبًا جديدًا ويكتب العنوان بدقة ويغلق تبويبًا بتوجيه المعلم؛ كتاب الطالب ص100–101: فتح علامة تبويب جديدة (2 دقيقتان)\nالاستراتيجيات: التعلم بالنمذجة.\n\n8. اكتشاف: تصفح الموقع (التدريب 2): يوجه الطلبة لتنفيذ التدريب 2: التمرير لأعلى ولأسفل، واستخدام الأسهم للتنقل في الجامع، والنقر على «معلومات عامة»، ثم يطرح: هل لاحظت اختلافًا عند كتابة عنوان الموقع بدلًا من كلمة؟ هل يمكن فتح أكثر من تبويب؟ ماذا يحدث عند النقر على زر الرجوع؟ ويتصفح التلميذ الموقع ويجرب الأسهم والتمرير، ويجيب عن الأسئلة مما اكتشفه؛ كتاب الطالب ص103: «لنتدرب معًا» تدريب 2 (تصفّح الموقع) (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n9. غلق الدرس – باحثون عن قلعة: تتنافس المجموعات في تحديد مكونات المتصفح التي تستخدمها للبحث عن معلومة عن قلعة بهلاء كشريط العنوان والتبويبات، وتقترح كلمات البحث المناسبة (1 دقيقتان)\nالاستراتيجيات: التعلم المبني على اللعب.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): اذكر اسم متصفح إنترنت.\nالإجابة: جوجل كروم (أو مايكروسوفت إيدج).\n\nس2 (مستوى التطبيق): ما وظيفة شريط العنوان؟\nالإجابة: كتابة عنوان الموقع للانتقال إليه.\n\nس3 (مستوى الاستدلال): ما الفرق بين متصفح الإنترنت ومحرك البحث؟\nالإجابة: المتصفح برنامج نعرض به مواقع الإنترنت مثل جوجل كروم، ومحرك البحث موقع يبحث عن المعلومات ويعرض قائمة بالنتائج مثل جوجل.\n\n• نشاط علاجي (لمن لم يتقن): يفتح المعلم جوجل كروم مع التلميذ ويشيران إلى شريط العنوان والتبويبات وزر الرجوع وزر التحديث وشريط التمرير ويجربانها، ثم يسأله: أين نكتب عنوان الموقع؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بشرح الفرق بين المتصفح ومحرك البحث بمثال، ثم البحث في جوجل عن معلومة يحددها المعلم وفتح النتيجة في تبويب جديد.\n\nتفريد التعليم (5 دقائق):\nس4 (مستوى المعرفة): ماذا يعرض محرك البحث بعد كتابة كلمة البحث؟\nالإجابة: قائمة بالنتائج (المواقع) المرتبطة بالكلمة.\n\nس5 (مستوى التطبيق): أيهما أدق للبحث عن متاحف عُمان: «متاحف» أم «المتاحف في سلطنة عُمان»؟ ولماذا؟\nالإجابة: الثانية؛ لأنها تحدد المكان المطلوب فتظهر نتائج أقرب إلى الهدف.\n\nس6 (مستوى الاستدلال): ظهرت نتائج كثيرة جدًا لبحثك، كيف تختار النتيجة المناسبة؟\nالإجابة: أقرأ عنوان النتيجة ووصفها، وأختار الموقع المرتبط بموضوعي والموثوق مثل المواقع الرسمية.\n\n• نشاط علاجي (لمن لم يتقن): يفتح المعلم جوجل كروم مع التلميذ ويشيران إلى شريط العنوان والتبويبات وزر الرجوع وزر التحديث وشريط التمرير ويجربانها، ثم يسأله: أين نكتب عنوان الموقع؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بشرح الفرق بين المتصفح ومحرك البحث بمثال، ثم البحث في جوجل عن معلومة يحددها المعلم وفتح النتيجة في تبويب جديد.\n\nتفريد التعليم (5 دقائق):\nس7 (مستوى المعرفة): ما الرمز الذي ننقر عليه لفتح تبويب جديد؟\nالإجابة: علامة (+).\n\nس8 (مستوى التطبيق): ما الفرق بين كتابة عنوان الموقع وكتابة كلمة في شريط العنوان؟\nالإجابة: كتابة العنوان الكامل تفتح الموقع مباشرة، أما الكلمة فتعرض نتائج البحث عنها.\n\nس9 (مستوى الاستدلال): فتحت خمسة تبويبات وأصبح التنقل صعبًا، ماذا تفعل؟\nالإجابة: أغلق التبويبات التي لا أحتاج إليها بالنقر على (X) في كل منها، وأبقي التبويب الذي أعمل فيه.\n\n• نشاط علاجي (لمن لم يتقن): يفتح المعلم جوجل كروم مع التلميذ ويشيران إلى شريط العنوان والتبويبات وزر الرجوع وزر التحديث وشريط التمرير ويجربانها، ثم يسأله: أين نكتب عنوان الموقع؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بشرح الفرق بين المتصفح ومحرك البحث بمثال، ثم البحث في جوجل عن معلومة يحددها المعلم وفتح النتيجة في تبويب جديد.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): صواب أم خطأ: جوجل كروم متصفح إنترنت.\nالإجابة: صواب.\n\nس2 (مستوى التطبيق): ما الزر الذي تنقر عليه للعودة إلى الصفحة السابقة؟\nالإجابة: زر الرجوع (Back).\n\nس3 (مستوى الاستدلال): محتوى صفحة الموقع طويل ولا يظهر كاملًا على الشاشة، كيف تشاهد بقيته؟\nالإجابة: باستخدام شريط التمرير أو عجلة الفأرة للتمرير إلى الأسفل.\n\nأسئلة التقويم الختامي (5 دقائق):\nس4 (مستوى المعرفة): ما أكثر محركات البحث استخدامًا؟\nالإجابة: جوجل (Google).\n\nس5 (مستوى التطبيق): اكتب كلمات البحث التي تستخدمها لمعرفة معلومات عن الحضارة العمانية.\nالإجابة: «الحضارة العمانية».\n\nس6 (مستوى الاستدلال): صمم سؤالًا بحثيًا عن معلم في ولايتك، واكتب كلمات البحث المناسبة له.\nالإجابة: مثال: ما تاريخ قلعة نزوى؟ وكلمات البحث: «تاريخ قلعة نزوى».\n\nأسئلة التقويم الختامي (5 دقائق):\nس7 (مستوى المعرفة): صواب أم خطأ: يتيح لك فتح تبويب جديد زيارة العديد من المواقع في الوقت نفسه.\nالإجابة: صواب.\n\nس8 (مستوى التطبيق): اكتب عنوان موقع جامع السلطان قابوس الأكبر.\nالإجابة: https://sultanqaboosgrandmosque.com\n\nس9 (مستوى الاستدلال): كتبت عنوان موقع ولم يفتح، اذكر سببًا محتملًا وحله.\nالإجابة: كتابة العنوان بشكل خاطئ؛ أراجع الحروف والنقاط وأعيد كتابته بدقة، أو أبحث عن الموقع بمحرك البحث.", "notes": "- للطالب: راجع مكونات واجهة جوجل كروم في الوحدة 3 – الدرس 2.\n- مهمة قبل الحصة القادمة (الفصل المقلوب): اطلع مع ولي أمرك على صفحات الدرس في كتاب التلميذ عن محرك البحث جوجل، واكتب كلمتين تبحث بهما عن المتاحف في سلطنة عُمان.\n- لولي الأمر: ساعد ابنك في المهمة السابقة، وتابع استخدامه للإنترنت.\n- للطالب: راجع خطوات البحث بمحرك جوجل في الوحدة 3 – الدرس 2، وأكمل التدريب 1.\n- لولي الأمر: ابحث مع ابنك عن معلومة يحتاجها في دروسه، وناقشه في اختيار كلمات البحث.\n- تحضير للحصة القادمة: هل تعرف عنوان موقع إلكتروني لمعلم عُماني؟\n- للطالب: راجع خطوات فتح تبويب جديد وتصفح الموقع في الوحدة 3 – الدرس 2، وأكمل التدريب 2 إن أمكن.\n- لولي الأمر: تصفح مع ابنك موقع جامع السلطان قابوس الأكبر واستكشفا خريطة الجامع معًا.\n- تحضير للحصة القادمة: فكّر: هل تختلف آداب التواصل عبر الإنترنت عن آداب التواصل وجهًا لوجه؟\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/it/?l=9\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}, {"id": "g3-10", "g": "الصف الثالث", "u": "الوحدة الثالثة: عالمي المتصل", "t": "أخلاقيات الإنترنت", "ours": true, "periods": [{"title": "أخلاقيات الإنترنت وقواعد التواصل + السلوكيات الإيجابية والسلبية عبر الإنترنت", "week": "الأسبوع الثالث عشر: 29/11–3/12/2026م (يوم الأنشطة التربوية)", "ref": "دليل المعلم: ص 110–112، 114  |  كتاب التلميذ: الوحدة 3 – الدرس 3: أخلاقيات الإنترنت (التدريبان 1 و2)", "f": {"outcomes": "1. يعرّف أخلاقيات الإنترنت وقواعد التواصل (5 دقائق)\n2. يتبع أخلاقيات الإنترنت في أثناء التواصل مع الآخرين (5 دقائق)\n3. يحكم على صحة عبارات تتعلق بالتواصل عبر الإنترنت (التدريبان 1 و 2) (5 دقائق)\n4. يصنف السلوكيات عبر الإنترنت إلى مهذبة وسيئة (4 دقائق)\n5. يميز العبارات التي تعبر عن أخلاقيات استخدام الإنترنت (التدريبان 3 و 4) (4 دقائق)\n6. يقترح قواعد تواصل لمجموعة الصف الإلكترونية (4 دقائق)\n\nمخرج تعليمي آخر:\n- يحترم الآخرين في العالم الافتراضي كما يحترمهم في الحياة الواقعية (4 دقائق)\n- يرفض نشر الشائعات واستخدام الألفاظ السيئة (4 دقائق)", "levels": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\nالمخرج 4: تحليل\nالمخرج 5: فهم\nالمخرج 6: إبداع\nالمخرج الآخر: تقييم", "strategies": "1. الحوار والمناقشة\n2. التعلم الذاتي\n3. التعلم التشاركي\n4. التعلم المبني على اللعب\n5. التعلم التعاوني", "resources": "1. الكتاب\n2. جهاز عرض البيانات\n3. السبورة التقليدية\n4. أخرى: بطاقات لكتابة التعريفات\n5. الأقلام\n6. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n7. أخرى: بطاقات خضراء وحمراء، ولوحات ورقية كبيرة للمجموعات\n8. أخرى: العرض التفاعلي ومقاطع الفيديو التوضيحية للدرس في منصة أ. عبير اليحمدية", "concepts": "1. أخلاقيات الإنترنت (Internet Ethics): القواعد السلوكية التي نتبعها عند استخدام الإنترنت.\n2. قواعد التواصل (Communication Rules): آداب نتبعها عند التحدث مع الآخرين عبر الإنترنت.\n3. المجتمع الافتراضي: الناس الذين يتواصلون عبر الإنترنت، وله قواعد كالمجتمع الحقيقي.\n4. السلوك المهذب عبر الإنترنت: مثل المحتوى الهادف، وإلقاء التحية، والاحترام، واستخدام الرموز التعبيرية.\n5. السلوك السيئ عبر الإنترنت: مثل الألفاظ السيئة، ونشر الشائعات، وإلقاء اللوم، وإرسال البريد المزعج، ومشاركة المعلومات الشخصية.\n6. البريد المزعج: رسائل عشوائية تُرسل دون فائدة أو طلب.", "warmup": "- يسأل المعلم: هل تستخدم مواقع المحادثة للتواصل عبر الإنترنت؟ هل سبق أن أبلغت عن سلوك مزعج؟ هل تتبع سلوكيات حسنة عند التواصل عبر الإنترنت؟ (5 دقائق)", "procedures": "1. تعريف شخصي للسلوك: يطلب المعلم من كل طالب أن يكتب بنفسه على بطاقة تعريفًا للسلوك اللائق وتعريفًا للسلوك غير اللائق قبل قراءة الكتاب، ويكتب التلميذ تعريفيه بنفسه؛ كتاب الطالب ص104: قواعد التواصل (2 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n2. حوار: الإنترنت مجتمع له قواعد: يستمع المعلم لقراءة بعض التعريفات، ويحاور الطلبة في أن الإنترنت مجتمع افتراضي يشبه الحقيقي وله قواعد تسمى «أخلاقيات الإنترنت»، ويسأل: ما قواعد السلوك اللائق؟ ثم يشرح سلوكين مهذبين من أمثلة الكتاب، ويقرأ التلميذ تعريفه، ويحاور زملاءه، ويستنتج قواعد التواصل المهذب؛ كتاب الطالب ص104–105: قواعد التواصل (3 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n3. تدريب ثنائي وتدقيق متبادل: يطلب المعلم من كل ثنائي حل التدريب 1 (صواب وخطأ) والتدريب 2 (ملء الفراغات)، ثم يتبادل كل ثنائيين الإجابات للتدقيق، ويؤكد أهمية الأمان عبر الإنترنت، ويحل التلميذ التدريبين مع زميله، ويدقق إجابات ثنائي آخر، ويصحح الأخطاء؛ كتاب الطالب ص106: «لنتدرب معًا» تدريبا 1 و 2 (5 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n4. القائمتان وميثاق التواصل: يوزع الطلبة في مجموعات بأدوار (قارئ، كاتب، مصمم، مقرر)، ويطلب قراءة تعليمات الكتاب وإنشاء قائمتين على لوحة: «السلوك السيئ» و«السلوك المهذب»، ثم كتابة ثلاث قواعد لمجموعة الصف الإلكترونية، وعرضها، ويشارك التلميذ في إعداد القائمتين والقواعد، ويعرض المقرر لوحة المجموعة؛ كتاب الطالب ص104–105: قواعد التواصل (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n5. تطبيق مستقل: التدريبان 3 و 4: يطلب المعلم حل التدريب 3 (ثماني عبارات) والتدريب 4 (السلوكيات الإيجابية) فرديًا، ثم يعرض الإجابات للتصحيح الذاتي، ويحل التلميذ التدريبين بنفسه ويصحح إجاباته؛ كتاب الطالب ص107–108: «لنتدرب معًا» تدريبا 3 و 4 (3 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. غلق الدرس – مجلس عماني رقمي: تتحاور المجموعات في آداب المجلس العماني كاحترام الكبير والكلام الطيب وحسن الاستماع، وتحول كلًّا منها إلى قاعدة من قواعد أخلاقيات التواصل عبر الإنترنت (2 دقيقتان)\nالاستراتيجيات: الحوار والمناقشة.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ماذا نسمي القواعد السلوكية التي نتبعها عند التواصل عبر الإنترنت؟\nالإجابة: أخلاقيات الإنترنت.\n\nس2 (مستوى التطبيق): هل يكفي أن تكون مهذبًا مع أصدقائك المقربين فقط عبر الإنترنت؟\nالإجابة: لا، يجب أن أكون مهذبًا مع الجميع.\n\nس3 (مستوى الاستدلال): كتب زميلك رسالة فيها أخطاء إملائية في مجموعة الصف، كيف تتصرف بأدب؟\nالإجابة: لا أنتقده أمام الجميع، ويمكنني أن أنبهه بلطف في رسالة خاصة.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم مواقف مصورة لرسائل مهذبة وأخرى غير مهذبة، ويصنفها مع التلميذ ويقرآن قاعدة تواصل لكل موقف، ثم يسأله: هل نكون مهذبين مع الأصدقاء المقربين فقط؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة ردّ مهذب على رسالة فيها أخطاء أرسلها زميل في مجموعة الصف، وإعداد ملصق لخمس قواعد من أخلاقيات الإنترنت.\n\nتفريد التعليم (5 دقائق):\nس4 (مستوى المعرفة): صنّف إلى مهذب وسيئ: الشائعات، التحية، الألفاظ السيئة، المحتوى الهادف.\nالإجابة: مهذب: التحية والمحتوى الهادف. سيئ: الشائعات والألفاظ السيئة.\n\nس5 (مستوى التطبيق): صواب أم خطأ مع التعليل: «لا تصبر إذا لم يُجب الشخص المتلقي عن رسائلك».\nالإجابة: خطأ؛ يجب أن أصبر فقد يكون مشغولًا.\n\nس6 (مستوى الاستدلال): اقترح قاعدتين لمجموعة الصف الإلكترونية.\nالإجابة: مثل: أبدأ بالتحية وأستخدم كلمات مهذبة، وأجعل رسائلي مختصرة وهادفة ولا أنشر صوري الشخصية.\n\n• نشاط علاجي (لمن لم يتقن): يعرض المعلم مواقف مصورة لرسائل مهذبة وأخرى غير مهذبة، ويصنفها مع التلميذ ويقرآن قاعدة تواصل لكل موقف، ثم يسأله: هل نكون مهذبين مع الأصدقاء المقربين فقط؟\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بكتابة ردّ مهذب على رسالة فيها أخطاء أرسلها زميل في مجموعة الصف، وإعداد ملصق لخمس قواعد من أخلاقيات الإنترنت.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): أكمل بكلمة مناسبة (السخرية/التحية): ........ تصرف سيئ عند التواصل عبر الإنترنت.\nالإجابة: السخرية.\n\nس2 (مستوى التطبيق): صواب أم خطأ: يمكنك التعبير عن شعورك باستخدام الرموز التعبيرية.\nالإجابة: صواب.\n\nس3 (مستوى الاستدلال): لماذا يُعد التزامك بأخلاقيات التواصل دليلًا على رقيك في استخدام الإنترنت؟\nالإجابة: لأن سلوكي عبر الإنترنت يعكس شخصيتي ويؤثر في حياتي الواقعية وفي الآخرين، فالالتزام بالأدب يدل على الاحترام والمسؤولية.\n\nأسئلة التقويم الختامي (5 دقائق):\nس4 (مستوى المعرفة): أي السلوكين إيجابي: «محترم» أم «إلقاء اللوم»؟\nالإجابة: محترم.\n\nس5 (مستوى التطبيق): لماذا يجب ألا تنشر صورك الشخصية عبر الإنترنت؟\nالإجابة: لأنها من معلوماتي الشخصية وقد يستغلها الغرباء.\n\nس6 (مستوى الاستدلال): انتشرت في مجموعة الصف رسالة فيها إشاعة عن زميل، ما التصرف الصحيح؟\nالإجابة: لا أعيد نشرها ولا أعلق عليها بسخرية، وأخبر معلمي أو والديّ.", "notes": "- للطالب: راجع قواعد التواصل في الوحدة 3 – الدرس 3، وأكمل التدريبين 1 و 2.\n- لولي الأمر: راقب طريقة تواصل ابنك عبر الإنترنت وشجعه على التهذيب.\n- تحضير للحصة القادمة: اكتب سلوكًا مهذبًا وسلوكًا سيئًا رأيتهما في محادثة عبر الإنترنت.\n- للطالب: راجع السلوكيات الإيجابية والسلبية في الوحدة 3 – الدرس 3، وأكمل التدريبين 3 و 4.\n- لولي الأمر: ناقش مع ابنك قواعد التواصل التي كتبتها مجموعته، واتفقا على تطبيقها في الأسرة.\n- تحضير للحصة القادمة: هل سبق أن نسخت نصًا أو صورة من موقع ويب؟\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/it/?l=10\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}, {"id": "g3-11", "g": "الصف الثالث", "u": "الوحدة الثالثة: عالمي المتصل", "t": "العثور على المعلومات", "ours": true, "periods": [{"title": "نسخ النص من صفحة ويب ولصقه في مستند + نسخ الصورة من موقع وتنسيق المستند", "week": "الأسبوع الرابع عشر: 6–10/12/2026م", "ref": "دليل المعلم: ص 117–120  |  كتاب التلميذ: الوحدة 3 – الدرس 4: العثور على المعلومات (نسخ النص)", "f": {"outcomes": "1. يميز أنواع المعلومات في صفحة الويب (نصوص، صور، مقاطع فيديو، روابط) (5 دقائق)\n2. يحدد جزءًا من نص صفحة ويب وينسخه ويلصقه في مستند معالج الكلمات (5 دقائق)\n3. يختار المعلومات المناسبة لموضوعه بدل نسخ الصفحة كاملة (5 دقائق)\n4. ينسخ صورة من صفحة ويب ويلصقها في مستند (4 دقائق)\n5. ينسق نص المستند وصورته وفق مواصفات محددة (التدريب 1) (4 دقائق)\n6. يختار صورًا مرتبطة بموضوع المستند ويقيم جاذبيته (4 دقائق)\n\nمخرج تعليمي آخر:\n- يتنقل بين النوافذ المفتوحة باستخدام شريط المهام (4 دقائق)\n- يتأنى في اختيار الصور المناسبة لموضوع مستنده (4 دقائق)", "levels": "المخرج 1: فهم\nالمخرج 2: تطبيق\nالمخرج 3: تقييم\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم\nالمخرج الآخر: تطبيق\nالمخرج الآخر: تقييم", "strategies": "1. التعلم بالاكتشاف\n2. التعلم بالنمذجة\n3. التعلم الذاتي\n4. التعلم التشاركي\n5. التعلم التعاوني", "resources": "1. جهاز الحاسب\n2. جهاز عرض البيانات\n3. الكتاب\n4. أخرى: متصفح جوجل كروم Google Chrome، وتطبيق معالج الكلمات Microsoft Word، وصفحة ويب يحددها المعلم عن سلطنة عُمان\n5. أخرى: متصفح جوجل كروم Google Chrome، وتطبيق معالج الكلمات Microsoft Word، ومستند «معلومات عن عمان»\n6. أخرى: العرض التفاعلي ومقاطع الفيديو التوضيحية للدرس في منصة أ. عبير اليحمدية", "concepts": "1. نسخ النص (Copy Text): تحديد جزء من النص ونسخه لاستخدامه في مكان آخر.\n2. لصق النص (Paste Text): وضع النص المنسوخ في المستند.\n3. شريط المهام: الشريط أسفل الشاشة نتنقل به بين النوافذ المفتوحة.\n4. نسخ الصورة (Copy Image): نسخ صورة من صفحة ويب بالنقر عليها بزر الفأرة الأيمن.\n5. لصق الصورة (Paste Image): وضع الصورة المنسوخة في المستند.", "warmup": "- يسأل المعلم: هل سبق أن بحثت في موقع ويب عن نص تحتاج إليه؟ كيف استفدت منه؟ هل كتبته بيدك؟ هل سبق أن نسخت نصًا أو صورة من موقع؟ (5 دقائق)", "procedures": "1. اكتشاف أنواع المعلومات: يطلب المعلم تمييز أنواع المعلومات في صفحة كتاب التلميذ وفي الصفحة المعروضة، وذكر أنواع أخرى يصادفونها، ثم يستنتجون أن نسخ النص أسرع من كتابته، ويحدد التلميذ أنواع المعلومات ويستنتج فائدة النسخ؛ كتاب الطالب ص109: العثور على المعلومات (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n2. نمذجة: النسخ واللصق بين نافذتين: يقرأ المعلم الصفحة ويختار جزءًا مناسبًا مفكرًا بصوت عالٍ: «لا أنسخ الصفحة كلها»، ثم يحدده بالسحب وينسخه (Ctrl + C)، وينتقل إلى Word من شريط المهام ويلصقه (Ctrl + V)، ثم ينفذ الطلبة الخطوات معه، ويتابع التلميذ النمذجة، ثم ينسخ جزءًا من النص ويلصقه في Word بتوجيه المعلم؛ كتاب الطالب ص109–110: نسخ النص (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. تطبيق مستقل: مستند «معلومات عن عُمان»: يطلب المعلم من كل طالب قراءة الصفحة المحددة واختيار فقرتين مناسبتين ونسخهما إلى مستند جديد وحفظه باسم «معلومات عن عمان»، مع التحقق من عدم تحديد الصور بالخطأ، ويقرأ التلميذ ويختار وينسخ ويلصق بنفسه، ثم يحفظ المستند؛ كتاب الطالب ص109–110: نسخ النص ولصقه (5 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n4. نمذجة: نسخ الصورة ولصقها: يختار المعلم صورة مرتبطة بالموضوع، وينقر عليها بزر الفأرة الأيمن ويختار نسخ الصورة، ثم يلصقها في Word ويصغرها من مقبض الزاوية مفكرًا بصوت عالٍ، ثم ينفذ الطلبة الخطوات معه، ويتابع التلميذ النمذجة، ثم ينسخ صورة مناسبة ويلصقها في مستنده؛ كتاب الطالب ص111–112: نسخ الصور (2 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. مهمة جماعية: التدريب 1: يوزع المعلم الأدوار في مجموعات ثلاثية (منسق النص، منسق الصورة، مدقق)، ويكلفها بتنفيذ تعليمات سارة: الخط Calibri وحجمه 16، وخط العنوان برتقالي، وخط النص الرئيس أرجواني، ونمط مناسب للصورة، مذكرًا بتحديد النص أو الصورة قبل التنسيق، وينفذ التلميذ دوره في التنسيق، ويدقق المدقق كل بند، ثم يحفظون المستند؛ كتاب الطالب ص113: «نسّق المستند» (5 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. تبادل الآراء: يطلب المعلم من كل مجموعة مشاهدة مستند مجموعة أخرى والإجابة: هل يعجبك النص مع الصورة؟ ما التغيير الذي يجعله أكثر جاذبية؟ ويشاهد التلميذ مستند زملائه، ويقدم رأيه واقتراحه، ويستمع لآرائهم في مستنده (2 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما اختصار نسخ النص المحدد؟\nالإجابة: Ctrl + C.\n\nس2 (مستوى التطبيق): كيف تنتقل من نافذة المتصفح إلى نافذة Word؟\nالإجابة: بالنقر على أيقونة Word في شريط المهام.\n\nس3 (مستوى الاستدلال): لماذا لا يُنصح بنسخ نص صفحة الويب كاملة؟\nالإجابة: لأن الصفحة قد تحتوي معلومات لا تخص موضوعي، والأفضل قراءتها واختيار الأجزاء المناسبة فقط.\n\n• نشاط علاجي (لمن لم يتقن): يحدد المعلم مع التلميذ جملة من صفحة ويب وينسخها بـ Ctrl + C، ثم ينتقلان إلى Word من شريط المهام ويلصقانها بـ Ctrl + V، ثم يطلب منه نسخ جملة أخرى ولصقها.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقراءة صفحة ويب عن موضوع محدد واختيار جملتين فقط تناسبان الموضوع ولصقهما في Word مع صورة، وتعليل ما استبعدوه.\n\nتفريد التعليم (5 دقائق):\nس4 (مستوى المعرفة): ما الأمر الذي تختاره بعد النقر بزر الفأرة الأيمن على الصورة لنسخها؟\nالإجابة: نسخ الصورة (Copy Image).\n\nس5 (مستوى التطبيق): ما الخطوة الأولى قبل تغيير لون خط العنوان؟\nالإجابة: تحديد العنوان.\n\nس6 (مستوى الاستدلال): لصقت صورة كبيرة غطت الصفحة، كيف تجعلها مناسبة؟\nالإجابة: أصغرها من مقبض الزاوية للمحافظة على تناسبها، وأختار لها التفاف نص ونمطًا مناسبين.\n\n• نشاط علاجي (لمن لم يتقن): يحدد المعلم مع التلميذ جملة من صفحة ويب وينسخها بـ Ctrl + C، ثم ينتقلان إلى Word من شريط المهام ويلصقانها بـ Ctrl + V، ثم يطلب منه نسخ جملة أخرى ولصقها.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقراءة صفحة ويب عن موضوع محدد واختيار جملتين فقط تناسبان الموضوع ولصقهما في Word مع صورة، وتعليل ما استبعدوه.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): صواب أم خطأ: نسخ النص من صفحة الويب أسرع من كتابته.\nالإجابة: صواب.\n\nس2 (مستوى التطبيق): رتّب: لصق النص في Word، تحديد النص، نسخ النص.\nالإجابة: تحديد النص ثم نسخه ثم لصقه في Word.\n\nس3 (مستوى الاستدلال): حددت نصًا فتحددت معه صورة بالخطأ، كيف تتجنب ذلك؟\nالإجابة: أبدأ التحديد من بداية النص بدقة وأتوقف عند نهايته قبل الصورة، أو أنسخ أجزاء أصغر.\n\nأسئلة التقويم الختامي (5 دقائق):\nس4 (مستوى المعرفة): صواب أم خطأ: يجب أن تكون الصورة المنسوخة من الإنترنت مرتبطة بموضوع المستند.\nالإجابة: صواب.\n\nس5 (مستوى التطبيق): صف خطوات تغيير نوع الخط إلى Calibri وحجمه إلى 16.\nالإجابة: أحدد النص، ثم أختار Calibri من قائمة نوع الخط و 16 من قائمة حجم الخط.\n\nس6 (مستوى الاستدلال): اقترح تنسيقًا يجعل مستند «سلطنة عُمان» أكثر جاذبية، وبرر اختيارك.\nالإجابة: عنوان كبير بلون مميز وتوسيط، ونمط صورة بإطار وظل، وتمييز رقم المساحة؛ لإبراز المعلومات المهمة وجذب القارئ.", "notes": "- للطالب: راجع خطوات نسخ النص من موقع في الوحدة 3 – الدرس 4.\n- لولي الأمر: تابع ابنك عند نسخه معلومات من الإنترنت، وناقشه في اختيار المناسب منها.\n- تحضير للحصة القادمة: فكّر في صورة مناسبة لمستند «معلومات عن عمان».\n- للطالب: راجع خطوات  العرض التفاعلي ومقاطع الفيديو التوضيحية للدرس في منصة أ. عبير اليحمدية", "concepts": "1. شريط التنقل: قائمة في أعلى الموقع ننتقل بها بين أقسامه.\n2. علم سلطنة عُمان: يتكون من الألوان الأحمر والأبيض والأخضر ويحمل شعار الدولة.\n3. شعار الدولة: الخنجر العُماني وحزامه فوق سيفين متقاطعين.\n4. قواعد الأمان: لا نشارك المعلومات الشخصية، ونستخدم اسمًا مستعارًا، ولا نضغط على الإعلانات.\n5. إغلاق التبويب: النقر على علامة (X) في التبويب.\n6. كلمة المرور: كلمة سرية نختارها بحيث لا تكون من معلوماتنا الشخصية مثل تاريخ الميلاد.", "warmup": "- يسأل المعلم: ما ألوان علم سلطنة عُمان التي تعرفتها في المنزل؟ ما مكونات شعار الدولة؟ (5 دقائق)", "procedures": "1. بناء على التعلم المسبق: التخطيط للمقالة: يربط المعلم ما تعلمه الطلبة في المنزل بمهمة اليوم: مقالة للإذاعة المدرسية، ويناقش معهم الأجزاء التي سيبحثون عنها (نبذة تاريخية، شعار الدولة)، ويحدد التلميذ مع المعلم الأجزاء المطلوبة ويربطها بما قرأه؛ كتاب الطالب ص109–112: نسخ النص والصور (3 دقائق)\nالاستراتيجيات: الفصل المقلوب.\n\n2. تنفيذ مقالة الإذاعة المدرسية: يوجه الطلبة لتنفيذ خطوات التدريب 2: فتح جوجل كروم وWord، وكتابة www.omaninfo.om، واختيار «سلطنة عُمان» ثم «علم السلطنة وشعارها»، ونسخ الفقرة الأولى من «نبذة تاريخية» وصورة العلم، ثم الفقرة الأولى من «شعار الدولة» وصورة الشعار، وتنسيق المستند، ويقدم الدعم، وينفذ التلميذ الخطوات بالترتيب، وينسخ النصوص والصور المحددة فقط، وينسق مقالته؛ كتاب الطالب ص114–115: «لنتدرب معًا» تدريب 1 (ابحث ثم أنشئ مستندك) (6 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n3. حفظ المقالة وعرض نماذج: يطلب المعلم حفظ المقالة باسم مناسب، ويعرض نموذجين متميزين على جهاز العرض ويرشح أحدهما للإذاعة المدرسية، ويحفظ التلميذ مقالته، ويشاهد النماذج، ويقارن مقالته بها؛ كتاب الطالب ص115: المستند النهائي (2 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n4. صواب وخطأ مع التصحيح: يطلب المعلم من كل ثنائي حل التدريب 1 (ثماني عبارات)، ثم توضيح سبب خطأ العبارات الخاطئة واقتراح العبارة الصحيحة ومشاركتها مع الصف، ويحل التلميذ مع زميله، ويصحح العبارات الخاطئة ويشاركها؛ كتاب الطالب ص106–107: «لنتدرب معًا» (صواب وخطأ) (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n5. مهام جماعية: التدريبان 2 و 3: يوزع المعلم الأدوار (قارئ، كاتب، مدقق، مقرر)، ويكلف المجموعات بالتدريب 2 (ملء الفراغات) والتدريب 3 (لصق النص المناسب: الفيروسات، برنامج مكافحة الفيروسات، الضغط على الإعلانات)، مذكرًا بأهمية برامج مكافحة الفيروسات، وينجز التلميذ التدريبين مع مجموعته، ويعرض المقرر الإجابات؛ كتاب الطالب ص106–108: «لنتدرب معًا» (الفراغات والسلوكيات) (2 دقائق)\nالاستراتيجيات: التعلم التعاوني.\n\n6. سباق التتابع: ينظم المعلم سباق تتابع بين المجموعات لمطابقة أسماء أجزاء المتصفح بأيقوناتها على السبورة (التدريب 4) وإكمال جمل التدريب 5 بالملصقات، ويشارك التلميذ في التتابع مع فريقه؛ كتاب الطالب ص102: «لنتدرب معًا» تدريب 1 (طابق المسميات بأيقوناتها) (2 دقائق)\nالاستراتيجيات: التعلم المبني على اللعب.\n\n7. غلق الدرس – كنز الفنون الشعبية: يصنف الأزواج عناصر صفحة ويب تخيلية عن الفنون الشعبية العمانية إلى نص وصورة وفيديو ورابط، ويختار كل زوج العنصر الأنسب لتعريف زملائه بفن الرزحة (2 دقيقتان)\nالاستراتيجيات: فكر – زاوج – شارك.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما الموقع الذي استخدمته للبحث عن علم السلطنة وشعارها؟\nالإجابة: www.omaninfo.om\n\nس2 (مستوى التطبيق): كيف وصلت إلى صفحة «علم السلطنة وشعارها» في الموقع؟\nالإجابة: من شريط التنقل باختيار «سلطنة عُمان» ثم النقر على «علم السلطنة وشعارها».\n\nس3 (مستوى الاستدلال): لماذا نسخنا الفقرة الأولى فقط من كل نص؟\nالإجابة: لأنها تكفي لمقالة قصيرة للإذاعة المدرسية، ونسخ النص كاملًا يطيل المقالة دون حاجة.\n\n• نشاط علاجي (لمن لم يتقن): يحدد المعلم مع التلميذ جملة من صفحة ويب وينسخها بـ Ctrl + C، ثم ينتقلان إلى Word من شريط المهام ويلصقانها بـ Ctrl + V، ثم يطلب منه نسخ جملة أخرى ولصقها.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقراءة صفحة ويب عن موضوع محدد واختيار جملتين فقط تناسبان الموضوع ولصقهما في Word مع صورة، وتعليل ما استبعدوه.\n\nتفريد التعليم (5 دقائق):\nس4 (مستوى المعرفة): ما الرمز الذي ننقر عليه لإغلاق التبويب؟\nالإجابة: علامة (X).\n\nس5 (مستوى التطبيق): صحح العبارة: «يمكنك استخدام تاريخ ميلادك ككلمة مرور».\nالإجابة: لا أستخدم تاريخ ميلادي كلمة مرور؛ لأنه معلومة خاصة يسهل تخمينها ويجب حمايتها.\n\nس6 (مستوى الاستدلال): لماذا يجب تجنب الأرقام الكبيرة مثل رقم الهاتف عند اختيار الاسم المستعار؟\nالإجابة: لأنها قد تكون معلومات شخصية تكشف هويتي أو وسيلة التواصل معي.\n\n• نشاط علاجي (لمن لم يتقن): يحدد المعلم مع التلميذ جملة من صفحة ويب وينسخها بـ Ctrl + C، ثم ينتقلان إلى Word من شريط المهام ويلصقانها بـ Ctrl + V، ثم يطلب منه نسخ جملة أخرى ولصقها.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بقراءة صفحة ويب عن موضوع محدد واختيار جملتين فقط تناسبان الموضوع ولصقهما في Word مع صورة، وتعليل ما استبعدوه.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما ألوان علم سلطنة عُمان؟\nالإجابة: الأحمر والأبيض والأخضر.\n\nس2 (مستوى التطبيق): رتّب: كتابة عنوان الموقع، فتح جوجل كروم وWord، نسخ الفقرة ولصقها، اختيار «علم السلطنة وشعارها».\nالإجابة: فتح جوجل كروم وWord ثم كتابة عنوان الموقع ثم اختيار «علم السلطنة وشعارها» ثم نسخ الفقرة ولصقها.\n\nس3 (مستوى الاستدلال): ما مكونات شعار سلطنة عُمان؟\nالإجابة: الخنجر العُماني وحزامه فوق سيفين متقاطعين.\n\nأسئلة التقويم الختامي (5 دقائق):\nس4 (مستوى المعرفة): أكمل: برمجيات خبيثة تصيب جهاز الحاسوب وتضره هي ........\nالإجابة: الفيروسات.\n\nس5 (مستوى التطبيق): صواب أم خطأ: يُعد عنوان منزلك من المعلومات الشخصية.\nالإجابة: صواب.\n\nس6 (مستوى الاستدلال): أكمل وعلّل: اختر اسمًا مستعارًا بالتشاور مع ........\nالإجابة: أفراد أسرتك؛ ليتأكدوا أنه آمن ولا يكشف معلوماتي.", "notes": "- للطالب: احتفظ بمقالتك عن علم السلطنة وشعارها، وراجع التدريب 2 في الوحدة 3 – الدرس 4.\n- لولي الأمر: اطلب من ابنك أن يقرأ لك مقالته كما سيقرؤها في الإذاعة المدرسية.\n- تحضير للحصة القادمة: راجع قواعد الأمان وواجهة جوجل كروم استعدادًا للتدريب.\n- للطالب: أكمل تدريبات الوحدة 3 – الدرس 5 التي لم تنهها، وتأكد من لصق الملصقات.\n- لولي الأمر: راجع مع ابنك قواعد الأمان عبر الإنترنت، واتفقا على كلمة مرور قوية لا تتضمن معلوماته الشخصية.\n- تحضير للحصة القادمة: هل بحثت يومًا عن معلومة في موسوعة مطبوعة؟\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/it/?l=11\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}, {"id": "g3-12", "g": "الصف الثالث", "u": "الوحدة الثالثة: عالمي المتصل", "t": "البحث في موسوعة ويكيبيديا", "ours": true, "periods": [{"title": "الموسوعة وموقع ويكيبيديا + البحث عن مدينة صلالة وحفظ صورة على الحاسوب", "week": "الأسبوع السادس عشر: 20–24/12/2026م", "ref": "دليل المعلم: ص 130–132  |  كتاب التلميذ: الوحدة 3 – الدرس 6: البحث في موسوعة ويكيبيديا (زيارة الموقع والبحث فيه)", "f": {"outcomes": "1. يعرّف الموسوعة وموسوعة ويكيبيديا (5 دقائق)\n2. يزور موقع ويكيبيديا بكتابة عنوانه wikipedia.org في شريط العنوان (5 دقائق)\n3. يبحث في الموسوعة عن موضوع باستخدام مربع البحث ويعود إلى الصفحة السابقة بزر الرجوع (5 دقائق)\n4. يبحث في موسوعة ويكيبيديا عن معلومات حول مدينة صلالة (4 دقائق)\n5. يحفظ صورة من موقع على جهاز الحاسوب (حفظ الصورة Save Image) (4 دقائق)\n6. يختار مكانًا واسمًا مناسبين للصورة المحفوظة ليسهل الرجوع إليها (4 دقائق)\n\nمخرج تعليمي آخر:\n- يحب القراءة والاطلاع على مصادر المعرفة (4 دقائق)\n- يعتز بمدن سلطنة عُمان ومعالمها السياحية (4 دقائق)", "levels": "المخرج 1: تذكر\nالمخرج 2: تطبيق\nالمخرج 3: تطبيق\nالمخرج 4: تطبيق\nالمخرج 5: تطبيق\nالمخرج 6: تقييم\nالمخرج الآخر: تقييم", "strategies": "1. الحوار والمناقشة\n2. التعلم بالنمذجة\n3. التعلم بالاكتشاف\n4. التعلم التشاركي\n5. التعلم الذاتي", "resources": "1. جهاز الحاسب\n2. جهاز عرض البيانات\n3. الكتاب\n4. أخرى: متصفح جوجل كروم Google Chrome، وموسوعة مطبوعة إن توفرت في مركز مصادر التعلم، وبطاقات موضوعات للبحث\n5. صورة توضيحية\n6. أخرى: متصفح جوجل كروم Google Chrome، وموسوعة ويكيبيديا\n7. أخرى: العرض التفاعلي ومقاطع الفيديو التوضيحية للدرس في منصة أ. عبير اليحمدية", "concepts": "1. الموسوعة: مرجع يجمع معلومات عن موضوعات كثيرة مرتبة ليسهل البحث فيها.\n2. ويكيبيديا (Wikipedia): موسوعة على الإنترنت يكتبها المستخدمون ويعدلونها.\n3. مربع البحث في الموقع: مكان نكتب فيه الموضوع للبحث عنه داخل الموقع نفسه.\n4. حفظ الصورة (Save Image): تخزين صورة من موقع ملفًا على جهاز الحاسوب لاستخدامها لاحقًا.\n5. مكان الحفظ: المجلد الذي نختاره لتخزين الصورة فيه.", "warmup": "- يعرض المعلم موسوعة مطبوعة ويسأل: هل سبق أن بحثت عن معلومات في موسوعة مطبوعة؟ هل تعلم أنه يمكنك البحث في موقع بدلًا من محرك بحث جوجل؟ (5 دقائق)", "procedures": "1. حوار: من الموسوعة المطبوعة إلى ويكيبيديا: يحاور الطلبة حول معنى الموسوعة، ثم يعرّف ويكيبيديا موسوعة على الإنترنت، ويقارنها بالبحث في جوجل، ويحاور التلميذ ويستنتج الفرق بين البحث في موسوعة والبحث بمحرك البحث؛ كتاب الطالب ص116: البحث في موسوعة ويكيبيديا (3 دقائق)\nالاستراتيجيات: الحوار والمناقشة.\n\n2. نمذجة: زيارة الموسوعة والبحث فيها: يفتح المعلم جوجل كروم ويكتب wikipedia.org في شريط العنوان لزيارة الموسوعة مباشرة، ويختار العربية، ويكتب موضوعًا في مربع البحث، ثم يعود بزر الرجوع مفكرًا بصوت عالٍ، ثم ينفذ الطلبة الخطوات معه، ويتابع التلميذ النمذجة، ثم يزور الموسوعة ويبحث فيها ويستخدم زر الرجوع بتوجيه المعلم؛ كتاب الطالب ص116: فتح موقع ويكيبيديا والبحث فيه (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n3. اكتشاف: موضوعات من بطاقات: يوزع المعلم بطاقات موضوعات (قلعة نزوى، المها العربي، جامع السلطان قابوس الأكبر)، ويطلب البحث عنها في الموسوعة واكتشاف أجزاء الصفحة (العنوان، الفهرس، الصور) وتدوين معلومة واحدة، ويبحث التلميذ عن موضوع بطاقته، ويكتشف أجزاء الصفحة، ويدون معلومة يشاركها؛ كتاب الطالب ص117: التنقل في الموسوعة (5 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n4. نمذجة: البحث عن صلالة وحفظ صورة: يكتب المعلم «صلالة» في مربع بحث الموسوعة، ثم ينقر بزر الفأرة الأيمن على صورة ويختار حفظ الصورة باسم، ويحدد المجلد ويكتب اسمًا مناسبًا ثم ينقر على حفظ، مفكرًا بصوت عالٍ في مكان الحفظ، ثم ينفذ الطلبة الخطوات معه، ويتابع التلميذ النمذجة، ثم يحفظ صورة بتوجيه المعلم؛ كتاب الطالب ص118–119: حفظ الصور (3 دقائق)\nالاستراتيجيات: التعلم بالنمذجة.\n\n5. تطبيق مستقل: مجلد «مقالة صلالة»: يطلب المعلم من كل طالب إنشاء مجلد «مقالة صلالة»، وحفظ صورتين فيه بأسماء تصف محتواهما، وقراءة الصفحة وتدوين معلومتين عن صلالة، وينشئ التلميذ المجلد، ويحفظ الصورتين بأسماء مناسبة، ويدون معلومتين؛ كتاب الطالب ص117–119: التنقل وحفظ الصورة (4 دقائق)\nالاستراتيجيات: التعلم الذاتي.\n\n6. تحقق ثنائي ومشاركة: يطلب المعلم من كل ثنائي تبادل التحقق من المجلد وأسماء الصور، ثم مشاركة معلومة عن صلالة مع الصف، ويتحقق التلميذ من عمل زميله، ويشارك معلومة؛ كتاب الطالب ص119: الصورة في مجلد Saved Pictures (2 دقائق)\nالاستراتيجيات: التعلم التشاركي.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): ما الموسوعة؟\nالإجابة: مرجع يجمع معلومات عن موضوعات كثيرة مرتبة ليسهل البحث فيها.\n\nس2 (مستوى التطبيق): ما عنوان موقع موسوعة ويكيبيديا؟\nالإجابة: wikipedia.org\n\nس3 (مستوى الاستدلال): ما الفرق بين البحث في جوجل والبحث داخل ويكيبيديا؟\nالإجابة: جوجل يعرض نتائج من مواقع كثيرة، أما مربع البحث في ويكيبيديا فيعرض صفحات الموسوعة نفسها عن الموضوع.\n\n• نشاط علاجي (لمن لم يتقن): يكتب المعلم مع التلميذ wikipedia.org في شريط العنوان، ثم يبحثان في مربع البحث عن «مسقط» ويعودان بزر الرجوع، ثم يطلب منه البحث عن موضوع آخر وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالبحث عن مدينة عمانية في جوجل ثم في ويكيبيديا، ومقارنة النتائج، واستخراج ثلاث معلومات عنها.\n\nتفريد التعليم (5 دقائق):\nس4 (مستوى المعرفة): ما الأمر الذي تختاره لحفظ صورة من موقع؟\nالإجابة: حفظ الصورة باسم (Save image as).\n\nس5 (مستوى التطبيق): لماذا يجب تحديد مكان حفظ الصورة؟\nالإجابة: لأتمكن من العثور عليها بسهولة واستخدامها لاحقًا.\n\nس6 (مستوى الاستدلال): حفظت صورتين باسمي «image1» و«image2»، كيف تجعل العثور عليهما أسهل؟\nالإجابة: أعيد تسميتهما بأسماء تصف محتواهما مثل «خريف صلالة» و«شاطئ صلالة»، وأضعهما في مجلد «مقالة صلالة».\n\n• نشاط علاجي (لمن لم يتقن): يكتب المعلم مع التلميذ wikipedia.org في شريط العنوان، ثم يبحثان في مربع البحث عن «مسقط» ويعودان بزر الرجوع، ثم يطلب منه البحث عن موضوع آخر وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالبحث عن مدينة عمانية في جوجل ثم في ويكيبيديا، ومقارنة النتائج، واستخراج ثلاث معلومات عنها.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): صواب أم خطأ: ويكيبيديا موسوعة على الإنترنت.\nالإجابة: صواب.\n\nس2 (مستوى التطبيق): ما الزر الذي يعيدك إلى الصفحة السابقة؟\nالإجابة: زر الرجوع (Back).\n\nس3 (مستوى الاستدلال): بحثت في ويكيبيديا عن «عمان» فظهرت صفحة عن مدينة عمّان في الأردن، ماذا تفعل؟\nالإجابة: أكتب كلمة أدق مثل «سلطنة عمان»، أو أختار الصفحة الصحيحة من نتائج البحث.\n\nأسئلة التقويم الختامي (5 دقائق):\nس4 (مستوى المعرفة): صواب أم خطأ: يمكن حفظ الصور من الإنترنت على الحاسوب لاستخدامها لاحقًا.\nالإجابة: صواب.\n\nس5 (مستوى التطبيق): رتّب خطوات حفظ صورة: النقر على حفظ، النقر بزر الفأرة الأيمن على الصورة، اختيار المجلد وكتابة الاسم، اختيار حفظ الصورة باسم.\nالإجابة: النقر بزر الفأرة الأيمن على الصورة ثم اختيار حفظ الصورة باسم ثم اختيار المجلد وكتابة الاسم ثم النقر على حفظ.\n\nس6 (مستوى الاستدلال): ما الفرق بين نسخ الصورة وحفظها؟\nالإجابة: نسخ الصورة يتيح لصقها مباشرة في مكان آخر، أما حفظها فيخزنها ملفًا على الحاسوب يمكن إدراجه في أي وقت لاحق.", "notes": "- للطالب: راجع خطوات زيارة موسوعة ويكيبيديا والبحث فيها في الوحدة 3 – الدرس 6.\n- لولي الأمر: ابحث مع ابنك في الموسوعة عن ولايتكم واقرأ معه المعلومات.\n- تحضير للحصة القادمة: ماذا تعرف عن مدينة صلالة؟\n- للطالب: راجع خطوات حفظ صورة من موقع في الوحدة 3 – الدرس 6، وتأكد أن صورتيك في مجلد «مقالة صلالة».\n- لولي الأمر: حدّث ابنك عن مدينة صلالة ومعالمها، أو عن زيارة سابقة لها إن وجدت.\n- تحضير للحصة القادمة: فكر في عنوان مناسب لمقالتك عن صلالة.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/it/?l=12\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}, {"title": "إنشاء مقالة عن مدينة صلالة + التحقق من المعلومات ومتصفحات أخرى ومراجعة الوحدة", "week": "الأسبوع السابع عشر: 27–30/12/2026م", "ref": "دليل المعلم: ص 132، 134  |  كتاب التلميذ: الوحدة 3 – الدرس 6: أنشئ مقالة عن مدينة صلالة (التدريب 1)", "f": {"outcomes": "1. ينسخ نصًا من موسوعة ويكيبيديا ويلصقه في مستند جديد (5 دقائق)\n2. يدرج في المستند الصورة التي حفظها على الحاسوب بدلًا من نسخها من الموقع (5 دقائق)\n3. ينشئ مقالة منسقة عن مدينة صلالة (التدريب 1) (5 دقائق)\n4. يوضح أن معلومات ويكيبيديا يمكن أن يعدلها المستخدمون، ويتحقق منها بمصدر موثوق آخر (4 دقائق)\n5. يتعرف متصفحات ويب أخرى غير جوجل كروم مثل مايكروسوفت إيدج (4 دقائق)\n6. يطبق مهارات الوحدة (البحث والنسخ والحفظ والأمان) في مواقف متنوعة (4 دقائق)\n\nمخرج تعليمي آخر:\n- يحفظ عمله قبل إغلاق المستند (4 دقائق)\n- يفكر تفكيرًا ناقدًا عند قراءة المعلومات على الإنترنت (4 دقائق)", "levels": "المخرج 1: تطبيق\nالمخرج 2: تطبيق\nالمخرج 3: إبداع\nالمخرج 4: تقييم\nالمخرج 5: تذكر\nالمخرج 6: تطبيق\nالمخرج الآخر: تطبيق\nالمخرج الآخر: تقييم", "strategies": "1. التعلم المبني على المشاريع\n2. التعلم التشاركي\n3. التعلم المبني على حل المشكلات\n4. التعلم بالاكتشاف\n5. التعلم المبني على اللعب", "resources": "1. جهاز الحاسب\n2. جهاز عرض البيانات\n3. الكتاب\n4. الأقلام\n5. أخرى: متصفح جوجل كروم Google Chrome، وتطبيق معالج الكلمات Microsoft Word، ومجلد «مقالة صلالة»، وأوراق ملاحظات لاصقة\n6. السبورة الذكية\n7. برمجيات / تطبيقات مثل Edpuzzle, Padlet, Kahoot\n8. أخرى: متصفح جوجل كروم Google Chrome، ومتصفح Microsoft Edge، وموقع رسمي مثل www.omaninfo.om\n9. أخرى: العرض التفاعلي ومقاطع الفيديو التوضيحية للدرس في منصة أ. عبير اليحمدية", "concepts": "1. المقالة: نص له عنوان يعرض معلومات عن موضوع واحد.\n2. إدراج صورة من هذا الجهاز: إضافة صورة محفوظة في الحاسوب من تبويب إدراج ثم صور ثم هذا الجهاز.\n3. موثوقية المعلومة: مدى صحة المعلومة وإمكانية الاعتماد عليها.\n4. المصدر الموثوق: مصدر معروف ودقيق مثل المواقع الرسمية.\n5. Microsoft Edge: متصفح إنترنت آخر يشبه جوجل كروم في مكوناته.", "warmup": "- يعرض المعلم بطاقة المهمة: «أنشئ مقالة عن مدينة صلالة»، ويسأل: ما الذي تحتاج إليه لإنشاء المقالة؟ من أين ستأخذ النص؟ ومن أين ستدرج الصورة؟ (5 دقائق)", "procedures": "1. تنفيذ المقالة: يوجه الطلبة لتنفيذ التدريب 1: فتح مستند جديد في Word، ونسخ نص من صفحة صلالة في ويكيبيديا، وإدراج الصورة المحفوظة (إدراج ← صور ← هذا الجهاز)، وتنسيق الخط والمحاذاة والصورة كما يريدون، والحفظ قبل الإغلاق، ويقدم الدعم لمن يحتاج، وينفذ التلميذ الخطوات بنفسه، وينسق مقالته، ويحفظها باسم مناسب؛ كتاب الطالب ص121: «لنتدرب معًا» تدريب 1 «أنشئ مقالة عن مدينة صلالة» (7 دقائق)\nالاستراتيجيات: التعلم المبني على المشاريع.\n\n2. معرض المقالات: ينظم المعلم جولة يشاهد فيها كل طالب مقالتي زميلين ويترك ورقة ملاحظة بإشادة واقتراح، ويشاهد التلميذ مقالات زملائه، ويكتب ملاحظاته، ويقرأ الملاحظات على مقالته؛ كتاب الطالب ص121: «لنتدرب معًا» تدريب 1 (3 دقائق)\nالاستراتيجيات: التعلم التشاركي.\n\n3. التحقق من معلومة بمصدرين: يوضح المعلم أن صفحات ويكيبيديا يعدلها المستخدمون وتظهر التعديلات للزوار مباشرة فقد تتحسن أو تسوء، ثم يكلف المجموعات بالتحقق من معلومة عن صلالة أو عُمان بمقارنتها بموقع رسمي واتخاذ قرار، ويقارن التلميذ المعلومة في المصدرين مع مجموعته، ويقرر هل هي صحيحة، ويعرض طريقته؛ كتاب الطالب ص120: البحث عن صلالة في جوجل (5 دقائق)\nالاستراتيجيات: التعلم المبني على حل المشكلات.\n\n4. اكتشاف متصفح آخر: يعرض المعلم صفحة «برامج أخرى»، ويطلب فتح متصفح Microsoft Edge (إن توفر) ومقارنة مكوناته بجوجل كروم: شريط العنوان، والتبويبات، وزر الرجوع، ويستكشف التلميذ المتصفح الآخر، ويحدد أوجه الشبه والاختلاف، ويستنتج أن المهارات نفسها تنطبق عليه؛ كتاب الطالب ص122: برامج أخرى (3 دقائق)\nالاستراتيجيات: التعلم بالاكتشاف.\n\n5. غلق الدرس – موسوعة صغيرة عن عمان: تكتب كل مجموعة مدخلًا موسوعيًا قصيرًا من جملتين عن معلم عماني تعرفه، ثم تناقش المجموعات أهمية التحقق من المعلومة في الموسوعات الإلكترونية (2 دقيقتان)\nالاستراتيجيات: التعلم التعاوني.", "formative": "تفريد التعليم (5 دقائق):\nس1 (مستوى المعرفة): من أين تدرج الصورة التي حفظتها؟\nالإجابة: من تبويب إدراج ثم صور ثم هذا الجهاز.\n\nس2 (مستوى التطبيق): لماذا ندرج الصورة من الحاسوب بدلًا من نسخها من الموقع؟\nالإجابة: لأننا حفظناها مسبقًا في مجلد، ونستطيع استخدامها في أي وقت ولو دون إنترنت.\n\nس3 (مستوى الاستدلال): بماذا تبدأ مقالتك ليعرف القارئ موضوعها؟ وكيف تنسقه؟\nالإجابة: بعنوان واضح مثل «صلالة» في أعلى الصفحة بخط كبير وغامق وتوسيط.\n\n• نشاط علاجي (لمن لم يتقن): يكتب المعلم مع التلميذ wikipedia.org في شريط العنوان، ثم يبحثان في مربع البحث عن «مسقط» ويعودان بزر الرجوع، ثم يطلب منه البحث عن موضوع آخر وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالبحث عن مدينة عمانية في جوجل ثم في ويكيبيديا، ومقارنة النتائج، واستخراج ثلاث معلومات عنها.\n\nتفريد التعليم (5 دقائق):\nس4 (مستوى المعرفة): من يستطيع تعديل معلومات موسوعة ويكيبيديا؟\nالإجابة: المستخدمون الذين يستخدمون الموسوعة.\n\nس5 (مستوى التطبيق): لماذا يجب الحذر عند قراءة معلومات ويكيبيديا؟\nالإجابة: لأنها قد تُعدل فتصبح أحيانًا غير دقيقة، فأتحقق منها من مصدر آخر موثوق.\n\nس6 (مستوى الاستدلال): وجدت معلومتين مختلفتين عن موضوع واحد، كيف تحدد الصحيحة؟\nالإجابة: أقارن بمصدر رسمي موثوق مثل المواقع الحكومية، أو أسأل معلمي.\n\n• نشاط علاجي (لمن لم يتقن): يكتب المعلم مع التلميذ wikipedia.org في شريط العنوان، ثم يبحثان في مربع البحث عن «مسقط» ويعودان بزر الرجوع، ثم يطلب منه البحث عن موضوع آخر وحده.\n• نشاط إثرائي (للمتقنين): يكلف المعلم المتقنين بالبحث عن مدينة عمانية في جوجل ثم في ويكيبيديا، ومقارنة النتائج، واستخراج ثلاث معلومات عنها.", "summative": "أسئلة التقويم الختامي (5 دقائق):\nس1 (مستوى المعرفة): ما الخطوة التي تنفذها قبل إغلاق المستند؟\nالإجابة: حفظ المستند.\n\nس2 (مستوى التطبيق): اذكر تنسيقين طبقتهما على مقالة صلالة.\nالإجابة: مثل: تغيير نوع الخط وحجمه، ومحاذاة النص، وتطبيق نمط على الصورة.\n\nس3 (مستوى الاستدلال): قيّم مقالة زميلك: هل ترتبط الصورة بالنص؟ وما الذي تقترحه لتحسينها؟\nالإجابة: مثال: الصورة مرتبطة بالنص لأنها لصلالة، وأقترح تكبير العنوان وتمييز معلومة مهمة بلون.\n\nأسئلة التقويم الختامي (5 دقائق):\nس4 (مستوى المعرفة): اذكر متصفح إنترنت آخر غير جوجل كروم.\nالإجابة: مايكروسوفت إيدج (Microsoft Edge).\n\nس5 (مستوى التطبيق): صواب أم خطأ: تظهر تعديلات المستخدمين على صفحات ويكيبيديا للزوار مباشرة.\nالإجابة: صواب.\n\nس6 (مستوى الاستدلال): هل يمكنك تطبيق مهارات جوجل كروم في متصفح آخر؟ وضّح.\nالإجابة: نعم، لأن المتصفحات تتشابه في مكوناتها (شريط العنوان، والتبويبات، وزر الرجوع) مع اختلاف بسيط في الواجهة.", "notes": "- للطالب: احتفظ بمقالتك عن صلالة، وراجع التدريب 1 في الوحدة 3 – الدرس 6.\n- لولي الأمر: اطلب من ابنك أن يعرض عليك مقالته ويشرح كيف أنشأها.\n- تحضير للحصة القادمة: هل كل ما نقرؤه في الإنترنت صحيح؟ فكّر في ذلك.\n- للطالب: راجع دروس الوحدة الثالثة، وتأكد دائمًا من المعلومات بمصدر موثوق.\n- لولي الأمر: شجع ابنك على سؤال الكبار والتحقق من المعلومات قبل تصديقها أو نشرها.\n- ختام الفصل: احتفظ بأعمالك (المستندات والمقالات) في مجلد منظم على الحاسوب.\n🎮 رابط ألعاب ونشاط الدرس التفاعلي للطالب: https://afuq-edu.github.io/afuq/q/3/it/?l=12\n📚 منصة أ. عبير اليحمدية (الدروس والواجبات): https://alyahmedi352-star.github.io/abeer/"}}]}]</script>
<script>
(function(){
const PL=JSON.parse(document.getElementById('plans').textContent);
const FIELDS=[['outcomes','المخرجات التعليمية'],['levels','المستوى المعرفي',1],['strategies','الاستراتيجيات',1],['resources','المصادر التعليمية',1],['concepts','المفاهيم'],['warmup','التهيئة / التمهيد / التعلم القبلي'],['procedures','إجراءات سير الدرس / الأنشطة التدريسية'],['formative','التقويم التكويني'],['summative','التقويم الختامي'],['notes','ملاحظات ضمن خطة الدراسة الأسبوعية (يشاهدها الطالب وولي الأمر)']];
const SECS={'الصف الأول':['أول/1','أول/2','أول/3','أول/4','أول/5'],'الصف الثالث':['ثالث/1','ثالث/2','ثالث/3','ثالث/4','ثالث/5']};
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem('tahdeer35.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('tahdeer35.'+k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem('tahdeer35.'+k)}catch(e){}}};
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2600)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
let grade=LS.get('grade','الصف الأول');
function done(L){const tr=LS.get('t.'+L.id,{});let n=0;SECS[L.g].forEach(s=>{if(L.periods.every((p,i)=>tr[i+'|'+s]))n++});return {n,tr}}
function renderList(){
 $('#tabs').innerHTML=['الصف الأول','الصف الثالث'].map(k=>`<button class="${grade===k?'on':''}" data-g="${k}">${k}</button>`).join('');
 $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{grade=b.dataset.g;LS.set('grade',grade);renderList()});
 let h='',lastU='';
 PL.filter(p=>p.g===grade).forEach(L=>{
  if(L.u!==lastU){if(lastU)h+='</div>';h+=`<div class="unit">${esc(L.u)}</div><div class="list">`;lastU=L.u}
  const {n,tr}=done(L);
  h+=`<div class="lc" data-id="${L.id}"><b>${esc(L.t)}</b>${L.ours?'<span class="tag">🎬 له عرض تفاعلي في منصتك</span>':''}<small>${L.periods.length} ${L.periods.length>1?'حصتان':'حصة'} • ${esc(L.periods[0].week)}</small><small>نُشر في نور: ${n} من 5 شعب</small><div class="prog">${SECS[L.g].map(s=>`<span class="${L.periods.every((p,i)=>tr[i+'|'+s])?'on':''}">${s}</span>`).join('')}</div></div>`;
 });
 if(lastU)h+='</div>';
 $('#cards').innerHTML=h;
 $('#cards').querySelectorAll('.lc').forEach(c=>c.onclick=()=>{location.hash=c.dataset.id+'/0'});
}
function getP(L,pi){const p=JSON.parse(JSON.stringify(L.periods[pi]));const ed=LS.get('p.'+L.id+'.'+pi,null);if(ed)Object.assign(p.f,ed);return p}
function renderPlan(id,pi){
 const L=PL.find(x=>x.id===id); if(!L){show();return} pi=Math.min(pi,L.periods.length-1);
 const p=getP(L,pi), tr=LS.get('t.'+id,{}), edited=!!LS.get('p.'+id+'.'+pi,null);
 let h=`<div class="ph"><div class="printonly" style="font-weight:800;color:#173F55">تحضير درس — إعداد: أ. عبير صالح اليحمدية • مدرسة مزن المعرفة للصفوف (1-4) • تقنية المعلومات</div>
  <h2>${esc(L.t)}</h2>
  <div class="meta"><b>الصف</b><span>${L.g}</span><b>الوحدة</b><span>${esc(L.u)}</span><b>الحصة</b><span>${pi+1} من ${L.periods.length} — ${esc(p.title)} (35 دقيقة)</span><b>الأسبوع</b><span>${esc(p.week)}</span><b>المرجع</b><span>${esc(p.ref)}</span></div>
  ${L.periods.length>1?`<div class="ptabs">${L.periods.map((x,i)=>`<button data-p="${i}" class="${i===pi?'on':''}">الحصة ${i+1}</button>`).join('')}</div>`:''}
  <div class="acts"><button class="btn soft" id="back">→ كل الدروس</button><button class="btn pri" id="save">💾 حفظ تعديلاتي</button>${edited?'<button class="btn soft" id="reset">↺ النسخة الأصلية</button>':''}<button class="btn soft" id="print">🖨️ طباعة / PDF</button><a class="btn gold" href="https://lms.moe.gov.om/teacher/courses" target="_blank" rel="noopener">فتح نور ↗</a></div>
  <div class="howto">💡 افتحي «إضافة تحضير» في نور بجانب هذه الصفحة. في نور: اكتبي العنوان واختاري الكتاب والفصل. ثم انقري «نسخ» على كل بند هنا والصقيه في البند المقابل بـ <b>Ctrl+V</b>. البنود ذات الرقم الذهبي (المستوى، الاستراتيجيات، المصادر) اختاريها من قوائم نور كما هي مكتوبة هنا. ويمكنك تعديل أي نص بالنقر عليه.</div></div>`;
 h+=`<div class="sec"><div class="hd"><span class="n">ع</span><h3>العنوان</h3><button class="cp" data-c="title">📋 نسخ</button></div><div class="ed" contenteditable data-k="title">${esc(p.f.title||(L.t+(L.periods.length>1?' — الحصة '+(pi+1):'')))}</div></div>`;
 FIELDS.forEach(([k,t,sel],i)=>{
  h+=`<div class="sec${sel?' sel':''}"><div class="hd"><span class="n">${i+1}</span><h3>${t}</h3><button class="cp" data-c="${k}">📋 نسخ${sel?'':' للصق في نور'}</button></div><div class="ed" contenteditable data-k="${k}">${esc(p.f[k]||'')}</div>${sel?'<div class="note">في نور هذا البند قائمة اختيار: حدّدي منها العناصر المكتوبة هنا (وما يبدأ بـ «أخرى:» اختاري له «أخرى»).</div>':''}</div>`;
 });
 h+=`<div class="sec track-sec"><div class="hd"><span class="n">✓</span><h3>متابعة النشر في نور — الحصة ${pi+1}</h3></div><div class="track">${SECS[L.g].map(s=>{const v=tr[pi+'|'+s];return `<label class="${v?'on':''}"><input type="checkbox" data-s="${s}" ${v?'checked':''}>${s}${v?`<small>${v}</small>`:''}</label>`}).join('')}</div><div class="note">ضعي علامة بعد حفظ التحضير في نور لكل شعبة.</div></div>`;
 $('#plan').innerHTML=h; $('#plan').classList.add('open'); $('#list').style.display='none'; window.scrollTo(0,0);
 $('#plan').querySelectorAll('.ptabs button').forEach(b=>b.onclick=()=>{location.hash=id+'/'+b.dataset.p});
 $('#plan').querySelectorAll('.cp').forEach(b=>b.onclick=()=>copy(b));
 $('#plan').querySelectorAll('.track input').forEach(c=>c.onchange=()=>{const t=LS.get('t.'+id,{});const k=pi+'|'+c.dataset.s;if(c.checked)t[k]=new Date().toLocaleDateString('ar-OM');else delete t[k];LS.set('t.'+id,t);renderPlan(id,pi)});
 $('#back').onclick=()=>{history.pushState('',document.title,location.pathname);show()};
 $('#save').onclick=()=>{const o={};$('#plan').querySelectorAll('.ed[data-k]').forEach(e=>o[e.dataset.k]=e.innerText.replace(/\n$/,''));LS.set('p.'+id+'.'+pi,o);toast('حُفظت تعديلاتك على هذا الجهاز ✓');renderPlan(id,pi)};
 const r=$('#reset'); if(r) r.onclick=()=>{if(confirm('إرجاع هذه الحصة إلى النسخة الأصلية؟')){LS.del('p.'+id+'.'+pi);renderPlan(id,pi);toast('أُرجعت النسخة الأصلية')}};
 $('#print').onclick=()=>window.print();
}
async function copy(btn){
 const e=document.querySelector(`.ed[data-k="${btn.dataset.c}"]`); const text=e.innerText.replace(/\n+$/,'');
 const html=text.split('\n').map(l=>l.trim()?esc(l):'').join('<br>');
 let ok=false;
 try{ if(navigator.clipboard&&window.ClipboardItem){await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})]);ok=true} }catch(err){}
 if(!ok){try{await navigator.clipboard.writeText(text);ok=true}catch(err){}}
 if(!ok){const r=document.createRange();r.selectNodeContents(e);const s=getSelection();s.removeAllRanges();s.addRange(r);try{ok=document.execCommand('copy')}catch(err){}s.removeAllRanges()}
 if(ok){const t=btn.textContent;btn.classList.add('done');btn.textContent='✓ نُسخ';setTimeout(()=>{btn.classList.remove('done');btn.textContent=t},1500);toast('نُسخ — الصقيه في نور بـ Ctrl+V')}else toast('تعذّر النسخ، حدّدي النص وانسخيه يدويًّا');
}
function show(){const m=location.hash.slice(1).split('/');if(m[0]&&PL.find(p=>p.id===m[0]))renderPlan(m[0],+(m[1]||0));else{$('#plan').classList.remove('open');$('#list').style.display='';renderList()}}
window.addEventListener('hashchange',show);show();
})();
</script>
