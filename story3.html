<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>قضايا المحقّق الرقمي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
<script>(function(){try{var r=document.documentElement,g=function(k){var v=localStorage.getItem('abeer.'+k);return v===null?null:JSON.parse(v)};r.dataset.palette=g('pal')||'blue';var t=g('theme');if(t)r.dataset.theme=t}catch(e){}})()</script>
<style>
:root{--brand:#173F55;--brand-2:#225C78;--brand-3:#0F2C3C;--gold:#D9A64E;--gold-2:#F2CF8A;--bg:#EEF3F4;--paper:#fff;--file:#FBF3E2;--file-2:#F3E3C0;--line:#E2D3B0;--text:#1C2A31;--muted:#5E7079;--ok:#2E9A60;--no:#C2453A}
:root[data-palette="maroon"]{--brand:#6E1A31;--brand-2:#8E2A45;--brand-3:#4A0F21}
:root[data-palette="green"]{--brand:#1E5A47;--brand-2:#2C7A61;--brand-3:#123C2F}
:root[data-palette="gold"]{--brand:#7A5520;--brand-2:#9C7030;--brand-3:#4F3612}
:root[data-palette="night"]{--brand:#141C2B;--brand-2:#26324A;--brand-3:#0A0F18}
:root[data-palette="brown"]{--brand:#4A3326;--brand-2:#6E4B35;--brand-3:#2F2018}
:root[data-palette="violet"]{--brand:#35295A;--brand-2:#4C3D80;--brand-3:#22193D}
:root[data-palette="sea"]{--brand:#0E4A57;--brand-2:#16707E;--brand-3:#08313A}
:root[data-palette="olive"]{--brand:#38461F;--brand-2:#566A32;--brand-3:#232D12}
:root[data-palette="mint"]{--brand:#2F6F68;--brand-2:#4A9A8F;--brand-3:#1E4A45}
:root[data-palette="lavender"]{--brand:#5A4E8C;--brand-2:#7B6FB0;--brand-3:#3A3260}
:root[data-palette="sky"]{--brand:#2E6A8E;--brand-2:#4C8DB5;--brand-3:#1C4560}
:root[data-palette="turq"]{--brand:#1F7A80;--brand-2:#35A3A8;--brand-3:#13504F}
:root[data-palette="rose"]{--brand:#8A4F5E;--brand-2:#B07282;--brand-3:#5C3240}
:root[data-palette="sage"]{--brand:#5E7458;--brand-2:#809A79;--brand-3:#3E4F3A}
:root[data-palette="sand"]{--brand:#8A6A45;--brand-2:#B08E62;--brand-3:#5C4529}
:root[data-palette="sunset"]{--brand:#9A5B3F;--brand-2:#C98657;--brand-3:#663A27}

:root[data-theme="dark"]{--bg:#0E1A21;--paper:#16262F;--file:#1E2C33;--file-2:#2A3A40;--line:#3A4C52;--text:#E3EDF0;--muted:#9DB3BB;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A21;--paper:#16262F;--file:#1E2C33;--file-2:#2A3A40;--line:#3A4C52;--text:#E3EDF0;--muted:#9DB3BB;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:1.1rem/1.75 Tajawal,Tahoma,Arial,sans-serif;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 18%,color-mix(in srgb,var(--brand-2) 14%,transparent),transparent 40%),radial-gradient(circle at 90% 85%,color-mix(in srgb,var(--gold) 16%,transparent),transparent 40%)}
main{max-width:1180px;margin:auto;padding:16px 18px 10px;position:relative}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.2rem;color:var(--brand)}
:root[data-theme="dark"] .brand{color:var(--gold-2)}
.brand .mg{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:var(--gold-2);font-size:1.3rem;box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 30%,transparent);animation:scan 3.2s ease-in-out infinite}
@keyframes scan{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(12deg) scale(1.06)}}
.lsn{color:var(--muted);font-weight:800;font-size:.92rem}
.dots{margin-inline-start:auto;display:flex;gap:6px;align-items:center}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line);transition:.3s}.dots i.on{background:var(--gold);transform:scale(1.15)}.dots i.cur{box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 35%,transparent)}
.wrap{display:grid;grid-template-columns:1.08fr .92fr;gap:16px;align-items:stretch;margin-top:34px}h1:focus{outline:none}.board:has(.badge){display:flex;flex-direction:column;justify-content:center}
/* ملف القضية */
.file{position:relative;background:linear-gradient(180deg,var(--file),var(--file-2));border:2px solid var(--line);border-radius:6px 26px 26px 26px;padding:30px clamp(18px,3.5vw,40px) 22px;box-shadow:0 14px 40px rgba(15,44,60,.12);min-width:0}
.file::before{content:attr(data-tab);position:absolute;top:-2px;right:-2px;transform:translateY(-100%);background:var(--file-2);border:2px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;padding:4px 18px;font-weight:900;font-size:.85rem;color:var(--brand)}
:root[data-theme="dark"] .file::before{color:var(--gold-2)}
.clip{position:absolute;top:-14px;left:34px;width:22px;height:54px;border:4px solid #9AA7AE;border-radius:12px;border-bottom-color:transparent}
.secret{position:absolute;top:16px;left:22px;color:var(--no);border:3px solid var(--no);border-radius:8px;padding:0 10px;font-weight:900;transform:rotate(-12deg);opacity:.8;font-size:.95rem;letter-spacing:1px}
small.step{color:var(--brand-2);font-weight:900;font-size:.9rem}
:root[data-theme="dark"] small.step{color:var(--gold-2)}
h1{font-size:clamp(1.5rem,3.6vw,2.3rem);line-height:1.3;margin:.15em 0 .3em;font-weight:900;color:var(--brand)}
:root[data-theme="dark"] h1{color:#fff}
p{margin:6px 0}
.say{display:flex;gap:10px;align-items:flex-start;margin:12px 0}
.say img{width:58px;height:58px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);background:#fff;flex:none}
.say div{background:var(--paper);border:2px solid var(--line);border-radius:4px 18px 18px 18px;padding:8px 14px;font-weight:700;position:relative}
.say b{display:block;font-size:.82rem;color:var(--brand-2)}
.q{display:block;margin:12px 0 8px;font-weight:900;font-size:1.12rem}
.opts{display:grid;gap:9px}
.opts button{display:flex;align-items:center;gap:10px;text-align:start;font:inherit;font-weight:800;color:var(--text);background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:10px 14px;cursor:pointer;transition:.2s}
.opts button:hover{border-color:var(--gold);transform:translateX(-3px)}
.opts button .k{width:30px;height:30px;border-radius:50%;background:color-mix(in srgb,var(--brand-2) 14%,transparent);display:grid;place-items:center;flex:none;font-size:.9rem}
.opts button.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--paper))}
.opts button.ok .k{background:var(--ok);color:#fff}
.opts button.no{border-color:var(--no);animation:shake .4s}
@keyframes shake{25%{transform:translateX(6px)}50%{transform:translateX(-6px)}75%{transform:translateX(3px)}}
.opts.done button:not(.ok){opacity:.55;pointer-events:none}
.fb{min-height:1.8em;font-weight:800;margin-top:10px;font-size:1rem}.fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
.fact{display:none;margin-top:8px;background:var(--paper);border-inline-start:5px solid var(--gold);border-radius:0;padding:8px 12px;font-size:.98rem}
.fact.show{display:block;animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
.nav{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.btn{font:inherit;font-weight:900;border:0;border-radius:14px;padding:10px 18px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--brand-2) 14%,var(--paper));color:var(--text)}
.btn.pri{background:linear-gradient(135deg,var(--gold),var(--gold-2));color:#2A1C05;box-shadow:0 6px 16px rgba(217,166,78,.35)}
.btn:focus-visible,.opts button:focus-visible{outline:3px solid var(--brand-2);outline-offset:3px}
.pop{animation:pop .45s cubic-bezier(.2,1.5,.4,1)}@keyframes pop{from{transform:scale(.6);opacity:0}}
/* لوحة الأدلة */
.board{position:relative;border-radius:26px;padding:20px;background:linear-gradient(160deg,var(--brand-3),var(--brand) 60%,var(--brand-2));color:#fff;overflow:hidden;min-width:0;box-shadow:0 14px 40px rgba(15,44,60,.22)}
.board::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1.2px,transparent 1.3px);background-size:18px 18px;pointer-events:none}
.board h2{margin:0 0 12px;font-size:1.05rem;font-weight:900;color:var(--gold-2);display:flex;align-items:center;gap:8px;position:relative}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:14px;position:relative}
.slot{position:relative;background:rgba(255,255,255,.08);border:2px dashed rgba(242,207,138,.45);border-radius:16px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px 8px;transition:.3s}
.slot .pin{position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--no);box-shadow:0 2px 4px rgba(0,0,0,.4)}
.slot .lk{font-size:2rem;opacity:.6}.slot .nm{font-weight:800;font-size:.85rem;opacity:.8}
.slot.cur{border-color:var(--gold);background:rgba(242,207,138,.12);animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(242,207,138,.18)}}
.slot.got{background:#FFFDF6;color:#1C2A31;border:0;transform:rotate(var(--r,-2deg));box-shadow:0 8px 18px rgba(0,0,0,.3)}
.slot.got .ic{font-size:2.6rem;line-height:1.1}.slot.got .nm{opacity:1;color:#173F55;font-weight:900}
.slot .dg{position:absolute;bottom:8px;left:8px;width:44px;height:44px;border-radius:50%;border:3px solid var(--no);color:var(--no);display:grid;place-items:center;font-weight:900;font-size:1.4rem;transform:rotate(-14deg);background:rgba(255,255,255,.7)}
.slot.new{animation:stamp .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:scale(1.6) rotate(8deg);opacity:0}100%{transform:scale(1) rotate(var(--r,-2deg));opacity:1}}
.code{position:relative;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(0,0,0,.22);border-radius:16px;padding:10px}
.code span{font-weight:800;color:var(--gold-2);font-size:.9rem;margin-inline-end:4px}
.code b{width:40px;height:46px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:1.5rem;font-weight:900}
.code b.on{background:var(--gold);color:#2A1C05}
.ids{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;position:relative}
.id{background:#FFFDF6;color:#1C2A31;border-radius:16px;padding:10px;width:170px;text-align:center;box-shadow:0 10px 22px rgba(0,0,0,.3);transform:rotate(var(--r));animation:float 4s ease-in-out infinite}
.id:nth-child(2){animation-delay:-2s}
@keyframes float{50%{transform:rotate(var(--r)) translateY(-6px)}}
.id img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;border:3px solid var(--gold);display:block}
.id b{display:block;margin-top:6px;font-weight:900;color:#173F55}.id small{display:block;font-weight:800;color:#8A5A00;font-size:.78rem}
.big{position:relative;text-align:center;font-size:4.5rem;margin:14px 0 6px;animation:float 3s ease-in-out infinite}
.mglass{position:absolute;font-size:2.4rem;opacity:.85;animation:roam 9s ease-in-out infinite;pointer-events:none;z-index:2}
@keyframes roam{0%,100%{top:8%;left:6%}25%{top:46%;left:62%}50%{top:70%;left:18%}75%{top:22%;left:72%}}
/* القفل */
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center;margin-top:12px}
.pad button{font:inherit;font-weight:900;font-size:1.3rem;height:56px;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--text);cursor:pointer}
.pad button:hover{border-color:var(--gold)}
.entry{display:flex;gap:8px;justify-content:center;direction:ltr;margin-top:6px}
.entry b{width:50px;height:58px;border-radius:12px;border:3px solid var(--line);background:var(--paper);display:grid;place-items:center;font-size:1.7rem;font-weight:900}
.entry.no{animation:shake .4s}.entry.no b{border-color:var(--no)}.entry.ok b{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--paper))}
.safe{position:relative;width:180px;height:180px;margin:10px auto;border-radius:24px;background:linear-gradient(145deg,#8796A0,#55646D);box-shadow:inset 0 0 0 8px rgba(0,0,0,.18),0 12px 24px rgba(0,0,0,.35);display:grid;place-items:center}
.safe i{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle,#D7DEE2 30%,#9AA7AE 32%,#C7D0D5 60%,#7D8B93 62%);transition:transform 1.2s cubic-bezier(.2,.8,.2,1);position:relative}
.safe i::after{content:"";position:absolute;top:8px;left:50%;width:6px;height:22px;margin-left:-3px;background:#3B4A52;border-radius:3px}
.safe.open i{transform:rotate(540deg)}
.safe .st{position:absolute;inset:auto 0 -40px;text-align:center;font-weight:900;color:var(--gold-2)}
/* الشارة */
.badge{display:block;width:min(300px,90%);margin:6px auto}
.learn{list-style:none;padding:0;margin:8px 0}.learn li{padding:3px 0}.learn li::before{content:"✔️ "}
.conf i{position:fixed;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall 3s linear forwards;z-index:9;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
footer{text-align:center;font-size:.88rem;padding:16px;color:var(--muted)}
[hidden]{display:none!important}
@media(max-width:820px){.wrap{grid-template-columns:1fr}.board{order:-1}.slot{min-height:120px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body><main>
<header><div class="brand"><span class="mg">🔍</span>قضايا المحقّق الرقمي</div><span class="lsn" id="lsn"></span><div class="dots" id="dots"></div></header>
<section class="wrap">
 <div class="file" id="file" data-tab="ملف القضية"><span class="clip"></span><span class="secret">سرّي</span>
  <small class="step" id="step"></small><h1 id="title" tabindex="-1"></h1>
  <div id="body"></div>
  <p class="fb" id="fb" aria-live="polite"></p>
  <div class="nav" id="nav"></div>
 </div>
 <aside class="board" id="board" aria-label="لوحة الأدلة"></aside>
</section>
<footer>إعداد الأستاذة عبير صالح اليحمدية</footer>
</main>

const el=id=>document.getElementById(id), AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const WHO={m:['مريم',()=>IMG.girl],s:['سالم',()=>IMG.boy]};
let D,step=0,got={},entry='';
function tone(f,d,t=0){try{const a=window._ac||(window._ac=new(window.AudioContext||window.webkitAudioContext)());const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.12,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+d);o.connect(g);g.connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+d)}catch(e){}}
const N=()=>D.clues.length, LOCK=()=>N()+1, END=()=>N()+2;
const code=()=>D.clues.map(c=>String(c.digit)).join('');
function say(who,txt){const w=WHO[who]||WHO.m;return `<div class="say"><img src="${w[1]()}" alt="${w[0]}"><div><b>${w[0]}</b>${esc(txt)}</div></div>`}
function btn(label,fn,pri){const b=document.createElement('button');b.type='button';b.className='btn'+(pri?' pri':'');b.innerHTML=label;b.onclick=fn;el('nav').append(b);return b}
function go(n){step=n;entry='';render();el('title').focus({preventScroll:true});window.scrollTo({top:0,behavior:'smooth'})}
function confetti(){const c=document.createElement('div');c.className='conf';const C=['#D9A64E','#F2CF8A','#2E9A60','#E98AA8','#8FD3F4','#fff'];for(let i=0;i<40;i++){const x=document.createElement('i');x.style.left=Math.random()*100+'vw';x.style.background=C[i%C.length];x.style.animationDelay=Math.random()*.8+'s';x.style.animationDuration=2+Math.random()*1.5+'s';c.append(x)}document.body.append(c);setTimeout(()=>c.remove(),4200)}
function dots(){el('dots').innerHTML=Array.from({length:N()+2},(_,i)=>`<i class="${i+1<step||(i+1===step&&got[i])||step>i+1?'on':''} ${i+1===step?'cur':''}"></i>`).join('')}
function board(){
 const b=el('board');
 if(step===0){b.innerHTML=`<h2>🪪 بطاقات المحقّقَين</h2><div class="ids"><div class="id" style="--r:3deg"><img src="${IMG.girl}" alt="مريم"><b>مريم</b><small>محقّقة رقمية</small></div><div class="id" style="--r:-3deg"><img src="${IMG.boy}" alt="سالم"><b>سالم</b><small>محقّق رقمي</small></div></div><div class="big">${esc(D.icon||'🧰')}</div><span class="mglass">🔍</span>`;return}
 if(step===END()){b.innerHTML=badgeSVG();return}
 const slots=D.clues.map((c,i)=>{const r=(i%2?2.5:-2.5);
  if(got[i])return `<div class="slot got${got[i]==='new'?' new':''}" style="--r:${r}deg"><span class="pin"></span><div class="ic">${esc(c.icon)}</div><div class="nm">${esc(c.name)}</div><span class="dg">${AR(c.digit)}</span></div>`;
  return `<div class="slot${i+1===step?' cur':''}"><span class="pin"></span><div class="lk">${i+1===step?'🔍':'🔒'}</div><div class="nm">الدليل ${AR(i+1)}</div></div>`}).join('');
 b.innerHTML=`<h2>📌 لوحة الأدلة</h2><div class="slots">${slots}</div><div class="code"><span>رمز القفل:</span>${D.clues.map((c,i)=>`<b class="${got[i]?'on':''}">${got[i]?AR(c.digit):'؟'}</b>`).join('')}</div>`;
 Object.keys(got).forEach(k=>{if(got[k]==='new')got[k]=1});
}
function render(){
 el('lsn').textContent=D.lesson; el('fb').textContent=''; el('fb').className='fb'; el('nav').replaceChildren();
 const body=el('body'), n=N();
 el('file').dataset.tab='ملف القضية رقم '+AR(D.caseNo||1);
 if(step===0){
  el('step').textContent='🚨 بلاغ جديد'; el('title').textContent=D.title;
  body.innerHTML=`<p>${esc(D.intro)}</p>${(D.talk||[]).map(([w,t])=>say(w,t)).join('')}<p style="font-weight:800">🎯 مهمّتك: اكشف ${AR(n)} أدلة، واجمع أرقامها لتفتح ${esc(D.lock.name)}.</p>`;
  btn('🔍 افتح ملف القضية',()=>go(1),true);
 } else if(step<=n){
  const c=D.clues[step-1], done=!!got[step-1];
  el('step').textContent='الدليل '+AR(step)+' من '+AR(n); el('title').textContent=c.title;
  body.innerHTML=`${c.text?`<p>${esc(c.text)}</p>`:''}${c.say?say(c.who||'m',c.say):''}<strong class="q">❓ ${esc(c.q)}</strong><div class="opts${done?' done':''}" id="opts"></div><div class="fact${done?' show':''}" id="fact">🗂️ <b>معلومة الدليل:</b> ${esc(c.fact)}</div>`;
  const box=el('opts');
  c.options.forEach(([label,ok,msg],i)=>{const b=document.createElement('button');b.type='button';b.innerHTML=`<span class="k">${'أبجد'[i]||i+1}</span><span>${esc(label)}</span>`;if(done&&ok)b.classList.add('ok');
   b.onclick=()=>{ if(got[step-1])return; el('fb').textContent=msg||'';
    if(ok){b.classList.add('ok');box.classList.add('done');got[step-1]='new';el('fb').className='fb ok';el('fact').classList.add('show');tone(660,.15);tone(880,.2,.1);tone(1175,.25,.22);board();dots();navs()}
    else{b.classList.remove('no');void b.offsetWidth;b.classList.add('no');el('fb').className='fb no';tone(300,.2)} };
   box.append(b)});
 } else if(step===LOCK()){
  el('step').textContent='🔐 اللحظة الحاسمة'; el('title').textContent=D.lock.title;
  body.innerHTML=`<p>${esc(D.lock.text)}</p>${D.lock.say?say(D.lock.who||'s',D.lock.say):''}<div class="safe" id="safe"><i></i></div><div class="entry" id="entry"></div><div class="pad" id="pad"></div>`;
  const pad=el('pad');[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].forEach(k=>{const b=document.createElement('button');b.type='button';b.textContent=typeof k==='number'?AR(k):k;b.setAttribute('aria-label',k==='⌫'?'مسح':k==='✓'?'تأكيد':String(k));
   b.onclick=()=>{ if(el('safe').classList.contains('open'))return;
    if(k==='⌫')entry=entry.slice(0,-1); else if(k==='✓')return check(); else if(entry.length<n){entry+=k;tone(520+entry.length*60,.08)}
    showEntry(); if(entry.length===n)check()};pad.append(b)});
  showEntry();
 } else {
  el('step').textContent='✅ أُغلقت القضية'; el('title').textContent=D.end.title;
  body.innerHTML=`<p>${esc(D.end.text)}</p>${D.end.say?say(D.end.who||'m',D.end.say):''}<p style="font-weight:900;margin-top:10px">📚 ماذا تعلّمت في هذه القضية؟</p><ul class="learn">${(D.end.learned||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
 }
 board(); dots(); navs();
}
function showEntry(){const e=el('entry');e.className='entry';e.innerHTML=Array.from({length:N()},(_,i)=>`<b>${entry[i]!==undefined?AR(entry[i]):''}</b>`).join('')}
function check(){const e=el('entry');
 if(entry===code()){e.classList.add('ok');el('safe').classList.add('open');el('fb').className='fb ok';el('fb').textContent='🎉 فُتح القفل! أحسنت أيها المحقّق.';[523,659,784,1046].forEach((f,i)=>tone(f,.3,i*.13));confetti();navs()}
 else{e.classList.remove('no');void e.offsetWidth;e.classList.add('no');el('fb').className='fb no';el('fb').textContent='الرمز غير صحيح. انظر إلى أرقام الأدلة في لوحة الأدلة بالترتيب.';tone(260,.25);entry='';setTimeout(showEntry,450)}}
function navs(){const n=el('nav');n.replaceChildren();const N0=N();
 if(step===0){btn('🔍 افتح ملف القضية',()=>go(1),true);return}
 if(step<=N0){ if(got[step-1])btn(step===N0?'🔐 إلى القفل ←':'الدليل التالي ←',()=>go(step+1),true).classList.add('pop'); btn('→ السابق',()=>go(step-1)); return}
 if(step===LOCK()){ if(el('safe')&&el('safe').classList.contains('open'))btn('🏅 أغلق القضية ←',()=>go(END()),true).classList.add('pop'); btn('→ السابق',()=>go(step-1)); return}
 btn('⬇️ حفظ الشارة',saveBadge,true); btn('🔁 أعد القضية',()=>{got={};go(0)});
 if(D.back){const a=document.createElement('a');a.className='btn';a.href=D.back;a.textContent='🏠 العودة إلى المنصة';n.append(a)}
 if(step===END())confetti();
}
function lno(){const m=String(D.lesson).match(/(\d)\s*[\.:]\s*(\d)/);return 'الصف الثالث · الدرس '+(m?AR(m[1])+'٫'+AR(m[2]):'')}

 return `<svg class="badge" id="badge" viewBox="0 0 300 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="شارة محقّق رقمي">

function saveBadge(){const svg=el('badge');if(!svg)return;const xml=new XMLSerializer().serializeToString(svg);const im=new Image();
 im.onload=()=>{const c=document.createElement('canvas');c.width=900;c.height=990;const x=c.getContext('2d');x.drawImage(im,0,0,900,990);
  c.toBlob(b=>{if(!b){el('fb').textContent='تعذّر تجهيز الشارة.';return}const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='شارة المحقق الرقمي - '+(D.badge||'قضية')+'.png';l.click();setTimeout(()=>URL.revokeObjectURL(l.href),3000);el('fb').className='fb ok';el('fb').textContent='الشارة جاهزة للتنزيل 🏅'})};
 im.onerror=()=>el('fb').textContent='تعذّر تجهيز الشارة في هذا المتصفّح.';
 im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(xml)}
