:root[data-theme="dark"]{--bg:#0E1A21;--paper:#16262F;--text:#E3EDF0;--muted:#9DB3BB;--line:#27404B;--chip:#1F3540;color-scheme:dark}

.top img{width:52px;height:52px;border-radius:50%;background:#fff;padding:3px}

function readQ(){ const q=S.qs[S.i]; speak(q.q+' . '+q.o.map(o=>o[0]).join(' ، ')); }
function pick(k){ if(S.locked) return; S.locked=true; clearInterval(timerH); try{speechSynthesis.cancel()}catch(e){}
  const q=S.qs[S.i], u=S.u; const btns=[...document.querySelectorAll('.opt')]; btns.forEach(b=>b.disabled=true);
  const ci=q.o.findIndex(o=>o[1]); btns[ci].classList.add('ok');
  let msg;
  if(k===ci){ const pts=Math.max(20,Math.round(100*S.left/u.time)); S.score+=pts; S.right++; sfx.ok(); msg=`<span class="pts">✅ أحسنت! +${pts} نقطة</span><br>${esc(q.e)}`; }
  else { if(k>=0) btns[k].classList.add('no'); sfx.no(); msg=`${k<0?'⏰ انتهى الوقت!':'❌ ليست هذه الإجابة.'} الإجابة الصحيحة: <b>${esc(q.o[ci][0])}</b><br>${esc(q.e)}`; }
  const ex=$('#exp'); ex.innerHTML=msg+`<div class="acts"><button class="btn" onclick="next()">${S.i+1<S.qs.length?'السؤال التالي ←':'النتيجة 🏆'}</button></div>`; ex.classList.add('on'); }
function next(){ S.i++; if(S.i<S.qs.length) ask(); else end(); }
function starsOf(){ const p=S.right/S.qs.length; return p>=.9?3:p>=.6?2:p>0?1:0 }
function end(){ const st=starsOf(); sfx.win(); if(st>=2) confetti();
  const msg=st===3?'بطل حقيقي! 🌟':st===2?'أداء رائع! 👏':st===1?'بداية جيدة، حاول مرة أخرى لتجمع نجومًا أكثر 💪':'لا بأس، راجع الدرس وحاول من جديد 💪';
  $('#app').innerHTML=`<div class="end"><h1>انتهى التحدي!</h1><div class="stars">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div>
  <p style="font-size:1.2rem;font-weight:900;margin:0">${msg}</p>
  <div class="stats"><div class="stat"><b>${S.right}/${S.qs.length}</b>إجابات صحيحة</div><div class="stat"><b>${S.score}</b>نقطة</div><div class="stat"><b>${st}</b>نجوم</div></div>
  <div class="noprint"><label style="font-weight:800">اكتب اسمك لتحصل على الشهادة:</label><br><input class="in" id="nm" placeholder="اسمك هنا" maxlength="40"><div class="acts" style="justify-content:center"><button class="btn gold" onclick="cert()">احصل على الشهادة 🏅</button><button class="btn ghost" onclick="start(S.key)">أعد المحاولة</button><button class="btn ghost" onclick="location.hash=''">مسابقة أخرى</button></div></div>
  <div id="cert"></div></div>`; }
function cert(){ const n=($('#nm').value||'').trim(); if(!n){$('#nm').focus();return} sfx.win(); confetti();
  const d=new Date().toLocaleDateString('ar-OM',{day:'numeric',month:'long',year:'numeric'});
  $('#cert').innerHTML=`<div class="cert"><img src="903b5f133dc801a5866fccf3307ee053.jpg" alt=""><h2>شهادة حصاد الوحدة</h2><div>تُمنح هذه الشهادة للبطل/ة</div><div class="nm">${esc(n)}</div><div>لإتمامه/ا حصاد <b>${esc(S.u.unit)}</b> — ${esc(S.u.grade)}</div><div style="margin-top:6px">بنتيجة <b>${S.score}</b> نقطة و ${'⭐'.repeat(starsOf())||'—'}</div><div class="muted" style="color:#5E7079;margin-top:6px">${d}</div><div class="by">إعداد الأستاذة عبير صالح اليحمدية</div></div>
  <div class="acts noprint" style="justify-content:center"><button class="btn" onclick="print()">🖨️ طباعة / حفظ PDF</button></div>`;
  $('#cert').scrollIntoView({behavior:'smooth'}); }
function route(){ const k=location.hash.slice(1); if(DATA[k]) intro(k); else home(); }
addEventListener('hashchange',route); route();
</script></body></html>
