<style>

:root[data-theme="dark"]{--bg:#0E1A21;--paper:#16262F;--text:#E3EDF0;--muted:#9DB3BB;--line:#27404B;--chip:#1F3540;color-scheme:dark}

const ICO={"g1u1": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"12\" rx=\"2\"/><path d=\"M9 20h6M12 16v4\"/><path d=\"M7 8h6M7 11h4\"/></svg>", "g1u2": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3a9 9 0 1 0 0 18c1.2 0 2-.8 2-1.8 0-.5-.2-.9-.5-1.2-.3-.4-.5-.8-.5-1.2 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z\"/><circle cx=\"7.5\" cy=\"10.5\" r=\"1.2\"/><circle cx=\"11\" cy=\"7\" r=\"1.2\"/><circle cx=\"15.5\" cy=\"8\" r=\"1.2\"/></svg>", "g3u1": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"7\" y=\"3\" width=\"10\" height=\"17\" rx=\"5\"/><path d=\"M12 3v6\"/><path d=\"M3 21h3M18 21h3\"/></svg>", "g3u2": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 20l5-14h1l5 14\"/><path d=\"M6 15h7\"/><path d=\"M15 20h6\"/><path d=\"M17 4l3 3-6 6h-3v-3z\"/></svg>"};
const ic=k=>ICO[k]||ICO.g1u1;
const icL=l=>ic((l.g==='الصف الأول'?'g1':'g3')+(l.u.includes('الأولى')?'u1':'u2'));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let AC=null;function tone(f,d=.12,type='sine',v=.08,delay=0){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
const sfx={ok:()=>{tone(523,.12);tone(659,.12,'sine',.08,.1);tone(784,.22,'sine',.08,.2)},no:()=>{tone(300,.18,'triangle',.07);tone(220,.25,'triangle',.06,.15)},pick:()=>tone(700,.06,'triangle',.05),win:()=>{[523,659,784,1046].forEach((f,k)=>tone(f,.25,'sine',.08,k*.13))}};
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[^\u0600-\u06FF\s\d…،؟A-Za-z+]/g,' '));u.lang='ar-SA';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}
function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cols=['#D9A64E','#F2CF8A','#2F8A57','#2F6FB3','#C8443B','#fff'];for(let k=0;k<40;k++){const c=document.createElement('i');c.className='confetti';c.style.background=cols[k%6];c.style.left=(30+Math.random()*40)+'vw';c.style.top='35vh';document.body.appendChild(c);const dx=(Math.random()-.5)*700,dy=-200-Math.random()*300;c.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${dx}px,${dy}px) rotate(${Math.random()*720}deg)`,opacity:1,offset:.5},{transform:`translate(${dx*1.2}px,${dy+600}px) rotate(1080deg)`,opacity:0}],{duration:1800+Math.random()*600}).onfinish=()=>c.remove()}}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const vis=v=>!v?'':/\.jpg$/.test(v)?`<span class="vis"><img src="${v}" alt=""></span>`:([...v].length>4?`<span class="vt">${esc(v)}</span>`:`<span class="vis">${esc(v)}</span>`);
const PIXC={K:'#1A1A1A',C:'#29B6D1',R:'#C8443B',G:'#7AC143',O:'#F07A1E',Y:'#F2C94C'};
let S=null;
function home(){ const g={};Object.entries(DATA).forEach(([k,l])=>{const key=l.g+' — '+l.u;(g[key]=g[key]||[]).push([k,l])});
  $('#app').innerHTML=`<span class="badge">الصف الأول والصف الثالث</span><h1>اختر واجبك</h1><p style="margin:0">أجب عن الأسئلة، وفي النهاية اكتب اسمك لتحصل على شهادة إتمام الواجب 🏅</p>`+
  Object.entries(g).map(([u,ls])=>`<h3 style="margin:18px 0 8px;font-weight:900">${esc(u)}</h3><div class="units">${ls.map(([k,l])=>`<button class="ucard" onclick="location.hash='${k}'"><span class="e">${icL(l)}</span><b>${esc(l.t.split(': ')[1]||l.t)}</b><small>${esc(l.t.split(':')[0])} · ${l.qs.length} أسئلة</small></button>`).join('')}</div>`).join(''); }
function intro(k){ const l=DATA[k];
  $('#app').innerHTML=`<span class="badge">${esc(l.u)} · ${esc(l.g)}</span><h1>واجب ${esc(l.t)}</h1>
  <div class="stats"><div class="stat"><b>${l.qs.length}</b>أسئلة</div><div class="stat"><b>✏️</b>أسئلة تفاعلية</div><div class="stat"><b>🏅</b>شهادة</div></div>
  <ul class="rules"><li>اقرأ السؤال جيدًا.</li><li>اختر إجابتك ثم اضغط <b>تحقّق</b>.</li><li>بعد كل سؤال يظهر الشرح لتتعلّم أكثر.</li></ul>
  <div class="acts"><button class="btn gold" onclick="start('${k}')">ابدأ الواجب ✏️</button><button class="btn ghost" onclick="location.hash=''">واجب آخر</button></div>`; }
function start(k){ const l=DATA[k]; S={k,l,i:0,score:0,qs:l.qs}; ask(); }
function ask(){ const q=S.qs[S.i]; S.st={}; S.done=false;
  let h=`<div class="hud"><span class="pill">السؤال ${S.i+1} من ${S.qs.length}</span><span class="pill">⭐ ${S.score}</span><span class="sp"></span></div>
  <div class="bar"><i style="width:${S.i/S.qs.length*100}%"></i></div><div class="q">${esc(q.q)}</div>`;
  if(q.type==='choice'||q.type==='multi'||q.type==='pix'){ S.order=shuffle(q.opts.map((o,j)=>j));
    if(q.type==='pix'){const w=q.pix[0].length;h+=`<div class="pix" style="grid-template-columns:repeat(${w},28px)">${q.pix.join('').split('').map(c=>`<i style="${PIXC[c]?'background:'+PIXC[c]:''}"></i>`).join('')}</div>`}
    h+=`<div class="opts">${S.order.map(j=>{const o=q.opts[j];const v=q.type==='pix'?`<span class="vis" style="width:30px;height:30px;border-radius:50%;background:${PIXC[o[1]]};display:inline-block"></span>`:vis(o[1]);return `<button class="opt" data-j="${j}" onclick="tog(${j})">${v}${esc(o[0])}</button>`}).join('')}</div>`; }
  else if(q.type==='tf'){ h+=`<div class="tfrow"><button class="opt" data-j="1" onclick="tog(1)" style="justify-content:center">✅ صح</button><button class="opt" data-j="0" onclick="tog(0)" style="justify-content:center">❌ خطأ</button></div>`; }
  else if(q.type==='match'){ S.L=shuffle(q.pairs.map((p,j)=>j)); S.R=shuffle(q.pairs.map((p,j)=>j)); S.st={sel:null,map:{}};
    h+=`<p class="muted" style="margin-top:-8px">اضغط على الكلمة في اليمين، ثم على ما يناسبها في اليسار.</p><div class="mgrid"><div class="mcol">${S.L.map(j=>`<button class="mi" data-l="${j}" onclick="mL(${j})">${esc(q.pairs[j][0])}</button>`).join('')}</div><div class="mcol">${S.R.map(j=>`<button class="mi" data-r="${j}" onclick="mR(${j})">${vis(q.pairs[j][1])}</button>`).join('')}</div></div>`; }
  else if(q.type==='sort'){ S.st={sel:null,put:{}}; S.order=shuffle(q.items.map((x,j)=>j));
    h+=`<p class="muted" style="margin-top:-8px">اضغط على البطاقة ثم على الصندوق المناسب.</p><div class="pool" id="pool">${S.order.map(j=>`<button class="mi" data-s="${j}" onclick="event.stopPropagation();sSel(${j})">${vis(q.items[j][1])} ${esc(q.items[j][0])}</button>`).join('')}</div>
    <div class="bins">${q.bins.map((b,bi)=>`<div class="bin" data-b="${bi}" onclick="sPut(${bi})"><h4>${esc(b)}</h4></div>`).join('')}</div>`; }
  else if(q.type==='type'){ h+=`<input class="tin" id="tin" autocomplete="off" placeholder="اكتب هنا…">`; }
  h+=`<div class="acts"><button class="btn" id="chk" onclick="check()">تحقّق ✔</button></div><div class="exp" id="exp"></div>`;
  $('#app').innerHTML=h; if(q.type==='type') setTimeout(()=>$('#tin')&&$('#tin').focus(),300); }
function readQ(){ const q=S.qs[S.i]; let t=q.q; if(q.opts) t+=' . '+q.opts.map(o=>o[0]).join(' ، '); speak(t); }
function tog(j){ if(S.done) return; sfx.pick(); const q=S.qs[S.i];
  if(q.type==='multi'){ S.st[j]=!S.st[j]; document.querySelector(`.opt[data-j="${j}"]`).classList.toggle('on',S.st[j]); }
  else { S.st={c:j}; document.querySelectorAll('.opt').forEach(b=>b.classList.toggle('on',+b.dataset.j===j)); } }
const PC=['p0','p1','p2','p3','p4','p5'];
function mL(j){ if(S.done||S.st.map[j]!==undefined) return; sfx.pick(); S.st.sel=j; document.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('sel',+b.dataset.l===j)); }
function mR(r){ if(S.done||S.st.sel===null) return; if(Object.values(S.st.map).includes(r)) return; const j=S.st.sel; S.st.map[j]=r; S.st.sel=null; sfx.pick();
  const n=Object.keys(S.st.map).length-1; const c=PC[n%6];
  const lb=document.querySelector(`[data-l="${j}"]`); lb.classList.remove('sel'); lb.classList.add(c); lb.insertAdjacentHTML('beforeend',` <span class="tg">${n+1}</span>`);
  const rb=document.querySelector(`[data-r="${r}"]`); rb.classList.add(c); rb.insertAdjacentHTML('beforeend',` <span class="tg">${n+1}</span>`); }
function sSel(j){ if(S.done) return; sfx.pick(); S.st.sel=j; document.querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('sel',+b.dataset.s===j)); }
function sPut(bi){ if(S.done||S.st.sel===null) return; const j=S.st.sel; S.st.put[j]=bi; S.st.sel=null; sfx.pick();
  const b=document.querySelector(`[data-s="${j}"]`); b.classList.remove('sel'); document.querySelector(`.bin[data-b="${bi}"]`).appendChild(b); }
function norm(s){ return String(s).replace(/[\u064B-\u0652\u0640]/g,'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[\s،,.-]/g,'').replace(/[أإآ]/g,'ا').trim() }
function check(){ if(S.done) return; const q=S.qs[S.i]; let ok=false, fb='';
  if(q.type==='choice'||q.type==='pix'){ if(S.st.c===undefined) return hint('اختر إجابة أولًا'); ok=!!q.opts[S.st.c][2]; document.querySelectorAll('.opt').forEach(b=>{const j=+b.dataset.j;if(q.opts[j][2])b.classList.add('ok');else if(j===S.st.c)b.classList.add('no')}); }
  else if(q.type==='multi'){ const sel=Object.keys(S.st).filter(k=>S.st[k]).map(Number); if(!sel.length) return hint('اختر إجابة واحدة على الأقل'); ok=q.opts.every((o,j)=>!!o[2]===!!S.st[j]); document.querySelectorAll('.opt').forEach(b=>{const j=+b.dataset.j;if(q.opts[j][2])b.classList.add('ok');else if(S.st[j])b.classList.add('no')}); }
  else if(q.type==='tf'){ if(S.st.c===undefined) return hint('اختر صح أو خطأ'); ok=(S.st.c===1)===q.a; document.querySelectorAll('.opt').forEach(b=>{const j=+b.dataset.j;if((j===1)===q.a)b.classList.add('ok');else if(j===S.st.c)b.classList.add('no')}); }
  else if(q.type==='match'){ if(Object.keys(S.st.map).length<q.pairs.length) return hint('صِل كل الأسماء أولًا'); let good=0; Object.entries(S.st.map).forEach(([j,r])=>{const g=+j===r;if(g)good++;document.querySelector(`[data-l="${j}"]`).classList.add(g?'ok':'no')}); ok=good===q.pairs.length; if(!ok) fb='الصحيح: '+q.pairs.map(p=>p[0]+' ← '+(/\.jpg$/.test(p[1])?'صورته':p[1])).join('، '); }
  else if(q.type==='sort'){ if(Object.keys(S.st.put).length<q.items.length) return hint('ضع كل البطاقات في الصناديق أولًا'); let good=0; Object.entries(S.st.put).forEach(([j,b])=>{const g=q.items[j][2]===b;if(g)good++;document.querySelector(`[data-s="${j}"]`).classList.add(g?'ok':'no')}); ok=good===q.items.length; }
  else if(q.type==='type'){ const v=$('#tin').value; if(!v.trim()) return hint('اكتب إجابتك أولًا'); ok=q.ans==='*'?true:norm(v)===norm(q.ans); $('#tin').style.borderColor=ok?'var(--ok)':'var(--no)'; if(!ok) fb='الصحيح: '+q.ans; }
  S.done=true; if(ok){S.score++;sfx.ok()}else sfx.no();
  $('#chk').remove();
  const ex=$('#exp'); ex.innerHTML=`${ok?'<span class="pts">✅ أحسنت! إجابة صحيحة</span>':'❌ ليست صحيحة تمامًا. '+(fb?esc(fb):'')}<br>${esc(q.e)}<div class="acts"><button class="btn" onclick="next()">${S.i+1<S.qs.length?'السؤال التالي ←':'النتيجة 🏆'}</button></div>`; ex.classList.add('on'); }
function hint(m){ const ex=$('#exp'); ex.innerHTML='👆 '+m; ex.classList.add('on'); sfx.pick(); }
function next(){ S.i++; if(S.i<S.qs.length) ask(); else end(); }
function starsOf(){ const p=S.score/S.qs.length; return p>=.9?3:p>=.6?2:p>0?1:0 }
function end(){ const st=starsOf(); sfx.win(); if(st>=2) confetti();
  const msg=st===3?'ممتاز! أنجزت الواجب ببراعة 🌟':st===2?'أحسنت! أداء رائع 👏':'حاول مرة أخرى لتتعلّم أكثر 💪';
  $('#app').innerHTML=`<div class="end"><h1>أنجزت الواجب!</h1><div class="stars">${'⭐'.repeat(st)}${'☆'.repeat(3-st)}</div><p style="font-size:1.2rem;font-weight:900;margin:0">${msg}</p>
  <div class="stats"><div class="stat"><b>${S.score}/${S.qs.length}</b>إجابات صحيحة</div><div class="stat"><b>${Math.round(S.score/S.qs.length*100)}%</b>النتيجة</div><div class="stat"><b>${st}</b>نجوم</div></div>
  <div class="noprint"><label style="font-weight:800">اكتب اسمك لتحصل على شهادة إتمام الواجب:</label><br><input class="in" id="nm" placeholder="اسمك هنا" maxlength="40"><div class="acts" style="justify-content:center"><button class="btn gold" onclick="cert()">احصل على الشهادة 🏅</button><button class="btn ghost" onclick="start(S.k)">أعد الواجب</button><button class="btn ghost" onclick="location.hash=''">واجب آخر</button></div></div><div id="cert"></div></div>`; }
function cert(){ const n=($('#nm').value||'').trim(); if(!n){$('#nm').focus();return} sfx.win(); confetti();
  const d=new Date().toLocaleDateString('ar-OM',{day:'numeric',month:'long',year:'numeric'});
  $('#cert').innerHTML=`<div class="cert"><img src="903b5f133dc801a5866fccf3307ee053.jpg" alt=""><h2>شهادة إتمام الواجب</h2><div>تُمنح هذه الشهادة للبطل/ة</div><div class="nm">${esc(n)}</div><div>لإتمامه/ا واجب <b>${esc(S.l.t)}</b> — ${esc(S.l.g)}</div><div style="margin-top:6px">النتيجة: <b>${S.score} من ${S.qs.length}</b> ${'⭐'.repeat(starsOf())}</div><div style="color:#5E7079;margin-top:6px">${d}</div><div class="by">إعداد الأستاذة عبير صالح اليحمدية</div></div>
  <div class="acts noprint" style="justify-content:center"><button class="btn" onclick="print()">🖨️ طباعة / حفظ PDF</button></div><p class="noprint muted" style="font-weight:700">📸 صوّر الشهادة وأرسلها لأستاذتك.</p>`;
  $('#cert').scrollIntoView({behavior:'smooth'}); }
function route(){ const k=location.hash.slice(1); if(DATA[k]) intro(k); else home(); try{speechSynthesis.cancel()}catch(e){} }
addEventListener('hashchange',route); route();
</script></body></html>
