<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173F55">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.json">
<title>التقرير الشهري — منصة أ. عبير اليحمدية</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--brand:#173F55;--brand-2:#1F5A78;--brand-3:#0F2C3C;--gold:#D9A64E;--bg:#EEF3F7;--chip:#E9F0F6;--line:#D8E2EA;--text:#13324f;--muted:#5f7387;--ok:#2E8B57;--bad:#C0392B;--warn:#D98A00}
*{box-sizing:border-box}
body{margin:0;font-family:"Cairo",Tahoma,sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
header{background:linear-gradient(135deg,var(--brand-3),var(--brand));color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 18px}
header .in{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:1.55rem;font-weight:900}header p{margin:0;color:#cfe0ec;font-size:.92rem}header .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:12px;padding:9px 15px;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;font-size:.9rem}
.btn.gold{background:var(--gold);color:#2A1C05}.btn.ghost{background:rgba(255,255,255,.14);color:#fff}.btn.pri{background:var(--brand);color:#fff}
main{max-width:1100px;margin:auto;padding:16px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border-radius:16px;padding:12px 14px;margin-bottom:14px;box-shadow:0 4px 14px rgba(15,44,60,.06)}
.bar select,.bar input{font:inherit;font-weight:700;border:2px solid var(--line);border-radius:10px;padding:6px 10px;color:var(--brand)}
.msg{background:#FFF4E0;color:#7A5300;border-radius:14px;padding:14px;font-weight:700}
.msg a{color:inherit}
.rep{background:#fff;border-radius:18px;padding:22px;box-shadow:0 4px 14px rgba(15,44,60,.07)}
.rh{display:flex;align-items:center;gap:14px;border-bottom:3px solid var(--gold);padding-bottom:12px;margin-bottom:16px}
.rh img{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--line)}
.rh h2{margin:0;font-size:1.45rem;color:var(--brand)}.rh .s{color:var(--muted);font-weight:700;font-size:.92rem}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.kp div{background:var(--chip);border-radius:14px;padding:10px 12px;text-align:center}
.kp b{display:block;font-size:1.6rem;font-weight:900;color:var(--brand)}.kp span{font-size:.85rem;color:var(--muted);font-weight:700}
h3{margin:20px 0 8px;color:var(--brand-2);font-size:1.12rem}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:center}th{background:var(--brand);color:#fff;font-weight:800}
tr:nth-child(even) td{background:#F7FAFC}
td.n{text-align:right;font-weight:800}
.pb{height:12px;background:#E6EDF3;border-radius:8px;overflow:hidden;min-width:70px}.pb i{display:block;height:100%;border-radius:8px}
.pill{display:inline-block;border-radius:10px;padding:0 8px;font-weight:800;font-size:.8rem}
.ok{background:#DDF2E6;color:#1E7044}.wn{background:#FFF0D6;color:#8A5A00}.bd{background:#FDE3E0;color:#9B2C20}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cm{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit}
.sig{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:26px;font-weight:800;color:var(--brand)}
.sig div{border-top:2px dashed var(--line);padding-top:6px;text-align:center}
.muted{color:var(--muted)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--brand-3);color:#fff;padding:10px 18px;border-radius:14px;font-weight:800;display:none;z-index:99}
@media (max-width:760px){.two{grid-template-columns:1fr}.rh{flex-wrap:wrap}table{font-size:.8rem}}
@media print{@page{size:A4;margin:12mm}header,.bar,#toast,.noprint{display:none!important}body{background:#fff}main{padding:0;max-width:none}.rep{box-shadow:none;padding:0}h3{break-after:avoid}table,.kp{break-inside:avoid}.cm{border:0;padding:0;min-height:0}}
</style>
</head>
<body>
<header><div class="in"><div><h1>📊 التقرير الشهري</h1><p>الحضور • النقاط • الواجبات • التحاضير المنشورة في نور</p></div><span class="sp"></span><button class="btn gold" id="pr">🖨️ طباعة / PDF</button><a class="btn ghost" href="./">← المنصة</a></div></header>
<main>
 <div class="bar"><b>الشهر:</b><input type="month" id="mon"><b>الصفوف:</b><select id="gr"><option value="all">الكل</option><option>الصف الأول</option><option>الصف الثالث</option></select><span class="muted" id="st"></span></div>
 <div id="out"><div class="msg">جارٍ التحميل…</div></div>
</main>
<div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function(){
const CFG={apiKey:"AIzaSyAaHsbkUOcYi1cAI2A1UG46XS38sdoOdz0",authDomain:"abeer-platform-cf812.firebaseapp.com",projectId:"abeer-platform-cf812",storageBucket:"abeer-platform-cf812.firebasestorage.app",messagingSenderId:"941687915468",appId:"1:941687915468:web:90eb0930af29e5adf79369"};
const OWNER='alyahmedi.352@gmail.com', SUP='muniraalharasi567@gmail.com';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const toEn=s=>String(s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
function arDateToYM(s){ const p=toEn(s).replace(/[^\d\/\-]/g,'').split(/[\/\-]/).filter(Boolean); if(p.length<3) return ''; let [d,m,y]=p; if(d.length===4){[y,m,d]=p} return y+'-'+String(m).padStart(2,'0'); }
const now=new Date(); $('#mon').value=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');
let D=null, ROLE='';
window.__taqrirTest=d=>{D=d;$('#out').innerHTML='';render()};
if(!window.firebase){$('#out').innerHTML='<div class="msg">تعذّر الاتصال — التقرير يحتاج الإنترنت.</div>';return}
firebase.initializeApp(CFG); const db=firebase.firestore(), auth=firebase.auth();
auth.onAuthStateChanged(u=>{
 const em=u&&!u.isAnonymous?(u.email||'').toLowerCase():''; ROLE=em===OWNER?'owner':em===SUP?'sup':'';
 if(!ROLE){$('#out').innerHTML='<div class="msg">🔒 التقرير متاح للأستاذة عبير والمشرفة فقط. <a href="./#portal">ادخلي من بوابة المُلهِمات</a> ثم ارجعي إلى هذه الصفحة.</div>';return}
 load();
});
async function load(){
 $('#st').textContent='جارٍ جلب البيانات…';
 try{
  const g=c=>db.collection(c).get().then(q=>q.docs.map(d=>({id:d.id,...d.data()}))).catch(()=>[]);
  const [classes,students,att,pts,res,tah]=await Promise.all([g('t_classes'),g('t_students'),g('t_att'),g('t_points'),g('results'),g('tahdeer')]);
  D={classes:classes.sort((a,b)=>(a.order||0)-(b.order||0)),students:students.filter(s=>!s.removed),att,pts,res,tah};
  $('#st').textContent=''; render();
 }catch(e){ $('#out').innerHTML='<div class="msg">تعذّر جلب البيانات. تأكّدي من الاتصال بالإنترنت.</div>' }
}
$('#mon').onchange=()=>D&&render(); $('#gr').onchange=()=>D&&render(); $('#pr').onclick=()=>window.print();
function color(p){return p==null?'#B8C4CE':p>=90?'#2E8B57':p>=75?'#D98A00':'#C0392B'}
function pill(p){return p==null?'—':`<span class="pill ${p>=90?'ok':p>=75?'wn':'bd'}">${p}%</span>`}
function render(){
 const ym=$('#mon').value, G=$('#gr').value; const [yy,mm]=ym.split('-'); const mName=MONTHS[+mm-1]+' '+yy;
 const inM=d=>String(d||'').startsWith(ym), tsM=t=>{if(!t)return false;const d=new Date(t);return d.getFullYear()==+yy&&d.getMonth()+1==+mm};
 const CL=D.classes.filter(c=>G==='all'||c.grade===G);
 let tot={stu:0,days:0,mk:0,ab:0,lt:0,pts:0};
 const rows=CL.map(c=>{
  const st=D.students.filter(s=>s.classId===c.id); const A=D.att.filter(a=>a.classId===c.id&&inM(a.date));
  let mk=0,ab=0,lt=0,ex=0; A.forEach(a=>Object.entries(a.marks||{}).forEach(([sid,v])=>{mk++;if(v==='a')ab++;if(v==='l')lt++;if(v==='e')ex++}));
  const P=D.pts.filter(p=>p.classId===c.id&&inM(p.date)); const ptsSum=P.reduce((x,p)=>x+(+p.delta||0),0);
  const by={}; P.forEach(p=>by[p.studentId]=(by[p.studentId]||0)+(+p.delta||0));
  const top=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([id,v])=>{const s=st.find(x=>x.id===id);return s?`${esc(s.name)} (${v})`:''}).filter(Boolean);
  const ap=mk?Math.round((mk-ab)/mk*100):null;
  tot.stu+=st.length;tot.days+=A.length;tot.mk+=mk;tot.ab+=ab;tot.lt+=lt;tot.pts+=ptsSum;
  return {c,st:st.length,days:A.length,ab,lt,ex,ap,ptsSum,top};
 });
 const apAll=tot.mk?Math.round((tot.mk-tot.ab)/tot.mk*100):null;
 const R=D.res.filter(r=>tsM(r.at)&&(G==='all'||r.grade===G));
 const avgAll=R.length?Math.round(R.reduce((a,r)=>a+(+r.pct||0),0)/R.length):null;
 const acts={}; R.forEach(r=>{const k=(r.grade||'')+'|'+(r.type||'')+'|'+(r.title||'');(acts[k]=acts[k]||[]).push(+r.pct||0)});
 const reasons={}; D.pts.filter(p=>inM(p.date)&&CL.some(c=>c.id===p.classId)).forEach(p=>{const k=p.reason||'أخرى';reasons[k]=(reasons[k]||0)+(+p.delta||0)});
 /* التحاضير المنشورة في نور */
 const pubs=[]; D.tah.filter(t=>t.id.startsWith('t_')).forEach(t=>{const lid=t.id.slice(2);const g=lid.startsWith('g1')?'الصف الأول':lid.startsWith('g3')?'الصف الثالث':'';if(G!=='all'&&g!==G)return;Object.entries(t.marks||{}).forEach(([k,v])=>{if(arDateToYM(v)===ym){const [pi,sec]=k.split('|');pubs.push({lid,pi:+pi,sec,g})}})});
 const plans=window.TAH_NAMES||{};
 const pubBy={}; pubs.forEach(p=>{const k=p.lid+'|'+p.pi;(pubBy[k]=pubBy[k]||{lid:p.lid,pi:p.pi,g:p.g,secs:[]}).secs.push(p.sec)});
 const today=new Date().toLocaleDateString('ar-OM',{day:'numeric',month:'long',year:'numeric'});
 let h=`<div class="rep"><div class="rh"><img src="903b5f133dc801a5866fccf3307ee053.jpg" alt="" onerror="this.style.display='none'"><div style="flex:1"><h2>التقرير الشهري — ${mName}</h2><div class="s">مدرسة مزن المعرفة للصفوف (1-4) • مادة تقنية المعلومات • الأستاذة: عبير صالح اليحمدية${G!=='all'?' • '+G:''}</div></div><div class="s">تاريخ الإصدار:<br>${today}</div></div>
 <div class="kp"><div><b>${CL.length}</b><span>شعب دراسية</span></div><div><b>${tot.stu}</b><span>طالبًا وطالبة</span></div><div><b>${tot.days}</b><span>حصة حضور مسجّلة</span></div><div><b style="color:${color(apAll)}">${apAll==null?'—':apAll+'%'}</b><span>نسبة الحضور</span></div><div><b>${tot.pts}</b><span>نقطة تعزيز</span></div><div><b>${R.length}</b><span>واجبًا ونشاطًا محلولًا</span></div><div><b style="color:${color(avgAll)}">${avgAll==null?'—':avgAll+'%'}</b><span>متوسط الإنجاز</span></div><div><b>${Object.keys(pubBy).length}</b><span>حصة منشورة في نور</span></div></div>
 <h3>📅 الحضور والنقاط لكل شعبة</h3>
 <table><tr><th>الشعبة</th><th>الطلبة</th><th>أيام مسجّلة</th><th>نسبة الحضور</th><th></th><th>غياب</th><th>تأخّر</th><th>مستأذن</th><th>النقاط</th><th>الأكثر تميّزًا</th></tr>
 ${rows.map(r=>`<tr><td class="n">${esc(r.c.name)}</td><td>${r.st}</td><td>${r.days}</td><td>${pill(r.ap)}</td><td><div class="pb"><i style="width:${r.ap||0}%;background:${color(r.ap)}"></i></div></td><td>${r.ab}</td><td>${r.lt}</td><td>${r.ex}</td><td>${r.ptsSum}</td><td style="font-size:.8rem">${r.top.join('، ')||'—'}</td></tr>`).join('')}</table>
 <div class="two"><div><h3>⭐ نقاط التعزيز حسب السبب</h3>${Object.keys(reasons).length?`<table><tr><th>السبب</th><th>النقاط</th></tr>${Object.entries(reasons).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td class="n">${esc(k)}</td><td>${v}</td></tr>`).join('')}</table>`:'<p class="muted">لا توجد نقاط مسجّلة في هذا الشهر.</p>'}</div>
 <div><h3>📝 الواجبات والأنشطة في المنصة</h3>${Object.keys(acts).length?`<table><tr><th>النشاط</th><th>عدد الحلول</th><th>المتوسط</th></tr>${Object.entries(acts).sort((a,b)=>b[1].length-a[1].length).slice(0,15).map(([k,v])=>{const [g,t,ti]=k.split('|');const av=Math.round(v.reduce((a,x)=>a+x,0)/v.length);return `<tr><td class="n" style="font-size:.82rem">${esc(ti)} <span class="muted">(${esc(t)}${G==='all'?' • '+esc(g):''})</span></td><td>${v.length}</td><td>${pill(av)}</td></tr>`}).join('')}</table>`:'<p class="muted">لا توجد نتائج في هذا الشهر.</p>'}</div></div>
 <h3>📒 التحاضير المنشورة في منصة نور</h3>${Object.keys(pubBy).length?`<table><tr><th>الصف</th><th>الدرس</th><th>الحصة</th><th>الشعب المنشور لها</th></tr>${Object.values(pubBy).sort((a,b)=>a.lid.localeCompare(b.lid)||a.pi-b.pi).map(p=>`<tr><td>${esc(p.g)}</td><td class="n">${esc(plans[p.lid]||p.lid)}</td><td>${p.pi+1}</td><td>${p.secs.sort().join('، ')}</td></tr>`).join('')}</table>`:'<p class="muted">لم تُسجَّل تحاضير منشورة في نور خلال هذا الشهر (تُسجَّل من دفتر التحضير).</p>'}
 <h3>💬 ملاحظات المعلمة</h3><textarea class="cm" id="cmT" placeholder="اكتبي ملاحظاتك عن الشهر (تظهر في الطباعة)…"></textarea>
 <h3>🖊️ ملاحظات المشرفة</h3><textarea class="cm" id="cmS" placeholder="مساحة لملاحظات المشرفة…"></textarea>
 <div class="sig"><div>توقيع المعلمة</div><div>توقيع المشرفة</div></div></div>`;
 $('#out').innerHTML=h;
 ['cmT','cmS'].forEach(k=>{const e=$('#'+k);const key='taqrir.'+k+'.'+ym;try{e.value=localStorage.getItem(key)||''}catch(x){}e.oninput=()=>{try{localStorage.setItem(key,e.value)}catch(x){}}});
}
})();
</script>
<script>window.TAH_NAMES={"g1-1-1": "الدرس 1.1: الحاسوب في حياتنا", "g1-1-2": "الدرس 1.2: أجزاء جهاز الحاسوب", "g1-1-3": "الدرس 1.3: سطح المكتب", "g1-1-4": "الدرس 1.4: انقر واكتب", "g1-1-5": "الدرس 1.5: دعنا نتذكر", "g1-1-6": "الدرس 1.6: لنطبّق معًا", "g1-2-1": "الدرس 2.1: مقدمة إلى الرسم الرقمي", "g1-2-2": "الدرس 2.2: رسم الأشكال", "g1-2-3": "الدرس 2.3: لنتدرب على الأشكال", "g1-2-4": "الدرس 2.4: دمج الأشكال", "g1-2-5": "الدرس 2.5: لنتدرب على دمج الأشكال", "g1-2-6": "الدرس 2.6: الرسم الحر", "g1-3-1": "الدرس 3.1: الإنترنت", "g1-3-2": "الدرس 3.2: استمتع", "g1-3-3": "الدرس 3.3: تواصل", "g1-3-4": "الدرس 3.4: ابحث", "g1-proj": "المشروع", "g3-1": "أجهزة التفاعل مع الحاسوب", "g3-2": "تنظيم الملفات والمجلدات", "g3-3": "أجهزة الطباعة والالتقاط", "g3-4": "تنسيق النص", "g3-5": "إدراج وتنسيق صورة", "g3-6": "إنشاء القوائم", "g3-7": "المشروع", "g3-8": "الأمان عبر الإنترنت", "g3-9": "البحث عن المعلومات", "g3-10": "أخلاقيات الإنترنت", "g3-11": "العثور على المعلومات", "g3-12": "البحث في موسوعة ويكيبيديا"};</script>
<script src="devices.js" defer></script>
</body>
</html>
