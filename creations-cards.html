<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدخال أعمال «بصمات مبدعة»</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--p1:#2B2148;--p2:#4A3B78;--gd:#D9A64E;--gd2:#F2CF8A;--bg:#F1F0F6;--ln:#E2DFEC;--mu:#6B6585;--ink:#231C3A}
*{box-sizing:border-box}
body{margin:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
header{background:linear-gradient(135deg,var(--p1),var(--p2));color:#fff;padding:22px 18px 26px}
header h1{margin:0 auto;max-width:1000px;font-size:26px;font-weight:900}header h1 span{color:var(--gd2)}
header p{margin:4px auto 0;max-width:1000px;opacity:.85}
main{max-width:1000px;margin:-12px auto 40px;padding:0 16px}
.box{background:#fff;border:1px solid var(--ln);border-radius:18px;padding:16px 18px;margin-bottom:16px;box-shadow:0 6px 18px rgba(43,33,72,.06)}
.box h2{margin:0 0 10px;font-size:19px;font-weight:900;color:var(--p1)}
.g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.g{grid-template-columns:1fr}}
label.f{display:block;font-weight:800;font-size:13.5px;color:var(--p1);margin-bottom:3px}
.in{width:100%;font:inherit;font-size:14.5px;border:1px solid var(--ln);border-radius:10px;padding:7px 10px;background:#FBFAFD}
.btn{font:inherit;font-weight:900;font-size:16px;border:0;border-radius:12px;padding:10px 20px;cursor:pointer;background:linear-gradient(180deg,var(--gd2),var(--gd));color:#3A2A0C;box-shadow:0 4px 0 #B8862F}
.btn.s{background:var(--p1);color:#fff;box-shadow:0 4px 0 #170F2E}
.btn:active{transform:translateY(2px)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.muted{color:var(--mu);font-size:14px;margin:0}
#msg{font-weight:800;color:var(--p2)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 6px;border-bottom:1px solid var(--ln);text-align:right;vertical-align:middle}
th{color:var(--mu);font-weight:800}
td img{width:64px;height:48px;object-fit:cover;border-radius:8px;border:1px solid var(--ln)}
td img.ph{width:44px;height:44px;border-radius:50%}
.rk{font-size:20px}
.x{border:0;background:#FDECEC;color:#B3261E;border-radius:8px;font:inherit;font-weight:800;padding:3px 10px;cursor:pointer}
.empty{text-align:center;color:var(--mu);padding:16px}
</style>
</head>
<body>
<header><h1>إدخال أعمال <span>بصمات مبدعة</span></h1><p>أضيفي أعمال الطلبة والفائزين، ثم نزّلي ملف الاستيراد وارفعيه من بوابة المُلهِمات ← استيراد بطاقات دفعة واحدة.</p></header>
<main>
<section class="box">
  <h2>➕ عمل جديد</h2>
  <div class="g">
    <div><label class="f" for="occ">المناسبة</label><select class="in" id="occ"></select></div>
    <div><label class="f" for="gr">الصف</label><select class="in" id="gr"><option>الصف الأول</option><option>الصف الثالث</option></select></div>
    <div><label class="f" for="rk">النتيجة</label><select class="in" id="rk"><option value="0">مشاركة (المعرض)</option><option value="1">🥇 المركز الأول</option><option value="2">🥈 المركز الثاني</option><option value="3">🥉 المركز الثالث</option></select></div>
    <div><label class="f" for="nm">اسم الطالب/ة (الاسم الأول واسم الأب)</label><input class="in" id="nm" placeholder="مثل: مريم سالم"></div>
    <div><label class="f" for="wk">صورة العمل</label><input class="in" id="wk" type="file" accept="image/*"></div>
    <div><label class="f" for="ph">صورة الطالب/ة (للفائزين — اختياري)</label><input class="in" id="ph" type="file" accept="image/*"></div>
    <div style="grid-column:1/-1"><label class="f" for="lk">رابط المشروع (اختياري — مثل مشروع سكراتش)</label><input class="in" id="lk" dir="ltr" placeholder="https://scratch.mit.edu/projects/..."></div>
  </div>
  <div class="row"><button class="btn s" onclick="add()">إضافة إلى القائمة</button><span id="msg"></span></div>
</section>

<section class="box">
  <h2>📋 القائمة (<span id="cnt">0</span>)</h2>
  <div style="overflow-x:auto"><table><thead><tr><th>العمل</th><th>الطالب/ة</th><th>الصف</th><th>المناسبة</th><th>النتيجة</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
  <div class="row"><button class="btn" onclick="dl()">⬇️ تنزيل ملف الاستيراد</button>
  <p class="muted">لتعديل عمل بعد استيراده: عدّليه من «تعديل» في المنصة، أو احذفيه وأعيدي إدخاله.</p></div>
</section>
</main>
<script>
const OCC=['اليوم الوطني','اليوم العالمي للغة العربية','شهر رمضان المبارك','عيد الفطر','عيد الأضحى'];
const SEM={'اليوم الوطني':1,'اليوم العالمي للغة العربية':1,'شهر رمضان المبارك':2,'عيد الفطر':2,'عيد الأضحى':2};
const PROG={1:{'الصف الأول':'الرسّام','الصف الثالث':'Word'},2:{'الصف الأول':'سكراتش','الصف الثالث':'سكراتش'}};
const L=[]; const $=id=>document.getElementById(id);
$('occ').innerHTML=OCC.map(o=>`<option>${o}</option>`).join('');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function img(file,max,q,square){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{
  let sx=0,sy=0,sw=im.width,sh=im.height; if(square){const m=Math.min(sw,sh);sx=(sw-m)/2;sy=(sh-m)/2;sw=sh=m}
  const k=Math.min(1,max/Math.max(sw,sh)),c=document.createElement('canvas');c.width=Math.round(sw*k);c.height=Math.round(sh*k);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(file)})}
async function add(){
  const nm=$('nm').value.trim(), f=$('wk').files[0], p=$('ph').files[0];
  if(!nm){$('msg').textContent='اكتبي اسم الطالب/ة.';return} if(!f){$('msg').textContent='اختاري صورة العمل.';return}
  $('msg').textContent='جارٍ تجهيز الصور…';
  const occ=$('occ').value, gr=$('gr').value, rk=+$('rk').value, lk=$('lk').value.trim();
  if(rk&&L.some(x=>x.unit===occ&&x.grade===gr&&x.rank===rk)){$('msg').textContent='⚠️ هذا المركز مُدخل مسبقًا لنفس الصف والمناسبة.';return}
  const o={section:'creations',grade:gr,unit:occ,title:nm,rank:rk,prog:PROG[SEM[occ]][gr],
    desc:(rk?['','🥇 المركز الأول','🥈 المركز الثاني','🥉 المركز الثالث'][rk]+' — ':'مشاركة في ')+'مسابقة بصمات مبدعة: '+occ+' · '+PROG[SEM[occ]][gr],
    coverData:await img(f,520,.8), sheet:await img(f,1100,.82)};
  if(p) o.photo=await img(p,300,.85,true);
  if(lk){o.links=[lk];o.linkLabels=['افتح المشروع']}
  L.push(o); ['nm','lk'].forEach(i=>$(i).value=''); $('wk').value=''; $('ph').value='';
  $('msg').textContent='✅ أُضيف '+nm; draw();
}
function draw(){$('cnt').textContent=L.length;
  $('tb').innerHTML=L.length?L.map((o,k)=>`<tr><td><img src="${o.coverData}" alt=""></td><td>${o.photo?`<img class="ph" src="${o.photo}" alt=""> `:''}${esc(o.title)}</td><td>${o.grade}</td><td>${o.unit}</td><td class="rk">${['مشاركة','🥇','🥈','🥉'][o.rank]}</td><td><button class="x" onclick="L.splice(${k},1);draw()">حذف</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">لا توجد أعمال بعد</td></tr>'}
function dl(){ if(!L.length){$('msg').textContent='أضيفي عملًا واحدًا على الأقل.';return}
  const b=new Blob([JSON.stringify({app:'abeer-cards',made:new Date().toISOString(),items:L})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='creations-import.json';document.body.appendChild(a);a.click();a.remove();
  $('msg').textContent='✅ نُزّل الملف ('+Math.round(b.size/1024)+' ك.ب). استورديه من بوابة المُلهِمات.'}
draw();
</script>
</body>
</html>
